r":"What single yes-or-no decision could one neuron make about a photo?"},{"id":"av4_q4","type":"matchPairs","text":"Match each architecture to what it is best known for:","simple":"Match each architecture to what it is known for.","options":[],"correct":"","correctAnswers":[],"pairs":[{"term":"CNN","definition":"Processing images and visual data"},{"term":"RNN","definition":"Handling sequential data like time series"},{"term":"GAN","definition":"Generating realistic fake images"},{"term":"Transformer","definition":"Powering modern language models"}],"explanation":"CNNs (Convolutional Neural Networks) excel at vision, RNNs (Recurrent Neural Networks) handle sequences, GANs (Generative Adversarial Networks) create synthetic data, and Transformers dominate language AI.","difficulty":"beginner","transfer":"Which architecture would you pick for spotting a bird in a photo, and why?"},{"id":"av4_q5","type":"multipleChoice","text":"What is a 'diffusion model' in AI?","simple":"What is a diffusion model?","options":["A model that creates images by gradually removing noise","A model that spreads information across a network","A model that distributes tasks across multiple servers","A model that slowly degrades over time"],"correct":"A model that creates images by gradually removing noise","correctAnswers":["A model that creates images by gradually removing noise"],"pairs":[],"explanation":"Diffusion models learn to reverse a noise-adding process. They start with random noise and gradually refine it into a coherent image.","difficulty":"intermediate","transfer":"Why might a diffusion model get hands wrong when it draws people?"},{"id":"av4_q6","type":"sortOrder","text":"Put these AI architecture milestones in chronological order:","simple":"Put these architecture milestones in order.","options":["Transformer (2017)","Perceptron (1958)","CNN for ImageNet (2012)","GAN (2014)"],"correct":"","correctAnswers":["Perceptron (1958)","CNN for ImageNet (2012)","GAN (2014)","Transformer (2017)"],"pairs":[],"explanation":"The perceptron came first in 1958. AlexNet's CNN breakthrough was in 2012, GANs were invented by Ian Goodfellow in 2014, and the transformer architecture was introduced in a 2017 research paper.","difficulty":"advanced","transfer":"What does the gap between the perceptron and the transformer tell you about progress?"},{"id":"av4_q7","type":"scenarioJudgment","text":"A diffusion model is halfway through making an image. What guides each cleanup step?","simple":"What guides each step as a diffusion model cleans noise?","options":["The prompt it was given","A random dice roll","The user's location","The time of day"],"correct":"The prompt it was given","correctAnswers":["The prompt it was given"],"pairs":[],"explanation":"Each step removes some noise and nudges the image toward the prompt. Without the prompt it would make a random picture.","difficulty":"beginner","transfer":"How would you change the prompt to get a night scene instead of a day one?"},{"id":"av4_q8","type":"trueFalse","text":"A model's architecture is its design, including how layers connect.","simple":"Is architecture the design of how layers connect?","options":["True","False"],"correct":"True","correctAnswers":["True"],"pairs":[],"explanation":"Architecture is the blueprint. Training fills in the numbers.","difficulty":"beginner","transfer":"How is architecture like a building plan?"},{"id":"av4_q9","type":"explain","text":"Explain what the transformer architecture is known for.","simple":"What is the transformer architecture known for?","options":["It uses attention","It handles whole sequences at once","It powers most modern language models"],"correct":"The transformer is the design behind most modern language models. It uses attention to weigh which parts of the input matter for each word, and it processes the whole sequence at once, which made training on huge amounts of text practical.","correctAnswers":["The transformer is the design behind most modern language models. It uses attention to weigh which parts of the input matter for each word, and it processes the whole sequence at once, which made training on huge amounts of text practical."],"pairs":[],"explanation":"Strong answers mention attention and modern language models.","difficulty":"beginner","transfer":"Explain attention using how you skim a page for one name."}],"cards":[{"emoji":"📐","title":"Architecture","body":"A model architecture is its design, how layers are connected. The Transformer architecture powers most modern AI.","funFact":null},{"emoji":"🔦","title":"Attention","body":"The attention mechanism is like a spotlight. It lets the model focus on the most relevant parts of the input as it works.","funFact":null},{"emoji":"🌫️","title":"Diffusion Models","body":"A diffusion model makes images by starting with random noise and cleaning it up step by step toward something that matches the prompt. The perceptron, a single artificial neuron from 1958, is where this family of ideas began.","funFact":null}]},{"id":"av_l5","title":"The Modern Stack","description":"Today's hottest AI terms decoded","order":4,"difficulty":"advanced","questions":[{"id":"av5_q1","type":"scenarioJudgment","text":"A school bot needs today's schedule. What should the app add?","simple":"A school bot needs today's schedule. What should the app add?","options":["Retrieval from the live schedule","A larger model name","Higher temperature","More random wording"],"correct":"Retrieval from the live schedule","correctAnswers":["Retrieval from the live schedule"],"pairs":[],"explanation":"Retrieval brings current source material into the model's context. When generation uses retrieved evidence, the full pattern is called RAG.","difficulty":"beginner","transfer":"A homework bot needs today's timetable. What should it retrieve?"},{"id":"av5_q2","type":"fillInBlank","text":"RAG stands for Retrieval-Augmented __________, a technique that lets AI pull in external knowledge when answering.","simple":"RAG stands for Retrieval-Augmented what?","options":["Generation","Grounding","Grouping","Governance"],"correct":"Generation","correctAnswers":["Generation"],"pairs":[],"explanation":"RAG combines a retrieval system (that fetches relevant documents) with a generative model (that produces answers). This lets LLMs give accurate, up-to-date answers grounded in specific sources rather than relying solely on training data.","difficulty":"beginner","transfer":"Describe RAG using a student who checks the textbook before answering."},{"id":"av5_q3","type":"trueFalse","text":"A 'context window' is the max text an AI model can consider at once.","simple":"Does a context window limit text considered at once?","options":["True","False"],"correct":"True","correctAnswers":["True"],"pairs":[],"explanation":"The context window is like the model's working memory: your prompt, the conversation history, and any documents provided. Larger context windows let models work with more information at once.","difficulty":"beginner","transfer":"What might happen if you paste a whole novel into a small context window?"},{"id":"av5_q4","type":"matchPairs","text":"Match each modern AI concept to its meaning:","simple":"Match each modern AI idea to its meaning.","options":[],"correct":"","correctAnswers":[],"pairs":[{"term":"Agent","definition":"An AI system that takes actions toward a goal"},{"term":"Tool use","definition":"The model calling a calculator, search, or other function"},{"term":"System prompt","definition":"Hidden instructions that guide the assistant's behaviour"},{"term":"Guardrail","definition":"A rule the system enforces no matter what the prompt says"}],"explanation":"Agents act, tools extend what they can do, system prompts shape behaviour, and guardrails set limits the prompt cannot override.","difficulty":"intermediate","transfer":"Which of these four would you want a homework agent to have, and which would you limit?"},{"id":"av5_q5","type":"scenarioJudgment","text":"A dev wants their AI to search the web, query databases, and send emails. What concept is this?","simple":"An AI that searches, queries databases and sends email. What concept?","options":["An AI agent with tool use capabilities","A larger context window","A better fine-tuned model","A faster inference speed"],"correct":"An AI agent with tool use capabilities","correctAnswers":["An AI agent with tool use capabilities"],"pairs":[],"explanation":"This describes an AI agent, a system that can plan, reason, and take actions using external tools. Tool use (or function calling) lets the AI interact with APIs, databases, and services to accomplish real-world tasks.","difficulty":"intermediate","transfer":"Name one tool you would not let an agent use without asking you first."},{"id":"av5_q6","type":"multipleChoice","text":"What is 'function calling' in LLMs?","simple":"What is function calling?","options":["Letting an LLM request that specific functions be run","The process of calling an LLM's API endpoint","A way to speed up model inference","A technique for reducing model size"],"correct":"Letting an LLM request that specific functions be run","correctAnswers":["Letting an LLM request that specific functions be run"],"pairs":[],"explanation":"Function calling lets an LLM output structured requests to execute specific functions, like searching a database, checking the weather, or sending a message. The model decides which function to call and what arguments to pass.","difficulty":"advanced","transfer":"What function should a model call to answer 'what is 17 times 23' reliably?"},{"id":"av5_q7","type":"scenarioJudgment","text":"An assistant can look up your calendar and book a room by itself. What is it acting as?","simple":"An assistant books a room by itself. What is it acting as?","options":["An agent using tools","A search engine","A spreadsheet","A screensaver"],"correct":"An agent using tools","correctAnswers":["An agent using tools"],"pairs":[],"explanation":"Agents take actions with tools, not just chat. That also raises the need for oversight.","difficulty":"beginner","transfer":"Which action would you want an agent to ask you before doing?"},{"id":"av5_q8","type":"trueFalse","text":"Retrieval can supply a model with a document published after its training.","simple":"Can retrieval find a document written after a model was trained?","options":["True","False"],"correct":"True","correctAnswers":["True"],"pairs":[],"explanation":"A retrieval system can find newer sources and supply their text when generating a response. Check those sources and whether the answer represents them accurately.","difficulty":"beginner","transfer":"What document would a school helper need to retrieve?"},{"id":"av5_q9","type":"explain","text":"Explain retrieval augmented generation with a school example.","simple":"Explain retrieval augmented generation with a school example.","options":["Search finds relevant documents","They are placed in the prompt","The model answers from that evidence"],"correct":"With retrieval augmented generation, the system first searches for relevant documents, such as this year's school handbook, and puts the matching sections into the prompt. The model then answers from that evidence instead of guessing from old training data.","correctAnswers":["With retrieval augmented generation, the system first searches for relevant documents, such as this year's school handbook, and puts the matching sections into the prompt. The model then answers from that evidence instead of guessing from old training data."],"pairs":[],"explanation":"Strong answers include searching, adding to the prompt, and answering from evidence.","difficulty":"beginner","transfer":"Which document would you retrieve to answer 'when is the science fair'?"}],"cards":[{"emoji":"🪟","title":"Context Window","body":"The context window is how much text AI can consider at once. A bigger window means AI can work with longer documents.","funFact":null},{"emoji":"🤖","title":"Agents and Tools","body":"An AI agent can take actions on its own, using tools like web search or a calendar. Tool use lets AI do real tasks, not just chat.","funFact":null},{"emoji":"📚","title":"Retrieval","body":"Retrieval fetches the right documents and places them in the prompt so the model answers from real evidence. It keeps answers current without retraining.","funFact":null},{"emoji":"🛡️","title":"Guardrails","body":"A guardrail is a rule enforced by the system, not the prompt: what the assistant will not do, which tools it may use, and when a person must approve.","funFact":null}]},{"id":"av_l6","title":"Hardware & Scale","description":"The engines and economics powering AI","order":5,"difficulty":"advanced","questions":[{"id":"av6_q1","type":"multipleChoice","text":"Why are GPUs preferred over CPUs for training AI models?","simple":"Why are GPUs used for training AI?","options":["GPUs do thousands of calculations in parallel","GPUs are cheaper to manufacture","GPUs use less electricity","GPUs have more storage space"],"correct":"GPUs do thousands of calculations in parallel","correctAnswers":["GPUs do thousands of calculations in parallel"],"pairs":[],"explanation":"GPUs (Graphics Processing Units) were originally designed for rendering graphics, which requires massive parallel computation. Neural network training involves similar parallel math operations, making GPUs ideal for AI workloads.","difficulty":"beginner","transfer":"Why would a school laptop struggle to train a large model?"},{"id":"av6_q2","type":"trueFalse","text":"Some companies design custom chips built specifically for machine learning.","simple":"Do some companies design special chips just for AI?","options":["True","False"],"correct":"True","correctAnswers":["True"],"pairs":[],"explanation":"Several chip makers and cloud providers build accelerators designed for the matrix maths that neural networks use. They trade flexibility for speed and efficiency.","difficulty":"beginner","transfer":"Why might a chip built for one job beat a general chip at that job?"},{"id":"av6_q3","type":"fillInBlank","text":"FLOPS means Floating Point Operations Per __________. It measures computing speed.","simple":"FLOPS means floating point operations per what?","options":["Second","Session","Sequence","Set"],"correct":"Second","correctAnswers":["Second"],"pairs":[],"explanation":"FLOPS measures how many floating-point math operations a chip can perform each second. Modern AI training runs require petaFLOPS (quadrillions of operations per second) or even exaFLOPS of compute.","difficulty":"beginner","transfer":"Why is a faster chip not the only thing that makes training faster?"},{"id":"av6_q4","type":"matchPairs","text":"Match each hardware term to its role in AI:","simple":"Match each hardware word to its role.","options":[],"correct":"","correctAnswers":[],"pairs":[{"term":"GPU","definition":"Parallel processor that does many calculations at once"},{"term":"AI accelerator","definition":"A chip designed only for neural network maths"},{"term":"Edge AI","definition":"Running a model directly on a local device"},{"term":"Training compute","definition":"Total processing used to train a model"}],"explanation":"GPUs and accelerators do the maths; edge AI is about where the model runs; training compute is about how much work training took.","difficulty":"intermediate","transfer":"Which of these would matter most for a translation app used on a plane?"},{"id":"av6_q5","type":"scenarioJudgment","text":"A company wants AI running on phones with no internet needed. What is this?","simple":"AI runs on the phone with no internet. What is that?","options":["On-device AI (edge AI)","Cloud-based inference","Distributed training","Model pre-training"],"correct":"On-device AI (edge AI)","correctAnswers":["On-device AI (edge AI)"],"pairs":[],"explanation":"On-device inference runs the model on local hardware and can work offline. Check the surrounding app for telemetry, sync and connected tools before assuming data stays private.","difficulty":"intermediate","transfer":"Name one privacy benefit and one limit of running AI on the device."},{"id":"av6_q6","type":"sortOrder","text":"Rank these from least to most computationally expensive:","simple":"Rank from least to most computing needed.","options":["Running inference on a single query","Fine-tuning a model on custom data","Training a large model from scratch","Running a simple rule-based program"],"correct":"","correctAnswers":["Running a simple rule-based program","Running inference on a single query","Fine-tuning a model on custom data","Training a large model from scratch"],"pairs":[],"explanation":"Rule-based programs need minimal compute, and a single inference query takes a fraction of a second on a GPU. Fine-tuning requires hours to days of GPU time. Training a large model from scratch can cost millions of dollars and take months on thousands of GPUs.","difficulty":"advanced","transfer":"Why does answering one question cost so much less than training the model?"},{"id":"av6_q7","type":"scenarioJudgment","text":"A translation app works on a plane with no internet. Where is the model running?","simple":"A translation app works with no internet. Where is the model?","options":["On the device itself","On a distant server","In the cloud","Nowhere"],"correct":"On the device itself","correctAnswers":["On the device itself"],"pairs":[],"explanation":"The model runs locally and can work offline. Check whether the app sends other data when it reconnects.","difficulty":"beginner","transfer":"What is one advantage and one limit of running AI on a phone?"},{"id":"av6_q8","type":"trueFalse","text":"Training a large model costs more computing than answering one question with it.","simple":"Does training cost more computing than one answer?","options":["True","False"],"correct":"True","correctAnswers":["True"],"pairs":[],"explanation":"Training processes enormous datasets for weeks. A single inference is tiny by comparison.","difficulty":"beginner","transfer":"Why might a company still worry about inference costs?"},{"id":"av6_q9","type":"explain","text":"Explain why special chips are used for AI.","simple":"Why are special chips used for AI?","options":["AI needs huge numbers of calculations","GPUs and similar chips work in parallel","This makes training and inference practical"],"correct":"Training and running AI means doing billions of small calculations. Chips like GPUs are built to do many calculations at the same time, so work that would take months on an ordinary processor finishes in days.","correctAnswers":["Training and running AI means doing billions of small calculations. Chips like GPUs are built to do many calculations at the same time, so work that would take months on an ordinary processor finishes in days."],"pairs":[],"explanation":"Strong answers connect parallel calculation to speed.","difficulty":"beginner","transfer":"Why might a school choose a small on-device model instead of a huge one?"}],"cards":[{"emoji":"⚡","title":"Computing Power","body":"AI training requires massive computing power. Special chips like GPUs and TPUs crunch the enormous math involved.","funFact":null},{"emoji":"📊","title":"FLOPS","body":"FLOPS measures computing speed: floating point operations per second. Modern AI training uses petaFLOPS!","funFact":null},{"emoji":"📱","title":"On the Device","body":"Edge AI runs a model small enough to fit on your phone or laptop and can work offline. Check the app's other connections before assuming all data stays local.","funFact":null}]}],"bigIdeas":["representationReasoning"]},{"id":"ai_tools","name":"Kinds of AI Tools","icon":"wrench.and.screwdriver","color":"aiGreen","description":"Match the tool to the job: assistants, generators, classifiers, and agents","order":12,"unlock":{"kind":"completeTier2Minimum","value":6},"lessons":[{"id":"at_l1","title":"Language Model Assistants","description":"What a chat assistant is, and what it is not","order":0,"difficulty":"beginner","questions":[{"id":"at1_q1","type":"multipleChoice","text":"A chat assistant writes a paragraph one word at a time. What kind of model is it?","simple":"A chat helper writes text word by word. What is it?","options":["A large language model","A computer vision model","A recommendation system","A clustering model"],"correct":"A large language model","correctAnswers":["A large language model"],"pairs":[],"explanation":"Large language models generate text by predicting likely next tokens from patterns learned during training.","difficulty":"beginner","transfer":"A homework helper app suggests the next sentence as you type. What kind of model is doing that?"},{"id":"at1_q2","type":"matchPairs","text":"Match each assistant feature to what makes it work:","simple":"Match each helper feature to what makes it work.","options":[],"correct":"","correctAnswers":[],"pairs":[{"term":"Answers in full sentences","definition":"Next-token prediction"},{"term":"Quotes today's handbook","definition":"Retrieval before answering"},{"term":"Remembers earlier in the chat","definition":"Context window"},{"term":"Refuses a harmful request","definition":"Safety training and rules"}],"explanation":"An assistant is a language model wrapped in extra systems: retrieval for facts, a context window for the conversation, and safety layers for behaviour.","difficulty":"beginner","transfer":"A study app forgets what you said ten messages ago. Which part of the system probably ran out of room?"},{"id":"at1_q3","type":"trueFalse","text":"Some language models can be downloaded and run on your own computer.","simple":"Can some language models run on your own computer?","options":["True","False"],"correct":"True","correctAnswers":["True"],"pairs":[],"explanation":"Open-weight models publish their learned parameters so people can download and run them locally. Others are available only through an online service.","difficulty":"beginner","transfer":"Your family wants an assistant that works on a camping trip with no signal. What kind of model would that need?"},{"id":"at1_q4","type":"multipleChoice","text":"Modern language models connect words across a whole prompt using attention. Which architecture is this?","simple":"Which design links words across a prompt using attention?","options":["Transformer","Convolutional neural network","Decision tree","Retrieval database"],"correct":"Transformer","correctAnswers":["Transformer"],"pairs":[],"explanation":"The transformer architecture uses attention to relate tokens to each other. It is the basis of today's language models.","difficulty":"intermediate","transfer":"In the sentence 'Sam dropped the cup and it broke', which word must 'it' attend to?"},{"id":"at1_q5","type":"multipleChoice","text":"A team can download a model's parameters but not its training data or code. What is this?","simple":"You can download the weights but not the data. What is it?","options":["An open-weight model","A fully open-source model","A closed online model","A rule-based model"],"correct":"An open-weight model","correctAnswers":["An open-weight model"],"pairs":[],"explanation":"Open-weight means the learned weights are available. It does not guarantee that the data, training code, or licence are fully open.","difficulty":"intermediate","transfer":"A recipe lists the finished dish but not the ingredients or steps. How is that like an open-weight model?"},{"id":"at1_q6","type":"scenarioJudgment","text":"A clinic's rule says patient notes must stay on its own computers. Which choice meets that rule?","simple":"Patient notes must stay on the clinic's computers. Which choice fits?","options":["Run a model on the clinic's own servers","Use an online service with a strong privacy policy","Use a paid online service and delete each chat afterwards","Type the notes into a free assistant without names"],"correct":"Run a model on the clinic's own servers","correctAnswers":["Run a model on the clinic's own servers"],"pairs":[],"explanation":"The rule is about where the data goes, so only a local model satisfies it. A hosted service can be a sound choice when the data is allowed to leave.","difficulty":"advanced","transfer":"A club's rule says member phone numbers stay on the club laptop. Which AI setup respects that?"},{"id":"at1_q7","type":"explain","text":"Explain to a younger student what a chat assistant is actually doing when it answers.","simple":"Tell a younger kid what a chat helper is really doing.","options":["It predicts likely words from patterns","It does not think or feel","It can sound sure and still be wrong"],"correct":"It is a language model that predicts likely next words from patterns it learned in training. It does not think or feel, so it can sound confident even when the answer is wrong.","correctAnswers":["It is a language model that predicts likely next words from patterns it learned in training. It does not think or feel, so it can sound confident even when the answer is wrong."],"pairs":[],"explanation":"The strongest answers name the mechanism (predicting words) and the limit (fluent but not necessarily true).","difficulty":"beginner","transfer":"A younger cousin thanks a chat assistant for being kind. What would you gently explain?"},{"id":"at1_q8","type":"scenarioJudgment","text":"A chat assistant gives a confident answer about a rule at your school. What should you check?","simple":"A chat assistant states a school rule. What should you check?","options":["The current school handbook","A second chat assistant","How confident the wording sounds","How long the answer is"],"correct":"The current school handbook","correctAnswers":["The current school handbook"],"pairs":[],"explanation":"Assistants predict likely words. Local facts need a real source.","difficulty":"beginner","transfer":"An assistant tells you the pool's opening hours. Where would you confirm them before going?"}],"cards":[{"emoji":"💬","title":"Assistants Predict Words","body":"A chat assistant is a large language model. It writes by predicting likely next words, not by looking up one stored answer. Fluent text can still be wrong.","funFact":null},{"emoji":"🧩","title":"The Extra Parts","body":"An assistant is a model plus helpers. Retrieval fetches documents before it answers, the context window holds the conversation so far, and safety rules shape what it will do.","funFact":null},{"emoji":"🔦","title":"Attention","body":"Today's language models use a design called the transformer. Its attention step lets every word in a prompt look at every other word, so 'it' can connect back to 'the cup'.","funFact":null},{"emoji":"🔓","title":"Open or Closed","body":"Open-weight models can be downloaded and run by anyone with the hardware. Closed models are used only through an online service. Where the model runs decides where your data goes.","funFact":null}]},{"id":"at_l2","title":"Image and Video Generators","description":"Tools that turn words into pictures and clips","order":1,"difficulty":"beginner","questions":[{"id":"at2_q1","type":"multipleChoice","text":"You type 'a red bicycle in the rain' and a picture appears. What kind of tool is this?","simple":"You type words and a picture appears. What tool is this?","options":["Text-to-image generator","Image classifier","Speech recogniser","Recommendation system"],"correct":"Text-to-image generator","correctAnswers":["Text-to-image generator"],"pairs":[],"explanation":"A text-to-image generator creates a new picture from a written description. A classifier does the opposite: it labels a picture it is given.","difficulty":"beginner","transfer":"A poster app makes a new logo from your description. Generator or classifier?"},{"id":"at2_q2","type":"trueFalse","text":"Some image generators can run on a home computer without an internet connection.","simple":"Can some picture generators work with no internet?","options":["True","False"],"correct":"True","correctAnswers":["True"],"pairs":[],"explanation":"Open image models can be downloaded and run locally when the computer has enough graphics memory. Online services run the same kind of model on their own servers.","difficulty":"beginner","transfer":"An art club wants to make images during a trip with no Wi-Fi. What would the club's laptop need?"},{"id":"at2_q3","type":"matchPairs","text":"Match each visual tool to its job:","simple":"Match each picture tool to its job.","options":[],"correct":"","correctAnswers":[],"pairs":[{"term":"Text-to-image generator","definition":"Makes a new picture from a description"},{"term":"Text-to-video generator","definition":"Makes a short clip from a description"},{"term":"Image editor with AI","definition":"Removes or changes parts of a real photo"},{"term":"Image classifier","definition":"Says what is in a picture"}],"explanation":"Generators make new media, editors change existing media, and classifiers label media. Knowing which one you are using tells you what can go wrong.","difficulty":"beginner","transfer":"A phone app erases a stranger from your beach photo. Which kind of tool is that, and what could it get wrong?"},{"id":"at2_q4","type":"fillInBlank","text":"Most modern image generators use __________, a technique that starts with noise and refines it into an image.","simple":"Which method turns noise into a picture step by step?","options":["diffusion","compression","rendering","filtering"],"correct":"diffusion","correctAnswers":["diffusion"],"pairs":[],"explanation":"Diffusion models learn to reverse a noise-adding process. They start from random noise and remove it step by step, guided by the prompt.","difficulty":"intermediate","transfer":"A generator shows a blurry preview that sharpens over a few seconds. Which step of diffusion are you watching?"},{"id":"at2_q5","type":"multipleChoice","text":"What is a 'prompt' in AI image generation?","simple":"What is a prompt for a picture generator?","options":["The written description the tool works from","The file type used to save the result","The size setting for the finished picture","The amount of computing power used"],"correct":"The written description the tool works from","correctAnswers":["The written description the tool works from"],"pairs":[],"explanation":"The prompt is the written description the generator works from. Specific prompts about subject, style, and lighting usually give more useful results.","difficulty":"intermediate","transfer":"You want a picture of your dog as a knight. Write a prompt that names three details."},{"id":"at2_q6","type":"scenarioJudgment","text":"A studio owns a powerful computer and wants thousands of drafts with no per-image fee. Best fit?","simple":"A studio has a strong computer and wants free drafts. Best fit?","options":["An open image model running on the studio's own computer","A paid online generator that charges for each image","An online video generator with a monthly plan","A photo classifier that labels the studio's archive"],"correct":"An open image model running on the studio's own computer","correctAnswers":["An open image model running on the studio's own computer"],"pairs":[],"explanation":"With capable hardware already in place, a local model removes per-image costs. A paid service fits better when there is no hardware or time for setup.","difficulty":"advanced","transfer":"A friend wants three birthday card images and has an old laptop. Would you suggest local or online? Why?"},{"id":"at2_q7","type":"explain","text":"A friend says an AI image is 'a photo the computer found online.' Explain what is really happening.","simple":"Is an AI picture a photo found online? Explain.","options":["The image is newly generated, not found","It is built from patterns learned from many images","Details can be invented or wrong"],"correct":"The picture is generated new from patterns the model learned from many training images. It is not a stored photo, so details such as hands, text, or logos can be invented or wrong.","correctAnswers":["The picture is generated new from patterns the model learned from many training images. It is not a stored photo, so details such as hands, text, or logos can be invented or wrong."],"pairs":[],"explanation":"A strong answer separates generating from retrieving and mentions that generated details are not evidence of anything real.","difficulty":"beginner","transfer":"A generated image shows your school with a pool it does not have. How would you explain that to a classmate?"},{"id":"at2_q8","type":"trueFalse","text":"A clearer description usually gives a closer image result.","simple":"Does a clearer description give a closer image?","options":["True","False"],"correct":"True","correctAnswers":["True"],"pairs":[],"explanation":"Generators follow the words you give. Vague prompts leave the details to chance.","difficulty":"beginner","transfer":"Rewrite the prompt 'a nice animal' so a generator knows what to draw."}],"cards":[{"emoji":"🎨","title":"Words to Pictures","body":"Text-to-image generators turn a written description into a new picture. The picture is made fresh from learned patterns, not found online. The clearer the description, the closer the result.","funFact":null},{"emoji":"🧭","title":"Generate, Edit, or Label","body":"Generators make new pictures or clips. AI editors change parts of a real photo. Classifiers say what is already in a picture. Each one fails in its own way.","funFact":null},{"emoji":"🌫️","title":"Diffusion","body":"Most image generators use diffusion: start with random noise, then refine it step by step into a clean image guided by your prompt.","funFact":null},{"emoji":"🖥️","title":"Online or at Home","body":"Some open image models run on a home computer with enough graphics memory, with no fee per image. Online services run the same kind of model on their servers and charge for use or a plan.","funFact":null}]},{"id":"at_l3","title":"AI for Code","description":"How coding assistants help, and why review still matters","order":2,"difficulty":"intermediate","questions":[{"id":"at3_q1","type":"multipleChoice","text":"A coding assistant suggests the next lines as a programmer types. What is it?","simple":"A tool suggests code as you type. What is it?","options":["An AI assistant trained on code","A version control system","A cloud server","A new programming language"],"correct":"An AI assistant trained on code","correctAnswers":["An AI assistant trained on code"],"pairs":[],"explanation":"Coding assistants are language models trained on large amounts of code. They suggest completions, functions, and fixes inside an editor.","difficulty":"beginner","transfer":"A spelling checker suggests the next word in an essay. How is that similar to a coding assistant?"},{"id":"at3_q2","type":"multipleChoice","text":"A coding assistant writes a login function. What must happen before it ships?","simple":"AI wrote some code. What happens before it is used?","options":["Code review and testing","A higher temperature setting","A second round of tokenization","A search for similar images"],"correct":"Code review and testing","correctAnswers":["Code review and testing"],"pairs":[],"explanation":"Generated code can contain logic bugs or security problems. Human review and automated tests are required before important code is used.","difficulty":"beginner","transfer":"A friend's game script came from an assistant. What would you try before letting the whole class play it?"},{"id":"at3_q3","type":"sortOrder","text":"Put these steps of AI-assisted coding in the correct order:","simple":"Put the coding steps in order.","options":["Review and test the generated code","Describe what you want the code to do","AI generates a code suggestion","Add the working code to your project"],"correct":"","correctAnswers":["Describe what you want the code to do","AI generates a code suggestion","Review and test the generated code","Add the working code to your project"],"pairs":[],"explanation":"Describe, generate, review, integrate. Skipping the review step is the most common and most costly mistake.","difficulty":"beginner","transfer":"You ask an assistant for a chore-chart formula. Which step would you refuse to skip?"},{"id":"at3_q4","type":"matchPairs","text":"Match each kind of coding tool to how it works:","simple":"Match each coding tool to how it works.","options":[],"correct":"","correctAnswers":[],"pairs":[{"term":"Editor plug-in","definition":"Suggests code inline as you type"},{"term":"AI-first editor","definition":"Chat and edits built into the whole editor"},{"term":"Terminal agent","definition":"Runs multi-step tasks from the command line"},{"term":"Browser workspace","definition":"Codes and runs projects in a web page"}],"explanation":"Coding tools differ in where they live and how much they do on their own. Every one of them still needs a person to check the result.","difficulty":"beginner","transfer":"A tool can rename files across your whole project by itself. Which kind is it, and what would you check afterwards?"},{"id":"at3_q5","type":"fillInBlank","text":"A person working alongside a coding assistant is often called AI __________ programming.","simple":"Working with a coding assistant is called AI ______ programming.","options":["pair","solo","parallel","batch"],"correct":"pair","correctAnswers":["pair"],"pairs":[],"explanation":"AI pair programming borrows the idea of two developers working together, with one seat taken by an assistant that drafts, explains, and reviews.","difficulty":"intermediate","transfer":"Two students build a robot together and check each other's work. Which part of that is like AI pair programming?"},{"id":"at3_q6","type":"scenarioJudgment","text":"A junior developer used AI to write a database query and is unsure about security. What now?","simple":"AI wrote a database query. Security is unclear. What now?","options":["Have an experienced developer review it before it ships","Ship it because generated code is usually secure","Rewrite the whole feature by hand instead","Ask the assistant if it is safe and trust the answer"],"correct":"Have an experienced developer review it before it ships","correctAnswers":["Have an experienced developer review it before it ships"],"pairs":[],"explanation":"Generated code can contain vulnerabilities such as injection flaws. Review by someone experienced is the safeguard, especially for security-sensitive code.","difficulty":"advanced","transfer":"An assistant wrote the sign-in page for a club website. Who should look at it before members use it?"},{"id":"at3_q7","type":"explain","text":"Why should a programmer test code an assistant wrote, even when it looks right?","simple":"Why test code that AI wrote, even if it looks fine?","options":["Generated code can have hidden bugs","It can be insecure","The person is responsible for what ships"],"correct":"The assistant predicts plausible code, not correct code, so it can hide logic bugs or security holes that look fine. The programmer is responsible for what ships, so tests and review catch what reading alone misses.","correctAnswers":["The assistant predicts plausible code, not correct code, so it can hide logic bugs or security holes that look fine. The programmer is responsible for what ships, so tests and review catch what reading alone misses."],"pairs":[],"explanation":"Strong answers mention both hidden errors and responsibility.","difficulty":"beginner","transfer":"A calculator app you built with an assistant gives 7 + 8 = 16 once. What does that tell you about reading versus testing?"}],"cards":[{"emoji":"👩‍💻","title":"AI Pair Programming","body":"Coding assistants suggest code right in the editor, like a partner who types fast. You describe, it drafts, and you decide what stays.","funFact":null},{"emoji":"🧰","title":"Where Coding Tools Live","body":"Some assistants are plug-ins inside an editor. Some are editors built around chat. Some run tasks from the terminal, and some code and run projects in a web page. The more a tool does on its own, the more there is to check.","funFact":null},{"emoji":"🔍","title":"Review Before You Ship","body":"Generated code can hide bugs and security holes that look fine on the page. Review and test it before adding it to your project. The person who ships the code is responsible for it.","funFact":null}]},{"id":"at_l4","title":"Open, Closed, and Local","description":"Where a model runs and who can change it","order":3,"difficulty":"intermediate","questions":[{"id":"at4_q1","type":"multipleChoice","text":"A website lets researchers share and download thousands of AI models. What is it?","simple":"A site where people share AI models. What is it?","options":["A model-sharing platform","A single chat assistant","A cloud training service","A dataset search engine"],"correct":"A model-sharing platform","correctAnswers":["A model-sharing platform"],"pairs":[],"explanation":"Model-sharing platforms host open models, datasets, and demos so people can download, compare, and build on them.","difficulty":"beginner","transfer":"A site where people share free game levels works in a similar way. What would you check before downloading one?"},{"id":"at4_q2","type":"trueFalse","text":"'Open-weight' means exactly the same thing as 'open-source' for AI models.","simple":"Are open-weight and open-source the same thing?","options":["True","False"],"correct":"False","correctAnswers":["False"],"pairs":[],"explanation":"Open-weight releases the trained parameters. Open-source would also include the training data and code needed to rebuild the model.","difficulty":"beginner","transfer":"A band shares its finished song but not the sheet music or recordings. Which is that more like, open-weight or open-source?"},{"id":"at4_q3","type":"matchPairs","text":"Match each kind of licence to what it allows:","simple":"Match each licence to what it allows.","options":[],"correct":"","correctAnswers":[],"pairs":[{"term":"Permissive open licence","definition":"Use, change, and sell with few conditions"},{"term":"Share-alike licence","definition":"Share your changes under the same terms"},{"term":"Non-commercial licence","definition":"Free to use, but not to sell"},{"term":"Proprietary","definition":"Weights are not released to the public"}],"explanation":"A licence tells you what you may do with a model. Reading it matters as much as reading the model card.","difficulty":"beginner","transfer":"A friend wants to sell stickers made with a model marked non-commercial. What does the licence say about that?"},{"id":"at4_q4","type":"multipleChoice","text":"One command downloads an open model and runs it on your laptop. What is the tool for?","simple":"One command runs an open model on your laptop. Its job?","options":["Running AI models locally","Training a model in the cloud","Publishing a new language model","Labeling a dataset for fine-tuning"],"correct":"Running AI models locally","correctAnswers":["Running AI models locally"],"pairs":[],"explanation":"Local runners package open models so they can run on a personal computer without an online service or account.","difficulty":"intermediate","transfer":"Your school computer lab has no internet during exams. Which kind of tool could still run a model there?"},{"id":"at4_q5","type":"fillInBlank","text":"Running an AI model on your own hardware instead of through an online service is called running it __________.","simple":"Running a model on your own computer is running it ______.","options":["locally","remotely","privately","manually"],"correct":"locally","correctAnswers":["locally"],"pairs":[],"explanation":"Local means the computation happens on your machine. That gives privacy, no per-request cost, and offline use, but needs enough memory.","difficulty":"intermediate","transfer":"A game you play offline versus one that needs a server. Which is like a local model?"},{"id":"at4_q6","type":"scenarioJudgment","text":"A small charity has no IT staff, no private data, and needs a summary helper this week. Best fit?","simple":"No IT staff, no private data, needed this week. Best fit?","options":["A hosted online service that needs no setup","An open model on a server the charity must buy","A model the charity trains from scratch","A local runner on a volunteer's old laptop"],"correct":"A hosted online service that needs no setup","correctAnswers":["A hosted online service that needs no setup"],"pairs":[],"explanation":"With no private data and no hardware or staff, a hosted service is the sound choice. Local running earns its cost when data must stay in-house.","difficulty":"advanced","transfer":"A sports team wants match summaries from public scores and has no hardware. Local or hosted? Why?"},{"id":"at4_q7","type":"explain","text":"Explain one advantage and one cost of running a model locally instead of online.","simple":"Give one benefit and one cost of local AI.","options":["Advantage: inference can work offline","Cost: needs hardware and setup","Trade-off depends on the job"],"correct":"Local inference can work offline on your own device, but check the app for telemetry, connected tools, sync and costs. You may need capable hardware and must maintain the model.","correctAnswers":["Local inference can work offline on your own device, but check the app for telemetry, connected tools, sync and costs. You may need capable hardware and must maintain the model."],"pairs":[],"explanation":"Strong answers name a benefit and a cost and connect them to the situation.","difficulty":"beginner","transfer":"Your family debates a home movie server versus a streaming plan. Which trade-offs match local versus online AI?"},{"id":"at4_q8","type":"scenarioJudgment","text":"You want to use AI with private diary entries. Which option keeps them on your computer?","simple":"Which option keeps your diary on your own computer?","options":["A model running on your own computer","An online chat service with an account","A shared class document with comments","A cloud notes app that syncs devices"],"correct":"A model running on your own computer","correctAnswers":["A model running on your own computer"],"pairs":[],"explanation":"A local model does not send your text to a company server. It needs capable hardware.","difficulty":"beginner","transfer":"You want AI feedback on a song you have not released. What would you check about where the audio goes?"}],"cards":[{"emoji":"🔓","title":"Open or Closed","body":"Open-weight models publish their learned parameters, so anyone with the hardware can download and run them. Open-source would also share the data and code. Closed models are used only through an online service.","funFact":null},{"emoji":"📜","title":"Read the Licence","body":"A licence says what you may do with a model. Permissive licences allow almost anything, share-alike licences require you to share changes the same way, and non-commercial licences forbid selling.","funFact":null},{"emoji":"💻","title":"Running AI Locally","body":"You can run some AI models on your own computer. This gives you privacy, offline use, and no per-request fee, but it needs capable hardware and setup.","funFact":null},{"emoji":"☁️","title":"Online or Local","body":"Online AI runs on a company's servers. Local AI runs on your machine. Which is better depends on the job: where the data may go, what hardware you have, and how fast you need it.","funFact":null}]},{"id":"at_l5","title":"APIs and Integration","description":"How apps talk to AI behind the scenes","order":4,"difficulty":"advanced","questions":[{"id":"at5_q1","type":"multipleChoice","text":"What is an API in AI services?","simple":"What is an API?","options":["A way for an app to send requests to a model","The chat screen you type into","A kind of neural network","A programming language"],"correct":"A way for an app to send requests to a model","correctAnswers":["A way for an app to send requests to a model"],"pairs":[],"explanation":"An API lets a developer's code send a prompt to a model and receive the reply, so AI features can be built into apps and websites.","difficulty":"beginner","transfer":"A weather app shows a forecast from a weather service. How is that like an app calling an AI API?"},{"id":"at5_q2","type":"trueFalse","text":"Many apps with AI features call a model through an API instead of running their own model.","simple":"Do many apps borrow an AI model through an API?","options":["True","False"],"correct":"True","correctAnswers":["True"],"pairs":[],"explanation":"Running a large model is expensive, so most apps send requests to a model provider's API and pay per use.","difficulty":"beginner","transfer":"A tiny homework app has an 'explain this' button. Where does the model probably run?"},{"id":"at5_q3","type":"sortOrder","text":"Put these steps of an AI API call in the correct order:","simple":"Put the API steps in order.","options":["Receive the model's response","Authenticate with your API key","Send a request with your prompt","Show the response in your app"],"correct":"","correctAnswers":["Authenticate with your API key","Send a request with your prompt","Receive the model's response","Show the response in your app"],"pairs":[],"explanation":"Authenticate, send, receive, display. The app's own code handles the last step, which is where checks and formatting belong.","difficulty":"beginner","transfer":"Ordering a pizza by phone has similar steps. Which step is like showing the response in your app?"},{"id":"at5_q4","type":"fillInBlank","text":"An API __________ is a secret code that identifies your app and authorises it to use an AI service.","simple":"A secret code for service access is an API ______.","options":["key","token","bridge","lock"],"correct":"key","correctAnswers":["key"],"pairs":[],"explanation":"API keys must stay secret. A leaked key lets strangers use and bill your account.","difficulty":"intermediate","transfer":"You would not post your locker combination in a group chat. What is the API key version of that mistake?"},{"id":"at5_q5","type":"multipleChoice","text":"What is a 'rate limit' on an AI API?","simple":"What is a rate limit?","options":["A cap on requests per time period","The speed at which the model writes","The longest prompt the service accepts","The most you can pay each month"],"correct":"A cap on requests per time period","correctAnswers":["A cap on requests per time period"],"pairs":[],"explanation":"Rate limits stop one user from overwhelming the service. Requests above the limit are rejected until the window resets.","difficulty":"intermediate","transfer":"A library lets each card borrow five books a week. How is that like a rate limit?"},{"id":"at5_q6","type":"scenarioJudgment","text":"A developer accidentally publishes their API key in a public code repository. First step?","simple":"A developer posted their API key publicly. First step?","options":["Revoke the key and create a new one right away","Delete the commit and hope nobody saw it","Make the repository private and move on","Watch the usage to see whether anyone uses it"],"correct":"Revoke the key and create a new one right away","correctAnswers":["Revoke the key and create a new one right away"],"pairs":[],"explanation":"Exposed keys are found by automated scanners within minutes. Revoke first, then store the new key outside the code.","difficulty":"advanced","transfer":"You realise you read a house key code aloud on a livestream. What is the first thing to do?"},{"id":"at5_q7","type":"explain","text":"Explain why an API key should be kept secret, using an everyday comparison.","simple":"Why keep an API key secret? Compare it to something everyday.","options":["It works like a password or house key","Anyone with it can act as you","You can be charged for their use"],"correct":"An API key is like a house key or password: anyone who has it can use the service as if they were you, and you pay for what they do. So it stays out of shared code and screenshots.","correctAnswers":["An API key is like a house key or password: anyone who has it can use the service as if they were you, and you pay for what they do. So it stays out of shared code and screenshots."],"pairs":[],"explanation":"Strong answers include the comparison and the consequence.","difficulty":"beginner","transfer":"A teammate wants to paste the club's API key into a shared slideshow. What would you suggest instead?"},{"id":"at5_q8","type":"trueFalse","text":"An API lets an app send a request to a model and get a response back.","simple":"Does an API let an app send requests to a model?","options":["True","False"],"correct":"True","correctAnswers":["True"],"pairs":[],"explanation":"Most apps with AI features use an API rather than running their own model.","difficulty":"beginner","transfer":"Name an app you use that might call an AI service behind the scenes."}],"cards":[{"emoji":"🔌","title":"APIs Connect Apps to AI","body":"An API lets your app talk to an AI service. You send a request, the model processes it, and a response comes back. Most apps borrow a model this way instead of running their own.","funFact":null},{"emoji":"🔑","title":"API Keys","body":"An API key is like a password that identifies your app. Keep it secret: anyone with your key can use and charge your account. If a key leaks, revoke it first.","funFact":null},{"emoji":"⏱️","title":"Rate Limits","body":"A rate limit caps how many requests an app may send in a period of time. It keeps one user from overwhelming the service, so well-built apps wait and retry instead of failing.","funFact":null}]},{"id":"at_l6","title":"AI Agents and Automation","description":"Tools that plan steps and take actions","order":5,"difficulty":"advanced","questions":[{"id":"at6_q1","type":"multipleChoice","text":"What is an AI agent?","simple":"What is an AI agent?","options":["A system that plans and carries out multi-step tasks","A person who works in an AI company","A chatbot that only answers common questions","A device that stores and runs models"],"correct":"A system that plans and carries out multi-step tasks","correctAnswers":["A system that plans and carries out multi-step tasks"],"pairs":[],"explanation":"Agents break a goal into steps, use tools, check results, and adjust. A plain chatbot answers one message at a time.","difficulty":"beginner","transfer":"A robot vacuum maps a room, cleans, returns to charge, and resumes. Which parts make it agent-like?"},{"id":"at6_q2","type":"trueFalse","text":"Tool use lets a model request actions such as a web search or a database lookup during a task.","simple":"Can a model ask to use tools like search during a task?","options":["True","False"],"correct":"True","correctAnswers":["True"],"pairs":[],"explanation":"With tool use, a model can call functions the developer allows, such as search, calculators, or file access, and use the results.","difficulty":"beginner","transfer":"A homework agent can run a calculator. Which of its answers would you still check yourself?"},{"id":"at6_q3","type":"matchPairs","text":"Match each agent concept to its description:","simple":"Match each agent idea to what it means.","options":[],"correct":"","correctAnswers":[],"pairs":[{"term":"Tool use","definition":"The model calls an outside function"},{"term":"Planning","definition":"Breaking a goal into ordered steps"},{"term":"Observation","definition":"Reading a result before the next step"},{"term":"Human approval","definition":"A person confirms risky actions"}],"explanation":"Agents loop through plan, act, observe. Human approval is the safeguard that keeps high-stakes actions under a person's control.","difficulty":"beginner","transfer":"Planning a bake sale has the same loop. What would 'observation' look like there?"},{"id":"at6_q4","type":"fillInBlank","text":"A shared __________ lets many models connect to the same tools and data sources in a standard way.","simple":"A shared ______ lets many models use the same tools.","options":["protocol","password","dataset","browser"],"correct":"protocol","correctAnswers":["protocol"],"pairs":[],"explanation":"Open protocols define how a model asks for a tool and how the tool replies, so developers do not rebuild every connection from scratch.","difficulty":"intermediate","transfer":"Every charger fitting every phone would be a shared standard. What does a shared protocol save developers?"},{"id":"at6_q5","type":"multipleChoice","text":"What is a key difference between a regular chatbot and an AI agent?","simple":"How is an AI agent different from a chatbot?","options":["An agent can use tools and act across several steps","An agent needs a physical robot body","An agent uses a different kind of maths","An agent only responds to spoken commands"],"correct":"An agent can use tools and act across several steps","correctAnswers":["An agent can use tools and act across several steps"],"pairs":[],"explanation":"The difference is action and iteration: an agent plans, uses tools, observes results, and continues until the goal is met or a person stops it.","difficulty":"intermediate","transfer":"A study app both answers questions and books your library room. Which part is agent-like?"},{"id":"at6_q6","type":"scenarioJudgment","text":"A company wants an agent that processes refunds with access to payments. Top concern?","simple":"An agent can send refunds. What matters most?","options":["Human approval for high-stakes actions","Making it respond as fast as possible","Training it on as much customer data as possible","Letting it handle many refunds at once"],"correct":"Human approval for high-stakes actions","correctAnswers":["Human approval for high-stakes actions"],"pairs":[],"explanation":"When an agent can move money, a person should approve the action. Speed and scale are worthless if the action is wrong.","difficulty":"advanced","transfer":"A family agent can reorder groceries with a saved card. Which orders should need a parent's tap?"},{"id":"at6_q7","type":"explain","text":"Describe one task you would let an AI agent do on its own, and one you would not. Say why.","simple":"Which agent task needs approval? Which can run alone? Why?","options":["Low-stakes, reversible tasks can be automated","High-stakes or irreversible tasks need a person","The reason is about consequences"],"correct":"I would let an agent sort my photos into albums because a mistake is easy to undo. I would not let it send money or messages to people on its own, because those actions affect others and are hard to reverse.","correctAnswers":["I would let an agent sort my photos into albums because a mistake is easy to undo. I would not let it send money or messages to people on its own, because those actions affect others and are hard to reverse."],"pairs":[],"explanation":"Strong answers use consequences and reversibility as the test.","difficulty":"beginner","transfer":"Sort these by how much approval they need: renaming files, posting to a class group, moving money."},{"id":"at6_q8","type":"scenarioJudgment","text":"An agent can send emails for you. Which action should need your approval?","simple":"An agent can send emails. Which needs your approval?","options":["Sending a message to your whole class","Sorting saved drafts by their date","Counting the unread messages in your inbox","Spell-checking a draft you have not sent"],"correct":"Sending a message to your whole class","correctAnswers":["Sending a message to your whole class"],"pairs":[],"explanation":"Actions that reach other people or cost money deserve a human check.","difficulty":"beginner","transfer":"What other agent action would you want to approve first?"}],"cards":[{"emoji":"🤖","title":"AI Agents","body":"AI agents plan multi-step tasks, use tools, and check their own results. They go beyond answering one message. The loop is plan, act, observe, and adjust.","funFact":null},{"emoji":"🔗","title":"AI and Tools","body":"Modern models can use tools: search the web, run code, read files. Tools make AI useful for real tasks and also raise the stakes.","funFact":null},{"emoji":"🧷","title":"Shared Connectors","body":"A shared protocol is an agreed way for a model to ask for a tool and get a reply. With one standard, developers connect many models to the same tools without rebuilding each link.","funFact":null},{"emoji":"🛑","title":"Keep a Person in Charge","body":"The more an agent can do, the more important it is that a person approves actions that cost money or affect other people.","funFact":null}]}],"bigIdeas":["perception","naturalInteraction"]},{"id":"ai_practice","name":"AI in Practice","icon":"hand.raised.fingers.spread","color":"aiPrimary","description":"Put your AI skills to work with real-world challenges","order":13,"unlock":{"kind":"completeTier2Minimum","value":6},"lessons":[{"id":"aip_l1","title":"Evaluating AI Output","description":"Is this AI response good or bad?","order":0,"difficulty":"beginner","questions":[{"id":"aip1_q1","type":"multipleChoice","text":"What is the FIRST thing you should do when an AI assistant gives you a response?","simple":"What should you do first after an AI answers?","options":["Check if the information seems accurate and relevant","Copy and paste it directly into your work","Share it on social media immediately","Assume it is completely correct"],"correct":"Check if the information seems accurate and relevant","correctAnswers":["Check if the information seems accurate and relevant"],"pairs":[],"explanation":"AI responses can contain errors or made-up details. Always evaluate the output before using it, regardless of which assistant produced it.","difficulty":"beginner","transfer":"An AI answer about your town has a wrong date. What does that tell you?"},{"id":"aip1_q2","type":"multipleChoice","text":"One answer is accurate in 80 words. Another repeats itself for 500. Which quality favors the first?","simple":"One answer is short and right, one repeats itself. Which quality wins?","options":["Conciseness","Temperature","Model size","Tokenization"],"correct":"Conciseness","correctAnswers":["Conciseness"],"pairs":[],"explanation":"Conciseness means communicating the needed information without waste. Length alone does not make an answer useful.","difficulty":"beginner","transfer":"A friend's directions are correct but ten minutes long. What would make them better?"},{"id":"aip1_q3","type":"scenarioJudgment","text":"An AI claims the internet was invented in 1995. What should you do with that claim?","simple":"AI says the internet started in 1995. What do you do?","options":["Check the date in a trusted source before using it","Use it, because it sounds specific","Ask the same AI whether it is sure","Change the year to one that sounds better"],"correct":"Check the date in a trusted source before using it","correctAnswers":["Check the date in a trusted source before using it"],"pairs":[],"explanation":"A specific-sounding date can still be wrong. The internet grew out of networks from the late 1960s onward, so this claim fails a quick check.","difficulty":"beginner","transfer":"An assistant tells you when your favourite game studio was founded. How would you check it in under a minute?"},{"id":"aip1_q4","type":"fillInBlank","text":"When an AI confidently presents false information as fact, this is called a __________.","simple":"AI states false things as fact. This is called a what?","options":["hallucination","fabrication","calculation","calibration"],"correct":"hallucination","correctAnswers":["hallucination"],"pairs":[],"explanation":"AI hallucination occurs when a model generates plausible-sounding but factually incorrect information. This is a known limitation of all current language models.","difficulty":"intermediate","transfer":"A helper invents a book title for your report. How would you notice, and what next?"},{"id":"aip1_q5","type":"matchPairs","text":"Match each quality indicator to what it checks in AI output:","simple":"Match each quality check to what it looks for.","options":[],"correct":"","correctAnswers":[],"pairs":[{"term":"Accuracy","definition":"Are the facts correct?"},{"term":"Relevance","definition":"Does it answer the question?"},{"term":"Completeness","definition":"Is anything important missing?"},{"term":"Clarity","definition":"Is it easy to understand?"}],"explanation":"Evaluating AI output across multiple dimensions helps you determine whether a response is truly useful or needs improvement.","difficulty":"beginner","transfer":"Check a recipe an assistant wrote against these four qualities. Which one fails most often?"},{"id":"aip1_q6","type":"multipleChoice","text":"Which AI output quality issue is HARDEST for most people to detect?","simple":"Which AI mistake is hardest for people to spot?","options":["Subtle factual errors mixed with correct information","Completely off-topic responses","Responses in the wrong language","Responses that are obviously too short"],"correct":"Subtle factual errors mixed with correct information","correctAnswers":["Subtle factual errors mixed with correct information"],"pairs":[],"explanation":"AI models are especially tricky when they weave small errors into mostly accurate text. This makes fact-checking individual claims essential.","difficulty":"advanced","transfer":"A history answer has nine true dates and one wrong one. Why is that harder to catch than nonsense?"},{"id":"aip1_q7","type":"scenarioJudgment","text":"An AI answer lists five facts. One looks odd. What do you do?","simple":"One fact in an AI answer looks odd. What do you do?","options":["Check that fact with a trusted source","Trust it because the others seem fine","Delete the answer","Ask the AI if it is sure"],"correct":"Check that fact with a trusted source","correctAnswers":["Check that fact with a trusted source"],"pairs":[],"explanation":"Subtle errors hide among correct facts. Treat the answer as a draft and verify what matters.","difficulty":"beginner","transfer":"Which kind of fact would you always verify?"},{"id":"aip1_q8","type":"trueFalse","text":"A longer AI answer is a better answer.","simple":"Is a longer answer a better answer?","options":["True","False"],"correct":"False","correctAnswers":["False"],"pairs":[],"explanation":"Accuracy and relevance matter more than length. Padding can hide missing substance.","difficulty":"beginner","transfer":"What would you cut from a rambling AI answer?"},{"id":"aip1_q9","type":"explain","text":"Describe how you would judge whether an AI answer is good.","simple":"How would you judge whether an AI answer is good?","options":["Check accuracy against a trusted source","Check it answers the actual question","Check it is clear and not padded"],"correct":"I would check the facts against a source I trust, make sure it actually answers what I asked rather than something nearby, and see whether it is clear and concise instead of padded. If any part fails, I fix it or ask again.","correctAnswers":["I would check the facts against a source I trust, make sure it actually answers what I asked rather than something nearby, and see whether it is clear and concise instead of padded. If any part fails, I fix it or ask again."],"pairs":[],"explanation":"Strong answers mention accuracy, relevance, and clarity.","difficulty":"beginner","transfer":"Judge an AI-written summary of a book you know well. Which check would you do first?"}],"cards":[{"emoji":"⚠️","title":"AI Makes Mistakes","body":"AI can hallucinate, generating confident but wrong information. Always fact-check important AI outputs!","funFact":null},{"emoji":"✅","title":"Verify, Verify, Verify","body":"Treat AI outputs like a first draft. Review for accuracy, check sources, and use your own judgment.","funFact":null},{"emoji":"🔍","title":"Four Quality Checks","body":"Accuracy asks whether the facts are right. Relevance asks whether it answers the question. Completeness asks what is missing. Clarity asks whether a reader can follow it.","funFact":null}]},{"id":"aip_l2","title":"Choosing the Right AI Tool","description":"Pick the best AI for the job","order":1,"difficulty":"beginner","questions":[{"id":"aip2_q1","type":"multipleChoice","text":"Which type of AI tool would be BEST for generating a realistic image from a text description?","simple":"Which AI tool makes a picture from words?","options":["A text-to-image generator","A text-only writing assistant","A spreadsheet formula assistant","A code completion assistant"],"correct":"A text-to-image generator","correctAnswers":["A text-to-image generator"],"pairs":[],"explanation":"Text-to-image generators are designed to create visuals from written prompts. Other tools are designed for writing, data, or code instead.","difficulty":"beginner","transfer":"You need a spoken speech turned into text. Which tool type?"},{"id":"aip2_q2","type":"multipleChoice","text":"A vision model is strong at photos but weak at essays. Which principle does this show?","simple":"One model is good with photos, not essays. What matters?","options":["Task-model fit","Model popularity","Higher temperature","Longer answers"],"correct":"Task-model fit","correctAnswers":["Task-model fit"],"pairs":[],"explanation":"Task-model fit means choosing a model whose tested strengths match the job. No model is best at every task.","difficulty":"beginner","transfer":"A photo app describes pictures well but writes poor captions. Which task should it keep?"},{"id":"aip2_q3","type":"matchPairs","text":"Match each task to the best type of AI tool:","simple":"Match each job to the kind of AI tool that fits.","options":[],"correct":"","correctAnswers":[],"pairs":[{"term":"Writing a research summary","definition":"Text-based AI chatbot"},{"term":"Creating a logo concept","definition":"Image generation AI"},{"term":"Transcribing a podcast","definition":"Speech-to-text AI"},{"term":"Translating a document","definition":"Translation AI model"}],"explanation":"Specialized AI tools often outperform general-purpose ones for specific tasks. Knowing which tool to reach for is a key AI literacy skill.","difficulty":"beginner","transfer":"You need subtitles for a family video. Which kind of tool fits, and why not an image tool?"},{"id":"aip2_q4","type":"scenarioJudgment","text":"You need to analyze a big sales spreadsheet and make charts. Which choice fits best?","simple":"Big spreadsheet, need charts. Which tool fits?","options":["A data analysis tool, with a chatbot to explain results","A text chatbot alone, pasting all the rows","An image generator to draw the charts","No tool, since AI cannot work with numbers"],"correct":"A data analysis tool, with a chatbot to explain results","correctAnswers":["A data analysis tool, with a chatbot to explain results"],"pairs":[],"explanation":"Spreadsheet and analysis tools handle rows and charts reliably. A chatbot can help explain the results, but pasting thousands of rows into it is error-prone.","difficulty":"intermediate","transfer":"You want to plan a budget with formulas. Which kind of tool would you reach for first?"},{"id":"aip2_q5","type":"fillInBlank","text":"When choosing an AI tool, you should consider the task requirements, the tool's __________, and your privacy needs.","simple":"Choose a tool by the task, its strengths, and your what?","options":["strengths","popularity","logo design","download size"],"correct":"strengths","correctAnswers":["strengths"],"pairs":[],"explanation":"Each AI tool has different strengths and limitations. Matching the tool's capabilities to your specific needs leads to better results.","difficulty":"intermediate","transfer":"Two drawing apps do the job. One needs your contacts to run. How does that change your choice?"},{"id":"aip2_q6","type":"multipleChoice","text":"What matters MOST when choosing an AI tool for a sensitive workplace task?","simple":"For a sensitive work task, what matters most in a tool?","options":["Approved privacy, security, and data-retention rules","The tool has the most colorful logo","The tool gives the longest response","The tool is the newest one available"],"correct":"Approved privacy, security, and data-retention rules","correctAnswers":["Approved privacy, security, and data-retention rules"],"pairs":[],"explanation":"Sensitive work should use an organization-approved tool whose privacy, security, and retention rules fit the data. Capability alone is not enough.","difficulty":"advanced","transfer":"A club wants to store member phone numbers in an AI note tool. What should be checked first?"},{"id":"aip2_q7","type":"scenarioJudgment","text":"You need to turn a recorded interview into text. Which tool fits best?","simple":"Turn a recorded interview into text. Which tool?","options":["A speech-to-text model","An image generator","A chess engine","A spam filter"],"correct":"A speech-to-text model","correctAnswers":["A speech-to-text model"],"pairs":[],"explanation":"Each tool type is built for a kind of task. Match the tool to the job.","difficulty":"beginner","transfer":"Which tool would you pick to make a poster image?"},{"id":"aip2_q8","type":"trueFalse","text":"AI models are equally good at each kind of task.","simple":"Are AI models equally good at each task?","options":["True","False"],"correct":"False","correctAnswers":["False"],"pairs":[],"explanation":"Models have strengths and weaknesses. Knowing them helps you choose.","difficulty":"beginner","transfer":"What would you test before trusting a model with a new task?"},{"id":"aip2_q9","type":"explain","text":"Explain task-model fit and why it matters.","simple":"Explain task-model fit and why it matters.","options":["Different models are good at different tasks","Pick the tool built for the task","Using the wrong tool gives poor results"],"correct":"Task-model fit means choosing a model that is strong at the kind of task you have. A vision model is great with photos and weak with essays, so using it for writing gives poor results. Matching the tool to the job saves time and avoids mistakes.","correctAnswers":["Task-model fit means choosing a model that is strong at the kind of task you have. A vision model is great with photos and weak with essays, so using it for writing gives poor results. Matching the tool to the job saves time and avoids mistakes."],"pairs":[],"explanation":"Strong answers define it and give a mismatch example.","difficulty":"beginner","transfer":"Name one task where a general chatbot is the wrong tool, and what fits better."}],"cards":[{"emoji":"🧰","title":"Pick the Right Tool","body":"Different AI tools do different jobs. Chatbots write, image models draw, and speech models transcribe. Match the tool to the task!","funFact":null},{"emoji":"💪","title":"Every Model Has Strengths","body":"AI models are not all the same. Some shine at reasoning, others at images or code. Knowing their strengths helps you choose.","funFact":null},{"emoji":"🔒","title":"Privacy Is Part of Fit","body":"A tool that fits the task but needs data you should not share is the wrong tool. Check what it collects and who can see it before you paste anything.","funFact":null}]},{"id":"aip_l3","title":"Fact-Checking AI","description":"How to verify what AI tells you","order":2,"difficulty":"intermediate","questions":[{"id":"aip3_q1","type":"multipleChoice","text":"What is the most reliable way to fact-check an AI's response?","simple":"What is the best way to check an AI answer?","options":["Cross-reference with trusted primary sources","Ask the same AI if its answer is correct","Check if the response sounds confident","Count how many words are in the response"],"correct":"Cross-reference with trusted primary sources","correctAnswers":["Cross-reference with trusted primary sources"],"pairs":[],"explanation":"The best way to verify AI claims is to check them against authoritative sources like official websites, peer-reviewed research, or established reference materials.","difficulty":"beginner","transfer":"An AI cites a book. What is your first checking step?"},{"id":"aip3_q2","type":"trueFalse","text":"If an AI gives a citation, you can trust the source exists and says what it claims.","simple":"AI gave a citation. Can you trust it exists and says that?","options":["True","False"],"correct":"False","correctAnswers":["False"],"pairs":[],"explanation":"AI models are known to fabricate citations that look real but do not exist. Always verify that cited sources are real and actually support the claims made.","difficulty":"beginner","transfer":"An assistant cites a website for a sports record. What two things would you check on that site?"},{"id":"aip3_q3","type":"sortOrder","text":"Put these fact-checking steps in the best order:","simple":"Put the fact-checking steps in order.","options":["Search for the claim in trusted sources","Identify specific claims to verify","Read the AI response carefully","Form your final judgment on accuracy"],"correct":"","correctAnswers":["Read the AI response carefully","Identify specific claims to verify","Search for the claim in trusted sources","Form your final judgment on accuracy"],"pairs":[],"explanation":"Effective fact-checking follows a structured process: read, identify checkable claims, verify each against reliable sources, then assess overall accuracy.","difficulty":"beginner","transfer":"Use these steps on a surprising fact from a video. Which step do people usually skip?"},{"id":"aip3_q4","type":"scenarioJudgment","text":"An AI cites a study about coffee curing headaches, with an author name. What should you do?","simple":"AI cites a study by name. What should you do?","options":["Search for the study to confirm it exists and says that","Trust it because it names a journal","Ignore it because AI is never right","Share it, then check later if someone asks"],"correct":"Search for the study to confirm it exists and says that","correctAnswers":["Search for the study to confirm it exists and says that"],"pairs":[],"explanation":"AI can invent realistic-looking citations. Find the actual study, then check that it makes the claim.","difficulty":"intermediate","transfer":"A post says 'scientists proved' a game boosts grades. What would you search for before sharing?"},{"id":"aip3_q5","type":"fillInBlank","text":"AI models tend to hallucinate more when asked about __________ or niche topics with limited training data.","simple":"AI makes up more about which kind of topics?","options":["obscure","popular","simple","mathematical"],"correct":"obscure","correctAnswers":["obscure"],"pairs":[],"explanation":"AI models are more likely to generate incorrect information about obscure topics, recent events, or highly specialized subjects where training data is limited.","difficulty":"intermediate","transfer":"Would you trust an assistant more on the capital of France or your town's founding year? Why?"},{"id":"aip3_q6","type":"multipleChoice","text":"Which type of AI claim is MOST likely to be a hallucination?","simple":"Which kind of AI claim is most likely made up?","options":["A specific statistic with an exact percentage and date","A general explanation of how photosynthesis works","A definition of a common English word","A basic math calculation like 2 + 2"],"correct":"A specific statistic with an exact percentage and date","correctAnswers":["A specific statistic with an exact percentage and date"],"pairs":[],"explanation":"Specific numbers, dates, and statistics are among the most commonly hallucinated details. General knowledge and well-known concepts are more likely to be accurate.","difficulty":"advanced","transfer":"An answer says '43 percent of teens in 2023'. What makes that more suspicious than a general claim?"},{"id":"aip3_q7","type":"scenarioJudgment","text":"An AI gives a statistic with an exact percentage but no source. What should you do?","simple":"AI gives an exact percentage with no source. What now?","options":["Find the original source before using it","Use it, it sounds precise","Round it up","Share it quickly"],"correct":"Find the original source before using it","correctAnswers":["Find the original source before using i
