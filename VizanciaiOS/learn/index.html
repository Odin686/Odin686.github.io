They cannot reply outside office hours","They cannot read the messages people type"],"correct":"They produce caring words without feeling empathy","correctAnswers":["They produce caring words without feeling empathy"],"pairs":[],"explanation":"The bot predicts helpful-sounding text from patterns. It has no lived experience and no view of your whole situation, so it can miss what a person would notice.","difficulty":"advanced","transfer":"A greeting card has kind printed words. How is that different from a friend saying them?"},{"id":"ah5_q7","type":"scenarioJudgment","text":"A wellbeing chatbot is helpful for calming exercises. When should a person get real help instead?","simple":"When should someone get real help instead of a wellbeing bot?","options":["When feelings feel serious or unsafe","Only after trying the bot for a month","Only when the app is offline","When the exercises start to repeat"],"correct":"When feelings feel serious or unsafe","correctAnswers":["When feelings feel serious or unsafe"],"pairs":[],"explanation":"Bots can offer coping tips. Serious or unsafe feelings need a trusted person or professional right away.","difficulty":"beginner","transfer":"Who is one person you could talk to if a friend needed real help?"},{"id":"ah5_q8","type":"trueFalse","text":"A chatbot can truly feel empathy for you.","simple":"Can a chatbot truly feel empathy?","options":["True","False"],"correct":"False","correctAnswers":["False"],"pairs":[],"explanation":"It produces caring sounding words from patterns. Real understanding and care come from people.","difficulty":"beginner","transfer":"What can a friend do for you that a chatbot cannot?"},{"id":"ah5_q9","type":"explain","text":"Explain what a mental health chatbot can and cannot do.","simple":"What can a mental health chatbot do and not do?","options":["It can offer coping exercises and information","It cannot feel or fully understand context","Serious situations need people"],"correct":"A mental health chatbot can share coping exercises, information, and a place to write things down at any hour. It cannot feel empathy or understand the full picture of someone's life, so serious or unsafe situations need a trusted person or professional.","correctAnswers":["A mental health chatbot can share coping exercises, information, and a place to write things down at any hour. It cannot feel empathy or understand the full picture of someone's life, so serious or unsafe situations need a trusted person or professional."],"pairs":[],"explanation":"Strong answers list a real benefit and a real limit.","difficulty":"beginner","transfer":"Your cousin talks to a chatbot every night. What questions would show whether it helps or replaces people?"}],"cards":[{"emoji":"🧠","title":"Wellbeing chatbots","body":"A wellbeing chatbot offers coping exercises, mood tracking and a place to write things down at any hour. It follows scripts and patterns. It is not a therapist and cannot diagnose.","funFact":null},{"emoji":"🧩","title":"Coping exercises","body":"Many chatbots borrow exercises from cognitive behavioural therapy, or CBT, such as noticing a worried thought and testing whether it is true. A therapist is a trained person who works through this with you.","funFact":null},{"emoji":"💬","title":"Words are not feelings","body":"A chatbot generates caring-sounding words from patterns. It does not feel empathy and does not know your whole life, which is why serious or unsafe feelings need a person.","funFact":null},{"emoji":"🔎","title":"Checking a claim","body":"When an app says it is proven to reduce anxiety, ask who tested it, compared with what, with how many people, and who paid. A good claim points to a study you can read.","funFact":null},{"emoji":"🧑‍🤝‍🧑","title":"When to get a person","body":"If your feelings, or a friend's, are serious or unsafe, tell a trusted adult right away. In Canada and the United States, 9-8-8 reaches a crisis line by call or text, and a well-designed bot shows contacts like this and urges talking to a person.","funFact":null}]},{"id":"ah_l6","title":"Future of AI in Medicine","description":"What's coming next","order":5,"difficulty":"advanced","questions":[{"id":"ah6_q1","type":"multipleChoice","text":"A tool reads a tumour's genetic test with the patient's records. What can it help with?","simple":"What can a tumour-gene tool help suggest?","options":["Suggesting treatments matched to that tumour","Giving every patient the same treatment","Assigning patients to trials at random","Replacing the cancer doctor entirely"],"correct":"Suggesting treatments matched to that tumour","correctAnswers":["Suggesting treatments matched to that tumour"],"pairs":[],"explanation":"It compares the tumour's changes with what has worked in similar cases. The oncology team weighs the suggestion with the whole patient in mind.","difficulty":"beginner","transfer":"A music app suggests songs from your history. How is that like, and unlike, matching a treatment?"},{"id":"ah6_q2","type":"trueFalse","text":"A surgical robot controlled by a surgeon at a console is AI making the surgical decisions.","simple":"Is a surgeon-controlled robot the same as AI deciding?","options":["True","False"],"correct":"False","correctAnswers":["False"],"pairs":[],"explanation":"Most surgical robots follow the surgeon's hand movements and add steadiness and precision. The surgeon plans and decides, so this is teleoperation, not AI judgment.","difficulty":"beginner","transfer":"A remote-control car follows your thumbs; a robot vacuum picks its own path. Which is more like AI?"},{"id":"ah6_q3","type":"matchPairs","text":"Match each health technology term to its meaning.","simple":"Match each health-tech term to its meaning.","options":[],"correct":"","correctAnswers":[],"pairs":[{"term":"Precision oncology","definition":"Treatment matched to a tumour's genetics"},{"term":"Digital twin","definition":"A virtual patient model for trying treatments"},{"term":"Predictive analytics","definition":"Forecasting who may get worse early"},{"term":"Surgical robot","definition":"A tool moved by the surgeon's hands"}],"explanation":"Some tools predict or simulate; a surgical robot mostly follows the surgeon. A person checks each result.","difficulty":"beginner","transfer":"Sort your family's gadgets: which decide on their own, and which just follow your hands?"},{"id":"ah6_q4","type":"fillInBlank","text":"Wearables with __________ monitoring track health at home and can alert a nurse.","simple":"__________ monitoring tracks health at home with a wearable.","options":["remote","in-person","centralized","acute"],"correct":"remote","correctAnswers":["remote"],"pairs":[],"explanation":"Remote monitoring sends readings such as heart rate and oxygen from home. A person reviews the alert and decides what to do, and some readings are false alarms.","difficulty":"intermediate","transfer":"A plant sensor texts you when soil is dry. What should you check before watering?"},{"id":"ah6_q5","type":"multipleChoice","text":"What is a 'digital twin' in healthcare AI?","simple":"What is a 'digital twin' in health care?","options":["A virtual model of a patient for testing treatments","A real twin whose health data is tracked","A backup copy of the medical record","A second model that checks the first"],"correct":"A virtual model of a patient for testing treatments","correctAnswers":["A virtual model of a patient for testing treatments"],"pairs":[],"explanation":"A digital twin is built from a patient's data to simulate how a treatment might affect them. It is only as good as the data and the model behind it.","difficulty":"intermediate","transfer":"A racing game uses a model of a real track. What could the model get wrong about the real race?"},{"id":"ah6_q6","type":"scenarioJudgment","text":"A video claims AI will replace all doctors within ten years. What is the best response?","simple":"A video says AI will replace all doctors. Best response?","options":["Ask what evidence and tested tasks back it","Accept it because AI improves every year","Reject it because machines cannot help in medicine","Wait ten years and then decide"],"correct":"Ask what evidence and tested tasks back it","correctAnswers":["Ask what evidence and tested tasks back it"],"pairs":[],"explanation":"This is a forecast, not a fact. Check which tasks were tested, who is accountable for decisions, and what the claim leaves out, such as comfort and judgment.","difficulty":"advanced","transfer":"A post says a new console will make phones useless. What evidence would change your view either way?"},{"id":"ah6_q7","type":"scenarioJudgment","text":"A village has no eye specialist. How could AI on a phone help?","simple":"A village has no eye doctor. How could phone AI help?","options":["Screen eye photos and flag who to refer","Replace the need for an eye specialist","Carry out eye surgery through the phone","Print a new pair of glasses"],"correct":"Screen eye photos and flag who to refer","correctAnswers":["Screen eye photos and flag who to refer"],"pairs":[],"explanation":"Screening can reach places with few specialists and point people toward care. A flagged person still needs a specialist.","difficulty":"beginner","transfer":"A phone app flags a cracked bike frame. What would still be needed before riding?"},{"id":"ah6_q8","type":"trueFalse","text":"Hospitals can use AI to predict which patients might get worse.","simple":"Can hospitals use AI to predict who might get worse?","options":["True","False"],"correct":"True","correctAnswers":["True"],"pairs":[],"explanation":"Early warnings let staff check on patients sooner. Staff still make the care decisions.","difficulty":"beginner","transfer":"What could go wrong if the warning system was too sensitive?"},{"id":"ah6_q9","type":"explain","text":"Explain why AI is unlikely to replace doctors, even as it improves.","simple":"Why is AI unlikely to replace doctors?","options":["Medicine needs judgment and empathy","Someone must be accountable","AI supports rather than decides"],"correct":"Medicine involves judgment about a whole person, comfort during hard news, and responsibility for decisions. AI can read scans and predict risks faster, but it does not understand a patient's life or take responsibility, so it supports doctors rather than replacing them.","correctAnswers":["Medicine involves judgment about a whole person, comfort during hard news, and responsibility for decisions. AI can read scans and predict risks faster, but it does not understand a patient's life or take responsibility, so it supports doctors rather than replacing them."],"pairs":[],"explanation":"Strong answers include empathy or judgment plus accountability.","difficulty":"beginner","transfer":"Someone says self-checkouts replaced cashiers, so AI will replace doctors. What is different about medicine?"}],"cards":[{"emoji":"🧬","title":"Treatment matched to the person","body":"A tumour's genetic changes differ from person to person. Precision oncology means a tool analyzes a genetic test alongside records to suggest which treatments have worked for similar cases, and the oncology team decides.","funFact":null},{"emoji":"🦾","title":"Robots and who is in control","body":"A surgical robot is usually controlled by a surgeon at a console: every movement comes from the surgeon's hands, and the machine adds steadiness and small tools. That is different from an AI deciding on its own. Ask who controls a machine before calling it AI.","funFact":null},{"emoji":"👥","title":"Digital twins and predictions","body":"A digital twin is a virtual model of a patient built from their data, used to try treatments in a simulation. Predictive analytics flags patients who may get worse. Both can be wrong, so people check the results.","funFact":null},{"emoji":"🌍","title":"Care at a distance","body":"Remote monitoring uses wearables to track heart rate, oxygen and sleep at home and alert a nurse. Phone-based screening can reach places with few specialists, and a flagged person still needs a specialist.","funFact":null},{"emoji":"🔭","title":"Big claims about the future","body":"Predictions that AI will replace doctors are opinions, not facts. Ask what evidence supports them, which tasks were actually tested, and who is accountable when something goes wrong.","funFact":null}]}],"bigIdeas":["perception","societalImpact"]},{"id":"ai_creative_arts","name":"AI Art & Music","icon":"paintpalette","color":"aiIndigo","description":"What creative tools do, what stays yours, and the questions artists are asking","order":10,"unlock":{"kind":"completeTier1","value":null},"lessons":[{"id":"aca_l1","title":"AI Visual Art","description":"Kinds of image tools, what they put out, and who made the pictures they learned from","order":0,"difficulty":"beginner","questions":[{"id":"aca1_q1","type":"multipleChoice","text":"An image generator takes a text description. What does it put out?","simple":"What does an image generator put out from text?","options":["A new picture","A list of matching stock photos","A sharper copy of one photo","A written description of a picture"],"correct":"A new picture","correctAnswers":["A new picture"],"pairs":[],"explanation":"An image generator learned visual patterns from many pictures and makes a new one to fit your words. It does not search a photo library.","difficulty":"beginner","transfer":"You want a poster for a school club. What details would you describe first?"},{"id":"aca1_q2","type":"trueFalse","text":"An upscaler takes a small image and puts out a larger, sharper one.","simple":"Does an upscaler make small images bigger and sharper?","options":["True","False"],"correct":"True","correctAnswers":["True"],"pairs":[],"explanation":"An upscaler predicts missing detail to enlarge a picture. Some of that detail is invented, so fine features can be wrong.","difficulty":"beginner","transfer":"A blurry team photo is upscaled. Which details might not match the real players?"},{"id":"aca1_q3","type":"scenarioJudgment","text":"An artist generates a starting image, then paints over it for hours. What is the person's role?","simple":"An artist paints over an AI image for hours. Their role?","options":["Choosing what to keep, change, and add","Choosing one image and leaving it unchanged","Labeling the image for a training set","Renting a finished image from a library"],"correct":"Choosing what to keep, change, and add","correctAnswers":["Choosing what to keep, change, and add"],"pairs":[],"explanation":"The person made many creative choices over the tool's starting point. Saying which parts the tool made keeps the process honest.","difficulty":"beginner","transfer":"You edit a photo with filters for an hour. Which of your choices would you want credited?"},{"id":"aca1_q4","type":"fillInBlank","text":"AI art raises questions about __________ ownership of generated images.","simple":"AI art raises questions about ___ ownership.","options":["copyright","physical","emotional","temporal"],"correct":"copyright","correctAnswers":["copyright"],"pairs":[],"explanation":"Copyright decides who may copy or sell a work. Who holds it for an AI-made picture is still being decided in many places.","difficulty":"intermediate","transfer":"You remix a friend's drawing in an app. Who should decide how it is shared, and why?"},{"id":"aca1_q5","type":"multipleChoice","text":"What goes into style transfer, and what comes out?","simple":"Style transfer: what goes in, what comes out?","options":["Two pictures in, one blended-style picture out","A text prompt in, a brand-new picture out","A small photo in, a larger photo out","A picture in, a written caption out"],"correct":"Two pictures in, one blended-style picture out","correctAnswers":["Two pictures in, one blended-style picture out"],"pairs":[],"explanation":"Style transfer keeps the content of one image and applies the look of another. The other options describe a generator, an upscaler, and a captioner.","difficulty":"intermediate","transfer":"You want your dog photo to look like a woodcut print. Which tool kind fits?"},{"id":"aca1_q6","type":"multipleChoice","text":"Many artists object to how image generators were trained. What is the main concern?","simple":"What is many artists' main concern about training?","options":["Their work was used without asking","The tools use too much electricity","The tools charge for every picture","The tools were released too quickly"],"correct":"Their work was used without asking","correctAnswers":["Their work was used without asking"],"pairs":[],"explanation":"Artists' pictures were collected to train models, often without consent, credit, or pay. Whether that was fair is still being argued in courts and studios.","difficulty":"advanced","transfer":"A game studio scans fan drawings to train a tool. What would you want the fans asked first?"},{"id":"aca1_q7","type":"scenarioJudgment","text":"You want an AI picture of a dragon reading in a library. What matters most in your prompt?","simple":"A dragon reads in a library. What should your prompt include?","options":["Clear details about subject, setting, and style","Repeating the word dragon several times","Typing every word in capital letters","Keeping the prompt to one word"],"correct":"Clear details about subject, setting, and style","correctAnswers":["Clear details about subject, setting, and style"],"pairs":[],"explanation":"Image generators follow your description. Specific details give closer results.","difficulty":"beginner","transfer":"Add one style word to make your dragon picture look different."},{"id":"aca1_q8","type":"trueFalse","text":"AI art models learned by studying millions of existing images.","simple":"Did AI art models learn from millions of images?","options":["True","False"],"correct":"True","correctAnswers":["True"],"pairs":[],"explanation":"They learned patterns of style and composition from huge image collections. Many of the artists were never asked.","difficulty":"beginner","transfer":"Why might an artist feel uncomfortable about that training?"},{"id":"aca1_q9","type":"explain","text":"Explain what a person adds when painting over an AI image, and what they should disclose.","simple":"What does the person add, and what should they disclose?","options":["Describes the person's choices and effort","Describes what the tool made","Says what viewers should be told"],"correct":"The person chose what to keep, change, and add, and spent hours making those choices. The tool made the starting image. They should tell viewers which parts the tool made and which parts they made themselves.","correctAnswers":["The person chose what to keep, change, and add, and spent hours making those choices. The tool made the starting image. They should tell viewers which parts the tool made and which parts they made themselves."],"pairs":[],"explanation":"Strong answers describe the human choices and name what should be disclosed.","difficulty":"beginner","transfer":"You used a beat generator for a song's drums. What would you tell listeners about it?"}],"cards":[{"emoji":"🎨","title":"Kinds of image tools","body":"An image generator takes a text description and puts out a new picture. Style transfer takes two pictures and puts out one with the first picture's look. An upscaler takes a small image and puts out a larger, sharper one.","funFact":null},{"emoji":"🖌️","title":"Learned from many images","body":"Image generators learned patterns of shape, colour, and style from very large collections of pictures. Many of those pictures were made by people who were not asked.","funFact":null},{"emoji":"🤝","title":"Credit and consent","body":"Artists ask two questions: was my work used to train this, and did anyone ask me. These questions are still being worked out, and thoughtful people disagree about the answers.","funFact":null},{"emoji":"✏️","title":"Describing what you want","body":"A prompt names the subject, the setting, and the style. Specific words give you closer results, and you still decide what to keep.","funFact":null}]},{"id":"aca_l2","title":"AI Music","description":"Music tool kinds, voices that belong to people, and ideas you build on","order":1,"difficulty":"intermediate","questions":[{"id":"aca2_q1","type":"multipleChoice","text":"A music generator takes a text description. What does it put out?","simple":"What does a music generator put out from text?","options":["A melody, beat, or full song","A live performance on stage","A list of songs to buy","A printed sheet of lyrics"],"correct":"A melody, beat, or full song","correctAnswers":["A melody, beat, or full song"],"pairs":[],"explanation":"A music generator learned patterns from many recordings and makes new audio to fit your words. It does not perform live.","difficulty":"beginner","transfer":"You need a short tune for a class video. What would you describe to the tool?"},{"id":"aca2_q2","type":"trueFalse","text":"A voice model can produce singing that sounds like a real person.","simple":"Can a voice model sound like a real singer?","options":["True","False"],"correct":"True","correctAnswers":["True"],"pairs":[],"explanation":"Voice models learn from recordings and can imitate a voice closely. That is why permission matters before using one.","difficulty":"beginner","transfer":"A friend's voice is cloned for a joke video. What should have happened first?"},{"id":"aca2_q3","type":"matchPairs","text":"Match each music tool kind to what it puts out.","simple":"Match each music tool to what it makes.","options":[],"correct":"","correctAnswers":[],"pairs":[{"term":"Music generator","definition":"A new melody or song from a description"},{"term":"Voice model","definition":"Singing that sounds like a chosen person"},{"term":"Stem separator","definition":"Vocals and instruments split into separate tracks"},{"term":"Mastering tool","definition":"A mix with balanced loudness and tone"}],"explanation":"Each tool takes a different input and puts out a different result. Knowing the kind tells you what to expect.","difficulty":"beginner","transfer":"You recorded a song on your phone. Which tool kind would you try first, and why?"},{"id":"aca2_q4","type":"fillInBlank","text":"Copying a real singer's voice without asking ignores their __________.","simple":"Copying a singer's voice without asking ignores their ___.","options":["consent","melody","audience","budget"],"correct":"consent","correctAnswers":["consent"],"pairs":[],"explanation":"Consent means the person agreed first. A voice is part of someone's identity and work, so asking comes before using it.","difficulty":"intermediate","transfer":"Someone wants to use your recorded laugh in a game. What would you want them to ask?"},{"id":"aca2_q5","type":"scenarioJudgment","text":"Someone makes a song with a famous singer's cloned voice without permission. What is the main problem?","simple":"A singer's voice is cloned without permission. Main problem?","options":["The singer never agreed to that use","The song was recorded on a computer","The song is shorter than a real single","The singer's fans might never hear it"],"correct":"The singer never agreed to that use","correctAnswers":["The singer never agreed to that use"],"pairs":[],"explanation":"The singer's voice was used without consent, and listeners may be misled about who performed. Both are real harms.","difficulty":"intermediate","transfer":"A classmate's drawing style is copied for a poster without asking. What is the same problem here?"},{"id":"aca2_q6","type":"multipleChoice","text":"A post says most musicians love AI tools. What would test that claim?","simple":"How could you test 'most musicians love AI tools'?","options":["A survey of many working musicians","One famous musician's public interview","The number of AI tools released","Sales of the newest music app"],"correct":"A survey of many working musicians","correctAnswers":["A survey of many working musicians"],"pairs":[],"explanation":"A claim about most musicians needs evidence from many musicians. One interview or one product's sales cannot show that.","difficulty":"advanced","transfer":"A video says most students prefer online homework. What evidence would you ask for?"},{"id":"aca2_q7","type":"scenarioJudgment","text":"A musician uses AI to suggest chord ideas, then writes the song. What role does the AI play?","simple":"AI suggests chords, the musician writes the song. AI's role?","options":["A source of ideas to build on","The composer of the finished song","The owner of the song's copyright","The performer on the recording"],"correct":"A source of ideas to build on","correctAnswers":["A source of ideas to build on"],"pairs":[],"explanation":"Some musicians use AI to spark ideas they then shape. The human makes the final work.","difficulty":"beginner","transfer":"What part of a song would you want to keep fully your own?"},{"id":"aca2_q8","type":"trueFalse","text":"Using AI to imitate a real singer's voice without permission is fine.","simple":"Is copying a singer's voice with AI without permission fine?","options":["True","False"],"correct":"False","correctAnswers":["False"],"pairs":[],"explanation":"A person's voice is part of their identity and work. Using it without permission harms them.","difficulty":"beginner","transfer":"How would you feel if someone used your voice without asking?"},{"id":"aca2_q9","type":"explain","text":"Explain why cloning a famous singer's voice raises a rights problem.","simple":"Why does cloning a singer's voice raise a rights problem?","options":["The voice belongs to the singer","People may be misled","The singer loses control and income"],"correct":"A singer's voice is their identity and their livelihood. Cloning it without permission can trick listeners into thinking the singer performed, and it takes away their control over how their voice is used and the income they would earn.","correctAnswers":["A singer's voice is their identity and their livelihood. Cloning it without permission can trick listeners into thinking the singer performed, and it takes away their control over how their voice is used and the income they would earn."],"pairs":[],"explanation":"Strong answers mention identity or livelihood and consent.","difficulty":"beginner","transfer":"A game copies a streamer's voice for a character without asking. Which of the same problems appear?"}],"cards":[{"emoji":"🎵","title":"Kinds of music tools","body":"A music generator takes a description or a few notes and puts out a melody, a beat, or a full song. A voice model takes recordings and puts out singing that sounds like that person.","funFact":null},{"emoji":"🎚️","title":"Studio helpers","body":"A stem separator takes a finished song and puts out separate tracks for vocals and instruments. A mastering tool takes a mix and puts out a version with balanced loudness.","funFact":null},{"emoji":"🎤","title":"A voice belongs to a person","body":"Cloning a singer's voice without asking uses their identity and their work. Consent means the person agreed first. Credit means saying who did what.","funFact":null},{"emoji":"🎸","title":"Ideas you build on","body":"Some musicians use AI to suggest chords or beats, then write the song themselves. Others choose not to use it. Both are choices about what stays yours.","funFact":null}]},{"id":"aca_l3","title":"AI Writing Assistants","description":"What a writing assistant puts out, and how to keep the writing yours","order":2,"difficulty":"intermediate","questions":[{"id":"aca3_q1","type":"multipleChoice","text":"A writing assistant takes your request. What can it put out?","simple":"What can a writing assistant put out?","options":["Ideas, a draft, or edits","A memory of your day","A signed note from a parent","A photo of your notebook"],"correct":"Ideas, a draft, or edits","correctAnswers":["Ideas, a draft, or edits"],"pairs":[],"explanation":"A writing assistant produces text from patterns in what it was trained on. It can suggest ideas, draft, or edit, but it has no memories of its own.","difficulty":"beginner","transfer":"You are planning a birthday speech. Which part would you ask for help with, and which would you keep?"},{"id":"aca3_q2","type":"trueFalse","text":"A fluent draft from a writing assistant can still contain mistakes.","simple":"Can a smooth AI draft still have mistakes?","options":["True","False"],"correct":"True","correctAnswers":["True"],"pairs":[],"explanation":"Smooth sentences are not proof of correct facts. Check names, dates, and quotes before you use a draft.","difficulty":"beginner","transfer":"An assistant drafts a science report with a date in it. What would you check first?"},{"id":"aca3_q3","type":"fillInBlank","text":"Asking for ideas, then writing yourself, keeps you the __________ of the story.","simple":"Ideas from AI, writing by you: you stay the ___.","options":["author","reader","printer","customer"],"correct":"author","correctAnswers":["author"],"pairs":[],"explanation":"The author makes the choices about what to say and how. Using ideas as a starting point keeps those choices yours.","difficulty":"beginner","transfer":"You ask a coach for drill ideas, then practise alone. Who improved at the sport?"},{"id":"aca3_q4","type":"multipleChoice","text":"Your teacher allows AI for feedback only. Which use follows that rule?","simple":"AI is allowed for feedback only. Which use fits?","options":["Asking what is unclear in your draft","Asking for a finished opening paragraph","Asking it to write the conclusion","Asking it to rewrite your draft"],"correct":"Asking what is unclear in your draft","correctAnswers":["Asking what is unclear in your draft"],"pairs":[],"explanation":"Feedback points out problems for you to fix. Having the tool write or rewrite the text goes beyond feedback.","difficulty":"intermediate","transfer":"A music teacher allows recording apps for feedback only. What would you use the app for?"},{"id":"aca3_q5","type":"scenarioJudgment","text":"An author publishes a novel mostly written by AI and lists only their name. What is missing?","simple":"A novel mostly by AI lists one human name. What is missing?","options":["A clear note about the tool's part","A second human editor's name","A longer list of chapter titles","A publisher's address on the cover"],"correct":"A clear note about the tool's part","correctAnswers":["A clear note about the tool's part"],"pairs":[],"explanation":"Readers and publishers expect to know how a book was made. A note about the tool's role keeps the credit honest.","difficulty":"intermediate","transfer":"A team project used AI for half the slides. What would you write on the credits slide?"},{"id":"aca3_q6","type":"multipleChoice","text":"A detector flags your own essay as AI-written. What is true about detectors?","simple":"A detector flags your own essay. What is true?","options":["They can flag human writing by mistake","They read the writer's browsing history","They compare essays with every book","They fail only on very short texts"],"correct":"They can flag human writing by mistake","correctAnswers":["They can flag human writing by mistake"],"pairs":[],"explanation":"A detector is a model that predicts whether text was machine-made. It can flag human writing and miss machine writing, so its result is a guess, not proof.","difficulty":"advanced","transfer":"A plagiarism checker flags a common phrase in your report. How would you show the work was yours?"},{"id":"aca3_q7","type":"scenarioJudgment","text":"You are stuck starting a story. What is a healthy way to use an AI writing tool?","simple":"Stuck starting a story. Healthy way to use AI?","options":["Ask for three opening ideas, then write your own","Ask it to write the story for you","Paste its opening in as your own","Ask for a full draft, then change a few words"],"correct":"Ask for three opening ideas, then write your own","correctAnswers":["Ask for three opening ideas, then write your own"],"pairs":[],"explanation":"Using AI to brainstorm keeps the writing yours. Copying its text does not.","difficulty":"beginner","transfer":"What would you ask an AI when your ending feels flat?"},{"id":"aca3_q8","type":"trueFalse","text":"AI writing tools have real feelings and experiences to draw on.","simple":"Do AI writing tools have real feelings and experiences?","options":["True","False"],"correct":"False","correctAnswers":["False"],"pairs":[],"explanation":"They produce text from patterns. Lived experience and emotion come from the human writer.","difficulty":"beginner","transfer":"What memory of yours could make a story feel real?"},{"id":"aca3_q9","type":"explain","text":"Explain what the human touch adds to AI-assisted writing.","simple":"What does the human touch add to AI-assisted writing?","options":["Real experiences and emotions","Judgment about what is worth saying","Editing that gives the text a voice"],"correct":"AI can produce smooth sentences, but it has never lived anything. A person brings real memories and feelings, decides what is worth saying, and edits the text so it sounds like them. That is what makes writing connect with readers.","correctAnswers":["AI can produce smooth sentences, but it has never lived anything. A person brings real memories and feelings, decides what is worth saying, and edits the text so it sounds like them. That is what makes writing connect with readers."],"pairs":[],"explanation":"Strong answers mention experience and editorial judgment.","difficulty":"beginner","transfer":"A friend's song lyrics came from a generator. What could they add so the song sounds like them?"}],"cards":[{"emoji":"✍️","title":"What a writing assistant does","body":"A writing assistant takes your request and puts out text: ideas, a draft, or edits. It works from patterns in text it was trained on, not from memories or feelings.","funFact":null},{"emoji":"📖","title":"Keep the writing yours","body":"Ask for ideas, then write. Follow your class rules about AI help, and say what the tool did if you used it. The author is the person making the choices.","funFact":null},{"emoji":"🔍","title":"Detectors guess","body":"An AI writing detector is a model that predicts whether text was machine-made. It can flag human writing by mistake and miss machine writing, so treat its result as a guess.","funFact":null},{"emoji":"🧐","title":"Fluent is not checked","body":"A draft can sound confident and still get a name, date, or quote wrong. Check facts against a source you trust before using them.","funFact":null}]},{"id":"aca_l4","title":"Copyright & AI Art","description":"The open questions about ownership, training data, and consent","order":3,"difficulty":"advanced","questions":[{"id":"aca4_q1","type":"multipleChoice","text":"Many copyright rules require a human author. A picture made entirely by a machine:","simple":"Copyright needs a human author. What about machine-only pictures?","options":["May not qualify for copyright","Belongs to the tool's maker","Is owned by the first viewer","Gets copyright after one year"],"correct":"May not qualify for copyright","correctAnswers":["May not qualify for copyright"],"pairs":[],"explanation":"Several copyright offices have said a work needs human creative choices. A person's real contribution can change the answer, and rules differ by country.","difficulty":"beginner","transfer":"You used a generator heavily for a comic. What would you tell readers about who made it?"},{"id":"aca4_q2","type":"trueFalse","text":"An opt-out lets an artist ask that their work not be used for training.","simple":"Can an opt-out keep an artist's work out of training?","options":["True","False"],"correct":"True","correctAnswers":["True"],"pairs":[],"explanation":"An opt-out is a request not to be included. Whether every company honours it, and whether opting out should be the default, are still debated.","difficulty":"beginner","transfer":"A photo site adds an opt-out for training. What would you want to know before choosing?"},{"id":"aca4_q3","type":"fillInBlank","text":"Companies argue that training on public images is '__________ use', like a student studying art.","simple":"Companies call training on public images '___ use'.","options":["fair","full","free","first"],"correct":"fair","correctAnswers":["fair"],"pairs":[],"explanation":"In the US the idea is called fair use; Canada has a related idea called fair dealing. Whether either covers AI training is still being decided.","difficulty":"beginner","transfer":"You study a comic's style to draw your own. How is that like, and unlike, model training?"},{"id":"aca4_q4","type":"multipleChoice","text":"You make an image with heavy creative input using a generator. Who owns it?","simple":"You shaped an AI image a lot. Who owns it?","options":["Unclear; rules differ by country","The tool's maker in every case","The first person who downloads it","The artist whose style you named"],"correct":"Unclear; rules differ by country","correctAnswers":["Unclear; rules differ by country"],"pairs":[],"explanation":"Mixed human and machine works are still being sorted out by courts and copyright offices. The answer can depend on where you live and how much you contributed.","difficulty":"intermediate","transfer":"You and a friend co-write a song with an app. How would you agree on who owns it?"},{"id":"aca4_q5","type":"scenarioJudgment","text":"A studio wants image generators for all character art. What should it consider first?","simple":"A studio wants AI for all character art. Consider first?","options":["Effects on its artists, consent, and quality","How fast the images can be exported","Which file format the images use","Whether the images match the logo colours"],"correct":"Effects on its artists, consent, and quality","correctAnswers":["Effects on its artists, consent, and quality"],"pairs":[],"explanation":"The decision affects artists' jobs, whether training used their work with consent, and the quality of the art. Speed and formats matter less than those questions.","difficulty":"intermediate","transfer":"A school newspaper considers generating all its photos. What questions would you raise first?"},{"id":"aca4_q6","type":"multipleChoice","text":"Which company response addresses artists' consent most directly?","simple":"Which response deals with artists' consent?","options":["Opt-out lists and licensing deals with artists","A watermark on every generated image","Larger and sharper generated images","Free access for students and teachers"],"correct":"Opt-out lists and licensing deals with artists","correctAnswers":["Opt-out lists and licensing deals with artists"],"pairs":[],"explanation":"Opt-outs and licences involve asking artists and sometimes paying them. Watermarks help disclosure but do not address consent.","difficulty":"advanced","transfer":"A club wants to use members' photos in a video. What would asking properly look like?"},{"id":"aca4_q7","type":"scenarioJudgment","text":"An AI made a picture from a one-word prompt with no other human input. Copyright?","simple":"An AI made a picture from one word. Copyright?","options":["Usually no; it needs a human author","Yes, once it is printed","Yes, if the prompt was long","Only after it is sold"],"correct":"Usually no; it needs a human author","correctAnswers":["Usually no; it needs a human author"],"pairs":[],"explanation":"Copyright generally protects human creativity. A picture with no human creative choices usually does not qualify.","difficulty":"beginner","transfer":"What human contribution might change that answer?"},{"id":"aca4_q8","type":"trueFalse","text":"Some artists have taken legal action over AI training on their work.","simple":"Have artists taken legal action over AI training?","options":["True","False"],"correct":"True","correctAnswers":["True"],"pairs":[],"explanation":"Whether training on artworks without permission is allowed is still being decided in courts.","difficulty":"beginner","transfer":"What outcome would you consider fair to artists?"},{"id":"aca4_q9","type":"explain","text":"Explain the debate about training image models on artists' work, in your own words.","simple":"Explain the debate about training on artists' work.","options":["Models trained on artists' work without permission","Companies argue learning patterns is allowed","Artists argue they should be asked or paid"],"correct":"Image models learned from millions of artworks, often without asking the artists. Companies argue that learning patterns from public images is allowed, like a student studying art. Artists argue their work was used to build products that compete with them, so they should be asked or paid. Courts are still deciding.","correctAnswers":["Image models learned from millions of artworks, often without asking the artists. Companies argue that learning patterns from public images is allowed, like a student studying art. Artists argue their work was used to build products that compete with them, so they should be asked or paid. Courts are still deciding."],"pairs":[],"explanation":"Strong answers present both sides without picking a winner.","difficulty":"beginner","transfer":"A coach studies rival teams' plays from public videos. How is that like, and unlike, this debate?"}],"cards":[{"emoji":"📜","title":"What copyright is","body":"Copyright gives the maker of a work control over copying and selling it. In many countries it requires a human author, so a picture made entirely by a machine may not qualify.","funFact":null},{"emoji":"⚖️","title":"Two open questions","body":"Is training a model on artists' work without asking allowed? And who, if anyone, owns a picture a person and a tool made together? Courts and lawmakers are still deciding.","funFact":null},{"emoji":"📚","title":"Fair use and fair dealing","body":"Some countries allow limited copying for purposes like study or commentary. Companies argue learning patterns fits that idea. Many artists argue their work built products that compete with them. Both sides make arguments worth understanding.","funFact":null},{"emoji":"🤝","title":"Consent, credit, and opt-out","body":"An opt-out lets an artist ask that their work not be used for training. A licence means the artist agreed and may be paid. Credit means saying whose work shaped the result.","funFact":null}]},{"id":"aca_l5","title":"AI in Film & Video","description":"Video tools, synthetic media, and why faces and voices need permission","order":4,"difficulty":"intermediate","questions":[{"id":"aca5_q1","type":"multipleChoice","text":"A video generator takes a text description. What does it put out?","simple":"What does a video generator put out from text?","options":["A short new video clip","A finished feature film","A written review of a film","A recording of a live show"],"correct":"A short new video clip","correctAnswers":["A short new video clip"],"pairs":[],"explanation":"Video generators make short clips that fit a description. Longer, consistent stories still need people to plan, shoot, and edit.","difficulty":"beginner","transfer":"Your class needs a ten-second clip of a volcano. What would you describe to the tool?"},{"id":"aca5_q2","type":"trueFalse","text":"A deepfake shows a real person doing something that did not happen.","simple":"Does a deepfake show a real person doing something fake?","options":["True","False"],"correct":"True","correctAnswers":["True"],"pairs":[],"explanation":"A deepfake is synthetic media that swaps or changes a real person's face or voice. It can mislead viewers, which is why consent and labels matter.","difficulty":"beginner","transfer":"A video shows a classmate saying something odd. What would you check before believing it?"},{"id":"aca5_q3","type":"fillInBlank","text":"AI __________ tools can sort raw footage and suggest cuts.","simple":"AI ___ tools sort footage and suggest cuts.","options":["editing","rendering","compositing","storyboarding"],"correct":"editing","correctAnswers":["editing"],"pairs":[],"explanation":"Editing tools pick likely best shots and propose cuts. The editor still decides the story.","difficulty":"beginner","transfer":"You filmed an hour of a school play. Which editing steps would you want help with?"},{"id":"aca5_q4","type":"multipleChoice","text":"In 2023, unions for screen writers and performers negotiated rules about:","simple":"In 2023, screen unions negotiated rules about what?","options":["AI use of scripts, faces, and voices","How long end credits may run","Which camera formats studios buy","How cinemas set ticket prices"],"correct":"AI use of scripts, faces, and voices","correctAnswers":["AI use of scripts, faces, and voices"],"pairs":[],"explanation":"The agreements set terms for using AI with scripts and performers' likenesses. They centred on consent, credit, and pay.","difficulty":"intermediate","transfer":"A sports league introduces AI referees. What rules might players ask for first?"},{"id":"aca5_q5","type":"scenarioJudgment","text":"A studio recreates a late actor's face without asking the estate. Which right is at stake?","simple":"A late actor's face is used without asking. Which right?","options":["Control over a person's likeness","The right to a film credit","The right to a longer role","Ownership of the camera equipment"],"correct":"Control over a person's likeness","correctAnswers":["Control over a person's likeness"],"pairs":[],"explanation":"A person's face and voice are part of their identity. Permission from them, or their estate, protects that control.","difficulty":"intermediate","transfer":"A game uses a retired athlete's face without asking. What is the same problem?"},{"id":"aca5_q6","type":"multipleChoice","text":"What is synthetic media?","simple":"What is synthetic media?","options":["Content AI generated or changed","Media stored on plastic discs","News reports written quickly","Films set in the future"],"correct":"Content AI generated or changed","correctAnswers":["Content AI generated or changed"],"pairs":[],"explanation":"Synthetic media is any picture, sound, or video that AI made or altered. It includes generated clips and deepfakes.","difficulty":"advanced","transfer":"You see a photo labelled synthetic. What questions would you ask before sharing it?"},{"id":"aca5_q7","type":"scenarioJudgment","text":"A studio wants an actor's face used in a new film after they died. What is needed?","simple":"Using a late actor's face in a film. What is needed?","options":["Permission from the actor's estate","A note in the end credits","A copy of their last film","A vote from their fans"],"correct":"Permission from the actor's estate","correctAnswers":["Permission from the actor's estate"],"pairs":[],"explanation":"A person's likeness is theirs, even after death. Consent protects them and their family.","difficulty":"beginner","transfer":"Why might an estate say no even if the film is respectful?"},{"id":"aca5_q8","type":"trueFalse","text":"AI can help with visual effects and editing in film.","simple":"Can AI help with film effects and editing?","options":["True","False"],"correct":"True","correctAnswers":["True"],"pairs":[],"explanation":"It speeds up tasks like cleanup, background removal, and rough cuts. People still direct the story.","difficulty":"beginner","transfer":"Which filmmaking job do you think AI would find hardest?"},{"id":"aca5_q9","type":"explain","text":"Explain why film workers wanted rules about AI use.","simple":"Why did film workers want rules about AI use?","options":["AI could copy faces, voices, or writing","Workers could lose pay or control","Rules protect consent and credit"],"correct":"AI can copy an actor's face and voice or draft scripts, which could let studios use people's work without paying or asking them. Workers wanted clear rules so that consent, credit, and fair pay are protected when AI is used.","correctAnswers":["AI can copy an actor's face and voice or draft scripts, which could let studios use people's work without paying or asking them. Workers wanted clear rules so that consent, credit, and fair pay are protected when AI is used."],"pairs":[],"explanation":"Strong answers connect the technology to pay and consent.","difficulty":"beginner","transfer":"A school band worries a tool could copy its recordings. What rules would they want?"}],"cards":[{"emoji":"🎬","title":"Tools on a film set","body":"A video generator takes a description and puts out a short clip. Editing tools sort footage and suggest cuts. Effects tools remove backgrounds, clean up frames, or change how a face looks.","funFact":null},{"emoji":"🎭","title":"Synthetic media","body":"Synthetic media is any picture, sound, or video that AI made or changed. It includes generated clips and deepfakes, which show a real person doing something they did not do.","funFact":null},{"emoji":"🪪","title":"Likeness and consent","body":"A person's face and voice are part of who they are. Using them in a film needs permission from the person, or from their estate after they die.","funFact":null},{"emoji":"📋","title":"Rules workers asked for","body":"In 2023, unions for screen writers and performers negotiated rules about how AI can use scripts, faces, and voices. The rules centre on consent, credit, and pay.","funFact":null}]},{"id":"aca_l6","title":"The Future of AI Creativity","description":"Treat forecasts about art as claims, and check what can be checked now","order":5,"difficulty":"advanced","questions":[{"id":"aca6_q1","type":"multipleChoice","text":"A headline says AI will replace all artists in five years. Which question tests it?","simple":"Which question tests 'AI replaces all artists soon'?","options":["How artists' work and pay have changed","How many people shared the headline","Whether the writer likes AI tools","How many pictures the tool can make"],"correct":"How artists' work and pay have changed","correctAnswers":["How artists' work and pay have changed"],"pairs":[],"explanation":"A forecast about artists is tested by looking at artists: their jobs, pay, and how they work now. Shares and tool speed do not test it.","difficulty":"beginner","transfer":"A post says AI will coach every sports team soon. What would you check first?"},{"id":"aca6_q2","type":"trueFalse","text":"Saying AI will create new art forms is a prediction, not a measured fact.","simple":"Is 'AI will create new art forms' a prediction?","options":["True","False"],"correct":"True","correctAnswers":["True"],"pairs":[],"explanation":"It might happen, but nobody has measured it yet. Ask what would count as a new art form and watch for it.","difficulty":"beginner","transfer":"A friend says a new game will change music forever. How would you treat that claim?"},{"id":"aca6_q3","type":"fillInBlank","text":"The blend of human creativity and AI capability is called __________ creativity.","simple":"Human plus AI creativity is called ___ creativity.","options":["augmented","simulated","distributed","artificial"],"correct":"augmented","correctAnswers":["augmented"],"pairs":[],"explanation":"Augmented creativity means a person and a tool make something together, with the person in charge of the choices.","difficulty":"beginner","transfer":"Where in a school project could a tool handle repetitive steps while you keep the vision?"},{"id":"aca6_q4","type":"matchPairs","text":"Match each claim about AI creativity to the evidence that would test it.","simple":"Match each claim to evidence that tests it.","options":[],"correct":"","correctAnswers":[],"pairs":[{"term":"AI will replace illustrators","definition":"Job listings and pay for illustrators over time"},{"term":"AI tools will get cheaper","definition":"Tool prices tracked over several years"},{"term":"New art forms will appear","definition":"Works that critics treat as a new form"},{"term":"Artists will stop using AI","definition":"Surveys of how artists actually work"}],"explanation":"Each claim points to something you could measure. If no measurement fits, the claim is hard to test.","difficulty":"beginner","transfer":"A claim says students will stop reading books. What could you measure to test it?"},{"id":"aca6_q5","type":"scenarioJudgment","text":"A school may teach image generators in art class. Which plan best protects skill building?","simple":"Teaching image generators in art class. Which plan protects skills?","options":["Teach them after drawing basics, with disclosure rules","Replace drawing lessons with prompt practice","Ban any mention of the tools","Let students use them without any rules"],"correct":"Teach them after drawing basics, with disclosure rules","correctAnswers":["Teach them after drawing basics, with disclosure rules"],"pairs":[],"explanation":"Learning the tool after the basics, with rules about disclosure, keeps skill building and honesty. Replacing practice or ignoring the tools does neither.","difficulty":"intermediate","transfer":"A coach considers a video analysis app for a youth team. When should players start using it?"},{"id":"aca6_q6","type":"multipleChoice","text":"What does a person bring to creative work that a tool does not?","simple":"What does a person bring that a tool does not?","options":["Lived experience and intention","Fast production of options","Perfectly straight lines","Access to many colours"],"correct":"Lived experience and intention","correctAnswers":["Lived experience and intention"],"pairs":[],"explanation":"A tool recombines patterns. Meaning, purpose, and real experience come from the person using it.","difficulty":"advanced","transfer":"Which memory of yours could shape a story that no tool could invent?"},{"id":"aca6_q7","type":"scenarioJudgment","text":"Photography was once called not real art. What does that suggest about AI art?","simple":"Photography was once called not real art. What does that suggest?","options":["New tools can become new art forms","AI art is certainly not real art","Photography replaced painting entirely","Art has not changed since then"],"correct":"New tools can become new art forms","correctAnswers":["New tools can become new art forms"],"pairs":[],"explanation":"New tools are often doubted at first. Over time people find creative ways to use them.","difficulty":"beginner","transfer":"What new kind of art could you imagine humans and AI making together?"},{"id":"aca6_q8","type":"trueFalse","text":"Lived experience and intention are things AI does not have.","simple":"Does AI lack lived experience and intention?","options":["True","False"],"correct":"True","correctAnswers":["True"],"pairs":[],"explanation":"AI recombines patterns. Meaning and purpose come from the people using it.","difficulty":"beginner","transfer":"What experience of yours would you want in a piece of art?"},{"id":"aca6_q9","type":"explain","text":"Explain what augmented creativity means with an example.","simple":"What is augmented creativity? Give an example.","options":["Humans and AI create together","AI generates options or handles tedious steps","The person directs the vision"],"correct":"Augmented creativity means a person and an AI make something together, with the AI generating options or handling tedious steps while the person sets the vision and makes the choices. For example, a designer might generate twenty poster layouts, pick one, and refine it by hand.","correctAnswers":["Augmented creativity means a person and an AI make something together, with the AI generating options or handling tedious steps while the person sets the vision and makes the choices. For example, a designer might generate twenty poster layouts, pick one, and refine it by hand."],"pairs":[],"explanation":"Strong answers define it and give a concrete example with the human in charge.","difficulty":"beginner","transfer":"Describe a school project where you would use a tool for options while keeping the vision."}],"cards":[{"emoji":"🔭","title":"Forecasts are claims","body":"Statements like AI will replace artists, or AI will create new art forms, are predictions. A prediction can be examined: ask what evidence would show it is coming true.","funFact":null},{"emoji":"📏","title":"What can be checked now","body":"You can check what tools do today, how artists actually work, and how contests and schools set rules. You cannot check what has not happened yet.","funFact":null},{"emoji":"🧩","title":"Augmented creativity","body":"Augmented creativity means a person and a tool make something together, with the person setting the vision and making the choices. The tool may generate options or handle repetitive steps.","funFact":null},{"emoji":"📷","title":"New tools, old debate","body":"Photography was once called not real art. That history suggests new tools can become art forms, but it does not settle whether every tool will.","funFact":null}]}],"bigIdeas":["naturalInteraction"]},{"id":"ai_vocabulary","name":"AI Words to Know","icon":"character.book.closed","color":"aiPrimary","description":"Speak AI like a pro, learn the words that matter","order":11,"unlock":{"kind":"completeTier1","value":null},"lessons":[{"id":"av_l1","title":"The Basics","description":"Core AI terms everyone should know","order":0,"difficulty":"beginner","questions":[{"id":"av1_q1","type":"multipleChoice","text":"A system improves from examples instead of one rule for every case. What approach is this?","simple":"A system learns from examples. What is that called?","options":["Machine learning (ML)","Rule-based programming","Database retrieval","Manual automation"],"correct":"Machine learning (ML)","correctAnswers":["Machine learning (ML)"],"pairs":[],"explanation":"ML means machine learning. A machine-learning model finds useful patterns in examples and applies them to new inputs.","difficulty":"beginner","transfer":"A spam filter improves from examples. Which term fits?"},{"id":"av1_q2","type":"trueFalse","text":"Deep learning is a specialized type of machine learning that uses neural networks with many layers.","simple":"Is deep learning a kind of machine learning with many layers?","options":["True","False"],"correct":"True","correctAnswers":["True"],"pairs":[],"explanation":"Deep learning is a subset of machine learning that uses deep neural networks, ones with multiple hidden layers, to learn complex patterns from large datasets.","difficulty":"beginner","transfer":"Why might 'deep' describe the layers rather than the cleverness?"},{"id":"av1_q3","type":"fillInBlank","text":"A neural __________ is a computing system inspired by the biological networks in the human brain.","simple":"A neural what is inspired by the brain?","options":["network","pathway","circuit","engine"],"correct":"network","correctAnswers":["network"],"pairs":[],"explanation":"A neural network is layers of connected nodes (artificial neurons) that process info, inspired by the brain.","difficulty":"beginner","transfer":"What is one way a neural network is not like a real brain?"},{"id":"av1_q4","type":"matchPairs","text":"Match each foundational AI term to its plain-English meaning:","simple":"Match each basic AI word to its meaning.","options":[],"correct":"","correctAnswers":[],"pairs":[{"term":"Algorithm","definition":"A step-by-step recipe for solving a problem"},{"term":"Model","definition":"A trained system that can make predictions"},{"term":"Training","definition":"Teaching a system by feeding it data"},{"term":"Inference","definition":"Using a trained model to get answers"}],"explanation":"These four terms are the bread and butter of AI. Training builds the model, and inference is when you actually use it, like when you ask an assistant a question.","difficulty":"beginner","transfer":"Describe a recipe app using all four words."},{"id":"av1_q5","type":"multipleChoice","text":"You send a message to an AI assistant and get a reply. That step is called:","simple":"Sending a message and getting a reply is called what?","options":["Inference","Training","Fine-tuning","Backpropagation"],"correct":"Inference","correctAnswers":["Inference"],"pairs":[],"explanation":"Inference is running a trained model to produce an output. Every reply you get from an assistant is inference on your input.","difficulty":"intermediate","transfer":"When a photo app tags your friend's face, is that training or inference?"},{"id":"av1_q6","type":"scenarioJudgment","text":"A colleague says 'AI and machine learning are exactly the same thing.' Is this accurate?","simple":"'AI and machine learning are the same thing.' Accurate?","options":["No, machine learning is one part of AI","Yes, the words mean the same thing","Yes, since all AI learns from data","No, machine learning is bigger than AI"],"correct":"No, machine learning is one part of AI","correctAnswers":["No, machine learning is one part of AI"],"pairs":[],"explanation":"AI is the broad goal of machines doing tasks that need intelligence. Machine learning is one way to get there; rule-based systems are another.","difficulty":"advanced","transfer":"Give one example of AI that does not use machine learning."},{"id":"av1_q7","type":"scenarioJudgment","text":"An app learned to spot weeds from thousands of labelled photos. Which term describes this?","simple":"An app learned weeds from labelled photos. Which term?","options":["Machine learning","A spreadsheet","A search engine","A screensaver"],"correct":"Machine learning","correctAnswers":["Machine learning"],"pairs":[],"explanation":"Learning patterns from examples instead of hand-written rules is machine learning.","difficulty":"beginner","transfer":"Name one app you use that probably learned from examples."},{"id":"av1_q8","type":"trueFalse","text":"Inference is when a trained model answers a new request.","simple":"Is inference when a trained model answers a new request?","options":["True","False"],"correct":"True","correctAnswers":["True"],"pairs":[],"explanation":"Training is the learning phase. Inference is using what was learned.","difficulty":"beginner","transfer":"When you ask a photo app to find beaches, is that training or inference?"},{"id":"av1_q9","type":"explain","text":"Explain model, training, and inference in one short paragraph.","simple":"Explain model, training, and inference.","options":["The model is what learned","Training is the learning phase","Inference is using it on new input"],"correct":"The model is the system that holds what was learned, like a trained brain. Training is the phase where it learns from many examples. Inference is when you give the finished model a new input and it produces an answer.","correctAnswers":["The model is the system that holds what was learned, like a trained brain. Training is the phase where it learns from many examples. Inference is when you give the finished model a new input and it produces an answer."],"pairs":[],"explanation":"Strong answers define all three and keep them distinct.","difficulty":"beginner","transfer":"Explain the three words using a student who studies, then sits a test."}],"cards":[{"emoji":"📖","title":"Key AI Terms","body":"AI has its own vocabulary. Learning these terms helps you understand AI news, conversations, and how the technology works.","funFact":null},{"emoji":"🔤","title":"Model, Training, Inference","body":"A model is the AI brain. Training is how it learns. Inference is when it uses what it learned to answer questions.","funFact":null},{"emoji":"▶️","title":"Inference","body":"Inference is using a trained model on a new input. Training happens once and takes huge computing; inference happens every time you ask, and costs far less.","funFact":null}]},{"id":"av_l2","title":"How Models Work","description":"The building blocks inside AI models","order":1,"difficulty":"beginner","questions":[{"id":"av2_q1","type":"multipleChoice","text":"In AI, what are 'parameters'?","simple":"What are parameters in AI?","options":["Adjustable values the model learns during training","The questions users ask the model","The programming languages used to build AI","The servers that run AI models"],"correct":"Adjustable values the model learns during training","correctAnswers":["Adjustable values the model learns during training"],"pairs":[],"explanation":"Parameters are the internal knobs the model tunes during training. When people say a model has 70 billion parameters, they mean it has 70 billion learned values that shape its behavior.","difficulty":"beginner","transfer":"If a model learns better after training, what changed inside it?"},{"id":"av2_q2","type":"multipleChoice","text":"A model splits a long word into smaller text pieces. What are those pieces called?","simple":"Pieces a long word is split into are called what?","options":["Tokens","Labels","Weights","Rewards"],"correct":"Tokens","correctAnswers":["Tokens"],"pairs":[],"explanation":"Tokens can be whole words, word parts, punctuation, or code. They are the text units a language model processes.","difficulty":"beginner","transfer":"Why might a long made-up word cost more tokens than a common short one?"},{"id":"av2_q3","type":"fillInBlank","text":"An __________ is a number representation that captures the meaning of text for AI to process.","simple":"Numbers that capture the meaning of text are an what?","options":["embedding","encoding","endpoint","encryption"],"correct":"embedding","correctAnswers":["embedding"],"pairs":[],"explanation":"Embeddings convert text into lists of numbers (vectors) that capture semantic meaning. Words with similar meanings end up with similar embeddings, letting models understand relationships between concepts.","difficulty":"beginner","transfer":"Which two song titles would you expect to get similar embeddings, and why?"},{"id":"av2_q4","type":"matchPairs","text":"Match each model-building term to its meaning:","simple":"Match each model-building word to its meaning.","options":[],"correct":"","correctAnswers":[],"pairs":[{"term":"Weights","definition":"Numerical values adjusted during training"},{"term":"Vectors","definition":"Lists of numbers representing data"},{"term":"Layers","definition":"Stacked processing stages in a network"},{"term":"Tensors","definition":"Multi-dimensional arrays of numbers"}],"explanation":"These are the mathematical building blocks of neural networks. Weights live inside layers, data flows through as tensors, and vectors represent individual pieces of information.","difficulty":"beginner","transfer":"Which of these four words describes the numbers that change during training?"},{"id":"av2_q5","type":"sortOrder","text":"Put these in order from smallest to largest unit of text processing:","simple":"Order from smallest to largest text unit.","options":["Token","Character","Sentence","Document"],"correct":"","correctAnswers":["Character","Token","Sentence","Document"],"pairs":[],"explanation":"Characters are the smallest units (individual letters). Tokens are typically a few characters or a word. Sentences contain multiple tokens, and documents contain multiple sentences.","difficulty":"intermediate","transfer":"Roughly how many tokens might a short text message be?"},{"id":"av2_q6","type":"multipleChoice","text":"Why do AI models convert words into numbers (vectors)?","simple":"Why do models turn words into numbers?","options":["Computers can only do math on numbers, not text","Because numbers take up less storage space","Because users prefer numerical outputs","Because text is too complicated to store"],"correct":"Computers can only do math on numbers, not text","correctAnswers":["Computers can only do math on numbers, not text"],"pairs":[],"explanation":"Neural networks are fundamentally mathematical systems. To process language, models must first convert text into numerical representations (embeddings/vectors) that can flow through matrix multiplications and other operations.","difficulty":"advanced","transfer":"How could numbers show that 'cat' is closer to 'kitten' than to 'car'?"},{"id":"av2_q7","type":"scenarioJudgment","text":"The words happy and joyful get similar number lists inside a model. What are those lists?","simple":"Happy and joyful get similar number lists. What are they?","options":["Embeddings","Passwords","Pixels","Rate limits"],"correct":"Embeddings","correctAnswers":["Embeddings"],"pairs":[],"explanation":"Embeddings turn words into numbers so similar meanings sit close together.","difficulty":"beginner","transfer":"Which two words would you expect to sit close together as embeddings?"},{"id":"av2_q8","type":"trueFalse","text":"Parameters are numbers inside a model that change during training.","simple":"Are parameters numbers that change during training?","options":["True","False"],"correct":"True","correctAnswers":["True"],"pairs":[],"explanation":"Training adjusts millions or billions of parameters so the model's guesses improve.","difficulty":"beginner","transfer":"If a model has more parameters, what might it need more of?"},{"id":"av2_q9","type":"explain","text":"Explain why a model turns words into numbers.","simple":"Why does a model turn words into numbers?","options":["Computers calculate with numbers","Embeddings capture meaning as numbers","Similar words get similar numbers"],"correct":"Computers can only do math, not read. So a model converts each word or token into a list of numbers called an embedding. Words with similar meanings get similar numbers, which lets the model compare and combine them mathematically.","correctAnswers":["Computers can only do math, not read. So a model converts each word or token into a list of numbers called an embedding. Words with similar meanings get similar numbers, which lets the model compare and combine them mathematically."],"pairs":[],"explanation":"Strong answers mention math and similarity.","difficulty":"beginner","transfer":"Explain embeddings to a friend using a map where similar places are close together."}],"cards":[{"emoji":"🧩","title":"Tokens","body":"AI does not read words, it reads tokens. Hello world might be 2 tokens, but Supercalifragilisticexpialidocious might be 5!","funFact":null},{"emoji":"🧮","title":"Parameters","body":"Parameters are the tiny numbers inside an AI model that get adjusted during training. Large models have billions of them; exact counts for the biggest models are not public.","funFact":null},{"emoji":"🔢","title":"Embeddings","body":"AI turns words into lists of numbers called embeddings. Words with similar meanings get similar numbers, so the model can do math on language.","funFact":null}]},{"id":"av_l3","title":"Training Talk","description":"How AI models learn and improve","order":2,"difficulty":"intermediate","questions":[{"id":"av3_q1","type":"multipleChoice","text":"In supervised learning, what does the model learn from?","simple":"In supervised learning, what does the model learn from?","options":["Labeled examples with correct answers","Unlabeled data with no guidance","Real-time user feedback only","Random trial and error"],"correct":"Labeled examples with correct answers","correctAnswers":["Labeled examples with correct answers"],"pairs":[],"explanation":"Supervised learning uses labeled data: input-output pairs where the correct answer is provided. The model learns to map inputs to the right outputs, like learning from a textbook with answer keys.","difficulty":"beginner","transfer":"A model learns from photos marked cat or dog. Which learning type?"},{"id":"av3_q2","type":"multipleChoice","text":"A pre-trained model is adjusted with a smaller legal dataset. What process is this?","simple":"A pre-trained model adjusted with a small legal dataset. What process?","options":["Fine-tuning","Pre-training","Inference","Clustering"],"correct":"Fine-tuning","correctAnswers":["Fine-tuning"],"pairs":[],"explanation":"Fine-tuning adjusts an existing model on a smaller, specialized dataset. It does not restart the full training process from zero.","difficulty":"beginner","transfer":"What small dataset would you use to fine-tune a helper for your school's rules?"},{"id":"av3_q3","type":"matchPairs","text":"Match each training approach to its description:","simple":"Match each training approach to what it means.","options":[],"correct":"","correctAnswers":[],"pairs":[{"term":"Supervised Learning","definition":"Learning from labeled examples"},{"term":"Unsupervised Learning","definition":"Finding patterns in unlabeled data"},{"term":"Reinforcement Learning","definition":"Learning through rewards and penalties"},{"term":"Pre-training","definition":"Initial broad training on massive data"}],"explanation":"Modern language models combine approaches: pre-training on vast text, then fine-tuning with human feedback (reinforcement learning from human feedback, or RLHF).","difficulty":"beginner","transfer":"Which approach would teach a robot to walk, and why?"},{"id":"av3_q4","type":"fillInBlank","text":"One complete pass through the entire training dataset is called an __________.","simple":"One full pass through the training data is an what?","options":["epoch","batch","cycle","round"],"correct":"epoch","correctAnswers":["epoch"],"pairs":[],"explanation":"An epoch is one full pass through all training data. Models typically train for many epochs, seeing the same data multiple times to gradually improve their performance.","difficulty":"intermediate","transfer":"Why might training for too many epochs make a model memorise?"},{"id":"av3_q5","type":"multipleChoice","text":"What is 'overfitting' in machine learning?","simple":"What is overfitting?","options":["When a model memorizes training data but fails on new data","When a model trains for too few epochs","When a model uses too little data","When a model runs too slowly"],"correct":"When a model memorizes training data but fails on new data","correctAnswers":["When a model memorizes training data but fails on new data"],"pairs":[],"explanation":"Overfitting is like a student who memorizes test answers but cannot solve new problems. The model performs great on training data but poorly on anything it has not seen before.","difficulty":"intermediate","transfer":"How is overfitting like memorising last year's test answers?"},{"id":"av3_q6","type":"scenarioJudgment","text":"A team wants a model to answer questions about their internal documents. What should they try first?","simple":"A team wants answers from its own documents. Try what first?","options":["Retrieve the relevant documents into the prompt","Train a new model from scratch","Use the model with no documents at all","Raise the randomness setting"],"correct":"Retrieve the relevant documents into the prompt","correctAnswers":["Retrieve the relevant documents into the prompt"],"pairs":[],"explanation":"Retrieval gives the model the actual text to answer from and stays current when documents change. Fine-tuning is for changing style or format, not for storing facts.","difficulty":"advanced","transfer":"A club wants a helper that knows its rulebook. Would you retrieve the rulebook or fine-tune? Why?"},{"id":"av3_q7","type":"scenarioJudgment","text":"A model sorts thousands of unlabeled photos into groups on its own. Which approach is that?","simple":"A model groups unlabeled photos by itself. Which approach?","options":["Unsupervised learning","Supervised learning","Reinforcement learning","Fine-tuning"],"correct":"Unsupervised learning","correctAnswers":["Unsupervised learning"],"pairs":[],"explanation":"No labels were given, so the model found patterns on its own. That is unsupervised learning.","difficulty":"beginner","transfer":"What could a person do with the groups once the model finds them?"},{"id":"av3_q8","type":"trueFalse","text":"Reinforcement learning improves through rewards rather than labelled answers.","simple":"Does reinforcement learning improve through rewards?","options":["True","False"],"correct":"True","correctAnswers":["True"],"pairs":[],"explanation":"The agent tries actions and learns from reward signals instead of a correct label for each input.","difficulty":"beginner","transfer":"Which of the three learning types fits teaching a robot to walk?"},{"id":"av3_q9","type":"explain","text":"Explain the three ways AI learns, giving one example for each.","simple":"Explain the three ways AI learns with examples.","options":["Supervised uses labelled examples","Unsupervised finds patterns without labels","Reinforcement learns from rewards"],"correct":"Supervised learning uses labelled examples, like photos marked cat or dog. Unsupervised learning finds patterns on its own, like grouping shoppers with similar habits. Reinforcement learning improves through rewards, like a game agent that scores points for winning moves.","correctAnswers":["Supervised learning uses labelled examples, like photos marked cat or dog. Unsupervised learning finds patterns on its own, like grouping shoppers with similar habits. Reinforcement learning improves through rewards, like a game agent that scores points for winning moves."],"pairs":[],"explanation":"Strong answers name all three with a fitting example each.","difficulty":"beginner","transfer":"Which of the three ways would you use to teach a helper to sort recycling? Why?"}],"cards":[{"emoji":"🏫","title":"Ways to Learn","body":"Supervised learning uses labeled examples with correct answers. Unsupervised learning finds patterns on its own. Reinforcement learning improves through rewards.","funFact":null},{"emoji":"🔧","title":"Fine-Tuning","body":"Fine-tuning takes a model that is already trained and teaches it a specialty with extra data. It is much cheaper than starting from scratch.","funFact":null},{"emoji":"📝","title":"Overfitting","body":"Overfitting is when a model memorizes its training data but fails on new problems, like memorizing test answers instead of understanding.","funFact":null},{"emoji":"🔁","title":"Epochs","body":"An epoch is one complete pass through the training data. Models usually train for several epochs; too many and the model starts to memorise instead of learn.","funFact":null}]},{"id":"av_l4","title":"Architecture Speak","description":"The designs behind modern AI systems","order":3,"difficulty":"intermediate","questions":[{"id":"av4_q1","type":"multipleChoice","text":"What is a 'transformer' in AI?","simple":"What is a transformer in AI?","options":["The architecture behind most modern language models","A device that converts electrical voltage","A robot that changes shape","A data compression method"],"correct":"The architecture behind most modern language models","correctAnswers":["The architecture behind most modern language models"],"pairs":[],"explanation":"The transformer, introduced in a 2017 research paper, uses attention to process whole sequences at once. Most of today's language models are built on it.","difficulty":"beginner","transfer":"Why might reading a whole sentence at once help a model understand 'bank'?"},{"id":"av4_q2","type":"trueFalse","text":"The 'attention mechanism' helps a model focus on the most relevant parts of its input while generating output.","simple":"Does attention help a model focus on the relevant parts?","options":["True","False"],"correct":"True","correctAnswers":["True"],"pairs":[],"explanation":"Attention lets the model weigh the importance of different input tokens when producing each output token. For example, when answering a question, it can 'attend to' the most relevant parts of a long passage.","difficulty":"beginner","transfer":"In 'the dog that chased the cat was tired', which word should 'tired' attend to?"},{"id":"av4_q3","type":"fillInBlank","text":"A __________ is the simplest neural network: one neuron that takes inputs, applies weights, and outputs a result.","simple":"The simplest neural network, one neuron, is a what?","options":["perceptron","processor","predictor","parameter"],"correct":"perceptron","correctAnswers":["perceptron"],"pairs":[],"explanation":"The perceptron, invented in 1958, is the granddaddy of neural networks: one neuron that multiplies inputs by weights and sums them up. Modern networks stack millions of these together.","difficulty":"beginner","transfe
