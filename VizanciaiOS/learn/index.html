["A team could use a smaller model when the task is simple, since it needs less computation than a large one. They could also send fewer requests, for example by caching answers people ask for again. Each request is small, but at scale those choices add up."],"pairs":[],"explanation":"Strong answers name two concrete choices and connect them to scale.","difficulty":"beginner","transfer":"Your class chatbot answers the same five questions daily. What would you change to cut its energy use?"}],"cards":[{"emoji":"⚡","title":"Electricity In and Out","body":"Training a large model runs many chips for weeks, and every answer it gives afterwards also uses power. One request uses a small amount, but millions of requests add up.","funFact":null},{"emoji":"💧","title":"Data Centres Need Cooling","body":"Servers make heat, and data centres cool them with fans, chilled water, or evaporating water. That is why some sites use large amounts of water, and where a data centre is built matters.","funFact":null},{"emoji":"🪨","title":"Chips Come from the Ground","body":"AI chips are made from mined and refined materials, and old hardware becomes electronic waste. Using hardware longer and recycling it reduces that footprint.","funFact":null},{"emoji":"📉","title":"Choices That Shrink the Footprint","body":"A smaller model for a simple task, fewer repeated requests, and caching answers people ask again all cut energy use. Exact numbers stay inside providers, so claims about AI's footprint need a dated source. The energy meter in a simulation is a model, not a measurement.","funFact":null}]}],"bigIdeas":["societalImpact"]},{"id":"ai_at_work","name":"AI in Your Life","icon":"briefcase","color":"aiGreen","description":"How AI shows up in work, hiring and decisions, and where people stay responsible.","order":8,"unlock":{"kind":"completeTier1","value":null},"lessons":[{"id":"aw_l1","title":"AI Helpers at Work","description":"Matching kinds of tasks to kinds of tools","order":0,"difficulty":"beginner","questions":[{"id":"aw1_q1","type":"multipleChoice","text":"A writing assistant at work mainly does what?","simple":"What does a writing assistant mainly do?","options":["Drafts text a person checks","Decides which staff get hired","Repairs the office computers","Approves every company budget"],"correct":"Drafts text a person checks","correctAnswers":["Drafts text a person checks"],"pairs":[],"explanation":"A writing assistant produces a first draft from a request. The person still reads it, fixes it, and decides whether to send it.","difficulty":"beginner","transfer":"You use a writing helper for a thank-you note to a coach. What would you check before sending?"},{"id":"aw1_q2","type":"trueFalse","text":"A spreadsheet helper can suggest a formula that gives the wrong total.","simple":"Can a spreadsheet helper suggest a wrong formula?","options":["True","False"],"correct":"True","correctAnswers":["True"],"pairs":[],"explanation":"Helpers guess from patterns, so a suggested formula can point at the wrong cells. Check the total against a few numbers you know.","difficulty":"beginner","transfer":"Your team's fundraiser sheet shows an odd total. How would you check it?"},{"id":"aw1_q3","type":"matchPairs","text":"Match each work task to the kind of tool that helps with it.","simple":"Match each task to the kind of tool.","options":[],"correct":"","correctAnswers":[],"pairs":[{"term":"Drafting an email","definition":"Writing assistant"},{"term":"Adding up sales by month","definition":"Spreadsheet helper"},{"term":"Answering common order questions","definition":"Customer-service chatbot"},{"term":"Finding a meeting time","definition":"Scheduling tool"}],"explanation":"Each kind of tool suits a kind of task. Knowing the kinds helps you pick a tool, or decide you do not need one.","difficulty":"beginner","transfer":"Which kind of tool would help plan a family trip, and which would you skip?"},{"id":"aw1_q4","type":"fillInBlank","text":"A helper's draft can include a made-up fact, so the sender must __________ it.","simple":"A draft may hold a made-up fact. The sender must ____ it.","options":["check","forward","shorten","sign"],"correct":"check","correctAnswers":["check"],"pairs":[],"explanation":"A language model can state a wrong date or invent a detail with confidence. Checking against a source is part of using the tool.","difficulty":"intermediate","transfer":"An AI helper writes a fact about your favourite team. Where would you check it?"},{"id":"aw1_q5","type":"scenarioJudgment","text":"An employee lets an assistant draft every report and sends them unread. What is the main risk?","simple":"Reports go out unread from an AI helper. Main risk?","options":["A wrong figure goes out under their name","The reports lose their page formatting","The assistant stops working after a week","The manager receives too many reports"],"correct":"A wrong figure goes out under their name","correctAnswers":["A wrong figure goes out under their name"],"pairs":[],"explanation":"The tool may be wrong, but the person who sends the report is responsible for it. Reading it is the job, not an extra.","difficulty":"intermediate","transfer":"A friend hands in an AI-written project without reading it. What could happen at school?"},{"id":"aw1_q6","type":"multipleChoice","text":"A coding helper suggests a block of code. What still needs a developer?","simple":"A coding helper suggests code. What needs a person?","options":["Testing whether it works","Typing it faster than before","Choosing a font for it","Counting the lines it wrote"],"correct":"Testing whether it works","correctAnswers":["Testing whether it works"],"pairs":[],"explanation":"Suggested code can look right and still fail or do the wrong thing. Developers test it, fit it to the project, and answer for it.","difficulty":"advanced","transfer":"A helper writes a recipe for you. What would you do before cooking it for guests?"},{"id":"aw1_q7","type":"scenarioJudgment","text":"An assistant drafts a meeting summary. What should the worker do before sending it?","simple":"AI drafted a meeting summary. What comes before sending?","options":["Read and correct it","Send it unread","Delete the meeting notes","Add more jargon"],"correct":"Read and correct it","correctAnswers":["Read and correct it"],"pairs":[],"explanation":"AI drafts save time, but the person sending it is responsible for what it says.","difficulty":"beginner","transfer":"What mistake could a summary contain that only an attendee would notice?"},{"id":"aw1_q8","type":"trueFalse","text":"Adding AI improves any task at work.","simple":"Does adding AI improve any task?","options":["True","False"],"correct":"False","correctAnswers":["False"],"pairs":[],"explanation":"Simple tasks often need simple tools. Match the tool to the job, and skipping AI is a fair choice.","difficulty":"beginner","transfer":"Name one task where a calculator or checklist beats an AI assistant."},{"id":"aw1_q9","type":"explain","text":"Explain what it means to use AI as a helper rather than a replacement.","simple":"Explain AI as a helper, not a replacement.","options":["AI handles repetitive parts","A person directs and reviews","The person stays responsible"],"correct":"Using AI as a helper means letting it take on repetitive parts of a task, like a first draft or a data summary, while a person decides what is needed and checks the result. The person stays in charge and responsible for the final work.","correctAnswers":["Using AI as a helper means letting it take on repetitive parts of a task, like a first draft or a data summary, while a person decides what is needed and checks the result. The person stays in charge and responsible for the final work."],"pairs":[],"explanation":"Strong answers describe the split of work and who keeps responsibility.","difficulty":"beginner","transfer":"Describe one chore at home you would let a helper draft and one you would do yourself."}],"cards":[{"emoji":"🔧","title":"AI as a Helper","body":"An AI helper can draft, summarize, or suggest. A person decides what is needed, checks the result, and stays responsible for it.","funFact":null},{"emoji":"🧰","title":"Kinds of Tools","body":"Writing assistants draft text. Spreadsheet helpers suggest formulas and summaries. Customer-service chatbots answer common questions. Scheduling tools find meeting times.","funFact":null},{"emoji":"🎯","title":"Right Tool, Right Job","body":"Not every task needs AI. A checklist, a calculator, or a quick phone call is sometimes faster and more reliable. Choosing no AI is a fair choice.","funFact":null},{"emoji":"🧾","title":"Costs and Checks","body":"AI helpers cost money, energy, and checking time. A draft can hold a wrong date or a made-up detail, so the person who sends it reads it first.","funFact":null}]},{"id":"aw_l2","title":"AI in Hiring","description":"How screening software can be unfair, and how audits help","order":1,"difficulty":"intermediate","questions":[{"id":"aw2_q1","type":"multipleChoice","text":"Which hiring step most often uses AI software?","simple":"Which hiring step often uses AI?","options":["Sorting resumes by keywords","Signing the final contract","Choosing the office furniture","Paying the new employee"],"correct":"Sorting resumes by keywords","correctAnswers":["Sorting resumes by keywords"],"pairs":[],"explanation":"Employers may use software to sort many resumes quickly. A person sets the rules and should make the final decision.","difficulty":"beginner","transfer":"A screener rejects unusual resume formats. What could go wrong?"},{"id":"aw2_q2","type":"trueFalse","text":"Hiring tools have been found to favor some groups unfairly.","simple":"Have hiring tools been found to be unfair?","options":["True","False"],"correct":"True","correctAnswers":["True"],"pairs":[],"explanation":"Documented cases show screeners copying past patterns, such as favoring one gender. That is a reason audits exist.","difficulty":"beginner","transfer":"A game ranks players using old data from one region. What could be unfair about that?"},{"id":"aw2_q3","type":"scenarioJudgment","text":"A screener rates applicants by how many job-ad keywords they match. What is the risk?","simple":"A screener counts matching keywords. What is the risk?","options":["Skilled people using other words get missed","The job ad becomes too long to read","Applicants must type faster than usual","The tool runs out of memory space"],"correct":"Skilled people using other words get missed","correctAnswers":["Skilled people using other words get missed"],"pairs":[],"explanation":"Keyword counting rewards wording, not skill. A strong applicant who describes the same work differently can be filtered out.","difficulty":"beginner","transfer":"A teacher grades essays by counting certain words. Who might be marked unfairly?"},{"id":"aw2_q4","type":"fillInBlank","text":"AI hiring tools should be independently __________ regularly to check for discrimination.","simple":"Hiring tools should be ____ to check for unfairness.","options":["audited","minimized","outsourced","accelerated"],"correct":"audited","correctAnswers":["audited"],"pairs":[],"explanation":"Regular audits compare outcomes across groups and catch unfair patterns. Some cities and regions require them.","difficulty":"intermediate","transfer":"How could a sports team check whether its tryout scoring is fair to everyone?"},{"id":"aw2_q5","type":"multipleChoice","text":"Some places require hiring tools to be bias audited and applicants told. What does that protect?","simple":"Why require audits and telling applicants?","options":["Applicants from hidden unfair screening","Employers from hiring too many people","Tools from being copied by rivals","Interviewers from long meetings"],"correct":"Applicants from hidden unfair screening","correctAnswers":["Applicants from hidden unfair screening"],"pairs":[],"explanation":"Audits reveal unfair patterns, and notice lets applicants know software was involved. Both make hidden screening visible.","difficulty":"intermediate","transfer":"A school uses software to sort club applications. What should students be told?"},{"id":"aw2_q6","type":"multipleChoice","text":"AI video interview tools score faces and voices. Who could this treat unfairly?","simple":"Video interview AI scores faces. Who could be treated unfairly?","options":["People with accents or facial differences","People with very fast internet","People who wear bright colors","People who apply on weekends"],"correct":"People with accents or facial differences","correctAnswers":["People with accents or facial differences"],"pairs":[],"explanation":"Research has found such tools can score non-native speakers and people with facial differences or disabilities lower for reasons unrelated to the job.","difficulty":"advanced","transfer":"A speaking contest is judged by voice-analysis software. What could go wrong?"},{"id":"aw2_q7","type":"scenarioJudgment","text":"A resume screener rejects everyone who took a year off. Who could this harm unfairly?","simple":"A screener rejects gaps in work history. Who is harmed?","options":["Parents, carers, and people who were ill","Nobody","Only people with typos","Only new graduates"],"correct":"Parents, carers, and people who were ill","correctAnswers":["Parents, carers, and people who were ill"],"pairs":[],"explanation":"A gap has many good reasons. A blanket rule punishes people for life events unrelated to the job.","difficulty":"beginner","transfer":"What question should the company ask before adding any automatic rule?"},{"id":"aw2_q8","type":"trueFalse","text":"A human should make the final hiring decision, not the AI alone.","simple":"Should a human make the final hiring decision?","options":["True","False"],"correct":"True","correctAnswers":["True"],"pairs":[],"explanation":"AI can sort and suggest, but final decisions about people need human judgment and accountability.","difficulty":"beginner","transfer":"What could a human interviewer notice that a resume scanner cannot?"},{"id":"aw2_q9","type":"explain","text":"Explain why an AI hiring tool should be audited regularly.","simple":"Why should an AI hiring tool be audited regularly?","options":["It may reject groups unfairly","Bias can hide in the data","Audits check outcomes across groups"],"correct":"A hiring tool learns from past decisions, so it can quietly reject some groups more often without anyone intending it. Regular audits compare outcomes across groups and catch that bias before it affects many applicants.","correctAnswers":["A hiring tool learns from past decisions, so it can quietly reject some groups more often without anyone intending it. Regular audits compare outcomes across groups and catch that bias before it affects many applicants."],"pairs":[],"explanation":"Strong answers connect hidden bias to checking outcomes.","difficulty":"beginner","transfer":"How would you check whether a class vote app was treating some students unfairly?"}],"cards":[{"emoji":"📊","title":"Where AI Shows Up in Hiring","body":"Employers may use software to sort resumes, suggest matches, schedule interviews, or score video answers. A person sets the rules and should make the final call.","funFact":null},{"emoji":"🪞","title":"How Bias Gets In","body":"A screener learns from past hiring. If past hiring favored one group, the tool can copy that pattern without anyone intending it.","funFact":null},{"emoji":"🔍","title":"Audits","body":"An audit compares outcomes across groups, such as who gets through screening. Some places require audits and require telling applicants that software was used.","funFact":null},{"emoji":"🤝","title":"Human Judgment","body":"A scanner sees keywords. A person can see context, ask about a gap, and be accountable for the decision. Final decisions about people should involve a human.","funFact":null}]},{"id":"aw_l3","title":"Automation & Jobs","description":"How jobs change, and how to check claims about it","order":2,"difficulty":"intermediate","questions":[{"id":"aw3_q1","type":"multipleChoice","text":"A headline says '60% of jobs will be automated soon.' What should you check first?","simple":"A headline gives a big jobs number. Check what first?","options":["Who measured it and how","How many people shared it","Whether the font looks official","If the number is round"],"correct":"Who measured it and how","correctAnswers":["Who measured it and how"],"pairs":[],"explanation":"Job forecasts differ a lot depending on who made them and what they counted. Find the source and the method before repeating the number.","difficulty":"beginner","transfer":"A friend quotes a statistic about screen time. What two questions would you ask about it?"},{"id":"aw3_q2","type":"trueFalse","text":"Automation usually changes some tasks in a job rather than the whole job at once.","simple":"Does automation usually change tasks, not whole jobs?","options":["True","False"],"correct":"True","correctAnswers":["True"],"pairs":[],"explanation":"Most jobs mix many tasks. Software often takes over a repetitive one while the rest of the job changes shape.","difficulty":"beginner","transfer":"List two tasks in a babysitter's job and say which one software could help with."},{"id":"aw3_q3","type":"fillInBlank","text":"Tasks that are __________ and rule-based are the easiest to automate.","simple":"Tasks that are ____ and follow rules are easiest to automate.","options":["repetitive","creative","emotional","physical"],"correct":"repetitive","correctAnswers":["repetitive"],"pairs":[],"explanation":"Repetitive, rule-based tasks like sorting and copying data are the easiest for software to take over.","difficulty":"beginner","transfer":"Which chore at home is repetitive enough that a machine already does it?"},{"id":"aw3_q4","type":"matchPairs","text":"Match each job to a task software already helps with.","simple":"Match each job to a task software helps with.","options":[],"correct":"","correctAnswers":[],"pairs":[{"term":"Cashier","definition":"Scanning items at self-checkout"},{"term":"Translator","definition":"Producing a first-draft translation"},{"term":"Warehouse worker","definition":"Sorting parcels by address"},{"term":"Writer","definition":"Flagging spelling and grammar"}],"explanation":"Software helps with a repetitive part of each job. The person still handles the rest and fixes the software's mistakes.","difficulty":"beginner","transfer":"Pick a job someone in your family does. Which one task could software help with?"},{"id":"aw3_q5","type":"scenarioJudgment","text":"A marketer is deciding whether to use AI tools. What is the soundest way to choose?","simple":"A marketer might use AI tools. How should they decide?","options":["Test one on a real task first","Assume every new tool is a fad","Copy whatever their coworkers choose","Wait until a manager orders it"],"correct":"Test one on a real task first","correctAnswers":["Test one on a real task first"],"pairs":[],"explanation":"Choosing not to use AI can be reasonable. A fair trial on real work gives evidence either way instead of a guess.","difficulty":"intermediate","transfer":"You are deciding whether to use a study app. How would you test it fairly?"},{"id":"aw3_q6","type":"multipleChoice","text":"Which claim about AI and jobs could be checked with evidence today?","simple":"Which claim about jobs could be checked today?","options":["Job postings mentioning AI rose in one region last year","AI will end most work within twenty years","Every worker will enjoy using AI tools","No one will ever need new skills"],"correct":"Job postings mentioning AI rose in one region last year","correctAnswers":["Job postings mentioning AI rose in one region last year"],"pairs":[],"explanation":"A count of past postings can be checked against data. The others are forecasts or opinions, which evidence can inform but not settle.","difficulty":"advanced","transfer":"Write one checkable claim and one forecast about your favourite sport."},{"id":"aw3_q7","type":"scenarioJudgment","text":"A cashier's job now includes fixing self-checkout errors and helping customers. What happened?","simple":"A cashier now fixes self-checkout problems. What happened?","options":["The job changed rather than vanished","The job disappeared","Nothing changed","The robot got promoted"],"correct":"The job changed rather than vanished","correctAnswers":["The job changed rather than vanished"],"pairs":[],"explanation":"Automation often reshapes a job. Repetitive parts shrink and human parts grow.","difficulty":"beginner","transfer":"Which parts of a teacher's job would be hardest to automate?"},{"id":"aw3_q8","type":"trueFalse","text":"Machines replacing some human tasks is a new idea from the AI era.","simple":"Is automation a brand new idea from the AI era?","options":["True","False"],"correct":"False","correctAnswers":["False"],"pairs":[],"explanation":"Machines have replaced manual tasks for centuries. AI is the latest wave, reaching thinking tasks.","difficulty":"beginner","transfer":"Name one older invention that changed how people worked."},{"id":"aw3_q9","type":"explain","text":"Explain how a worker could decide whether an AI tool is worth using for a task.","simple":"How could a worker decide if an AI tool is worth using?","options":["Try it on a real task","Check errors and costs","Compare with doing it without AI"],"correct":"A worker can try the tool on a real task and check the result for mistakes. Then they compare the time saved with the cost and the checking effort. If the tool does not help, not using it is a fine choice.","correctAnswers":["A worker can try the tool on a real task and check the result for mistakes. Then they compare the time saved with the cost and the checking effort. If the tool does not help, not using it is a fine choice."],"pairs":[],"explanation":"Strong answers include a real trial, checking for errors, and a fair comparison.","difficulty":"beginner","transfer":"How would you decide whether a homework helper app is worth it for you?"}],"cards":[{"emoji":"🏭","title":"Automation Isn't New","body":"Machines have replaced manual tasks for centuries. AI is the latest wave, reaching tasks like sorting, drafting, and summarizing.","funFact":null},{"emoji":"🧩","title":"Tasks, Not Whole Jobs","body":"Most jobs mix many tasks. Software often takes over a repetitive part while the rest of the job changes shape.","funFact":null},{"emoji":"📰","title":"Checking Job Claims","body":"Forecasts about jobs vary widely. Ask who measured it, what they counted, and when, before repeating a number. A forecast is not a fact.","funFact":null},{"emoji":"🧭","title":"Deciding for Yourself","body":"Trying a tool on a real task gives evidence. Choosing not to use AI for some work is a fair choice, and so is using it with checks.","funFact":null}]},{"id":"aw_l4","title":"AI Decision-Making","description":"When software helps decide, and who stays accountable","order":3,"difficulty":"intermediate","questions":[{"id":"aw4_q1","type":"multipleChoice","text":"Which of these is a business decision AI software often helps with?","simple":"Which decision does AI often help with?","options":["Spotting unusual card payments","Choosing the company name","Writing the founder's life story","Painting the office walls"],"correct":"Spotting unusual card payments","correctAnswers":["Spotting unusual card payments"],"pairs":[],"explanation":"AI helps where there is lots of data and a repeated decision, like flagging odd payments. A person still reviews flagged cases.","difficulty":"beginner","transfer":"A shop uses AI to set prices. What should a manager still check?"},{"id":"aw4_q2","type":"trueFalse","text":"An AI that decides who gets a refund needs no human check.","simple":"Does a refund-deciding AI need no human check?","options":["True","False"],"correct":"False","correctAnswers":["False"],"pairs":[],"explanation":"Automatic decisions about people can be wrong or unfair. Someone needs to review complaints and be accountable.","difficulty":"beginner","transfer":"A game's auto-moderator mutes a player. Why should a person be able to review it?"},{"id":"aw4_q3","type":"fillInBlank","text":"An 'explainable AI' system can show __________ it reached a specific decision.","simple":"Explainable AI shows ____ it made a choice.","options":["why","when","who","where"],"correct":"why","correctAnswers":["why"],"pairs":[],"explanation":"Explainable AI shows the main reasons behind a result. Reasons let people spot errors and challenge unfair outcomes.","difficulty":"beginner","transfer":"A music app recommends a song. What would a good explanation of why look like?"},{"id":"aw4_q4","type":"multipleChoice","text":"A 'black box' AI system is:","simple":"What is a black box AI?","options":["One whose reasoning is hidden","One that stores encrypted files","One that runs without power","One kept inside a locked room"],"correct":"One whose reasoning is hidden","correctAnswers":["One whose reasoning is hidden"],"pairs":[],"explanation":"A black box shows what went in and what came out, but not clearly why. That is a concern when the decision affects a person.","difficulty":"intermediate","transfer":"A grading app gives a mark with no reasons. What would you ask the teacher?"},{"id":"aw4_q5","type":"scenarioJudgment","text":"A store's AI flags a customer as a likely fraudster. What is the fair next step?","simple":"AI flags a shopper as fraud. Fair next step?","options":["A person reviews it first","Ban the customer immediately","Close the customer's account","Tell other stores about it"],"correct":"A person reviews it first","correctAnswers":["A person reviews it first"],"pairs":[],"explanation":"A flag is a guess, not proof. A human check protects an innocent customer and keeps the store accountable.","difficulty":"intermediate","transfer":"An anti-cheat system flags your friend in a game. What should happen before a ban?"},{"id":"aw4_q6","type":"multipleChoice","text":"Which is the strongest reason for a human to review AI business decisions?","simple":"Strongest reason for a human to review AI decisions?","options":["AI misses context and a person is accountable","People add up numbers faster than computers","AI systems are banned in most countries","Computers cannot keep enough records safely"],"correct":"AI misses context and a person is accountable","correctAnswers":["AI misses context and a person is accountable"],"pairs":[],"explanation":"AI can err, miss context, and has no sense of fairness. When a decision affects people, someone has to answer for it.","difficulty":"advanced","transfer":"A team app picks who sits out this week. Why should the coach still look at it?"},{"id":"aw4_q7","type":"scenarioJudgment","text":"An AI denies a loan and the customer asks why. What should the bank be able to do?","simple":"A loan is denied. What should the bank be able to do?","options":["Explain the main reasons","Say the computer decided","Ignore the question","Deny the next one too"],"correct":"Explain the main reasons","correctAnswers":["Explain the main reasons"],"pairs":[],"explanation":"People affected by important decisions deserve understandable reasons. That is what explainable AI supports.","difficulty":"beginner","transfer":"What reason would you find fair, and what reason would you challenge?"},{"id":"aw4_q8","type":"trueFalse","text":"A black box AI is one whose decisions are hard to understand.","simple":"Is a black box AI hard to understand?","options":["True","False"],"correct":"True","correctAnswers":["True"],"pairs":[],"explanation":"You can see what goes in and what comes out, but not clearly why. That is risky for important decisions.","difficulty":"beginner","transfer":"Which decision would you never want made by a black box?"},{"id":"aw4_q9","type":"explain","text":"Explain why humans should oversee AI business decisions.","simple":"Why should humans oversee AI business decisions?","options":["AI makes mistakes","AI lacks moral judgment and context","A person is accountable for the outcome"],"correct":"AI can make errors, miss context that a person would catch, and has no sense of what is fair or kind. When a decision affects people, a human needs to check it and be the one who is accountable for the result.","correctAnswers":["AI can make errors, miss context that a person would catch, and has no sense of what is fair or kind. When a decision affects people, a human needs to check it and be the one who is accountable for the result."],"pairs":[],"explanation":"Strong answers give at least two reasons including accountability.","difficulty":"beginner","transfer":"A robot referee calls a foul in your match. Who should be able to overrule it, and why?"}],"cards":[{"emoji":"🤖","title":"AI Helps Decide","body":"Companies use AI to flag odd payments, suggest prices, and sort requests. These are guesses from data, and they can be wrong.","funFact":null},{"emoji":"📦","title":"Black Box","body":"A black box system shows what went in and what came out, but not clearly why. That is risky when the decision affects a person.","funFact":null},{"emoji":"💡","title":"Explainable AI","body":"Explainable AI shows the main reasons behind a choice. Reasons let people spot errors and challenge unfair results.","funFact":null},{"emoji":"⚖️","title":"Human Oversight","body":"A person should review decisions that matter to people and be the one accountable. Oversight is not a formality; it catches real mistakes.","funFact":null}]},{"id":"aw_l5","title":"Skills for Working with AI","description":"Judging AI output and deciding when to use it","order":4,"difficulty":"beginner","questions":[{"id":"aw5_q1","type":"multipleChoice","text":"An AI summary of a report looks fine. Which check finds errors best?","simple":"An AI summary looks fine. Best check?","options":["Compare key numbers with the original","Read the summary a second time","Ask the tool whether it is sure","Check the spelling only"],"correct":"Compare key numbers with the original","correctAnswers":["Compare key numbers with the original"],"pairs":[],"explanation":"A tool can restate a wrong number confidently. Comparing with the source catches it; asking the tool does not.","difficulty":"beginner","transfer":"An AI summarizes a chapter for you. How would you check it against the book?"},{"id":"aw5_q2","type":"multipleChoice","text":"Teachers, doctors, and lawyers need to judge AI output safely. What skill is this?","simple":"Judging AI output safely is which skill?","options":["AI literacy","Model pre-training","Backpropagation","Image segmentation"],"correct":"AI literacy","correctAnswers":["AI literacy"],"pairs":[],"explanation":"AI literacy means understanding what AI can do, where it can fail, and how to check its output. It matters far beyond engineering roles.","difficulty":"beginner","transfer":"How would a plumber use AI literacy on the job?"},{"id":"aw5_q3","type":"matchPairs","text":"Match each skill to what it means.","simple":"Match each skill to its meaning.","options":[],"correct":"","correctAnswers":[],"pairs":[{"term":"AI literacy","definition":"Knowing what AI can and cannot do"},{"term":"Data fluency","definition":"Reading and questioning numbers"},{"term":"Critical thinking","definition":"Checking claims before accepting them"},{"term":"Ethical reasoning","definition":"Weighing who a choice helps or harms"}],"explanation":"These skills work together. They help a person judge a tool's output instead of accepting it because it sounds confident.","difficulty":"beginner","transfer":"Which of these skills would you use to judge a viral video's claim?"},{"id":"aw5_q4","type":"fillInBlank","text":"__________ thinking becomes more important as AI generates more content.","simple":"____ thinking matters more as AI makes more content.","options":["Critical","Lateral","Abstract","Analytical"],"correct":"Critical","correctAnswers":["Critical"],"pairs":[],"explanation":"More generated content means more claims to check. Critical thinking means checking a claim before accepting it.","difficulty":"intermediate","transfer":"A group chat shares an AI-made news image. What would you check before believing it?"},{"id":"aw5_q5","type":"multipleChoice","text":"A customer-service chatbot writes 'I understand how you feel.' What is true about that line?","simple":"A chatbot says it understands you. What is true?","options":["It is generated text, not felt emotion","The chatbot shares the feeling","The chatbot checked the customer's records","The line proves the issue is solved"],"correct":"It is generated text, not felt emotion","correctAnswers":["It is generated text, not felt emotion"],"pairs":[],"explanation":"Language models produce caring words from patterns. The words are not evidence of feeling, and a real problem may still need a person.","difficulty":"intermediate","transfer":"A game character says it misses you. What do those words show?"},{"id":"aw5_q6","type":"scenarioJudgment","text":"A nurse's hospital does not use AI tools yet. What is a reasonable plan?","simple":"A nurse's hospital has no AI yet. Reasonable plan?","options":["Learn enough to judge tools later","Promise never to use such tools","Trust whatever the hospital buys","Use a chatbot for patient advice now"],"correct":"Learn enough to judge tools later","correctAnswers":["Learn enough to judge tools later"],"pairs":[],"explanation":"Not needing a tool today is fine. Basic AI literacy helps the nurse ask good questions if one is introduced, which matters for patient safety.","difficulty":"advanced","transfer":"Your school has no AI tools yet. What would be worth understanding anyway?"},{"id":"aw5_q7","type":"scenarioJudgment","text":"A nurse learns to check an AI's suggestions before acting on them. Which skill is that?","simple":"A nurse checks AI suggestions before acting. Which skill?","options":["AI literacy","Typing speed","Memorising drug names","Coding in Python"],"correct":"AI literacy","correctAnswers":["AI literacy"],"pairs":[],"explanation":"Knowing what AI can and cannot do, and checking its output, is AI literacy. It matters in every field.","difficulty":"beginner","transfer":"How would a chef use AI literacy at work?"},{"id":"aw5_q8","type":"trueFalse","text":"Critical thinking becomes more important as AI produces more content.","simple":"Does critical thinking matter more as AI makes more content?","options":["True","False"],"correct":"True","correctAnswers":["True"],"pairs":[],"explanation":"More content means more to evaluate. Judging quality and truth is a human skill in demand.","difficulty":"beginner","transfer":"What question would you ask about any AI-made article?"},{"id":"aw5_q9","type":"explain","text":"Explain what AI literacy means and why it matters outside tech jobs.","simple":"What is AI literacy and why does it matter?","options":["Know what AI can and cannot do","Check its output","Any job may meet AI tools"],"correct":"AI literacy means understanding what AI tools can do, where they fail, and how to check their output. Teachers, nurses, and shop staff may all meet these tools, so they need to judge them without being programmers.","correctAnswers":["AI literacy means understanding what AI tools can do, where they fail, and how to check their output. Teachers, nurses, and shop staff may all meet these tools, so they need to judge them without being programmers."],"pairs":[],"explanation":"Strong answers define the skill and give a reason it matters beyond tech roles.","difficulty":"beginner","transfer":"How would a bus driver or a coach use AI literacy in their work?"}],"cards":[{"emoji":"🧠","title":"AI Literacy","body":"AI literacy is knowing what AI can do, where it fails, and how to check its output. It is useful in any job, not only in tech.","funFact":null},{"emoji":"🔎","title":"Critical Thinking","body":"As more content is generated, checking claims before accepting them matters more. Compare with the source, not with the tool's confidence.","funFact":null},{"emoji":"📈","title":"Data Fluency and Ethics","body":"Data fluency means reading and questioning numbers. Ethical reasoning means weighing who a choice helps or harms.","funFact":null},{"emoji":"💬","title":"Words Are Not Feelings","body":"A chatbot can write caring sentences from patterns. The words show it can generate language, not that it feels anything.","funFact":null}]},{"id":"aw_l6","title":"AI Business Strategy","description":"How companies decide whether and how to adopt AI","order":5,"difficulty":"advanced","questions":[{"id":"aw6_q1","type":"multipleChoice","text":"The first step in adopting AI for a business:","simple":"First step for a business adopting AI?","options":["Pick a specific problem to solve","Buy the priciest AI platform","Replace staff with AI first","Copy a competitor's plan exactly"],"correct":"Pick a specific problem to solve","correctAnswers":["Pick a specific problem to solve"],"pairs":[],"explanation":"Start with a real problem and ask whether AI helps more than a simpler fix. Sometimes the answer is no AI at all.","difficulty":"beginner","transfer":"A school wants AI but has no clear goal. What should it decide first?"},{"id":"aw6_q2","type":"multipleChoice","text":"A small company needs text generation without training a model. What should it try first?","simple":"A small company wants text generation. Try what first?","options":["A foundation-model API","Training from scratch","Building a new GPU","Manual data clustering"],"correct":"A foundation-model API","correctAnswers":["A foundation-model API"],"pairs":[],"explanation":"A foundation-model API gives an app access to a model a provider already trained. It is usually faster and cheaper than training a large model from scratch.","difficulty":"beginner","transfer":"A school club wants a quiz maker. Would you build one or use an existing tool? Why?"},{"id":"aw6_q3","type":"fillInBlank","text":"A good AI strategy requires strong __________ governance for quality and security.","simple":"Good AI strategy needs strong ____ governance.","options":["data","talent","technology","marketing"],"correct":"data","correctAnswers":["data"],"pairs":[],"explanation":"Data governance keeps records accurate, organized, and secure. Poor data quality undermines any AI project.","difficulty":"beginner","transfer":"What records would a sports league need to keep clean before analyzing them?"},{"id":"aw6_q4","type":"multipleChoice","text":"An AI project's results are poor. Which is the likeliest cause to check first?","simple":"An AI project does badly. Check which cause first?","options":["Messy data or unclear goals","Too many software choices","Not enough public announcements","A model that is too fast"],"correct":"Messy data or unclear goals","correctAnswers":["Messy data or unclear goals"],"pairs":[],"explanation":"Unclear goals and bad data are common reasons projects disappoint, more often than limits of the technology.","difficulty":"intermediate","transfer":"A class survey gave confusing results. What would you check about the questions and the answers?"},{"id":"aw6_q5","type":"scenarioJudgment","text":"A vendor says its AI 'beats any expert in every situation.' What should a buyer ask for?","simple":"A vendor claims its AI beats any expert. Ask for what?","options":["Results on tasks like theirs","A bigger discount on licenses","A longer sales presentation","Its list of famous customers"],"correct":"Results on tasks like theirs","correctAnswers":["Results on tasks like theirs"],"pairs":[],"explanation":"Broad claims are a warning sign. Evidence on the buyer's own kind of task, with error rates, is what matters.","difficulty":"intermediate","transfer":"An ad says a study app makes anyone an A student. What evidence would you want?"},{"id":"aw6_q6","type":"multipleChoice","text":"What does 'AI readiness' measure?","simple":"What does AI readiness measure?","options":["Whether a company is ready to use AI","How many AI licenses a company bought","How large the data science team is","Whether the company uses cloud servers"],"correct":"Whether a company is ready to use AI","correctAnswers":["Whether a company is ready to use AI"],"pairs":[],"explanation":"AI readiness covers data, skills, rules, and leadership. A count of licenses or servers does not show any of that.","difficulty":"advanced","transfer":"Is your class ready to run a group project with a shared document? What would show readiness?"},{"id":"aw6_q7","type":"scenarioJudgment","text":"A company wants AI but has messy, incomplete records. What should it fix first?","simple":"A company has messy records and wants AI. Fix first?","options":["Its data quality","Its logo","Its office chairs","Its slogan"],"correct":"Its data quality","correctAnswers":["Its data quality"],"pairs":[],"explanation":"AI learns from data. Poor data leads to poor results no matter how good the model is.","difficulty":"beginner","transfer":"What messy data might a school have that would need cleaning?"},{"id":"aw6_q8","type":"trueFalse","text":"Most companies build their own AI models from scratch.","simple":"Do most companies build AI from scratch?","options":["True","False"],"correct":"False","correctAnswers":["False"],"pairs":[],"explanation":"Most use existing models through a service and focus on their own data and goals.","difficulty":"beginner","transfer":"Why would a small bakery not train its own model?"},{"id":"aw6_q9","type":"explain","text":"Explain what a company should do before adopting AI.","simple":"What should a company do before adopting AI?","options":["Pick a specific problem AI can help with","Check data quality","Set realistic expectations"],"correct":"The company should start with a clear, specific problem where AI could add value, not with hype. It should check that it has enough good quality data and set realistic expectations about what the system can do, then measure results. If a simpler fix works, choosing no AI is fine.","correctAnswers":["The company should start with a clear, specific problem where AI could add value, not with hype. It should check that it has enough good quality data and set realistic expectations about what the system can do, then measure results. If a simpler fix works, choosing no AI is fine."],"pairs":[],"explanation":"Strong answers include a clear problem and data quality.","difficulty":"beginner","transfer":"Your club wants a robot to run its bake sale. What would you check before agreeing?"}],"cards":[{"emoji":"🌐","title":"Start With the Problem","body":"Companies that do well start with a clear goal, decent data, and realistic expectations. Sometimes the best answer is a simpler tool or no AI.","funFact":null},{"emoji":"🧱","title":"Buy, Build, or Skip","body":"Most companies do not train models from scratch. They use an existing model through a service, often called an API, and focus on their own data and goals.","funFact":null},{"emoji":"🗂️","title":"Data Governance","body":"Data governance means keeping records accurate, organized, and secure. Poor data gives poor results no matter which model is used.","funFact":null},{"emoji":"✅","title":"AI Readiness","body":"AI readiness is whether a company has the data, skills, rules, and leadership to use AI well. It is not a count of licenses.","funFact":null},{"emoji":"🧾","title":"Costs Count","body":"AI adds licence fees, energy use, checking time, and new risks. A fair plan weighs these against the benefit before deciding.","funFact":null}]}],"bigIdeas":["societalImpact"]},{"id":"ai_healthcare","name":"AI Helping People","icon":"heart.text.square","color":"aiTeal","description":"See how AI helps doctors and nurses, where it can be wrong, and who decides","order":9,"unlock":{"kind":"completeTier1","value":null},"lessons":[{"id":"ah_l1","title":"AI Medical Imaging","description":"AI reading X-rays and scans","order":0,"difficulty":"beginner","questions":[{"id":"ah1_q1","type":"multipleChoice","text":"What does an image-reading tool mainly do with X-rays and scans?","simple":"What does a scan-reading tool mainly do?","options":["Flags areas that look unusual for review","Chooses the treatment with no doctor input","Sends the final bill to each patient","Builds and repairs the scanning machines"],"correct":"Flags areas that look unusual for review","correctAnswers":["Flags areas that look unusual for review"],"pairs":[],"explanation":"The tool is trained on many checked scans and points at spots that look unusual. A doctor examines the flagged area and decides.","difficulty":"beginner","transfer":"A coach uses a video tool that flags rough landings. What should the coach still check in person?"},{"id":"ah1_q2","type":"trueFalse","text":"Image-reading tools learn from many scans that doctors have already checked.","simple":"Do scan tools learn from scans doctors already checked?","options":["True","False"],"correct":"True","correctAnswers":["True"],"pairs":[],"explanation":"The tool is trained on examples with known answers. If those examples leave out some kinds of patients, it can do worse for them.","difficulty":"beginner","transfer":"You train a plant app on garden photos only. What might it get wrong on a forest hike?"},{"id":"ah1_q3","type":"fillInBlank","text":"Some tools scan for signs of a __________ and alert a specialist quickly, because minutes matter.","simple":"A tool sees signs of a __________ and alerts a specialist.","options":["stroke","cold","sprain","cavity"],"correct":"stroke","correctAnswers":["stroke"],"pairs":[],"explanation":"A stroke blocks blood flow in the brain, and fast treatment protects it. The tool sends an alert, and the specialist confirms what the scan shows.","difficulty":"beginner","transfer":"A smoke detector wakes a family. Why is a fast alert useful even when someone still checks the kitchen?"},{"id":"ah1_q4","type":"scenarioJudgment","text":"The tool flags a spot on an X-ray, but the radiologist thinks it is normal. What should happen?","simple":"Tool flags a spot; doctor says normal. What next?","options":["Note the flag and look more closely","Delete the flag and move on","Book surgery for the patient today","Switch the tool off for good"],"correct":"Note the flag and look more closely","correctAnswers":["Note the flag and look more closely"],"pairs":[],"explanation":"The tool is a second reader, so a disagreement is a reason to look again. The radiologist records both views, may ask a colleague, and makes the decision.","difficulty":"intermediate","transfer":"Your calculator and your own working disagree on a homework answer. What is a sensible next step?"},{"id":"ah1_q5","type":"multipleChoice","text":"What advantage does an image-reading tool bring to a busy department?","simple":"How does a scan tool help a busy hospital?","options":["Steady checking that does not tire","Removing the need for any scanning machines","Writing a prescription for every patient scanned","Skipping the consent step for busy patients"],"correct":"Steady checking that does not tire","correctAnswers":["Steady checking that does not tire"],"pairs":[],"explanation":"People get tired on long shifts and can miss details. The tool checks each image the same way, though it can still be wrong on scans unlike its training examples.","difficulty":"intermediate","transfer":"A referee gets tired late in a game. How could a replay tool help, and what would it still miss?"},{"id":"ah1_q6","type":"multipleChoice","text":"A tool helps examine digital tissue slides. What is it most useful for?","simple":"How does a tool help with tissue slides?","options":["Measuring and flagging unusual cells for a pathologist","Replacing the whole lab team with machines","Refilling patients' prescriptions automatically","Growing new tissue samples in the lab"],"correct":"Measuring and flagging unusual cells for a pathologist","correctAnswers":["Measuring and flagging unusual cells for a pathologist"],"pairs":[],"explanation":"Slides are scanned into very large images. The tool counts and measures cells and marks suspicious areas, and the pathologist grades the tumour and decides.","difficulty":"advanced","transfer":"A photo app counts birds in a flock picture. What would you check before trusting the count?"},{"id":"ah1_q7","type":"scenarioJudgment","text":"An image-reading tool flags a spot on an X-ray. Who decides what happens next?","simple":"A tool flags a spot on an X-ray. Who decides?","options":["A doctor who reviews the image","The tool that made the flag","The patient's own phone app","The person who booked the scan"],"correct":"A doctor who reviews the image","correctAnswers":["A doctor who reviews the image"],"pairs":[],"explanation":"The tool is a second reader. A qualified person makes the medical decision.","difficulty":"beginner","transfer":"A homework app flags a paragraph as copied. Who should decide what happens next, and why?"},{"id":"ah1_q8","type":"trueFalse","text":"Image-reading tools can help doctors spot problems earlier in some cases.","simple":"Can imaging tools help doctors spot problems earlier?","options":["True","False"],"correct":"True","correctAnswers":["True"],"pairs":[],"explanation":"A tool can check thousands of images consistently and flag unusual ones for review. A doctor still confirms each flag.","difficulty":"beginner","transfer":"A bird app was trained on summer photos only. What might it miss in winter, and why?"},{"id":"ah1_q9","type":"explain","text":"Explain why medical imaging AI is described as a second opinion, not a replacement.","simple":"Why is imaging AI a second opinion, not a replacement?","options":["It flags unusual findings","A doctor confirms and decides","It can miss or over-flag things"],"correct":"Imaging AI looks through scans and flags anything that seems unusual, which helps busy doctors not miss things. It can still be wrong in both directions, so a doctor reviews the flag, considers the patient's full history, and makes the decision.","correctAnswers":["Imaging AI looks through scans and flags anything that seems unusual, which helps busy doctors not miss things. It can still be wrong in both directions, so a doctor reviews the flag, considers the patient's full history, and makes the decision."],"pairs":[],"explanation":"Strong answers say what the AI does and why a doctor still decides.","difficulty":"beginner","transfer":"A friend says the computer already read the scan, so no doctor is needed. What would you say?"}],"cards":[{"emoji":"🩻","title":"Reading scans","body":"X-rays, MRI and CT scans are pictures of the inside of the body. An image-reading tool is trained on many scans that doctors have already checked, and it flags areas that look unusual, such as signs of a stroke, where fast treatment matters.","funFact":null},{"emoji":"🔍","title":"A second reader","body":"A radiologist is a doctor who reads scans. The tool works like a second reader: it points at spots, and the radiologist examines the image, considers the patient's history, and decides.","funFact":null},{"emoji":"⚖️","title":"Two kinds of mistakes","body":"A false alarm flags something harmless. A miss skips a real problem. Both happen, which is why a person reviews every flag instead of trusting it on its own.","funFact":null},{"emoji":"🏥","title":"Training data shapes results","body":"A tool trained on scans from one hospital or one kind of machine can do worse somewhere else. Testing it on fresh scans from the new setting shows whether it still works.","funFact":null},{"emoji":"🔬","title":"Slides under the microscope","body":"A pathologist examines thin slices of tissue to look for disease. Slides can be scanned into digital images so a tool can count cells and mark suspicious areas for the pathologist to check.","funFact":null}]},{"id":"ah_l2","title":"AI Drug Discovery","description":"Accelerating medicine development","order":1,"difficulty":"intermediate","questions":[{"id":"ah2_q1","type":"multipleChoice","text":"How does AI help find new medicines?","simple":"How can AI help scientists find new medicines?","options":["Predicting which molecules are worth testing","Making and packing the pills","Delivering medicine to people's homes","Setting the price of each medicine"],"correct":"Predicting which molecules are worth testing","correctAnswers":["Predicting which molecules are worth testing"],"pairs":[],"explanation":"AI screens huge numbers of possible molecules and ranks the promising ones. That shortens the early search, but tests still decide.","difficulty":"beginner","transfer":"You have 500 songs to pick a playlist from. How could a shortlist tool help, and what would you still do?"},{"id":"ah2_q2","type":"trueFalse","text":"Most molecules that look promising at first turn out not to become medicines.","simple":"Do most promising molecules fail to become medicines?","options":["True","False"],"correct":"True","correctAnswers":["True"],"pairs":[],"explanation":"Many candidates fail on safety or do not work in people. A prediction is a starting point for testing, not an answer.","difficulty":"beginner","transfer":"Many players at tryouts do not make the team. Why is a shortlist still useful?"},{"id":"ah2_q3","type":"fillInBlank","text":"AI models can predict how a protein __________ into its 3D shape.","simple":"AI predicts how a protein __________ into its shape.","options":["folds","splits","melts","grows"],"correct":"folds","correctAnswers":["folds"],"pairs":[],"explanation":"A protein's shape controls what it does and how a medicine can attach to it. Predicted shapes are checked against lab experiments.","difficulty":"beginner","transfer":"A paper crane's shape depends on how you fold it. Why would the fold order matter for copying it?"},{"id":"ah2_q4","type":"multipleChoice","text":"Why can a graph neural network read a molecule well?","simple":"Why can a graph network read a molecule well?","options":["It treats atoms as points and bonds as links","It needs fewer examples than any other model","It reads molecules as plain spreadsheet rows","It works from the molecule's name alone"],"correct":"It treats atoms as points and bonds as links","correctAnswers":["It treats atoms as points and bonds as links"],"pairs":[],"explanation":"A molecule is naturally a graph of atoms joined by bonds. The network learns from that structure directly instead of from a flattened list.","difficulty":"intermediate","transfer":"A friendship map shows people as dots and friendships as lines. What could a tool learn from it?"},{"id":"ah2_q5","type":"scenarioJudgment","text":"An AI ranks a compound as a likely cancer treatment. Should patients take it now?","simple":"AI ranks a compound as promising. Give it to patients now?","options":["No, it still needs trials for safety and effect","Yes, if the model reports high confidence","Yes, if the patient signs a consent form","No, unless the AI was trained on that cancer"],"correct":"No, it still needs trials for safety and effect","correctAnswers":["No, it still needs trials for safety and effect"],"pairs":[],"explanation":"A prediction is a reason to test, not proof. Trials in people are how safety and effect get shown, and a signed form does not replace that evidence.","difficulty":"intermediate","transfer":"A recipe app says a new dish will be delicious. What would you do before serving it at a party?"},{"id":"ah2_q6","type":"multipleChoice","text":"During an outbreak, how might AI help find a treatment quickly?","simple":"In an outbreak, how could AI help find a treatment?","options":["Suggesting existing medicines worth testing","Building new breathing machines for hospitals","Predicting the exact day the outbreak ends","Making a finished vaccine without any trials"],"correct":"Suggesting existing medicines worth testing","correctAnswers":["Suggesting existing medicines worth testing"],"pairs":[],"explanation":"Medicines already tested for safety can be searched for a new use. AI can scan research and data for candidates, and a trial then shows whether one helps.","difficulty":"advanced","transfer":"You need a costume fast. Why might searching your closet beat sewing a new one, and what would you still check?"},{"id":"ah2_q7","type":"scenarioJudgment","text":"An AI suggests a molecule that might treat an illness. What must happen before patients use it?","simple":"AI suggests a molecule for an illness. What must happen first?","options":["Testing in the lab and in trials","Selling it in pharmacies right away","Sharing the formula on social media","Nothing, because the AI is confident"],"correct":"Testing in the lab and in trials","correctAnswers":["Testing in the lab and in trials"],"pairs":[],"explanation":"AI narrows the search. Safety and effectiveness are still proven through real tests.","difficulty":"beginner","transfer":"A friend's homemade lotion 'should work'. What would you want to know before using it?"},{"id":"ah2_q8","type":"trueFalse","text":"AI can help predict the shape of proteins.","simple":"Can AI help predict protein shapes?","options":["True","False"],"correct":"True","correctAnswers":["True"],"pairs":[],"explanation":"Protein shape affects how medicines work. Predicting it faster speeds up research.","difficulty":"beginner","transfer":"Knowing a lock's shape helps you design a key. How is that like knowing a protein's shape?"},{"id":"ah2_q9","type":"explain","text":"Explain how AI speeds up drug discovery without replacing trials.","simple":"How does AI speed up drug discovery without replacing trials?","options":["It screens many candidate molecules quickly","It predicts which ones are promising","Trials still prove safety"],"correct":"Finding a medicine means checking huge numbers of possible molecules. AI can predict which ones are most promising in hours instead of years, so scientists test fewer dead ends. Clinical trials are still needed to prove a medicine is safe and works in people.","correctAnswers":["Finding a medicine means checking huge numbers of possible molecules. AI can predict which ones are most promising in hours instead of years, so scientists test fewer dead ends. Clinical trials are still needed to prove a medicine is safe and works in people."],"pairs":[],"explanation":"Strong answers include narrowing the search and keeping trials.","difficulty":"beginner","transfer":"A news story says AI 'invented' a medicine last week. What questions would you ask?"}],"cards":[{"emoji":"💊","title":"Finding a medicine","body":"Finding a new medicine means testing huge numbers of possible molecules, and most of them fail. AI can predict which ones are most worth testing, so scientists chase fewer dead ends.","funFact":null},{"emoji":"🧬","title":"Proteins and their shapes","body":"Proteins are tiny machines in the body, and a protein's 3D shape controls what it does. AI models can predict how a protein folds from its building blocks, which used to take years of lab work. Predictions are still checked by experiments.","funFact":null},{"emoji":"🕸️","title":"Molecules as graphs","body":"A molecule can be drawn as atoms joined by bonds, like dots joined by lines. A graph neural network reads that drawing directly, so it learns from the molecule's structure.","funFact":null},{"emoji":"🧪","title":"Trials prove it","body":"A clinical trial tests a medicine in people, starting with a few volunteers to check safety and then more people to see whether it works. No prediction replaces that step.","funFact":null},{"emoji":"🔁","title":"New uses for old medicines","body":"Sometimes a medicine already tested for safety might help with a different illness. AI can search research and data for such candidates, and a trial then shows whether the idea holds.","funFact":null}]},{"id":"ah_l3","title":"AI Diagnostics","description":"AI helping doctors diagnose","order":2,"difficulty":"intermediate","questions":[{"id":"ah3_q1","type":"multipleChoice","text":"A symptom checker chatbot asks about your symptoms. What can it give you?","simple":"What can a symptom checker chatbot give you?","options":["A list of possible causes to discuss","A final diagnosis you can rely on","A prescription sent to the pharmacy","A note excusing you from school"],"correct":"A list of possible causes to discuss","correctAnswers":["A list of possible causes to discuss"],"pairs":[],"explanation":"It matches your words to patterns and suggests possibilities. A diagnosis needs a professional who can examine you.","difficulty":"beginner","transfer":"A quiz says which sport suits you. Would you sign up without trying it? Why or why not?"},{"id":"ah3_q2","type":"trueFalse","text":"Diagnostic AI tools are usually treated as support for a professional, not the final word.","simple":"Are diagnostic tools support for a doctor, not the final word?","options":["True","False"],"correct":"True","correctAnswers":["True"],"pairs":[],"explanation":"In many places these tools are called decision support. A licensed professional makes the diagnosis and is responsible for it.","difficulty":"beginner","transfer":"A GPS suggests a route while a parent drives. Who is responsible for the driving, and why?"},{"id":"ah3_q3","type":"multipleChoice","text":"An eye-screening tool checks for disease. What does it look at?","simple":"What does an eye-screening tool look at?","options":["Pictures of the back of the eye","Readings from a blood pressure cuff","Answers on a written symptom form","Recordings of the person's heartbeat"],"correct":"Pictures of the back of the eye","correctAnswers":["Pictures of the back of the eye"],"pairs":[],"explanation":"The tool learns from many eye pictures checked by specialists. A flagged eye still needs a specialist's exam.","difficulty":"beginner","transfer":"A gardening app checks leaf photos for disease. Why would the photo quality matter?"},{"id":"ah3_q4","type":"fillInBlank","text":"Clinical __________ support systems help doctors weigh evidence and options.","simple":"Clinical __________ support helps doctors weigh options.","options":["decision","payment","booking","cleaning"],"correct":"decision","correctAnswers":["decision"],"pairs":[],"explanation":"A clinical decision support system combines the patient's data with medical knowledge to suggest what to consider. The doctor still weighs the suggestion and decides.","difficulty":"intermediate","transfer":"A homework planner suggests what to do first. Who still decides, and when would you ignore it?"},{"id":"ah3_q5","type":"matchPairs","text":"Match each kind of diagnostic tool to what it reads.","simple":"Match each tool kind to what it reads.","options":[],"correct":"","correctAnswers":[],"pairs":[{"term":"Image-reading tool","definition":"X-rays and other scans"},{"term":"Heart-rhythm sensor","definition":"The heart's electrical signal"},{"term":"Skin-photo checker","definition":"A photo of a mole or rash"},{"term":"Genetic test reader","definition":"Results from a DNA test"}],"explanation":"Each tool reads one kind of input and flags what looks unusual. A professional reviews the flag and decides.","difficulty":"beginner","transfer":"A weather app reads air pressure; a step counter reads motion. What does each still not know about your day?"},{"id":"ah3_q6","type":"scenarioJudgment","text":"A symptom app says you might have a heart problem. What is the best next step?","simple":"An app says maybe a heart problem. Best next step?","options":["Tell an adult and book a doctor's visit","Follow the app's advice and treat it yourself","Ignore it because apps are often wrong","Post the result online and ask for opinions"],"correct":"Tell an adult and book a doctor's visit","correctAnswers":["Tell an adult and book a doctor's visit"],"pairs":[],"explanation":"A symptom app is a screening tool, so a worrying result is a reason to be checked by a professional. Self-treating or crowd opinions skip the exam that matters.","difficulty":"advanced","transfer":"A bike app says your brakes may be worn. Who would you ask to check, and why not just keep riding?"},{"id":"ah3_q7","type":"scenarioJudgment","text":"A symptom app says your headache is probably nothing. It gets worse. What should you do?","simple":"A symptom app says not serious. It gets worse. What now?","options":["Tell an adult and see a professional","Keep trusting the app's first answer","Type it into a different symptom app","Wait it out and hope it passes"],"correct":"Tell an adult and see a professional","correctAnswers":["Tell an adult and see a professional"],"pairs":[],"explanation":"Apps give suggestions, not diagnoses. Changing symptoms need a person who can examine you.","difficulty":"beginner","transfer":"Who is a trusted adult you would tell about a health worry, and what would you say first?"},{"id":"ah3_q8","type":"trueFalse","text":"A smartwatch can use AI to notice unusual heart rhythms.","simple":"Can a smartwatch use AI to notice heart rhythm changes?","options":["True","False"],"correct":"True","correctAnswers":["True"],"pairs":[],"explanation":"Wearables track patterns and can alert people to see a doctor. They do not replace a medical check.","difficulty":"beginner","transfer":"A fitness band says you barely slept, but you feel fine. What could explain the gap?"},{"id":"ah3_q9","type":"explain","text":"Explain why a symptom checker should not give you a final diagnosis.","simple":"Why should a symptom checker not give a final diagnosis?","options":["It only sees the symptoms you typed","It cannot examine you","A professional confirms and takes responsibility"],"correct":"A symptom checker only knows the words you typed, so it cannot examine you, run tests, or notice things you did not mention. It can suggest possibilities, but a health professional who can examine you confirms the diagnosis and takes responsibility for the care.","correctAnswers":["A symptom checker only knows the words you typed, so it cannot examine you, run tests, or notice things you did not mention. It can suggest possibilities, but a health professional who can examine you confirms the diagnosis and takes responsibility for the care."],"pairs":[],"explanation":"Strong answers mention limited information and professional responsibility.","difficulty":"beginner","transfer":"A friend wants to skip the doctor because an app said 'just a cold'. What would you say?"}],"cards":[{"emoji":"📱","title":"Symptom checkers","body":"A symptom checker is an app or chatbot that asks about your symptoms and lists possible causes. It only knows what you type. It is a place to start a conversation, not a diagnosis.","funFact":null},{"emoji":"🩺","title":"What a diagnosis is","body":"A diagnosis is a health professional's conclusion about what is wrong, made after examining you and sometimes running tests. A person takes responsibility for it. AI tools that help the professional think are called decision support.","funFact":null},{"emoji":"🧰","title":"Kinds of diagnostic tools","body":"An image-reading tool reads scans. A heart-rhythm sensor reads the heart's electrical signal. A skin-photo checker rates a mole picture, an eye-screening tool looks at pictures of the back of the eye, and a genetic test reader interprets DNA results. Each one supports a professional.","funFact":null},{"emoji":"⌚","title":"Wearables","body":"Smartwatches and bands track heart rhythm, movement and sleep, and some can notice unusual patterns. An alert from a wearable is a reason to ask a doctor, not a diagnosis.","funFact":null},{"emoji":"🧑‍⚕️","title":"Getting worse? Tell a person","body":"If symptoms get worse, or an alert appears, tell a parent, nurse, pharmacist or doctor. Apps cannot examine you, and in an emergency you call for help rather than typing.","funFact":null}]},{"id":"ah_l4","title":"Patient Data Privacy","description":"Protecting health information","order":3,"difficulty":"advanced","questions":[{"id":"ah4_q1","type":"multipleChoice","text":"Why do health records get extra privacy protection?","simple":"Why is health information protected extra carefully?","options":["They can affect jobs, insurance, and relationships","They are harder to store than other files","They belong to the hospital, not the patient","They are mostly written by computers"],"correct":"They can affect jobs, insurance, and relationships","correctAnswers":["They can affect jobs, insurance, and relationships"],"pairs":[],"explanation":"Health details are personal and can be used against someone. In Canada, federal and provincial laws set rules for who can see health information and why.","difficulty":"beginner","transfer":"You keep a private diary about how you feel. Who should get to read it, and what should they ask first?"},{"id":"ah4_q2","type":"trueFalse","text":"Patients should be told before their records are shared with a company to train AI.","simple":"Should patients be told before records are shared for AI?","options":["True","False"],"correct":"True","correctAnswers":["True"],"pairs":[],"explanation":"Telling people what is collected, who sees it, and why is part of consent. Sharing quietly breaks trust even when the goal is good.","difficulty":"beginner","transfer":"A club wants to post team photos online. What should it tell members first?"},{"id":"ah4_q3","type":"fillInBlank","text":"__________ removes personal identifiers from health records before using them to train AI.","simple":"__________ removes names from records before AI training.","options":["De-identification","Encryption","Tokenization","Compression"],"correct":"De-identification","correctAnswers":["De-identification"],"pairs":[],"explanation":"De-identification removes names, addresses, health card numbers, and other details that point to a person. The medical patterns stay useful for research.","difficulty":"beginner","transfer":"You share a class survey. What details would you remove so no one can be picked out?"},{"id":"ah4_q4","type":"multipleChoice","text":"How does federated learning protect patient privacy?","simple":"How does federated learning protect patient privacy?","options":["The model learns at each hospital; only updates leave","All records are copied into one shared database","Hospitals send record summaries by email","Each hospital trains a separate model alone"],"correct":"The model learns at each hospital; only updates leave","correctAnswers":["The model learns at each hospital; only updates leave"],"pairs":[],"explanation":"Patient records stay inside each hospital. The model travels to the data and sends back what it learned, not the records themselves.","difficulty":"intermediate","transfer":"Classes share what they learned from a survey without sharing answer sheets. How is that like federated learning?"},{"id":"ah4_q5","type":"scenarioJudgment","text":"A startup copies posts from a health forum to train a chatbot without telling users. Acceptable?","simple":"A company trains on forum posts without asking. Acceptable?","options":["No, people did not agree to that use","Yes, public posts have no protection","Yes, if the posts are anonymized later","No, unless the chatbot is free to use"],"correct":"No, people did not agree to that use","correctAnswers":["No, people did not agree to that use"],"pairs":[],"explanation":"People posted to get support, not to train a product. Public does not mean free for any use, and anonymizing afterwards does not undo the missing consent.","difficulty":"intermediate","transfer":"A classmate reads your group chat aloud to the class. Why does it matter that it was 'just a chat'?"},{"id":"ah4_q6","type":"multipleChoice","text":"Why are synthetic health datasets valuable for research?","simple":"Why are synthetic health datasets useful for research?","options":["They copy real patterns without exposing real people","They are more accurate than real records","They remove the need for any real data","They can be shared with no review at all"],"correct":"They copy real patterns without exposing real people","correctAnswers":["They copy real patterns without exposing real people"],"pairs":[],"explanation":"A generator makes artificial records that follow real patterns. Developers can test ideas with less privacy risk, though the data must still be checked for leaks and mistakes.","difficulty":"advanced","transfer":"A drama class practises with made-up patient stories. What does that protect, and what might it miss?"},{"id":"ah4_q7","type":"scenarioJudgment","text":"A hospital wants to train AI on records. What should it remove first?","simple":"A hospital trains AI on records. Remove what first?","options":["Names and other personal identifiers","The diagnoses in each record","The medicines that were prescribed","Nothing, records are fine as is"],"correct":"Names and other personal identifiers","correctAnswers":["Names and other personal identifiers"],"pairs":[],"explanation":"De-identification strips details that point to a person. The medical patterns stay useful.","difficulty":"beginner","transfer":"A yearbook shows a photo, a birthday, and a street name. Could someone be identified without the name?"},{"id":"ah4_q8","type":"trueFalse","text":"Health data is more sensitive than most other personal data.","simple":"Is health data more sensitive than most data?","options":["True","False"],"correct":"True","correctAnswers":["True"],"pairs":[],"explanation":"It can affect jobs, insurance, and relationships if leaked. Laws in Canada and elsewhere give it extra protection.","difficulty":"beginner","transfer":"Why might someone not want their health history shared with an employer?"},{"id":"ah4_q9","type":"explain","text":"Explain de-identification and why it lets AI learn safely.","simple":"Explain de-identification and why it helps AI learn safely.","options":["Personal identifiers are removed","Medical patterns remain","Patients are protected from exposure"],"correct":"De-identification removes names, addresses, and other details that point to a person before records are used. The medical patterns stay, so the AI can still learn what matters, but a leak would not expose who each patient is.","correctAnswers":["De-identification removes names, addresses, and other details that point to a person before records are used. The medical patterns stay, so the AI can still learn what matters, but a leak would not expose who each patient is."],"pairs":[],"explanation":"Strong answers say what is removed and what is kept.","difficulty":"beginner","transfer":"A school wants to study attendance without naming students. How would you de-identify the list?"}],"cards":[{"emoji":"⚖️","title":"Health data is sensitive","body":"Health records can include diagnoses, medicines and mental health notes. A leak can affect jobs, insurance and relationships, so this data gets extra care.","funFact":null},{"emoji":"🤝","title":"Who can see it, and why","body":"Consent means agreeing to a use after being told about it. Before health data trains an AI, people should know what is collected, who sees it, and why. Canada has a federal privacy law, PIPEDA, and Ontario has a health privacy law, PHIPA, that set rules for this.","funFact":null},{"emoji":"🔐","title":"Hidden names, safe data","body":"De-identification removes names, addresses, health card numbers and other details that point to a person, while the medical patterns stay. Some combinations, such as a rare illness plus a small town plus a birth date, can still identify someone, so extra care is needed.","funFact":null},{"emoji":"🏥","title":"Learning without moving the data","body":"Federated learning sends the model to each hospital, where it learns, and only the model updates come back. Synthetic data means made-up records that copy real patterns without real people. Both reduce risk without removing it.","funFact":null},{"emoji":"🧑‍🤝‍🧑","title":"Ask before you share","body":"Before typing health details into an app or chatbot, ask an adult who runs it, where the information goes, and whether it can be deleted. Public does not mean free for any use.","funFact":null}]},{"id":"ah_l5","title":"Mental Health AI","description":"AI for emotional well-being","order":4,"difficulty":"intermediate","questions":[{"id":"ah5_q1","type":"multipleChoice","text":"What can a wellbeing chatbot offer?","simple":"What can a feelings chatbot give you?","options":["Coping exercises and a place to write","A diagnosis from a licensed therapist","A full replacement for talking to people","A guaranteed cure for worry"],"correct":"Coping exercises and a place to write","correctAnswers":["Coping exercises and a place to write"],"pairs":[],"explanation":"It can share coping exercises, track mood, and listen at any hour. It does not diagnose and does not replace people who care about you.","difficulty":"beginner","transfer":"A stretching app helps before practice. What would you still want a coach for?"},{"id":"ah5_q2","type":"trueFalse","text":"An app says it is 'clinically proven' to reduce anxiety. That claim can be trusted without checking.","simple":"Can a 'clinically proven' app claim be trusted unchecked?","options":["True","False"],"correct":"False","correctAnswers":["False"],"pairs":[],"explanation":"Ask who ran the study, how many people took part, what it was compared with, and who paid. A trustworthy claim links to research you can read.","difficulty":"beginner","transfer":"A shampoo ad says '9 out of 10 agree'. What would you want to know about the 10?"},{"id":"ah5_q3","type":"scenarioJudgment","text":"A user tells a wellbeing chatbot they feel unsafe. What should a well-designed bot do?","simple":"Someone tells a chatbot they feel unsafe. Bot should?","options":["Give crisis contacts and urge contacting a person","Try to handle the situation entirely by itself","End the conversation and stop responding","Tell the user to think more positively"],"correct":"Give crisis contacts and urge contacting a person","correctAnswers":["Give crisis contacts and urge contacting a person"],"pairs":[],"explanation":"A well-designed bot recognizes crisis words, shares crisis contacts, and urges reaching a person now. It is not equipped to handle the situation alone.","difficulty":"beginner","transfer":"A friend says something that worries you. Who could you tell, and why is telling an adult not 'snitching'?"},{"id":"ah5_q4","type":"fillInBlank","text":"Some tools watch sleep, activity, and __________ patterns for early signs of low mood.","simple":"Tools watch sleep, activity, and __________ patterns for mood signs.","options":["social","weather","traffic","grocery"],"correct":"social","correctAnswers":["social"],"pairs":[],"explanation":"Changes such as sleeping much more or messaging much less can be early signs. A pattern is a reason to check in, not a diagnosis, and tracking this data raises privacy questions.","difficulty":"intermediate","transfer":"A coach notices a player skipping practice and going quiet. What might the coach do?"},{"id":"ah5_q5","type":"multipleChoice","text":"What is one real advantage of a wellbeing chatbot over an appointment?","simple":"One real advantage of a wellbeing chatbot?","options":["Available at any hour, with no waiting","Understands feelings better than a trained therapist","Keeps everything you type fully private","Works for every person who tries it"],"correct":"Available at any hour, with no waiting","correctAnswers":["Available at any hour, with no waiting"],"pairs":[],"explanation":"It costs less, needs no appointment, and some people find it easier to start with. Those are real benefits, but availability is not the same as understanding.","difficulty":"intermediate","transfer":"A tutoring app answers at midnight. When is that helpful, and when do you need your teacher?"},{"id":"ah5_q6","type":"multipleChoice","text":"What limit do current wellbeing chatbots share?","simple":"What limit do wellbeing chatbots share?","options":["They produce caring words without feeling empathy","They cost more than seeing a therapist","
