.","funFact":null},{"emoji":"🎯","title":"Accuracy Isn't Everything","body":"An AI that says 'no fire' 99% of the time has high accuracy, but it misses every real fire! Multiple metrics matter.","funFact":null},{"emoji":"🎯","title":"Precision and Recall","body":"Precision asks: of the things it flagged, how many were right? Recall asks: of the real cases, how many did it find? F1 balances the two. The test set is data the model never trained on.","funFact":null}]},{"id":"hal_l6","title":"Transfer Learning","description":"Building on existing knowledge","order":5,"difficulty":"advanced","questions":[{"id":"hal6_q1","type":"scenarioJudgment","text":"A model that knows common objects is adapted to identify crop disease. Which approach is this?","simple":"A general object model is adapted to crop disease. Which approach?","options":["Transfer learning","Training from scratch","Clustering","Prompt engineering"],"correct":"Transfer learning","correctAnswers":["Transfer learning"],"pairs":[],"explanation":"Transfer learning reuses features learned on an earlier task. The model can then be fine-tuned for crop disease with less data and compute.","difficulty":"beginner","transfer":"A photo model is adapted to spot rust on bridges. Which approach?"},{"id":"hal6_q2","type":"trueFalse","text":"Transfer learning can reduce the amount of training data needed.","simple":"Can transfer learning cut how much training data you need?","options":["True","False"],"correct":"True","correctAnswers":["True"],"pairs":[],"explanation":"Since the model already learned general features, it needs less data to adapt to a new task. That's why fine-tuning pre-trained models is so popular.","difficulty":"beginner","transfer":"Why might a small clinic prefer to adapt an existing model rather than build one?"},{"id":"hal6_q3","type":"fillInBlank","text":"In transfer learning, a pre-trained model is __________ on a smaller, specific dataset.","simple":"A pre-trained model is what on a smaller dataset?","options":["fine-tuned","retrained","evaluated","normalized"],"correct":"fine-tuned","correctAnswers":["fine-tuned"],"pairs":[],"explanation":"Fine-tuning adjusts a pre-trained model using a smaller task-specific dataset. This can specialize a general model without repeating all of its original training.","difficulty":"beginner","transfer":"Explain fine-tuning using a musician who already plays piano learning organ."},{"id":"hal6_q4","type":"multipleChoice","text":"Which is a good analogy for transfer learning?","simple":"Which comparison fits transfer learning?","options":["A musician learning a new instrument faster","Starting from scratch every time","Forgetting everything you learned","Using a calculator for math"],"correct":"A musician learning a new instrument faster","correctAnswers":["A musician learning a new instrument faster"],"pairs":[],"explanation":"Just as musical skills transfer between instruments, learned features transfer between AI tasks, saving time and compute.","difficulty":"intermediate","transfer":"Give your own comparison for transfer learning from sport or games."},{"id":"hal6_q5","type":"scenarioJudgment","text":"You have 300 medical images and want a diagnosis model. Which starting point fits best?","simple":"Only 300 medical images. Best starting point?","options":["Adapt a model already trained on many images, then test carefully","Train a new model from scratch on the 300 images","Use a text chatbot to describe the images","Skip testing because the base model is trusted"],"correct":"Adapt a model already trained on many images, then test carefully","correctAnswers":["Adapt a model already trained on many images, then test carefully"],"pairs":[],"explanation":"A small dataset is rarely enough to train from scratch. Transfer learning reuses general visual knowledge, but medical use still needs careful evaluation on held-out cases.","difficulty":"intermediate","transfer":"A club has 50 photos of its mascot. How would you build a mascot detector, and what would you test?"},{"id":"hal6_q6","type":"multipleChoice","text":"Which AI approach relies heavily on transfer learning?","simple":"Which approach leans on transfer learning?","options":["Fine-tuning a pre-trained foundation model","Running K-means clustering from scratch","Writing a database query","Sorting a table alphabetically"],"correct":"Fine-tuning a pre-trained foundation model","correctAnswers":["Fine-tuning a pre-trained foundation model"],"pairs":[],"explanation":"A foundation model first learns broad patterns from a large dataset. Fine-tuning transfers that knowledge to a narrower task using a smaller, carefully chosen dataset.","difficulty":"advanced","transfer":"Why do most apps adapt a big existing model instead of training their own?"},{"id":"hal6_q7","type":"multipleChoice","text":"Knowing Spanish makes Italian easier to learn. Which AI idea is this like?","simple":"Spanish makes Italian easier. Which AI idea is this like?","options":["Transfer learning","Overfitting","Clustering","Tokenization"],"correct":"Transfer learning","correctAnswers":["Transfer learning"],"pairs":[],"explanation":"Transfer learning reuses what a model learned on one task to speed up another related task.","difficulty":"beginner","transfer":"What skill from one video game helps you learn a similar one?"},{"id":"hal6_q8","type":"trueFalse","text":"Fine-tuning usually starts with a model that has already been trained.","simple":"Does fine-tuning start with an already trained model?","options":["True","False"],"correct":"True","correctAnswers":["True"],"pairs":[],"explanation":"Fine-tuning adds specialist training on top of general knowledge. Starting from scratch would cost far more.","difficulty":"beginner","transfer":"Why is fine-tuning cheaper than training from nothing?"},{"id":"hal6_q9","type":"explain","text":"Explain why a team with few medical images might use transfer learning.","simple":"Why use transfer learning with few medical images?","options":["A pre-trained model already knows general shapes","Only a small dataset is needed to specialise it","Training from scratch would need far more data"],"correct":"A model trained on millions of everyday photos already knows edges, shapes, and textures. The team can fine-tune it with a few hundred medical images so it learns the specific patterns, instead of needing millions of scans to train from nothing.","correctAnswers":["A model trained on millions of everyday photos already knows edges, shapes, and textures. The team can fine-tune it with a few hundred medical images so it learns the specific patterns, instead of needing millions of scans to train from nothing."],"pairs":[],"explanation":"Strong answers connect the general starting point to the small dataset.","difficulty":"beginner","transfer":"Name one risk of adapting a general model to a medical task with only a few images."}],"cards":[{"emoji":"🔄","title":"Transfer Learning","body":"Instead of starting from scratch, AI can reuse knowledge from one task to help with another. Like how knowing Spanish helps you learn Italian!","funFact":null},{"emoji":"🎨","title":"Fine-Tuning","body":"Fine-tuning takes a pre-trained model and specializes it. A general language model can be fine-tuned to become a medical assistant.","funFact":null},{"emoji":"🏔️","title":"Foundation Models","body":"A foundation model is trained once on a huge general dataset. Teams then fine-tune or prompt it for their own task, which needs far less data than starting from nothing.","funFact":null}]},{"id":"hal_l7","title":"AI Without Learning: Rules, Search and Planning","description":"Some AI follows rules, searches ahead, and plans steps without learning from data","order":6,"difficulty":"beginner","questions":[{"id":"hal7_q1","type":"multipleChoice","text":"A thermostat turns on heat when the room drops below 19 degrees. What kind of AI is this?","simple":"Heat turns on below 19 degrees. What kind of system is that?","options":["A rule-based system","A neural network","Reinforcement learning","Unsupervised learning"],"correct":"A rule-based system","correctAnswers":["A rule-based system"],"pairs":[],"explanation":"A rule says if this, then that. Nothing is learned from data; a person wrote the rule.","difficulty":"beginner","transfer":"Write one if-then rule a school bell system follows."},{"id":"hal7_q2","type":"trueFalse","text":"A system must learn from data to count as AI.","simple":"Must AI learn from data?","options":["True","False"],"correct":"False","correctAnswers":["False"],"pairs":[],"explanation":"Rules, search and planning were AI long before machine learning. A chess program that looks ahead is AI without learning.","difficulty":"beginner","transfer":"Name one game where a computer opponent could work with rules alone."},{"id":"hal7_q3","type":"fillInBlank","text":"A maze solver tries paths and backs up from dead ends. This is called __________.","simple":"Trying paths and backing up from dead ends is called what?","options":["search","training","labelling","clustering"],"correct":"search","correctAnswers":["search"],"pairs":[],"explanation":"Search explores possible moves or paths until it finds one that reaches the goal. A game bot looking ahead is doing search.","difficulty":"beginner","transfer":"How would you search for the shortest route across your school between classes?"},{"id":"hal7_q4","type":"multipleChoice","text":"A helpdesk asks in order: Is it on? Is it plugged in? Is the light red? What is that?","simple":"A helpdesk asks yes or no questions in order. What is that?","options":["Asking questions in order to reach a decision","Learning from thousands of tickets","Guessing randomly","Predicting the next word"],"correct":"Asking questions in order to reach a decision","correctAnswers":["Asking questions in order to reach a decision"],"pairs":[],"explanation":"A decision tree is a branching set of questions. Each answer leads to the next question or a result.","difficulty":"beginner","transfer":"Draw a three-question decision tree for choosing what to wear."},{"id":"hal7_q5","type":"scenarioJudgment","text":"A delivery robot must reach three stops in the shortest total time. Which part of AI is this?","simple":"A robot must visit three stops fastest. Which part of AI?","options":["Planning a sequence of steps toward a goal","Clustering the stops","Labelling the stops","Generating text about the stops"],"correct":"Planning a sequence of steps toward a goal","correctAnswers":["Planning a sequence of steps toward a goal"],"pairs":[],"explanation":"Planning picks an order of actions that reaches the goal well. It uses search over possible orders, not learning from examples.","difficulty":"beginner","transfer":"Plan the order for three chores so you finish soonest. What did you compare?"},{"id":"hal7_q6","type":"scenarioJudgment","text":"A bank must apply its exact loan rules every time and explain each decision. Rules or learning?","simple":"Exact rules, every time, with explanations. Rules or learning?","options":["Rules, because the steps are known and must be predictable","Learning, because it is newer","Learning, because rules cannot be written down","Neither, since banks do not use computers"],"correct":"Rules, because the steps are known and must be predictable","correctAnswers":["Rules, because the steps are known and must be predictable"],"pairs":[],"explanation":"When the rules are clear and predictability matters, rule-based systems are easier to check and explain. Learning shines on messy inputs like photos or speech.","difficulty":"intermediate","transfer":"Would you use rules or learning to grade multiple-choice tests? To grade drawings?"},{"id":"hal7_q7","type":"matchPairs","text":"Match each task to the approach that fits it best:","simple":"Match each task to rules or learning.","options":[],"correct":"","correctAnswers":[],"pairs":[{"term":"Recognising faces in photos","definition":"Learning from examples"},{"term":"Calculating tax from a price","definition":"A written rule"},{"term":"Finding the shortest route on a map","definition":"Search"},{"term":"Ordering steps to assemble furniture","definition":"Planning"}],"explanation":"Messy inputs suit learning. Exact calculations suit rules. Routes suit search, and ordered steps suit planning.","difficulty":"intermediate","transfer":"Add one more task from your day to each of the four approaches."},{"id":"hal7_q8","type":"trueFalse","text":"A chess program that looks several moves ahead is searching, not learning.","simple":"Looking moves ahead in chess is search, not learning?","options":["True","False"],"correct":"True","correctAnswers":["True"],"pairs":[],"explanation":"Classic chess programs search possible moves and score positions with rules. Some modern ones add learning, but search alone is still AI.","difficulty":"beginner","transfer":"In tic-tac-toe, how many moves ahead would a program need to look to never lose?"},{"id":"hal7_q9","type":"explain","text":"Explain when a rule-based system beats a learning system, and when learning is the better choice.","simple":"When do rules beat learning, and when does learning win?","options":["Rules when the steps are clear and must be predictable","Learning when inputs are messy like photos or speech","Rules are easier to check and explain"],"correct":"Rules are better when the steps are already known and the answer must be the same every time, like calculating a price, because you can read and check the rule. Learning is better when nobody can write the rule down, like recognising a voice or a face, because the system finds the pattern from examples.","correctAnswers":["Rules are better when the steps are already known and the answer must be the same every time, like calculating a price, because you can read and check the rule. Learning is better when nobody can write the rule down, like recognising a voice or a face, because the system finds the pattern from examples."],"pairs":[],"explanation":"Strong answers give one example of each and mention predictability or explainability.","difficulty":"beginner","transfer":"Pick one app on your phone and say which parts probably use rules and which use learning."}],"cards":[{"emoji":"📏","title":"If This, Then That","body":"A rule-based system follows instructions a person wrote: if the room is cold, turn on the heat. It does not learn, so you can read exactly what it will do.","funFact":null},{"emoji":"🧩","title":"Search","body":"Search tries possible moves or paths until one reaches the goal. A maze solver and a chess program that looks ahead are both searching.","funFact":null},{"emoji":"🗺️","title":"Planning and Decision Trees","body":"Planning picks an order of steps toward a goal. A decision tree asks questions one after another, and each answer leads to the next question or a result.","funFact":null},{"emoji":"⚖️","title":"Rules or Learning?","body":"Use rules when the steps are clear and must be predictable. Use learning when the input is messy, like photos or speech, and nobody can write the rule down.","funFact":null}]},{"id":"hal_l8","title":"Where Training Data Comes From","description":"Web scraping, users, labelers, sensors and synthetic data, and why the source matters","order":7,"difficulty":"beginner","questions":[{"id":"hal8_q1","type":"multipleChoice","text":"Collecting text and images from many public websites to build a dataset is called what?","simple":"Gathering text and pictures from websites for a dataset is called?","options":["Web scraping","Fine-tuning","Inference","Clustering"],"correct":"Web scraping","correctAnswers":["Web scraping"],"pairs":[],"explanation":"Scraping copies content from websites at scale. It gathers a lot quickly, and it raises questions about permission and quality.","difficulty":"beginner","transfer":"If your drawings were posted online, how would you feel about them being scraped for training?"},{"id":"hal8_q2","type":"trueFalse","text":"Everything in a large web dataset has been checked for accuracy.","simple":"Is everything in a big web dataset checked?","options":["True","False"],"correct":"False","correctAnswers":["False"],"pairs":[],"explanation":"Web data is far too large to check by hand. Mistakes, jokes and false claims come along with the useful text.","difficulty":"beginner","transfer":"Name one kind of website whose text you would not want a helper to learn from."},{"id":"hal8_q3","type":"matchPairs","text":"Match each data source to a question worth asking about it:","simple":"Match each data source to a good question about it.","options":[],"correct":"","correctAnswers":[],"pairs":[{"term":"Scraped websites","definition":"Did the authors agree to this use?"},{"term":"App users","definition":"Did people consent in the settings?"},{"term":"Paid labelers","definition":"Are the workers treated and paid fairly?"},{"term":"Synthetic data","definition":"Does it copy the flaws of the model that made it?"}],"explanation":"Each source has its own quality and fairness questions. Good dataset documentation answers them.","difficulty":"intermediate","transfer":"Which of these four questions would you ask first about a homework helper, and why?"},{"id":"hal8_q4","type":"fillInBlank","text":"People paid to write example answers or check labels are called data __________.","simple":"People paid to write or check examples are data what?","options":["labelers","tokens","clusters","agents"],"correct":"labelers","correctAnswers":["labelers"],"pairs":[],"explanation":"Labelers and annotators make training data usable. Their pay, working conditions and instructions shape what the model learns.","difficulty":"beginner","transfer":"What instructions would you give labelers marking photos as 'safe for kids' so they agree with each other?"},{"id":"hal8_q5","type":"scenarioJudgment","text":"A voice helper was trained mostly on adult speakers from one region. Who is likely missing?","simple":"Trained on adults from one region. Who is missing?","options":["Children and people with other accents","Nobody, adults cover everyone","Only people who never speak","Only the developers"],"correct":"Children and people with other accents","correctAnswers":["Children and people with other accents"],"pairs":[],"explanation":"A dataset reflects who was recorded. Asking 'who is missing' predicts who the system will serve badly.","difficulty":"beginner","transfer":"Your class trains a helper on your own voices. Who would it probably misunderstand?"},{"id":"hal8_q6","type":"multipleChoice","text":"Data made by a program, such as generated sentences, is called what?","simple":"Data a program makes up is called what?","options":["Synthetic data","Scraped data","Sensor data","Labelled data"],"correct":"Synthetic data","correctAnswers":["Synthetic data"],"pairs":[],"explanation":"Synthetic data can fill gaps and protect privacy, but it can also repeat the mistakes of whatever generated it.","difficulty":"beginner","transfer":"When might made-up practice examples help a spelling helper, and when might they mislead it?"},{"id":"hal8_q7","type":"scenarioJudgment","text":"An app's settings say 'help improve our models' and it is switched on. What does that likely mean?","simple":"A setting says 'help improve our models'. What does it mean?","options":["Your activity may be used for training unless you turn it off","The app will run faster","Nothing changes either way","The app deletes your data"],"correct":"Your activity may be used for training unless you turn it off","correctAnswers":["Your activity may be used for training unless you turn it off"],"pairs":[],"explanation":"Many apps collect user data for training by default. Reading the setting, and asking an adult when unsure, is part of consent.","difficulty":"intermediate","transfer":"Find one setting like this on a family device and describe what it says."},{"id":"hal8_q8","type":"trueFalse","text":"Good dataset documentation says where the data came from and who is missing from it.","simple":"Should a dataset say where it came from and who is missing?","options":["True","False"],"correct":"True","correctAnswers":["True"],"pairs":[],"explanation":"Documentation lets others judge a model before trusting it. Source, consent and gaps are the first things to write down.","difficulty":"beginner","transfer":"Write two lines of documentation for a dataset of your class's favourite songs."},{"id":"hal8_q9","type":"explain","text":"Explain two places training data can come from and one problem each source can bring.","simple":"Name two data sources and one problem with each.","options":["Names two sources such as the web, users, labelers, sensors, or synthetic","Gives a real problem for each, such as consent, quality, or fairness","Connects the source to how the model behaves"],"correct":"Data can be scraped from websites, which is fast but may include mistakes and content the authors never agreed to share. It can also come from app users, which is realistic but needs real consent and can leave out people who do not use the app. Where the data comes from shapes who the model works well for.","correctAnswers":["Data can be scraped from websites, which is fast but may include mistakes and content the authors never agreed to share. It can also come from app users, which is realistic but needs real consent and can leave out people who do not use the app. Where the data comes from shapes who the model works well for."],"pairs":[],"explanation":"Strong answers name two sources and connect each problem to how the model will behave.","difficulty":"beginner","transfer":"Which data source would you choose for a helper that suggests books to kids, and what would you check?"}],"cards":[{"emoji":"🌐","title":"Five Sources","body":"Training data comes from the web, from users, from paid labelers, from sensors, or it is generated by a program. Each source has its own quality and fairness problems.","funFact":null},{"emoji":"✅","title":"Consent","body":"Using someone's words, photos or voice for training needs permission. Settings that say 'help improve our models' are one place that permission is asked, or assumed.","funFact":null},{"emoji":"🧑‍🏭","title":"The People Behind the Data","body":"Labelers write examples and check answers, often for low pay. Their instructions and working conditions shape what a model learns.","funFact":null},{"emoji":"📋","title":"Who Is Missing?","body":"A dataset reflects who was recorded. Good documentation says where the data came from and who is missing, so you can predict who the model will serve badly.","funFact":null}]}],"bigIdeas":["learning"]},{"id":"generative_ai","name":"AI That Creates","icon":"sparkles","color":"aiPink","description":"AI that writes, draws, and creates. How does it do it?","order":5,"unlock":{"kind":"completeTier1","value":null},"lessons":[{"id":"ga_l1","title":"What is Generative AI?","description":"AI that creates new content","order":0,"difficulty":"beginner","questions":[{"id":"ga1_q1","type":"multipleChoice","text":"A prompt goes in and a brand new picture comes out. Which kind of AI is this?","simple":"Words go in, a new picture comes out. Which kind of AI?","options":["Generative AI","Discriminative AI","A recommendation system","A rule-based system"],"correct":"Generative AI","correctAnswers":["Generative AI"],"pairs":[],"explanation":"Generative AI creates new content such as text, images, audio, or code. It learned patterns from many examples and uses them to produce something new.","difficulty":"beginner","transfer":"A tool writes a new song from a short description. Which kind of AI is that?"},{"id":"ga1_q2","type":"trueFalse","text":"A music generator that composes a new tune from a description is generative AI.","simple":"Is a tool that composes new tunes generative AI?","options":["True","False"],"correct":"True","correctAnswers":["True"],"pairs":[],"explanation":"It creates new audio from patterns learned in many songs. Text, image, music, and code generators all belong to the same family.","difficulty":"beginner","transfer":"An app suggests a new drum beat for your band. Is it generating or recognising?"},{"id":"ga1_q3","type":"fillInBlank","text":"A __________ is AI that creates new content like text, images, or code.","simple":"AI that creates new text or pictures is a __________.","options":["generative model","discriminative model","classification model","retrieval system"],"correct":"generative model","correctAnswers":["generative model"],"pairs":[],"explanation":"Generative models learn patterns from training data and use them to produce new, similar content. Chatbots, image generators, and code assistants all rely on them.","difficulty":"beginner","transfer":"Your class makes a comic with an image generator. What did the model learn from to draw it?"},{"id":"ga1_q4","type":"multipleChoice","text":"A model decides whether a photo contains a stop sign. Which kind of model is it?","simple":"A model checks if a photo has a stop sign. Which kind?","options":["Discriminative model","Generative model","Large language model","Recommendation system"],"correct":"Discriminative model","correctAnswers":["Discriminative model"],"pairs":[],"explanation":"A discriminative model sorts inputs into categories. A generative model instead creates a new sample such as an image or a paragraph.","difficulty":"intermediate","transfer":"A music app labels songs as happy or sad. Is that recognising or generating?"},{"id":"ga1_q5","type":"matchPairs","text":"Match each kind of generative tool to what it produces:","simple":"Match each tool kind to what it makes.","options":[],"correct":"","correctAnswers":[],"pairs":[{"term":"Text generator","definition":"New paragraphs, stories, or answers"},{"term":"Image generator","definition":"A new picture or drawing"},{"term":"Music generator","definition":"A new tune or song"},{"term":"Code assistant","definition":"Working program code"}],"explanation":"Each tool takes a description as input and produces a different kind of output. The pattern is the same: learned patterns in, new content out.","difficulty":"beginner","transfer":"You need a sound effect for a school play. Which tool kind fits, and what would you type?"},{"id":"ga1_q6","type":"scenarioJudgment","text":"A student wants AI help without handing in AI work. Which workflow is strongest?","simple":"How can AI help while the work stays yours?","options":["Draft with AI, say so, revise it yourself","Hand in the first generated draft unchanged","Use the tool and keep it to yourself","Skip checking the facts and sources it used"],"correct":"Draft with AI, say so, revise it yourself","correctAnswers":["Draft with AI, say so, revise it yourself"],"pairs":[],"explanation":"Responsible help keeps you in control. Saying how AI helped, checking sources, and revising in your own words protect both learning and trust.","difficulty":"advanced","transfer":"You used AI to brainstorm a science fair idea. What would you tell your teacher?"},{"id":"ga1_q7","type":"scenarioJudgment","text":"An app writes a new bedtime story from a short description. Which kind of AI is this?","simple":"An app generates a new story. What kind of AI?","options":["Generative AI","A spam filter","A face unlock","A spell checker"],"correct":"Generative AI","correctAnswers":["Generative AI"],"pairs":[],"explanation":"Generative AI creates new content such as text, images, or music from a prompt.","difficulty":"beginner","transfer":"Name one thing at school you could ask a generative tool to create."},{"id":"ga1_q8","type":"trueFalse","text":"Generative AI copies one stored file and shows it to you.","simple":"Does generative AI just copy one stored file?","options":["True","False"],"correct":"False","correctAnswers":["False"],"pairs":[],"explanation":"It creates new output from patterns it learned during training. The result is new, though it can resemble training data.","difficulty":"beginner","transfer":"Why does a generated picture sometimes look a bit like a famous painting?"},{"id":"ga1_q9","type":"explain","text":"Explain the difference between AI that recognises and AI that generates.","simple":"Explain AI that recognises versus AI that generates.","options":["Recognising AI sorts or labels input","Generating AI creates new content","Both learned patterns from data"],"correct":"Recognising AI looks at something and decides what it is, like labelling a photo as a cat. Generating AI makes something new, like drawing a cat that never existed. Both learned patterns from examples, but one classifies and the other creates.","correctAnswers":["Recognising AI looks at something and decides what it is, like labelling a photo as a cat. Generating AI makes something new, like drawing a cat that never existed. Both learned patterns from examples, but one classifies and the other creates."],"pairs":[],"explanation":"Strong answers give an example of each and note that both learn from data.","difficulty":"beginner","transfer":"Look at three apps you use. Which one recognises and which one generates?"}],"cards":[{"emoji":"✨","title":"AI That Creates","body":"Generative AI makes new content: text, images, music, or code. It learned patterns from many existing examples and uses them to produce something that did not exist before.","funFact":null},{"emoji":"🧰","title":"Kinds of Creative Tools","body":"A text generator turns a description into writing. An image generator turns one into a picture, a music generator into a tune, and a code assistant into program code. Different outputs, same idea.","funFact":null},{"emoji":"🔍","title":"Recognise or Generate","body":"A discriminative model looks at an input and sorts or labels it, like deciding whether a photo shows a cat. A generative model creates a new sample instead.","funFact":null},{"emoji":"📝","title":"The Prompt","body":"The words you give a generative tool are called the prompt. A clear prompt says what you want, and the tool uses it to shape the output.","funFact":null}]},{"id":"ga_l2","title":"Large Language Models","description":"The brains behind AI chatbots","order":1,"difficulty":"intermediate","questions":[{"id":"ga2_q1","type":"multipleChoice","text":"A chatbot writes paragraphs by predicting text tokens. What kind of model powers it?","simple":"A chatbot writes by predicting tokens. What model is it?","options":["Large language model","Computer vision model","Recommendation system","Speech recognition model"],"correct":"Large language model","correctAnswers":["Large language model"],"pairs":[],"explanation":"A large language model, or LLM, learns language patterns from big text collections. It generates a response one token at a time.","difficulty":"beginner","transfer":"An app finishes your sentences as you type. What kind of model likely powers it?"},{"id":"ga2_q2","type":"multipleChoice","text":"An LLM chooses the next small piece of text. What is that piece called?","simple":"What is the small piece of text a model predicts called?","options":["Token","Label","Reward","Pixel"],"correct":"Token","correctAnswers":["Token"],"pairs":[],"explanation":"A token can be a word, part of a word, punctuation, or code. Language models read and write sequences of tokens.","difficulty":"beginner","transfer":"Type a long word into a chat tool. Why might it count as more than one token?"},{"id":"ga2_q3","type":"multipleChoice","text":"An LLM first learns broad language patterns from huge text collections. Which stage is this?","simple":"The model first learns language from lots of text. Which stage?","options":["Pre-training","Inference","Retrieval","Evaluation"],"correct":"Pre-training","correctAnswers":["Pre-training"],"pairs":[],"explanation":"Pre-training builds broad language ability before the model is specialised or used. It adjusts the model's parameters across many examples.","difficulty":"beginner","transfer":"Learning to ride a bike before racing one. Which part is like pre-training?"},{"id":"ga2_q4","type":"scenarioJudgment","text":"A long article will not fit into an LLM request. Which limit did it reach?","simple":"A long article does not fit in one request. Which limit?","options":["Context window","Learning rate","Model latency","Reward function"],"correct":"Context window","correctAnswers":["Context window"],"pairs":[],"explanation":"The context window is the amount of text the model can consider in one request. Retrieval can select the most relevant parts of a long document.","difficulty":"intermediate","transfer":"You want a chatbot to summarise a whole novel. What might you do first?"},{"id":"ga2_q5","type":"matchPairs","text":"Match each LLM term to its job:","simple":"Match each language model word to its job.","options":[],"correct":"","correctAnswers":[],"pairs":[{"term":"Token","definition":"A small unit of text"},{"term":"Parameter","definition":"A learned number inside the model"},{"term":"Context window","definition":"Text available for the current request"},{"term":"Inference","definition":"Using the trained model to generate output"}],"explanation":"Parameters are learned during training. At inference time, the model processes tokens inside its context window to generate an output.","difficulty":"beginner","transfer":"Explain the word token to a younger sibling using the pieces of a jigsaw puzzle."},{"id":"ga2_q6","type":"scenarioJudgment","text":"An LLM must answer from current school rules without changing its weights. Which method fits?","simple":"A model must use the newest school rules without retraining. Which method?","options":["RAG","Pre-training","Image classification","Reinforcement learning"],"correct":"RAG","correctAnswers":["RAG"],"pairs":[],"explanation":"RAG retrieves relevant source text and gives it to the LLM at inference time. The model can use current evidence without being retrained.","difficulty":"advanced","transfer":"A library helper needs today's opening hours. How would retrieval help it answer?"},{"id":"ga2_q7","type":"trueFalse","text":"A large language model writes by predicting the next likely token.","simple":"Does a language model write by predicting the next token?","options":["True","False"],"correct":"True","correctAnswers":["True"],"pairs":[],"explanation":"It builds text one token at a time, choosing a likely next piece based on what came before.","difficulty":"beginner","transfer":"Why might predicting likely text produce a confident but wrong date?"},{"id":"ga2_q8","type":"scenarioJudgment","text":"A chatbot does not know about a rule added to the school handbook last week. Why?","simple":"A chatbot misses last week's new rule. Why?","options":["Its training ended before the change","It refuses to read handbooks","Rules are not stored as text","It only answers old questions"],"correct":"Its training ended before the change","correctAnswers":["Its training ended before the change"],"pairs":[],"explanation":"Models know what was in their training data. New facts must be provided in the prompt or retrieved.","difficulty":"beginner","transfer":"How could the school app give the model the newest rules?"},{"id":"ga2_q9","type":"explain","text":"Explain what a context window is and why it matters.","simple":"What is a context window, and why does it matter?","options":["The text the model can see at once","Anything outside it is invisible to the model","Longer documents may not fit"],"correct":"The context window is the amount of text the model can consider at one time, including your prompt and any documents. Anything outside it might as well not exist for the model, so a very long article may need to be shortened or split.","correctAnswers":["The context window is the amount of text the model can consider at one time, including your prompt and any documents. Anything outside it might as well not exist for the model, so a very long article may need to be shortened or split."],"pairs":[],"explanation":"Strong answers define the limit and give a consequence.","difficulty":"beginner","transfer":"A friend pastes a long game rulebook into a chatbot. What could go wrong?"}],"cards":[{"emoji":"💬","title":"Large Language Models","body":"An LLM predicts likely text one token at a time. A token can be a word, part of a word, punctuation, or code.","funFact":null},{"emoji":"🔢","title":"Training and Inference","body":"Pre-training adjusts learned numbers called parameters. Inference uses the trained model to answer a new request.","funFact":null},{"emoji":"📚","title":"Context and RAG","body":"The context window holds what the model can see right now. RAG retrieves useful sources and places them in that context.","funFact":null},{"emoji":"🗓️","title":"Training Cutoff","body":"A model knows what was in its training data, up to a cutoff date. Newer facts have to be given in the prompt or retrieved from a source.","funFact":null}]},{"id":"ga_l3","title":"Transformers Architecture","description":"The technology behind modern AI","order":2,"difficulty":"advanced","questions":[{"id":"ga3_q1","type":"multipleChoice","text":"A model weighs how each word relates to every other word. Which design is this?","simple":"A model links every word to every other word. Which design?","options":["Transformer","Decision tree","Lookup table","Rule-based parser"],"correct":"Transformer","correctAnswers":["Transformer"],"pairs":[],"explanation":"The transformer uses attention to relate every token to every other token. It was introduced in a 2017 research paper and underlies most large language models.","difficulty":"beginner","transfer":"A translator app keeps the meaning of a long sentence. Which design likely helps?"},{"id":"ga3_q2","type":"trueFalse","text":"The attention mechanism helps a model focus on relevant parts of the input.","simple":"Does attention help a model focus on important words?","options":["True","False"],"correct":"True","correctAnswers":["True"],"pairs":[],"explanation":"Attention lets the model weigh how much each part of the input matters for the token it is processing. That captures links between words that are far apart.","difficulty":"beginner","transfer":"In the sentence 'the fish swam in the tank', which words connect to tank?"},{"id":"ga3_q3","type":"fillInBlank","text":"The __________ mechanism is the key innovation in transformers.","simple":"The __________ mechanism lets transformers focus on key words.","options":["attention","deletion","compression","copying"],"correct":"attention","correctAnswers":["attention"],"pairs":[],"explanation":"Attention lets the model focus on the most relevant parts of the input. Several attention heads can track different relationships at once.","difficulty":"beginner","transfer":"When you reread a tricky sentence, which words do you focus on? That is attention."},{"id":"ga3_q4","type":"multipleChoice","text":"Why can transformers train faster than older language models?","simple":"Why do transformers train faster than older models?","options":["They handle a whole sequence at once","They need far less training data overall","They rely on much simpler maths","They read each word one at a time"],"correct":"They handle a whole sequence at once","correctAnswers":["They handle a whole sequence at once"],"pairs":[],"explanation":"Older models read one word after another. Transformers process every token in parallel, which speeds up training and scales to very large models.","difficulty":"intermediate","transfer":"Reading a whole page at once versus word by word. Which finds a name faster?"},{"id":"ga3_q5","type":"multipleChoice","text":"What does tokenization do in a language model?","simple":"What does tokenization do?","options":["Breaks text into smaller pieces","Converts pictures into numbers","Assigns security permissions","Groups words by their meaning"],"correct":"Breaks text into smaller pieces","correctAnswers":["Breaks text into smaller pieces"],"pairs":[],"explanation":"Tokenization splits text into tokens the model can process: words, parts of words, or characters. Different models split text differently.","difficulty":"intermediate","transfer":"Split the word unbelievable into pieces. Which pieces might a tokenizer choose?"},{"id":"ga3_q6","type":"sortOrder","text":"Order these language AI approaches from earliest to latest:","simple":"Put these language AI approaches in order, oldest first.","options":["Large language models","Hand-written rules","Transformer architecture","Recurrent networks (one word at a time)"],"correct":"","correctAnswers":["Hand-written rules","Recurrent networks (one word at a time)","Transformer architecture","Large language models"],"pairs":[],"explanation":"Early systems followed hand-written rules. Recurrent networks learned from text one word at a time, transformers read whole sequences, and today's large language models build on transformers.","difficulty":"advanced","transfer":"A 2005 tool fixed grammar with fixed rules. Where does it sit on this timeline?"},{"id":"ga3_q7","type":"scenarioJudgment","text":"In 'we sat by the bank of the river', what helps a model decide what bank means?","simple":"What helps a model decide what 'bank' means in a sentence?","options":["Attention to nearby words like river","The length of the sentence","The font size","Random choice"],"correct":"Attention to nearby words like river","correctAnswers":["Attention to nearby words like river"],"pairs":[],"explanation":"Attention lets the model weigh related words. Seeing river makes the water meaning more likely.","difficulty":"beginner","transfer":"Which word would you attend to in 'the bat flew out of the cave'?"},{"id":"ga3_q8","type":"trueFalse","text":"Transformers can look at all the words in a sentence at the same time.","simple":"Can transformers look at all words at once?","options":["True","False"],"correct":"True","correctAnswers":["True"],"pairs":[],"explanation":"Older models read one word after another. Transformers process the whole sequence in parallel, which speeds up training.","difficulty":"beginner","transfer":"Why does reading everything at once help with long sentences?"},{"id":"ga3_q9","type":"explain","text":"Explain attention as a spotlight, in your own words.","simple":"Explain attention as a spotlight.","options":["Attention focuses on the most relevant words","Different words get different weight","This helps with meaning and long sentences"],"correct":"Attention is like a spotlight the model moves across the input. For each word it is working on, it shines more light on the words that matter most and less on the rest. That helps it understand which words connect, even when they are far apart.","correctAnswers":["Attention is like a spotlight the model moves across the input. For each word it is working on, it shines more light on the words that matter most and less on the rest. That helps it understand which words connect, even when they are far apart."],"pairs":[],"explanation":"Strong answers mention relevance and unequal weighting.","difficulty":"beginner","transfer":"A coach watches the player with the ball most closely. How is that like attention?"}],"cards":[{"emoji":"🔦","title":"The Attention Trick","body":"Transformers use attention to focus on the words that matter most for each word they process. The idea came from a 2017 research paper titled 'Attention Is All You Need'.","funFact":null},{"emoji":"🧩","title":"Tokens: Word Pieces","body":"Before processing text, a model breaks it into small pieces called tokens. Tokenization can split one long word into several tokens.","funFact":null},{"emoji":"⏳","title":"Before Transformers","body":"Early language programs followed hand-written rules. Later, recurrent networks learned from text but read one word at a time. Transformers read the whole sequence at once, which makes training faster.","funFact":null}]},{"id":"ga_l4","title":"AI Hallucinations","description":"When AI makes things up","order":3,"difficulty":"intermediate","questions":[{"id":"ga4_q1","type":"multipleChoice","text":"A chatbot states a false fact in a confident, fluent way. What is this called?","simple":"A chatbot confidently states something false. What is this called?","options":["A hallucination","A tokenization error","A context window","A retrieval step"],"correct":"A hallucination","correctAnswers":["A hallucination"],"pairs":[],"explanation":"A hallucination is invented output that sounds plausible but is wrong. Any language model can produce one.","difficulty":"beginner","transfer":"An AI cites a study you cannot find anywhere. What might be happening?"},{"id":"ga4_q2","type":"trueFalse","text":"Hallucinations are a solved problem in modern language models.","simple":"Are hallucinations a solved problem?","options":["True","False"],"correct":"False","correctAnswers":["False"],"pairs":[],"explanation":"Newer methods reduce hallucinations but do not remove them. Checking important claims still matters.","difficulty":"beginner","transfer":"A new app claims it makes no mistakes. What would you want to test?"},{"id":"ga4_q3","type":"scenarioJudgment","text":"A lawyer cites AI-generated court cases without checking. They are fake. Who is responsible?","simple":"A lawyer files fake AI-made cases without checking. Who is responsible?","options":["The lawyer who filed without checking","The chatbot that generated the text","The judge who read the filing","The client who hired the lawyer"],"correct":"The lawyer who filed without checking","correctAnswers":["The lawyer who filed without checking"],"pairs":[],"explanation":"People remain responsible for work they submit. Cases like this have happened, and courts penalised the lawyer, not the tool.","difficulty":"beginner","transfer":"You hand in a project with AI-made facts. Who is responsible for the mistakes?"},{"id":"ga4_q4","type":"fillInBlank","text":"You should __________ important AI-generated information before relying on it.","simple":"You should __________ important AI facts before trusting them.","options":["verify","ignore","delete","share"],"correct":"verify","correctAnswers":["verify"],"pairs":[],"explanation":"Check AI claims against a trusted source, especially for decisions that matter. The habit works the same with any tool.","difficulty":"intermediate","transfer":"A chatbot gives a medicine dose for your pet. What do you do before acting on it?"},{"id":"ga4_q5","type":"multipleChoice","text":"Why do language models hallucinate?","simple":"Why do language models make things up?","options":["They predict likely text, not checked facts","Their training data contains nothing but errors","They run out of computing power","Their memory fills up while they write"],"correct":"They predict likely text, not checked facts","correctAnswers":["They predict likely text, not checked facts"],"pairs":[],"explanation":"Models generate statistically likely text. They have no built-in truth check, so a likely sounding sentence can be false.","difficulty":"intermediate","transfer":"Why might a model invent a plausible birthday for a little-known author?"},{"id":"ga4_q6","type":"multipleChoice","text":"What is the strongest defence against hallucinations?","simple":"What best protects you from hallucinations?","options":["Cross-check with reliable sources","Ask the model if it is sure","Assume the model is correct","Switch to an older model"],"correct":"Cross-check with reliable sources","correctAnswers":["Cross-check with reliable sources"],"pairs":[],"explanation":"Verify outputs against trusted sources. Systems can also retrieve real documents (RAG) to ground answers, but a person still checks what matters.","difficulty":"advanced","transfer":"A chatbot summarises a news story. Which two sources would you compare it with?"},{"id":"ga4_q7","type":"scenarioJudgment","text":"An AI names a book that does not exist and gives a page number. What happened?","simple":"An AI names a book that does not exist. What happened?","options":["It hallucinated a source","It read the book","It found a rare edition","It made a typo"],"correct":"It hallucinated a source","correctAnswers":["It hallucinated a source"],"pairs":[],"explanation":"Models can produce realistic looking titles and citations that are invented. Look them up before using them.","difficulty":"beginner","transfer":"How would you check whether a cited article is real?"},{"id":"ga4_q8","type":"trueFalse","text":"A confident tone means the AI's answer is correct.","simple":"Does a confident tone mean the answer is right?","options":["True","False"],"correct":"False","correctAnswers":["False"],"pairs":[],"explanation":"Models sound the same whether they are right or wrong. Tone is not evidence.","difficulty":"beginner","transfer":"What kind of claim would you double-check no matter how sure it sounds?"},{"id":"ga4_q9","type":"explain","text":"Explain why a language model can hallucinate, and one habit that protects you.","simple":"Why can a model hallucinate? Name one habit that protects you.","options":["It predicts likely text, not checked facts","Likely text can be false","Verify important claims with trusted sources"],"correct":"A language model chooses words that are likely to follow, not words it has checked against the truth. Likely sounding text can be false, so the habit that protects you is verifying important claims with a trusted source before using them.","correctAnswers":["A language model chooses words that are likely to follow, not words it has checked against the truth. Likely sounding text can be false, so the habit that protects you is verifying important claims with a trusted source before using them."],"pairs":[],"explanation":"Strong answers connect prediction to falsehood and name verification.","difficulty":"beginner","transfer":"A friend trusts a chatbot's sports statistics. What habit would you suggest, and why?"}],"cards":[{"emoji":"🎭","title":"What a Hallucination Is","body":"A hallucination is when a model produces text that sounds right but is made up. It can invent facts, dates, quotes, and even book titles.","funFact":null},{"emoji":"🎲","title":"Why It Happens","body":"A language model predicts likely words, not checked facts. Likely text can still be false, and the model has no built-in truth check.","funFact":null},{"emoji":"🔎","title":"Verify What Matters","body":"Before relying on an AI answer, check it with a trusted source. Tone is not evidence; a wrong answer can sound as confident as a right one.","funFact":null}]},{"id":"ga_l5","title":"Image Generation AI","description":"Creating pictures with words","order":4,"difficulty":"intermediate","questions":[{"id":"ga5_q1","type":"multipleChoice","text":"What does an image generator take as its main input?","simple":"What does an image generator take as input?","options":["A written description (prompt)","A finished image database","A set of ready templates","Pixels typed one by one"],"correct":"A written description (prompt)","correctAnswers":["A written description (prompt)"],"pairs":[],"explanation":"Text-to-image tools turn a written prompt into a new picture. The clearer the description, the closer the result.","difficulty":"beginner","transfer":"What would you type to get a picture of a snowy cabin at night?"},{"id":"ga5_q2","type":"trueFalse","text":"Diffusion models work by gradually removing noise from a random image.","simple":"Do diffusion models slowly remove noise from static?","options":["True","False"],"correct":"True","correctAnswers":["True"],"pairs":[],"explanation":"They start with random static and clean it up in steps, steering toward your prompt.","difficulty":"beginner","transfer":"Slowly tuning a fuzzy radio into a clear song. How is that like diffusion?"},{"id":"ga5_q3","type":"matchPairs","text":"Match each image-generation word to its meaning:","simple":"Match each picture-making word to its meaning.","options":[],"correct":"","correctAnswers":[],"pairs":[{"term":"Prompt","definition":"The words describing the picture you want"},{"term":"Noise","definition":"The random static the process starts from"},{"term":"Diffusion","definition":"Removing noise step by step to form an image"},{"term":"Sample","definition":"One finished picture the model produced"}],"explanation":"A prompt guides the process, noise is the starting point, diffusion is the cleanup, and each output is one sample. Run it again and you get a different sample.","difficulty":"beginner","transfer":"You generate three versions of a poster. Which of these words describes each version?"},{"id":"ga5_q4","type":"fillInBlank","text":"__________ models create images by learning to remove noise step by step.","simple":"__________ models make pictures by removing noise in steps.","options":["Diffusion","Transformer","Adversarial","Classification"],"correct":"Diffusion","correctAnswers":["Diffusion"],"pairs":[],"explanation":"Diffusion models reverse a noise-adding process, gradually shaping random noise into a clear image guided by the prompt.","difficulty":"intermediate","transfer":"A friend asks how the app drew their dog. Explain it in one sentence using the word noise."},{"id":"ga5_q5","type":"scenarioJudgment","text":"An artist finds their pictures were used to train an image generator without asking. Which issue is this?","simple":"An artist's pictures trained a generator without asking. Which issue?","options":["Consent for training data","Hallucination in the output","The size of the context window","The wording of the prompt"],"correct":"Consent for training data","correctAnswers":["Consent for training data"],"pairs":[],"explanation":"Training on creative work without permission raises consent and copyright questions. Courts and licensing rules are still working through them.","difficulty":"intermediate","transfer":"Your band's recording trained a music tool without asking. What would you want to know?"},{"id":"ga5_q6","type":"multipleChoice","text":"A generated poster has a six-fingered hand and jumbled letters. What does this show?","simple":"A generated picture has extra fingers and odd letters. Why?","options":["Generated images can contain mistakes worth checking","The prompt was written in another language","The model has run out of noise","The picture was copied from a photo"],"correct":"Generated images can contain mistakes worth checking","correctAnswers":["Generated images can contain mistakes worth checking"],"pairs":[],"explanation":"Image models learn visual patterns, not the rules of hands, text, or physics. Check fingers, lettering, logos, shadows, and reflections before you use a picture.","difficulty":"advanced","transfer":"You generate a team logo with text. List two things you would check before printing it."},{"id":"ga5_q7","type":"multipleChoice","text":"Which prompt gives an image generator the clearest instructions?","simple":"Which prompt is clearest for an image generator?","options":["A red fox in snow, watercolour style","A really nice picture of an animal","Something cool that looks amazing","Draw it well and make it pretty"],"correct":"A red fox in snow, watercolour style","correctAnswers":["A red fox in snow, watercolour style"],"pairs":[],"explanation":"Specific subjects, settings, and styles guide the generator. Vague prompts leave everything to chance.","difficulty":"beginner","transfer":"Rewrite the prompt 'a picture of a dog' to be more specific."},{"id":"ga5_q8","type":"trueFalse","text":"Image generators start from random noise and refine it into a picture.","simple":"Do image generators start from random noise?","options":["True","False"],"correct":"True","correctAnswers":["True"],"pairs":[],"explanation":"Diffusion models remove noise step by step, steering toward the description in your prompt.","difficulty":"beginner","transfer":"Why might a generator get hands or letters wrong?"},{"id":"ga5_q9","type":"explain","text":"Explain how a diffusion model turns noise into a picture.","simple":"How does a diffusion model turn noise into a picture?","options":["It starts with random noise","It removes noise a little at a time","Your prompt guides each step"],"correct":"The model starts with a square of random noise, like static on a screen. Step by step it removes some noise and nudges the pixels toward what your prompt describes. After many steps a clear picture appears that matches the words.","correctAnswers":["The model starts with a square of random noise, like static on a screen. Step by step it removes some noise and nudges the pixels toward what your prompt describes. After many steps a clear picture appears that matches the words."],"pairs":[],"explanation":"Strong answers mention noise, gradual steps, and the prompt guiding them.","difficulty":"beginner","transfer":"Describe the diffusion steps as if you were wiping a foggy window to reveal a drawing."}],"cards":[{"emoji":"📝","title":"Words In, Picture Out","body":"An image generator takes a prompt, the words describing what you want, and produces a new picture. Specific prompts give more predictable results.","funFact":null},{"emoji":"🌫️","title":"From Noise to Picture","body":"The model starts with random static called noise. In each step it removes a little noise and nudges the pixels toward your prompt until a clear image appears. This process is called diffusion.","funFact":null},{"emoji":"🎲","title":"Every Run Is a Sample","body":"Each picture the model produces is one sample. Run the same prompt again and you usually get a different picture.","funFact":null},{"emoji":"🖐️","title":"Check the Details","body":"Generated images can contain mistakes: extra fingers, jumbled text, odd logos, or shadows that break physics. Look closely before you use one.","funFact":null},{"emoji":"⚖️","title":"Who Owns AI Art?","body":"Image models learned from pictures made by people. Whether that use needs permission, and who owns the result, is still being decided by courts and licensing rules.","funFact":null}]},{"id":"ga_l6","title":"Responsible Use of Generative AI","description":"Ethics and best practices","order":5,"difficulty":"intermediate","questions":[{"id":"ga6_q1","type":"multipleChoice","text":"You used generative AI to help with a team project. What should you do?","simple":"AI helped with your project. What should you do?","options":["Say AI helped and review the output","Use it without telling anyone","Skip reviewing what it produced","Use it only where errors do not matter"],"correct":"Say AI helped and review the output","correctAnswers":["Say AI helped and review the output"],"pairs":[],"explanation":"Being open about AI help and checking its output are the two core habits of responsible use.","difficulty":"beginner","transfer":"You used AI to draft a club flyer. What two things should you do before printing?"},{"id":"ga6_q2","type":"trueFalse","text":"It is safe to type private or confidential information into a public AI chatbot.","simple":"Is it safe to put private information into a public chatbot?","options":["True","False"],"correct":"False","correctAnswers":["False"],"pairs":[],"explanation":"Public services may store what you type or use it to improve the model. Keep private details out unless an adult confirms the tool is approved.","difficulty":"beginner","transfer":"You want help with a form that has your address on it. What would you leave out?"},{"id":"ga6_q3","type":"scenarioJudgment","text":"A company uses AI-made images of people who do not exist in adverts. Best practice?","simple":"A company puts AI-made people in adverts. Best practice?","options":["Label the images as AI-generated","Present them as real customers","Delete the images after posting","Add more AI-made images"],"correct":"Label the images as AI-generated","correctAnswers":["Label the images as AI-generated"],"pairs":[],"explanation":"Labelling AI-made people keeps trust with viewers. Some places also require labels on synthetic media in advertising.","difficulty":"beginner","transfer":"Your school newsletter uses a generated photo of a crowd. What note would you add?"},{"id":"ga6_q4","type":"fillInBlank","text":"AI drafts club emails, but a person approves each one before sending. That person is the human in the __________.","simple":"A person checks each AI email first. The human in the __________.","options":["loop","cloud","queue","code"],"correct":"loop","correctAnswers":["loop"],"pairs":[],"explanation":"Human in the loop means a person reviews and approves AI output before it goes out. Messages, money, and anything hard to undo deserve that check.","difficulty":"intermediate","transfer":"A chore app suggests who cleans what. Where would you want a person in the loop?"},{"id":"ga6_q5","type":"multipleChoice","text":"An AI-written article is about to go live. What should happen first?","simple":"An AI article is about to go live. What first?","options":["Review, edit, and fact-check it","Publish it without any review","Add a note that nobody read it","Ask the model if it is accurate"],"correct":"Review, edit, and fact-check it","correctAnswers":["Review, edit, and fact-check it"],"pairs":[],"explanation":"Review for accuracy and tone before anything goes public, no matter which model wrote it.","difficulty":"intermediate","transfer":"You made a class podcast script with AI. What would you check before recording?"},{"id":"ga6_q6","type":"multipleChoice","text":"Why does generative AI raise concern about misinformation?","simple":"Why does generative AI worry people about fake news?","options":["It makes convincing fakes quickly and cheaply","It produces only truthful content","Its output is easy for anyone to spot","It cannot create realistic pictures"],"correct":"It makes convincing fakes quickly and cheaply","correctAnswers":["It makes convincing fakes quickly and cheaply"],"pairs":[],"explanation":"Realistic fake text, images, audio, and video can be produced at scale. Labels, source checks, and verification habits matter more as a result.","difficulty":"advanced","transfer":"A shocking video of a celebrity spreads in your group chat. What would you check first?"},{"id":"ga6_q7","type":"scenarioJudgment","text":"You want to paste a friend's private message into an AI tool for advice. Best move?","simple":"Paste a friend's private message into an AI tool?","options":["Describe the problem without private details","Paste the whole message into the tool","Include their name so advice is specific","Post the message publicly for opinions"],"correct":"Describe the problem without private details","correctAnswers":["Describe the problem without private details"],"pairs":[],"explanation":"Other people's private information is not yours to share. Describe the situation without names or details.","difficulty":"beginner","transfer":"How would you describe a problem without revealing who was involved?"},{"id":"ga6_q8","type":"trueFalse","text":"Telling people when content was made with AI helps keep trust.","simple":"Does saying content is AI-made help keep trust?","options":["True","False"],"correct":"True","correctAnswers":["True"],"pairs":[],"explanation":"Disclosure lets people judge what they are seeing. Hiding it damages trust when discovered.","difficulty":"beginner","transfer":"When would you add a note that AI helped with a school project?"},{"id":"ga6_q9","type":"explain","text":"Describe two habits of responsible generative AI use and why each matters.","simple":"Describe two habits of responsible AI use.","options":["Review and fact-check outputs before using them","Do not share private or confidential data","Disclose AI use where it matters"],"correct":"First, review and fact-check anything the tool produces, because it can be wrong or made up. Second, keep private and confidential information out of prompts, because it may be stored. Saying when AI helped keeps trust with the people who read your work.","correctAnswers":["First, review and fact-check anything the tool produces, because it can be wrong or made up. Second, keep private and confidential information out of prompts, because it may be stored. Saying when AI helped keeps trust with the people who read your work."],"pairs":[],"explanation":"Strong answers give two habits with a reason for each.","difficulty":"beginner","transfer":"Write two rules for AI use your family could agree on, with a reason for each."}],"cards":[{"emoji":"🪪","title":"Say When AI Helped","body":"Telling people when AI helped lets them judge what they see. Hiding it damages trust when it is discovered.","funFact":null},{"emoji":"🔒","title":"Keep Private Things Private","body":"Public AI services may store what you type. Leave out passwords, addresses, other people's messages, and confidential work.","funFact":null},{"emoji":"🔁","title":"Human in the Loop","body":"A person who reviews and approves AI output before it is used is the human in the loop. Emails, money, and anything hard to undo deserve that check.","funFact":null},{"emoji":"🎥","title":"Real or AI-Made?","body":"Voices, faces, and videos can now be generated. If a surprising message or clip asks you to act, confirm it through another channel before you do.","funFact":null}]}],"bigIdeas":["naturalInteraction","learning"]},{"id":"prompt_engineering","name":"Talking to AI","icon":"text.cursor","color":"aiOrange","description":"Write clear prompts, improve them, and check what comes back","order":6,"unlock":{"kind":"completeTier1","value":null},"lessons":[{"id":"pe_l1","title":"Introduction to Prompting","description":"What a prompt is and what makes one clear","order":0,"difficulty":"beginner","questions":[{"id":"pe1_q1","type":"multipleChoice","text":"What is a prompt when you use an AI assistant?","simple":"What is a prompt?","options":["The text you type to guide the reply","The data the model learned from","The computer that runs the model","The answer the model sends back"],"correct":"The text you type to guide the reply","correctAnswers":["The text you type to guide the reply"],"pairs":[],"explanation":"A prompt is the instruction you give an AI assistant. The reply is shaped by your words, so clear prompts help.","difficulty":"beginner","transfer":"You want help planning a bake sale poster. What would your prompt say?"},{"id":"pe1_q2","type":"trueFalse","text":"The same prompt can give different replies from different AI assistants.","simple":"Can one prompt get different replies from different assistants?","options":["True","False"],"correct":"True","correctAnswers":["True"],"pairs":[],"explanation":"Assistants are trained and tuned differently, so the same prompt often gets different replies. Even one assistant can answer differently twice.","difficulty":"beginner","transfer":"Two friends answer the same question differently. How would you decide which answer to trust?"},{"id":"pe1_q3","type":"fillInBlank","text":"Prompt __________ is the skill of writing clear instructions for AI.","simple":"Prompt __________ is writing clear instructions for AI.","options":["engineering","tuning","modeling","processing"],"correct":"engineering","correctAnswers":["engineering"],"pairs":[],"explanation":"Prompt engineering means planning and improving your instructions so the reply fits what you need. It is a skill anyone can practise.","difficulty":"beginner","transfer":"Asking a sibling to help with a chore is like prompting. What details make the request clear?"},{"id":"pe1_q4","type":"scenarioJudgment","text":"Someone types 'help' into a chatbot and gets a vague reply. What is the best next step?","simple":"Typing 'help' gets a vague reply. What should you do?","options":["Say what they need help with and why","Type 'help' again in capital letters","Switch to a different chatbot app","Wait for the chatbot to ask questions"],"correct":"Say what they need help with and why","correctAnswers":["Say what they need help with and why"],"pairs":[],"explanation":"A one-word prompt gives the model nothing to work with. Adding the task and the situation turns a vague request into a clear one.","difficulty":"intermediate","transfer":"A friend texts 'stuck' with nothing else. What would you ask them first?"},{"id":"pe1_q5","type":"multipleChoice","text":"Which prompt would work best?","simple":"Which prompt is clearest?","options":["Write a 100-word summary of photosynthesis for 10-year-olds","Tell me about plants and how they grow in gardens","Give me some science facts about nature today","Write something interesting about biology for me"],"correct":"Write a 100-word summary of photosynthesis for 10-year-olds","correctAnswers":["Write a 100-word summary of photosynthesis for 10-year-olds"],"pairs":[],"explanation":"The best prompt names the topic, the length, and the audience. The others leave the model guessing.","difficulty":"intermediate","transfer":"Write a clear prompt asking for a bedtime story for a younger sibling."},{"id":"pe1_q6","type":"multipleChoice","text":"A prompt names the goal and format, but the reply still misses. What is most likely missing?","simple":"Goal and format are set, but the reply misses. What is missing?","options":["Context about the situation and audience","A polite greeting at the start","Capital letters on the key words","A request to reply more quickly"],"correct":"Context about the situation and audience","correctAnswers":["Context about the situation and audience"],"pairs":[],"explanation":"A clear prompt covers the goal, the context, the format, and any limits. When the goal and format are set but the reply misses, the missing piece is usually context, such as who it is for and why. An example of what you want can also help.","difficulty":"advanced","transfer":"You ask for a thank-you note and get a formal letter. What context would you add?"},{"id":"pe1_q7","type":"scenarioJudgment","text":"You type write about dogs and get a dull answer. What should you add?","simple":"You type write about dogs. What should you add?","options":["Who it is for, how long, what angle","Several exclamation marks at the end","The word please at the start and end","Nothing, just send it a second time"],"correct":"Who it is for, how long, what angle","correctAnswers":["Who it is for, how long, what angle"],"pairs":[],"explanation":"Audience, length, and focus turn a vague request into a clear one.","difficulty":"beginner","transfer":"Rewrite the prompt write about space for a grade 4 class."},{"id":"pe1_q8","type":"trueFalse","text":"A prompt is the text you give an AI to tell it what you want.","simple":"Is a prompt the text you give an AI?","options":["True","False"],"correct":"True","correctAnswers":["True"],"pairs":[],"explanation":"The prompt is your instructions. Clear prompts lead to more useful answers.","difficulty":"beginner","transfer":"What would you include in a prompt for a birthday poem?"},{"id":"pe1_q9","type":"explain","text":"Explain why a vague prompt gives a vague answer, using an example.","simple":"Why does a vague prompt give a vague answer? Give an example.","options":["The model guesses what you meant","Missing details are filled with generic choices","Specific prompts remove the guessing"],"correct":"The model can only work with what you give it, so when details are missing it fills them with generic guesses. Asking for a story gets a random story, but asking for a funny two-paragraph story about a lost robot for eight-year-olds gets something you can actually use.","correctAnswers":["The model can only work with what you give it, so when details are missing it fills them with generic guesses. Asking for a story gets a random story, but asking for a funny two-paragraph story about a lost robot for eight-year-olds gets something you can actually use."],"pairs":[],"explanation":"Strong answers include the guessing idea and a concrete before-and-after.","difficulty":"beginner","transfer":"Turn 'help with my project' into a clear prompt for a real project you have."}],"cards":[{"emoji":"💬","title":"What a Prompt Is","body":"A prompt is the text you give an AI assistant to say what you want. The reply is built from your words, so clear words matter.","funFact":null},{"emoji":"🎯","title":"Be Specific","body":"Instead of 'write about dogs', try 'write a short, funny paragraph about a puppy's first day at school'. Details give the assistant something to work with.","funFact":null},{"emoji":"🧩","title":"Parts of a Clear Prompt","body":"A clear prompt usually names the goal, the context, the format, and any limits. Context means the background the assistant needs, such as who the reader is. An example of what you want helps too.","funFact":null},{"emoji":"🔁","title":"Same Prompt, Different Reply","body":"Different assistants are trained differently, and even one assistant can answer the same prompt two ways. That is normal. Compare the reply with what you asked for.","funFact":null},{"emoji":"✅","title":"Check the Reply","body":"A clear prompt makes a better reply more likely, not guaranteed. Read the answer and ask two questions: does it fit my request, and is it true?","funFact":null}]},{"id":"pe_l2","title":"Prompt Techniques","description":"Examples, steps, and roles","order":1,"difficulty":"intermediate","questions":[{"id":"pe2_q1","type":"multipleChoice","text":"What is 'few-shot prompting'?","simple":"What is few-shot prompting?","options":["Giving a few examples in the prompt","Training the model on a small dataset","Using one or two words as the prompt","Asking for a short and quick reply"],"correct":"Giving a few examples in the prompt","correctAnswers":["Giving a few examples in the prompt"],"pairs":[],"explanation":"Few-shot prompting puts examples of the input and output you want inside the prompt. The model follows the pattern without any retraining.","difficulty":"beginner","transfer":"You want dates written as 3 March 2026. How would you show that?"},{"id":"pe2_q2","type":"trueFalse","text":"Zero-shot prompting means asking AI to do a task without any examples.","simple":"Is zero-shot prompting asking with no examples?","options":["True","False"],"correct":"True","correctAnswers":["True"],"pairs":[],"explanation":"Zero-shot relies on what the model already learned. Many everyday tasks work fine this way; add examples when the format matters.","difficulty":"beginner","transfer":"Which request this week needed no example, and which one would have gone better with one?"},{"id":"pe2_q3","type":"matchPairs","text":"Match prompting techniques:","simple":"Match each technique to its meaning.","options":[],"correct":"","correctAnswers":[],"pairs":[{"term":"Zero-shot","definition":"No examples given"},{"term":"Few-shot","definition":"A few examples provided"},{"term":"Chain-of-thought","definition":"Step-by-step reasoning"},{"term":"Role prompting","definition":"Assign AI a persona"}],"explanation":"These techniques work with most AI assistants. Pick the one that matches what the reply is missing.","difficulty":"beginner","transfer":"You want a joke in one exact style. Which technique would you try first?"},{"id":"pe2_q4","type":"fillInBlank","text":"__________ prompting asks AI to reason through a problem step by step.","simple":"__________ prompting asks for step-by-step reasoning.","options":["Chain-of-thought","Zero-shot","Random","Silent"],"correct":"Chain-of-thought","correctAnswers":["Chain-of-thought"],"pairs":[],"explanation":"Chain-of-thought prompting asks for the reasoning, not just the answer. Seeing the steps lets you check where a mistake happened.","difficulty":"intermediate","transfer":"You ask for help splitting a restaurant bill. Why ask to see the steps?"},{"id":"pe2_q5","type":"multipleChoice","text":"When is few-shot prompting most useful?","simple":"When do examples in a prompt help most?","options":["When you need a very specific output format","When you have no preference about the format","When you only want a yes or no answer","When the model already uses the right format"],"correct":"When you need a very specific output format","correctAnswers":["When you need a very specific output format"],"pairs":[],"explanation":"Examples help most when the reply must follow an exact pattern, like a table layout or a writing style that is hard to describe.","difficulty":"intermediate","transfer":"You want flashcards in one exact layout. What example would you include?"},{"id":"pe2_q6","type":"scenarioJudgment","text":"An assistant solves a logic puzzle and shows its steps. What do the steps give you?","simple":"The AI shows its steps. What are they for?","options":["Steps you can check one at a time","Proof that the final answer is right","A guarantee the puzzle was understood","A sign that no checking is needed"],"correct":"Steps you can check one at a time","correctAnswers":["Steps you can check one at a time"],"pairs":[],"explanation":"Some assistants reason step by step on their own; you can also ask for the steps. Either way, the value is that you can verify each step. A wrong step can still lead to a wrong answer.","difficulty":"advanced","transfer":"A friend shows their working on a maths problem. How would you use it to check the answer?"},{"id":"pe2_q7","type":"scenarioJudgment","text":"You want book titles in the form Title (Author, Year). What is the best way to show this?","simple":"You want a specific title format. Best way to show it?","options":["Include two examples in the prompt","Describe it and hope it guesses","Type the whole request in capitals","Send the same request three times"],"correct":"Include two examples in the prompt","correctAnswers":["Include two examples in the prompt"],"pairs":[],"explanation":"Examples show the exact format you want. This is called few-shot prompting.","difficulty":"beginner","transfer":"What example would you give for a recipe format?"},{"id":"pe2_q8","type":"trueFalse","text":"Asking a model to explain its steps can help on multi-step problems.","simple":"Can asking for steps help with multi-step problems?","options":["True","False"],"correct":"True","correctAnswers":["True"],"pairs":[],"explanation":"Working through steps gives the model room to reason and makes mistakes easier for you to spot.","difficulty":"beginner","transfer":"Which kind of homework question would you ask for steps on?"},{"id":"pe2_q9","type":"explain","text":"Explain few-shot prompting and when you would use it.","simple":"Explain few-shot prompting and when to use it.","options":["You put examples in the prompt","The model copies the pattern","Useful for exact formats or styles"],"correct":"Few-shot prompting means including a few examples of what you want inside the prompt. The model picks up the pattern and follows it. It is most useful when you need an exact format or style that is hard to describe in words.","correctAnswers":["Few-shot prompting means including a few examples of what you want inside the prompt. The model picks up the pattern and follows it. It is most useful when you need an exact format or style that is hard to describe in words."],"pairs":[],"explanation":"Strong answers define it and name a good use.","difficulty":"beginner","transfer":"Write two example lines you would give for a chore chart in one exact layout."}],"cards":[{"emoji":"📝","title":"Show an Example","body":"Giving the assistant one or two examples of what you want is called few-shot prompting. Zero-shot means asking with no examples. Examples work well for exact formats and styles.","funFact":null},{"emoji":"🪜","title":"Ask for the Steps","body":"Asking for the reasoning or the steps helps you check the answer. Some assistants show their steps on their own. Either way, the steps are there for you to verify, not proof the answer is right.","funFact":null},{"emoji":"🎭","title":"Give It a Role","body":"Saying 'act as a science tutor' changes tone, vocabulary, and depth. A role does not add knowledge the model lacks.","funFact":null},{"emoji":"✅","title":"Verify, Do Not Just Trust","body":"A step-by-step reply can still contain a wrong step. Read each step and check the ones that matter to you.","funFac
