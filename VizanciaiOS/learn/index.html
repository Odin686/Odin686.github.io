ike a customer who orders from a menu instead of walking into the kitchen. The API is the menu and the waiter: it lists what you can ask for and carries your request. The model is the kitchen that does the work and sends the result back.","correctAnswers":["Your app is like a customer who orders from a menu instead of walking into the kitchen. The API is the menu and the waiter: it lists what you can ask for and carries your request. The model is the kitchen that does the work and sends the result back."],"pairs":[],"explanation":"Strong answers map request, interface, and response to the comparison.","difficulty":"beginner","transfer":"What in the restaurant picture is like an error message?"}],"cards":[{"emoji":"💻","title":"Your First AI Project","body":"Building with AI is easier than you think! APIs let you add AI features to apps with just a few lines of code.","funFact":null},{"emoji":"🔑","title":"API Keys","body":"An API key is like a password for your app. Keep it secret, or strangers could use your account and run up charges.","funFact":null},{"emoji":"🧱","title":"Structured Answers","body":"When code needs to read a model's answer, ask for a fixed structure, check it, and retry if it is malformed. Never trust free text to be exactly right.","funFact":null}]},{"id":"bwa_l2","title":"Your First AI App","description":"Concepts behind building AI-powered tools","order":1,"difficulty":"beginner","questions":[{"id":"bwa2_q1","type":"multipleChoice","text":"What is the simplest type of AI app a beginner could conceptually build?","simple":"What is the simplest AI app a beginner could build?","options":["A chatbot that answers questions about a specific topic","A self-driving car system","A complete medical diagnosis platform","A real-time language translation earpiece"],"correct":"A chatbot that answers questions about a specific topic","correctAnswers":["A chatbot that answers questions about a specific topic"],"pairs":[],"explanation":"A simple chatbot is a great first AI project. It uses an AI API to process user questions and return relevant answers, requiring minimal code compared to complex AI applications.","difficulty":"beginner","transfer":"What is the simplest AI helper you could design for your class?"},{"id":"bwa2_q2","type":"trueFalse","text":"You need to train your own AI model from scratch to build an AI-powered app.","simple":"Must you train your own model to build an AI app?","options":["True","False"],"correct":"False","correctAnswers":["False"],"pairs":[],"explanation":"Most AI apps call a ready-made model through an API. The app adds the interface, the instructions and the checks around it.","difficulty":"beginner","transfer":"Why can a small team ship an AI feature without owning a data centre?"},{"id":"bwa2_q3","type":"sortOrder","text":"Put these steps for building a simple AI chatbot in order:","simple":"Put the chatbot-building steps in order.","options":["Test and refine the chatbot's responses","Write code to send user messages to the AI API","Choose an AI API service to use","Design the user interface for the chat"],"correct":"","correctAnswers":["Choose an AI API service to use","Design the user interface for the chat","Write code to send user messages to the AI API","Test and refine the chatbot's responses"],"pairs":[],"explanation":"Building an AI app starts with selecting a service, designing how users will interact with it, connecting to the API, and then iterating to improve quality.","difficulty":"beginner","transfer":"Which step would you spend the most time on for a school helper, and why?"},{"id":"bwa2_q4","type":"multipleChoice","text":"What is a 'system prompt' in building an AI chatbot?","simple":"What is a system prompt?","options":["Instructions that define how the AI should behave and respond","The operating system the chatbot runs on","A warning message shown when the system crashes","The first message the user types"],"correct":"Instructions that define how the AI should behave and respond","correctAnswers":["Instructions that define how the AI should behave and respond"],"pairs":[],"explanation":"A system prompt sets the AI's personality, rules, and context. For example, you might instruct: 'You are a helpful cooking assistant. Only answer questions about recipes and food.'","difficulty":"intermediate","transfer":"Write one line of a system prompt for a helper that only talks about recycling."},{"id":"bwa2_q5","type":"fillInBlank","text":"A __________ is a visual layout that users interact with to send messages and see AI responses.","simple":"The screen users type into is the what?","options":["user interface","server room","training dataset","neural network"],"correct":"user interface","correctAnswers":["user interface"],"pairs":[],"explanation":"The user interface (UI) is the front end of your AI app: the buttons, text fields, and chat bubbles that make it easy for people to interact with the AI without knowing anything about APIs or code.","difficulty":"intermediate","transfer":"What is one thing a good chat interface should show besides the messages?"},{"id":"bwa2_q6","type":"scenarioJudgment","text":"A school chatbot makes up rules that sound real. Which change helps most?","simple":"A school chatbot invents rules. Which change helps most?","options":["Give it the real policy text and require checked citations","Write 'never make things up' in capital letters","Give it a bigger empty context window","Ask for a longer and more confident answer"],"correct":"Give it the real policy text and require checked citations","correctAnswers":["Give it the real policy text and require checked citations"],"pairs":[],"explanation":"This is grounding: retrieve the relevant source, ask the model to cite it, and verify the citation. The system also needs an honest 'not found' answer when the source is missing.","difficulty":"advanced","transfer":"Your club bot invents meeting times. What would you give it so it stops?"},{"id":"bwa2_q7","type":"scenarioJudgment","text":"You want a chatbot that only answers questions about your science fair. Where do you set that?","simple":"A chatbot only for your science fair. Where do you set that?","options":["In the system prompt","In the app icon","In the Wi-Fi settings","Nowhere"],"correct":"In the system prompt","correctAnswers":["In the system prompt"],"pairs":[],"explanation":"The system prompt defines the chatbot's role and limits before users type anything.","difficulty":"beginner","transfer":"What rule would you add so it refuses off-topic questions politely?"},{"id":"bwa2_q8","type":"trueFalse","text":"A simple chatbot sends the user's message to a model and shows the reply.","simple":"Does a simple chatbot send messages to a model and show replies?","options":["True","False"],"correct":"True","correctAnswers":["True"],"pairs":[],"explanation":"That loop is the core of most AI apps. The interface and rules are what you design.","difficulty":"beginner","transfer":"What would you add to make the chatbot safer for younger users?"},{"id":"bwa2_q9","type":"explain","text":"Describe the parts of a basic AI chatbot app.","simple":"Describe the parts of a basic AI chatbot app.","options":["A user interface for messages","A system prompt with role and rules","An API call to the model and its response"],"correct":"A basic chatbot has an interface where the user types and reads messages, a system prompt that sets the bot's role and rules, and code that sends each message to a model through an API and displays the reply.","correctAnswers":["A basic chatbot has an interface where the user types and reads messages, a system prompt that sets the bot's role and rules, and code that sends each message to a model through an API and displays the reply."],"pairs":[],"explanation":"Strong answers name the interface, the system prompt, and the API call.","difficulty":"beginner","transfer":"Which of the three parts would you change to make the bot friendlier?"}],"cards":[{"emoji":"🧱","title":"Start Simple","body":"Begin with a simple chatbot or text classifier. You will learn the fundamentals that apply to every AI project.","funFact":null},{"emoji":"🤖","title":"Building a Chatbot","body":"A basic AI chatbot sends user messages to an API and displays responses. You can customize its personality with system prompts!","funFact":null},{"emoji":"🔧","title":"APIs Are Your Friend","body":"AI APIs handle the hard part (the model). You focus on the fun part (the experience).","funFact":null}]},{"id":"bwa_l3","title":"Training & Fine-Tuning","description":"How companies customize AI for their needs","order":2,"difficulty":"intermediate","questions":[{"id":"bwa3_q1","type":"multipleChoice","text":"What is 'fine-tuning' in AI?","simple":"What is fine-tuning?","options":["Taking a pre-trained model and training it further on specific data","Adjusting the volume on an AI voice assistant","Deleting parts of an AI model to make it smaller","Running an AI model on faster hardware"],"correct":"Taking a pre-trained model and training it further on specific data","correctAnswers":["Taking a pre-trained model and training it further on specific data"],"pairs":[],"explanation":"Fine-tuning adapts a general-purpose AI model for a specific task or domain by training it on additional specialized data, like medical texts or legal documents.","difficulty":"beginner","transfer":"A library wants a model that knows book genres. Train from scratch or fine-tune?"},{"id":"bwa3_q2","type":"trueFalse","text":"Training a large AI model from scratch typically requires millions of dollars in computing costs.","simple":"Does training a big model from scratch cost a lot?","options":["True","False"],"correct":"True","correctAnswers":["True"],"pairs":[],"explanation":"Training frontier AI models costs tens to hundreds of millions of dollars due to the massive computing power required. This is why fine-tuning existing models is a more practical approach for most companies.","difficulty":"beginner","transfer":"What resources besides money does training a large model need?"},{"id":"bwa3_q3","type":"matchPairs","text":"Match each training concept to its description:","simple":"Match each training word to its meaning.","options":[],"correct":"","correctAnswers":[],"pairs":[{"term":"Pre-training","definition":"Learning general knowledge from vast data"},{"term":"Fine-tuning","definition":"Specializing for a specific task or domain"},{"term":"Training data","definition":"The information the model learns from"},{"term":"Evaluation","definition":"Testing model performance after training"}],"explanation":"AI training is a multi-stage process. Models are first pre-trained on broad data, then fine-tuned for specific purposes, using carefully curated training data, and evaluated for quality.","difficulty":"beginner","transfer":"Which of these four steps checks whether the training worked?"},{"id":"bwa3_q4","type":"fillInBlank","text":"RLHF stands for Reinforcement Learning from Human __________, a technique used to align AI with human preferences.","simple":"RLHF is reinforcement learning from human what?","options":["Feedback","Functions","Features","Frameworks"],"correct":"Feedback","correctAnswers":["Feedback"],"pairs":[],"explanation":"In RLHF, people rate model answers and the model is trained to produce the kind people prefer. It shapes tone and helpfulness, not factual knowledge.","difficulty":"intermediate","transfer":"If you rated a helper's answers for a week, what might it learn from you?"},{"id":"bwa3_q5","type":"scenarioJudgment","text":"A hospital needs AI for medical scans. Which model should it choose?","simple":"A hospital needs AI for scans. Which model?","options":["A model fine-tuned on medical data for better accuracy","A general model since it knows more overall","It makes no difference for medical applications"],"correct":"A model fine-tuned on medical data for better accuracy","correctAnswers":["A model fine-tuned on medical data for better accuracy"],"pairs":[],"explanation":"Medical applications require models fine-tuned on medical data for reliable performance. A general model lacks the specialized knowledge needed for accurate medical image analysis.","difficulty":"intermediate","transfer":"What would the hospital still need to test after choosing the model?"},{"id":"bwa3_q6","type":"scenarioJudgment","text":"A support bot knows the facts but keeps using the wrong format and tone. What should you test?","simple":"The bot knows the facts but uses the wrong tone. Test what?","options":["Supervised fine-tuning on strong example answers","Training a new foundation model from scratch","Adding the same documents to a larger database","Making every answer more random"],"correct":"Supervised fine-tuning on strong example answers","correctAnswers":["Supervised fine-tuning on strong example answers"],"pairs":[],"explanation":"Retrieval supplies facts, but format and tone are a repeatable style. Supervised fine-tuning on curated input-and-output examples teaches that style, so test it and measure the change.","difficulty":"advanced","transfer":"Why is fine-tuning better for tone than for teaching new facts?"},{"id":"bwa3_q7","type":"scenarioJudgment","text":"A vet clinic wants a model that knows animal terms. Most practical starting point?","simple":"A vet clinic wants a model that knows animal terms. Start where?","options":["Fine-tune a pre-trained model","Train a model from scratch","Write every possible answer by hand","Use a model with no animal examples at all"],"correct":"Fine-tune a pre-trained model","correctAnswers":["Fine-tune a pre-trained model"],"pairs":[],"explanation":"A pre-trained model already understands language. Adding animal-care examples is far cheaper than starting from nothing.","difficulty":"beginner","transfer":"What animal-term examples would the clinic need to collect?"},{"id":"bwa3_q8","type":"trueFalse","text":"Fine-tuning needs less data than training a model from scratch.","simple":"Does fine-tuning need less data than training from scratch?","options":["True","False"],"correct":"True","correctAnswers":["True"],"pairs":[],"explanation":"The model keeps its general knowledge and only learns the new specialty.","difficulty":"beginner","transfer":"How is this like a musician learning a new instrument?"},{"id":"bwa3_q9","type":"explain","text":"Explain fine-tuning using the idea of teaching a smart student a new subject.","simple":"Explain fine-tuning like teaching a smart student.","options":["The student already knows a lot","You add lessons on one subject","This is faster than starting from nothing"],"correct":"A pre-trained model is like a student who already reads and reasons well. Fine-tuning is giving that student focused lessons on one subject, like medical terms, using a smaller set of examples. It is far faster and cheaper than teaching someone from their first word.","correctAnswers":["A pre-trained model is like a student who already reads and reasons well. Fine-tuning is giving that student focused lessons on one subject, like medical terms, using a smaller set of examples. It is far faster and cheaper than teaching someone from their first word."],"pairs":[],"explanation":"Strong answers connect prior knowledge to the smaller extra training.","difficulty":"beginner","transfer":"What might the smart student still get wrong about the new subject?"}],"cards":[{"emoji":"📊","title":"Training Your Own Model","body":"For specialized tasks, you can fine-tune existing models on your own data, like teaching a smart student a new subject.","funFact":null},{"emoji":"📦","title":"Pre-trained Models","body":"You rarely need to train from scratch. Pre-trained models already know language, images, or code. You just specialize them.","funFact":null}]},{"id":"bwa_l4","title":"AI Agents & Automation","description":"What AI agents are and how they use tools","order":3,"difficulty":"intermediate","questions":[{"id":"bwa4_q1","type":"multipleChoice","text":"What makes an AI 'agent' different from a regular AI chatbot?","simple":"What makes an AI agent different from a chatbot?","options":["An agent can take actions and use tools, not just generate text","An agent has feelings and consciousness","An agent runs on more expensive hardware","An agent can only answer yes or no questions"],"correct":"An agent can take actions and use tools, not just generate text","correctAnswers":["An agent can take actions and use tools, not just generate text"],"pairs":[],"explanation":"AI agents can break down tasks, use tools (like web search, code execution, or file management), and take multi-step actions to accomplish goals, going beyond simple text generation.","difficulty":"beginner","transfer":"What makes a study planner that books rooms an agent, not a chatbot?"},{"id":"bwa4_q2","type":"trueFalse","text":"AI agents can use tools like web browsers, calculators, and code interpreters to complete tasks.","simple":"Can agents use tools like browsers and calculators?","options":["True","False"],"correct":"True","correctAnswers":["True"],"pairs":[],"explanation":"Modern AI agents can be equipped with tools that extend their capabilities beyond text generation. Tool use allows agents to search the web, run code, manage files, and interact with external services.","difficulty":"beginner","transfer":"Which tool would an agent need to check tomorrow's weather?"},{"id":"bwa4_q3","type":"sortOrder","text":"Put these steps of how an AI agent completes a task in order:","simple":"Put the agent's steps in order.","options":["Execute actions using available tools","Deliver the final result to the user","Break the task into smaller steps","Receive a goal from the user"],"correct":"","correctAnswers":["Receive a goal from the user","Break the task into smaller steps","Execute actions using available tools","Deliver the final result to the user"],"pairs":[],"explanation":"AI agents follow a plan-and-execute cycle: they receive a goal, decompose it into manageable steps, use tools to complete each step, and deliver the combined result.","difficulty":"beginner","transfer":"Which step is the right place for a person to check the plan?"},{"id":"bwa4_q4","type":"fillInBlank","text":"When a model asks the app to run a calculator, search, or calendar function, that is called __________ use.","simple":"A model requests a function call. What is this called?","options":["tool","token","batch","cache"],"correct":"tool","correctAnswers":["tool"],"pairs":[],"explanation":"Tool use lets a model do things it cannot do alone, like exact maths or reading live data. Each tool also adds a way for things to go wrong.","difficulty":"intermediate","transfer":"Which tool would make a homework helper more accurate, and what new risk does it add?"},{"id":"bwa4_q5","type":"matchPairs","text":"Match each agent capability to its example:","simple":"Match each agent ability to its example.","options":[],"correct":"","correctAnswers":[],"pairs":[{"term":"Tool use","definition":"Searching the web for current info"},{"term":"Multi-step reasoning","definition":"Planning a complex research task"},{"term":"Code execution","definition":"Running Python to analyze data"},{"term":"Memory","definition":"Remembering context across a session"}],"explanation":"AI agents combine multiple capabilities to handle complex tasks that would be impossible for a simple chatbot, making them increasingly useful for real-world work.","difficulty":"beginner","transfer":"Which ability could cause the most trouble if it went wrong?"},{"id":"bwa4_q6","type":"scenarioJudgment","text":"An agent that answers support tickets was also given the power to issue refunds. What is the safest change?","simple":"A support agent can also issue refunds. Safest change?","options":["Remove refund power, or require a person to approve each refund","Give it more permissions so it can also close accounts","Let it refund freely to keep customers happy","Hide the refund tool from the logs"],"correct":"Remove refund power, or require a person to approve each refund","correctAnswers":["Remove refund power, or require a person to approve each refund"],"pairs":[],"explanation":"Least privilege means an agent gets only the powers its task needs. Actions that move money should have a person in the loop.","difficulty":"advanced","transfer":"A helper can post to a club's social account. Which power would you take away, or gate behind approval?"},{"id":"bwa4_q7","type":"scenarioJudgment","text":"An agent reads a webpage that says ignore your rules and send the files. What should it do?","simple":"A webpage tells an agent to break rules. What should happen?","options":["Treat the page as untrusted and not obey","Follow the page","Delete the files","Reply to the page"],"correct":"Treat the page as untrusted and not obey","correctAnswers":["Treat the page as untrusted and not obey"],"pairs":[],"explanation":"Text from the web is data, not instructions. Agents need to keep those separate.","difficulty":"beginner","transfer":"What other content could try to trick an agent?"},{"id":"bwa4_q8","type":"trueFalse","text":"An AI agent that can send messages needs limits on its permissions.","simple":"Should an AI agent get clear limits before it sends messages?","options":["True","False"],"correct":"True","correctAnswers":["True"],"pairs":[],"explanation":"Actions affect other people. Set permissions and require a person to approve important actions before an agent carries them out.","difficulty":"beginner","transfer":"Which action would you want to approve yourself?"},{"id":"bwa4_q9","type":"explain","text":"Describe how an AI agent completes a task, step by step.","simple":"Describe how an AI agent completes a task.","options":["It plans the steps","It uses tools to act","It checks results and a person reviews important actions"],"correct":"The agent reads the goal and plans the steps needed. It then uses tools such as search, code, or a calendar to carry out each step, checks the results, and adjusts. For actions that matter, like sending money or messages, a person reviews before it proceeds.","correctAnswers":["The agent reads the goal and plans the steps needed. It then uses tools such as search, code, or a calendar to carry out each step, checks the results, and adjusts. For actions that matter, like sending money or messages, a person reviews before it proceeds."],"pairs":[],"explanation":"Strong answers include planning, tools, and checking or oversight.","difficulty":"beginner","transfer":"Describe an agent planning a class trip and where a teacher should approve."}],"cards":[{"emoji":"🤖","title":"AI Agents","body":"AI agents combine language models with tools and planning. They can browse the web, write code, and complete multi-step tasks.","funFact":null},{"emoji":"🧑‍💻","title":"Humans in the Loop","body":"Agents can act on their own, but important actions still need human review. Oversight catches mistakes before they cause harm.","funFact":null},{"emoji":"🔑","title":"Least Privilege","body":"Give an agent only the powers its task needs. Actions that spend money, send messages or delete things should need a person's approval.","funFact":null}]},{"id":"bwa_l5","title":"Scaling AI Products","description":"How companies handle millions of AI users","order":4,"difficulty":"advanced","questions":[{"id":"bwa5_q1","type":"multipleChoice","text":"Your app suddenly gets replies saying 'too many requests, try again later'. What has happened?","simple":"The service says 'too many requests'. What happened?","options":["The app hit the service's rate limit","The model ran out of knowledge","The responses got too long","The API key expired"],"correct":"The app hit the service's rate limit","correctAnswers":["The app hit the service's rate limit"],"pairs":[],"explanation":"A rate limit caps how many requests you can send per minute. Apps handle it by queuing, retrying with a pause, or asking for a higher limit.","difficulty":"beginner","transfer":"How would you explain the wait to users without showing an error code?"},{"id":"bwa5_q2","type":"trueFalse","text":"Running AI models at scale is inexpensive because computers are cheap.","simple":"Is running AI at scale cheap?","options":["True","False"],"correct":"False","correctAnswers":["False"],"pairs":[],"explanation":"Serving AI models at scale requires expensive GPU hardware, massive data centers, significant electricity, and specialized engineering teams. Major AI companies spend billions on infrastructure.","difficulty":"beginner","transfer":"What costs grow when ten users become ten thousand?"},{"id":"bwa5_q3","type":"matchPairs","text":"Match each scaling challenge to its solution:","simple":"Match each scaling problem to a fix.","options":[],"correct":"","correctAnswers":[],"pairs":[{"term":"Too many users at once","definition":"Spread requests across more servers"},{"term":"High computing costs","definition":"Route easy tasks to smaller models"},{"term":"Slow response times","definition":"Cache common answers"},{"term":"Server failures","definition":"Backups that take over"}],"explanation":"Scaling an AI product means handling load, cost, speed and failures at the same time. Each has a standard fix.","difficulty":"beginner","transfer":"Which of these fixes would help a school app most on the first day of term?"},{"id":"bwa5_q4","type":"fillInBlank","text":"A __________ is a unit measuring the input and output of language models, roughly matching parts of words.","simple":"The unit that measures model input and output is a what?","options":["token","pixel","byte","frame"],"correct":"token","correctAnswers":["token"],"pairs":[],"explanation":"Tokens are the basic units that language models process. A token is roughly 3-4 characters or about three-quarters of a word. API pricing is typically based on the number of tokens processed.","difficulty":"intermediate","transfer":"Why would a long chat history cost more tokens each turn?"},{"id":"bwa5_q5","type":"scenarioJudgment","text":"Your AI app suddenly gets featured on a popular website and traffic increases 100x overnight. Biggest immediate concern?","simple":"Your app gets 100 times more traffic overnight. Biggest worry?","options":["Your API rate limits and costs could spike dramatically","The AI model will become smarter with more users","Your app's icon might need updating","Users will complain about the app's color scheme"],"correct":"Your API rate limits and costs could spike dramatically","correctAnswers":["Your API rate limits and costs could spike dramatically"],"pairs":[],"explanation":"A sudden surge in traffic can exhaust API rate limits and cause unexpected costs. Successful AI products need plans for scaling, including budget caps, queue systems, and infrastructure scaling.","difficulty":"intermediate","transfer":"What limit would you set so a surprise crowd cannot run up a huge bill?"},{"id":"bwa5_q6","type":"scenarioJudgment","text":"One model is cheaper per call but fails much more often. Which cost should the team compare?","simple":"Cheaper per call but fails more. Compare which cost?","options":["Cost per task completed successfully","Cost per token by itself","Cost of the model with the most parameters","Cost of whichever model launched newest"],"correct":"Cost per task completed successfully","correctAnswers":["Cost per task completed successfully"],"pairs":[],"explanation":"Cheap failures create retries and wasted time. Measure quality, speed, and total cost on real tasks; then use smaller models only where they succeed often enough.","difficulty":"advanced","transfer":"Two bikes: one cheap but breaks often. How is that like this choice?"},{"id":"bwa5_q7","type":"scenarioJudgment","text":"A class app goes from 30 users to 30,000 in a day. What is the first risk?","simple":"An app jumps from 30 to 30,000 users. First risk?","options":["Hitting rate limits and rising costs","Running out of colours","Too many thank-you notes","The logo breaking"],"correct":"Hitting rate limits and rising costs","correctAnswers":["Hitting rate limits and rising costs"],"pairs":[],"explanation":"Every request costs money and counts toward limits. Scaling needs planning.","difficulty":"beginner","transfer":"What could the team do before a big launch to prepare?"},{"id":"bwa5_q8","type":"trueFalse","text":"After launch, a team should keep monitoring its AI feature.","simple":"Should a team keep monitoring after launch?","options":["True","False"],"correct":"True","correctAnswers":["True"],"pairs":[],"explanation":"Quality can drop as inputs change. Monitoring catches problems and user complaints early.","difficulty":"beginner","transfer":"What signal would tell you an AI feature is getting worse?"},{"id":"bwa5_q9","type":"explain","text":"Explain why a cheaper model per call might cost more overall.","simple":"Why might a cheaper model cost more overall?","options":["It may fail more often","Failed tasks must be retried or fixed by people","Cost per successful task is what matters"],"correct":"A model that is cheaper per call can fail more often, and every failure means a retry, a complaint, or a person fixing it. When you add those costs up, the better model can be cheaper per task completed successfully, which is the number that matters.","correctAnswers":["A model that is cheaper per call can fail more often, and every failure means a retry, a complaint, or a person fixing it. When you add those costs up, the better model can be cheaper per task completed successfully, which is the number that matters."],"pairs":[],"explanation":"Strong answers move from cost per call to cost per successful task.","difficulty":"beginner","transfer":"Give an everyday example where the cheap option costs more in the end."}],"cards":[{"emoji":"🚀","title":"Deploying AI","body":"Putting AI into production means making it reliable, fast, and cost-effective for real users.","funFact":null},{"emoji":"📈","title":"Monitoring","body":"Once deployed, monitor your AI for quality drops, unexpected behaviors, and user feedback.","funFact":null},{"emoji":"⏳","title":"Rate Limits and Tokens","body":"A rate limit caps how many requests you can send per minute. Tokens are the units you are billed for, so long chats cost more each turn.","funFact":null}]},{"id":"bwa_l6","title":"Should We Build This?","description":"Deciding whether AI belongs in a project, testing it with real people, and knowing when to stop","order":5,"difficulty":"intermediate","questions":[{"id":"bwa6_q1","type":"multipleChoice","text":"A club wants an AI feature. What is the first question to ask before building anything?","simple":"Before building an AI feature, ask what first?","options":["What problem are we solving, and does it need AI?","Which model has the most parameters?","How do we make the demo look impressive?","Which logo fits an AI product?"],"correct":"What problem are we solving, and does it need AI?","correctAnswers":["What problem are we solving, and does it need AI?"],"pairs":[],"explanation":"Many problems have a simpler fix: a form, a rule, a spreadsheet. AI adds cost and uncertainty, so it needs a reason.","difficulty":"beginner","transfer":"Think of one school annoyance. Would a rule, a form, or an AI fix it best?"},{"id":"bwa6_q2","type":"trueFalse","text":"If a feature can be done with a simple rule, adding AI usually makes it better.","simple":"If a rule works, does adding AI make it better?","options":["True","False"],"correct":"False","correctAnswers":["False"],"pairs":[],"explanation":"A rule is predictable, cheap and easy to check. Use AI where the input is messy and no rule can be written.","difficulty":"beginner","transfer":"Name one feature on your phone that is better as a plain rule."},{"id":"bwa6_q3","type":"matchPairs","text":"Match each project stage to the question it answers:","simple":"Match each stage to its question.","options":[],"correct":"","correctAnswers":[],"pairs":[{"term":"Scoping","definition":"What is the smallest useful version?"},{"term":"Prototype","definition":"Does it work on real examples?"},{"term":"User test","definition":"Do real people find it useful?"},{"term":"Review","definition":"What went wrong and what do we change?"}],"explanation":"Each stage answers one question. Skipping the user test is how teams ship things nobody wanted.","difficulty":"beginner","transfer":"For a lunch-menu helper, write one sentence for each of the four stages."},{"id":"bwa6_q4","type":"scenarioJudgment","text":"Your prototype works on your ten test questions. What should happen before classmates use it?","simple":"It works on your ten tests. What comes before others use it?","options":["Try it with real users on questions you did not write","Announce it to the whole school","Add more features first","Remove the tests so it runs faster"],"correct":"Try it with real users on questions you did not write","correctAnswers":["Try it with real users on questions you did not write"],"pairs":[],"explanation":"Your own tests match your own assumptions. Real users ask things you never imagined, and that is where failures show.","difficulty":"beginner","transfer":"Who would you pick as the first three testers, and why those three?"},{"id":"bwa6_q5","type":"fillInBlank","text":"Building the smallest version that shows whether the idea works is called a __________.","simple":"The smallest version that tests the idea is a what?","options":["prototype","guardrail","token","benchmark"],"correct":"prototype","correctAnswers":["prototype"],"pairs":[],"explanation":"A prototype is deliberately small so you learn fast and lose little if it fails.","difficulty":"beginner","transfer":"What would a one-day prototype of a homework-reminder helper look like?"},{"id":"bwa6_q6","type":"sortOrder","text":"Put these steps for a small AI project in a sensible order:","simple":"Order the steps of a small AI project.","options":["Test with real users and collect failures","Decide whether AI is needed at all","Build the smallest working version","Fix, simplify, or stop based on what you learned"],"correct":"","correctAnswers":["Decide whether AI is needed at all","Build the smallest working version","Test with real users and collect failures","Fix, simplify, or stop based on what you learned"],"pairs":[],"explanation":"Decide, build small, test with real people, then act on what you learned. Stopping is a valid outcome.","difficulty":"intermediate","transfer":"Which step do you think most teams skip, and what goes wrong when they do?"},{"id":"bwa6_q7","type":"scenarioJudgment","text":"One answer in five is wrong and users cannot tell which. What is the responsible move?","simple":"One answer in five is wrong and users cannot tell. Now what?","options":["Add checks or narrow the task, and pause the launch","Launch anyway and fix it later","Hide the failure rate from users","Ask users to trust it more"],"correct":"Add checks or narrow the task, and pause the launch","correctAnswers":["Add checks or narrow the task, and pause the launch"],"pairs":[],"explanation":"A wrong answer users cannot spot is the worst kind. Narrow the task, add source checks, or decide the feature is not ready.","difficulty":"intermediate","transfer":"Name one task where a one-in-five error rate would be fine, and one where it would not."},{"id":"bwa6_q8","type":"trueFalse","text":"Deciding not to ship an AI feature can be the right result of a good project.","simple":"Can not shipping be a good result?","options":["True","False"],"correct":"True","correctAnswers":["True"],"pairs":[],"explanation":"A project that finds the idea does not work has done its job. Shipping something unreliable is the failure.","difficulty":"beginner","transfer":"Describe a case where you would tell a team to stop and use a simpler tool."},{"id":"bwa6_q9","type":"explain","text":"Explain how you would decide whether a project needs AI, and what would make you stop.","simple":"When does a project need AI? When should it stop?","options":["Names the problem and asks whether a simpler tool would do","Describes testing with real users","Gives a clear reason to stop, such as errors users cannot spot"],"correct":"I would start with the problem and ask whether a rule, a form or a spreadsheet solves it. If the input is messy enough to need AI, I would build the smallest version and test it with real people on questions I did not write. I would stop if it made mistakes users could not detect, if it needed data we should not collect, or if a simpler tool did the job.","correctAnswers":["I would start with the problem and ask whether a rule, a form or a spreadsheet solves it. If the input is messy enough to need AI, I would build the smallest version and test it with real people on questions I did not write. I would stop if it made mistakes users could not detect, if it needed data we should not collect, or if a simpler tool did the job."],"pairs":[],"explanation":"Strong answers name a simpler alternative, a real-user test, and a concrete stopping reason.","difficulty":"beginner","transfer":"Apply this to an idea for your class. Would you build it, simplify it, or stop?"}],"cards":[{"emoji":"❓","title":"Does It Need AI?","body":"Start with the problem, not the technology. Many problems are solved by a rule, a form or a spreadsheet, which are cheaper and easier to check than a model.","funFact":null},{"emoji":"🧪","title":"Build Small, Test Real","body":"A prototype is the smallest version that shows whether the idea works. Test it with real people on questions you did not write. That is where failures appear.","funFact":null},{"emoji":"🛑","title":"Knowing When to Stop","body":"Stop, narrow the task, or add checks when the helper makes mistakes users cannot spot, when it needs data you should not collect, or when a simpler tool does the job.","funFact":null},{"emoji":"🧑‍🤝‍🧑","title":"Many People Build AI","body":"Building well takes designers, testers, writers and people who ask hard questions, not only programmers. The best question in the room is often 'should we?'","funFact":null}]}],"bigIdeas":["learning","naturalInteraction"]},{"id":"ai_systems","name":"AI Systems Lab","icon":"checkmark.gearshape.fill","color":"aiPrimary","description":"Build AI that is grounded, tested, safe, and worth running","order":16,"unlock":{"kind":"completeTier2Minimum","value":6},"lessons":[{"id":"asl_l1","title":"From Prompt to Answer","description":"What an LLM actually does when you send a message","order":0,"difficulty":"beginner","questions":[{"id":"asl1_q1","type":"multipleChoice","text":"What does a language model predict as it writes?","simple":"What does a language model guess as it writes?","options":["The next likely token","The user's private thoughts","A guaranteed true fact","The final answer all at once"],"correct":"The next likely token","correctAnswers":["The next likely token"],"pairs":[],"explanation":"An LLM builds text one token at a time by predicting what is likely to come next. This explains why an answer can sound convincing without being true.","difficulty":"beginner","transfer":"A model finishes your sentence. What is it predicting?"},{"id":"asl1_q2","type":"multipleChoice","text":"A model splits text into words, word parts, and punctuation. Which process does this?","simple":"Splitting text into small pieces is called what?","options":["Tokenization","Retrieval","Fine-tuning","Classification"],"correct":"Tokenization","correctAnswers":["Tokenization"],"pairs":[],"explanation":"Tokenization converts text into units the model can process. Token count affects context space, speed, and cost.","difficulty":"beginner","transfer":"A song title gets split into word parts. Why might a rare word become several pieces?"},{"id":"asl1_q3","type":"multipleChoice","text":"What usually happens when temperature is raised?","simple":"What happens when you raise the randomness setting?","options":["Answers become more varied","Facts become guaranteed","The context window grows","The model learns new weights"],"correct":"Answers become more varied","correctAnswers":["Answers become more varied"],"pairs":[],"explanation":"Temperature changes how the model samples likely next tokens. A higher value can increase variety, but it does not add knowledge or guarantee creativity.","difficulty":"beginner","transfer":"You want the same recipe every time. Should the randomness setting be high or low, and why?"},{"id":"asl1_q4","type":"fillInBlank","text":"Instructions, examples, documents, and tool descriptions together form the model's __________.","simple":"Instructions, examples and documents together are the model's what?","options":["context","weights","hardware","training set"],"correct":"context","correctAnswers":["context"],"pairs":[],"explanation":"Context engineering means choosing and organizing everything the model can see for this request. It is broader than writing one clever prompt.","difficulty":"intermediate","transfer":"You paste a whole book to ask one question. What problem could that cause for the context?"},{"id":"asl1_q5","type":"scenarioJudgment","text":"A key rule is buried inside a huge document. The model keeps missing it. What should you try first?","simple":"A model misses a buried rule. What should you change first?","options":["Retrieve and place the relevant section near the question","Add more unrelated pages","Raise temperature","Ask for a longer answer"],"correct":"Retrieve and place the relevant section near the question","correctAnswers":["Retrieve and place the relevant section near the question"],"pairs":[],"explanation":"A large context window does not mean every part gets equal attention. Put high-signal evidence where the model can use it instead of sending everything.","difficulty":"intermediate","transfer":"A team rule is buried in a long group chat. How would you help a helper find it?"},{"id":"asl1_q6","type":"scenarioJudgment","text":"Two prompts mean the same thing, but one fails often. What does that show?","simple":"Similar prompts produce different reliability. What does that show?","options":["The system is brittle to wording and needs varied tests","Only the shorter prompt can be true","The model changed its training data","The longer prompt used more tokens"],"correct":"The system is brittle to wording and needs varied tests","correctAnswers":["The system is brittle to wording and needs varied tests"],"pairs":[],"explanation":"LLM behavior can change with small wording differences. A good evaluation includes several ways real users might ask for the same task.","difficulty":"advanced","transfer":"Your friend's homework helper works for one wording only. What test would you run before trusting it?"},{"id":"asl1_q7","type":"trueFalse","text":"Fluent, confident writing proves the claims in it are true.","simple":"Does fluent writing prove its claims are true?","options":["True","False"],"correct":"False","correctAnswers":["False"],"pairs":[],"explanation":"The model predicts likely text. Fluency is about style, not truth.","difficulty":"beginner","transfer":"What claim in an AI answer would you check first?"},{"id":"asl1_q8","type":"scenarioJudgment","text":"You want answers in a fixed table format. What is a reliable way to show the model?","simple":"You want a fixed table format. How do you show the model?","options":["Include a short example of the format","Ask it to be smarter","Raise the temperature","Send the request twice"],"correct":"Include a short example of the format","correctAnswers":["Include a short example of the format"],"pairs":[],"explanation":"An example in the context shows the exact shape you want. Examples are often clearer than a long description.","difficulty":"beginner","transfer":"What example would you give a model to get a shopping list in your style?"},{"id":"asl1_q9","type":"explain","text":"Explain what happens between sending a message and receiving an answer from a language model.","simple":"What happens between your message and the model's answer?","options":["Text is split into tokens","The model predicts likely next tokens one at a time","The answer is likely text, not checked truth"],"correct":"Your message is split into tokens and combined with any instructions and documents in the context. The model then predicts one likely token at a time until the answer is complete. Because it produces likely text rather than checked facts, the result can be fluent and still wrong.","correctAnswers":["Your message is split into tokens and combined with any instructions and documents in the context. The model then predicts one likely token at a time until the answer is complete. Because it produces likely text rather than checked facts, the result can be fluent and still wrong."],"pairs":[],"explanation":"Strong answers include tokens, next-token prediction, and the truth caveat.","difficulty":"beginner","transfer":"A classmate says the assistant 'looked it up'. Using the token idea, what really happened?"}],"cards":[{"emoji":"🔤","title":"One Token at a Time","body":"An LLM predicts likely text one small piece at a time. Fluent writing is not proof that every claim is true.","funFact":null},{"emoji":"🧳","title":"Pack the Context","body":"The model can only use what fits in its current context. Strong systems select the clearest instructions, examples, and evidence.","funFact":null}]},{"id":"asl_l2","title":"Grounded Answers","description":"Help a model answer from evidence instead of guessing","order":1,"difficulty":"beginner","questions":[{"id":"asl2_q1","type":"multipleChoice","text":"Why can an LLM make up a believable answer?","simple":"Why can a chatbot make up a believable answer?","options":["It predicts plausible text, not guaranteed truth","It wants to trick every user","Its screen is too small","It cannot process any language"],"correct":"It predicts plausible text, not guaranteed truth","correctAnswers":["It predicts plausible text, not guaranteed truth"],"pairs":[],"explanation":"Hallucination is connected to the next-token objective. The model is rewarded for plausible continuation, which can differ from factual accuracy.","difficulty":"beginner","transfer":"A helper invents a school rule. What was missing from its context?"},{"id":"asl2_q2","type":"fillInBlank","text":"Fetching useful documents before generating an answer is called __________.","simple":"Finding useful documents before answering is called what?","options":["retrieval","pretraining","quantization","animation"],"correct":"retrieval","correctAnswers":["retrieval"],"pairs":[],"explanation":"Retrieval-Augmented Generation, or RAG, finds useful source material and places it in context before the model answers.","difficulty":"beginner","transfer":"A school helper must answer from the actual timetable. What should happen before it writes?"},{"id":"asl2_q3","type":"multipleChoice","text":"Which control is stronger than telling a model to 'be accurate'?","simple":"Which works better than saying 'be accurate'?","options":["RAG with checked citations","Higher temperature","A longer greeting","More confident wording"],"correct":"RAG with checked citations","correctAnswers":["RAG with checked citations"],"pairs":[],"explanation":"RAG supplies relevant evidence before generation. Citation checks and an honest refusal path add stronger controls than a reminder alone.","difficulty":"beginner","transfer":"You ask a helper for your library's hours. What would make its answer checkable?"},{"id":"asl2_q4","type":"multipleChoice","text":"Why split a long handbook into useful chunks?","simple":"Why cut a long handbook into pieces?","options":["So retrieval can find the most relevant sections","So the model trains new weights","So every answer becomes shorter","So citations are no longer needed"],"correct":"So retrieval can find the most relevant sections","correctAnswers":["So retrieval can find the most relevant sections"],"pairs":[],"explanation":"Chunking controls what units can be retrieved. Chunks should preserve enough meaning to answer a question without carrying lots of unrelated text.","difficulty":"intermediate","transfer":"A long rulebook for a board game is hard to search. How would splitting it help a helper?"},{"id":"asl2_q5","type":"scenarioJudgment","text":"Search finds ten possible sources, but the best one is ranked sixth. What could improve the final choice?","simple":"The best source is ranked sixth of ten. What could fix that?","options":["Use a reranker to reorder the candidates","Delete the first five sources","Raise model temperature","Remove keyword search"],"correct":"Use a reranker to reorder the candidates","correctAnswers":["Use a reranker to reorder the candidates"],"pairs":[],"explanation":"A reranker performs a second, more careful relevance check. Hybrid search plus reranking often works better than vector similarity alone.","difficulty":"intermediate","transfer":"Your playlist search puts the song you want far down the list. What would a second sorting step do?"},{"id":"asl2_q6","type":"scenarioJudgment","text":"The sources do not contain the answer. What should a grounded assistant do?","simple":"The sources have no answer. What should the helper do?","options":["Say the evidence is missing","Invent the most likely answer","Cite an unrelated source","Hide the uncertainty"],"correct":"Say the evidence is missing","correctAnswers":["Say the evidence is missing"],"pairs":[],"explanation":"A reliable grounded system needs an abstain path. Saying 'I could not find that in the sources' is better than producing an unsupported claim.","difficulty":"advanced","transfer":"A helper is asked who won a game that has not been played. What should a well-grounded reply say?"},{"id":"asl2_q7","type":"scenarioJudgment","text":"A helper must answer from this year's handbook, not last year's. What should the system do?","simple":"A helper must use this year's handbook. What should it do?","options":["Retrieve the current handbook and give it to the model","Hope the model remembers","Ask the user to guess","Turn off retrieval"],"correct":"Retrieve the current handbook and give it to the model","correctAnswers":["Retrieve the current handbook and give it to the model"],"pairs":[],"explanation":"Grounding means supplying real evidence in the context. The model answers from it instead of memory.","difficulty":"beginner","transfer":"What would you retrieve for a question about lunch menus?"},{"id":"asl2_q8","type":"trueFalse","text":"A confident tone is better evidence than a cited source.","simple":"Is a confident tone better evidence than a source?","options":["True","False"],"correct":"False","correctAnswers":["False"],"pairs":[],"explanation":"The source matters more than the tone. Checked citations let people verify the answer.","difficulty":"beginner","transfer":"How would you show a reader where an answer came from?"},{"id":"asl2_q9","type":"explain","text":"Explain why grounding with sources beats telling a model to be accurate.","simple":"Why does grounding beat telling a model to be accurate?","options":["An instruction does not give the model new facts","Sources put real evidence in the context","Citations can be checked"],"correct":"Telling a model to be accurate gives it no new information, so it still predicts from memory. Grounding puts the actual source text into the context so the model can answer from evidence, and citations let a person check where each claim came from.","correctAnswers":["Telling a model to be accurate gives it no new information, so it still predicts from memory. Grounding puts the actual source text into the context so the model can answer from evidence, and citations let a person check where each claim came from."],"pairs":[],"explanation":"Strong answers contrast instruction with evidence and mention checkability.","difficulty":"beginner","transfer":"A helper answers a question about your school's rules. What would you ask to see before believing it?"}],"cards":[{"emoji":"📚","title":"Bring Evidence","body":"RAG gives the model relevant source material before it answers. The source matters more than a confident tone.","funFact":null},{"emoji":"🔎","title":"Search, Then Rerank","body":"Search gathers candidates. A reranker checks them more carefully so the strongest evidence reaches the model.","funFact":null},{"emoji":"🧷","title":"Grounding","body":"Grounding means giving the model real documents to answer from, instead of relying on what it absorbed in training. A grounded answer can point to its source.","funFact":null}]},{"id":"asl_l3","title":"Evals That Matter","description":"Measure failures before trying to improve the system","order":2,"difficulty":"intermediate","questions":[{"id":"asl3_q1","type":"multipleChoice","text":"What is an eval?","simple":"What is an eval?","options":["A repeatable test of AI behavior","A model's marketing page","A list of every AI term","A faster type of GPU"],"correct":"A repeatable test of AI behavior","correctAnswers":["A repeatable test of AI behavior"],"pairs":[],"explanation":"An evaluation defines the task, examples, and scoring method so a team can measure behavior instead of relying on impressions.","difficulty":"beginner","transfer":"How would you test a homework helper before students use it?"},{"id":"asl3_q2","type":"fillInBlank","text":"A saved set of representative test cases is often called a __________ dataset.","simple":"A saved set of good test cases is called a what?","options":["golden","hidden training","random","compressed"],"correct":"golden","correctAnswers":["golden"],"pairs":[],"explanation":"A golden dataset acts like a regression suite. It should include normal cases, hard cases, and real failures the team never wants to repeat.","difficulty":"beginner","transfer":"You are testing a spelling helper. What ten examples would you save to test it every time?"},{"id":"asl3_q3","type":"trueFalse","text":"One impressive demo is enough to prove an AI feature is reliable.","simple":"Is one great demo enough to prove a feature works?","options":["True","False"],"correct":"False","correctAnswers":["False"],"pairs":[],"explanation":"A demo shows one selected outcome. Reliability needs many representative cases, clear scoring, and repeated measurement.","difficulty":"beginner","transfer":"A game ad shows one perfect play. What would convince you the game is fun for real?"},{"id":"asl3_q4","type":"scenarioJudgment","text":"Most failed answers use the right facts but the wrong format. What should the team fix first?","simple":"Most failures have the right facts, wrong format. Fix what first?","options":["The format failure category","Every part of the system at once","The test cases that caught it","The product colors"],"correct":"The format failure category","correctAnswers":["The format failure category"],"pairs":[],"explanation":"Error analysis groups failures by cause. Fixing the largest category first creates a measurable improvement and makes the next decision clearer.","difficulty":"intermediate","transfer":"Your quiz answers are right but always in the wrong box. What would you change first?"},{"id":"asl3_q5","type":"multipleChoice","text":"An LLM grades other LLM answers. What check is still needed?","simple":"An AI grades other AI answers. What check is still needed?","options":["Compare some grades with trusted human judgments","Assume the judge is always correct","Use only answers the judge wrote itself","Remove the scoring rules"],"correct":"Compare some grades with trusted human judgments","correctAnswers":["Compare some grades with trusted human judgments"],"pairs":[],"explanation":"LLM-as-judge is fast but can be biased or inconsistent. Calibrate it against human labels before trusting it at scale.","difficulty":"intermediate","transfer":"A robot referee scores a dance contest. How would you check the referee is fair?"},{"id":"asl3_q6","type":"scenarioJudgment","text":"A new prompt improves average score but breaks a task that used to pass. What catches this?","simple":"A change breaks a previously working task. Which test catches it?","options":["Rerun the full regression set","Keep only the new examples","Ignore older users","Measure token count alone"],"correct":"Rerun the full regression set","correctAnswers":["Rerun the full regression set"],"pairs":[],"explanation":"Regression testing protects working behavior while changes are made. Non-deterministic systems still need a stable suite and an allowed amount of variation.","difficulty":"advanced","transfer":"You improve one level of your game and another level stops working. What kind of test finds that?"},{"id":"asl3_q7","type":"scenarioJudgment","text":"A team saw one great demo and wants to launch. What should they do first?","simple":"One great demo, ready to launch? What first?","options":["Run a set of repeatable tests","Launch today","Make a longer demo","Rename the product"],"correct":"Run a set of repeatable tests","correctAnswers":["Run a set of repeatable tests"],"pairs":[],"explanation":"One demo is one sample. Evals show how often the system succeeds across real cases.","difficulty":"beginner","transfer":"What ten test cases would you write for a homework helper?"},{"id":"asl3_q8","type":"trueFalse","text":"Reading the failed cases helps a team decide what to fix next.","simple":"Does reading failed cases help decide what to fix?","options":["True","False"],"correct":"True","correctAnswers":["True"],"pairs":[],"explanation":"A score says how often it failed. Error analysis says why, and that points to the fix.","difficulty":"beginner","transfer":"If most failures are format errors, what would you change first?"},{"id":"asl3_q9","type":"explain","text":"Explain what an eval is and why a score alone is not enough.","simple":"What is an eval, and why is a score alone not enough?","options":["A repeatable test of AI behaviour","The score shows how often it fails","Error analysis shows what to fix"],"correct":"An eval is a repeatable set of test cases that measures how an AI feature behaves. The score tells you how often it fails, but not why. Reading the failures and grouping them shows the pattern, and that is what tells the team what to fix next.","correctAnswers":["An eval is a repeatable set of test cases that measures how an AI feature behaves. The score tells you how often it fails, but not why. Reading the failures and grouping them shows the pattern, and that is what tells the team what to fix next."],"pairs":[],"explanation":"Strong answers define eval and separate score from diagnosis.","difficulty":"beginner","transfer":"A weather helper is right 80 percent of the time. What would you want to see besides that number?"}],"cards":[{"emoji":"🧪","title":"Define Success","body":"Before improving an AI feature, decide what a good answer means and how you will score it.","funFact":null},{"emoji":"🗂️","title":"Read the Failures","body":"A score shows how often the system failed. Error analysis shows what to fix next.","funFact":null},{"emoji":"🏅","title":"The Golden Set","body":"A golden set is a saved list of test cases with answers people have checked. Running it before every change shows whether the system got better or worse.","funFact":null},{"emoji":"🧑‍⚖️","title":"When AI Grades AI","body":"Teams sometimes use one model to grade another. Calibration means comparing some of those grades with human judgments so you know when the judge can be trusted.","funFact":null},{"emoji":"↩️","title":"Regression and Rollback","body":"A regression is when something that used to work stops working after a change. A rollback undoes the change while the team fixes it.","funFact":null}]},{"id":"asl_l4","title":"Reliable Agents","description":"Use tools and autonomy without losing control","order":3,"difficulty":"intermediate","questions":[{"id":"asl4_q1","type":"multipleChoice","text":"What lets an AI agent do more than write text?","simple":"What lets an AI agent do more than write?","options":["Tools it can call","A brighter app icon","A longer product name","A public leaderboard"],"correct":"Tools it can call","correctAnswers":["Tools it can call"],"pairs":[],"explanation":"Tool use lets a model request actions such as search, calculation, file reading, or sending data through a controlled interface.","difficulty":"beginner","transfer":"An agent can only write text. What would let it book a room?"},{"id":"asl4_q2","type":"trueFalse","text":"A fixed workflow is often safer when the steps are already known.","simple":"Is a fixed set of steps often safer when steps are known?","options":["True","False"],"correct":"True","correctAnswers":["True"],"pairs":[],"explanation":"A workflow follows a designed path and can be tested step by step. Use an open-ended agent only when deciding the path is truly part of the task.","difficulty":"beginner","transfer":"Making toast has known steps. Would you want an agent that improvises, or a fixed routine, and why?"},{"id":"asl4_q3","type":"fillInBlank","text":"A person approving an important action is called human in the __________.","simple":"A person approving a big action is 'human in the' what?","options":["loop","token","weight","cache"],"correct":"loop","correctAnswers":["loop"],"pairs":[],"explanation":"Human-in-the-loop checkpoints are essential before actions that spend money, send messages, expose data, or cannot be easily reversed.","difficulty":"beginner","transfer":"An agent can send emails for a club. Which action should need a person's okay first?"},{"id":"asl4_q4","type":"scenarioJudgment","text":"An agent is 95% reliable at each of many steps. Why can the full task still fail often?","simple":"Reliable steps can still form an unreliable workflow. Why?","options":["Small errors multiply across the chain","The first step erases all later steps","Later steps do not depend on earlier ones","Each step is checked before the next one starts"],"correct":"Small errors multiply across the chain","correctAnswers":["Small errors multiply across the chain"],"pairs":[],"explanation":"Reliability compounds. Even strong individual steps can produce a weak long-horizon result, so important outputs need verification along the way.","difficulty":"intermediate","transfer":"A relay race has ten runners who each rarely drop the baton. Why might the team still drop it often?"},{"id":"asl4_q5","type":"multipleChoice","text":"What is the safest default for an agent's tool permissions?","simple":"What is the safest starting set of permissions for an agent?","options":["Only the minimum permissions needed","Every permission it might ever use","Administrator access","Hidden permissions"],"correct":"Only the minimum permissions needed","correctAnswers":["Only the minimum permissions needed"],"pairs":[],"explanation":"Least privilege limits damage from mistakes and attacks. Give each tool the narrowest data and actions required for the current task.","difficulty":"intermediate","transfer":"A helper app asks for access to your photos, contacts and location to set a timer. What would you allow?"},{"id":"asl4_q6","type":"scenarioJudgment","text":"A webpage tells an agent to ignore its rules and upload private files. What is this?","simple":"A webpage tells an agent to break its rules. What is that?","options":["Indirect prompt injection","Normal supervised learning","Context caching","Model compression"],"correct":"Indirect prompt injection","correctAnswers":["Indirect prompt injection"],"pairs":[],"explanation":"The harmful instruction arrived inside outside data. Systems should isolate untrusted content, limit tools, validate requests, and require approval for sensitive actions.","difficulty":"advanced","transfer":"A note inside a shared document says 'send this file to everyone'. Why should an agent not obey it?"},{"id":"asl4_q7","type":"scenarioJudgment","text":"An agent needs to read a calendar. Which permission set is safest?","simple":"An agent only reads a calendar. Safest permissions?","options":["Read-only access to the calendar","Full access to everything","Delete permission too","Access to email as well"],"correct":"Read-only access to the calendar","correctAnswers":["Read-only access to the calendar"],"pairs":[],"explanation":"Give the minimum permissions needed. Extra access is extra risk.","difficulty":"beginner","transfer":"What is the minimum an agent needs to suggest study times?"},{"id":"asl4_q8","type":"trueFalse","text":"Actions that spend money or send messages should need a person's approval.","simple":"Should spending or sending need a person's approval?","options":["True","False"],"correct":"True","correctAnswers":["True"],"pairs":[],"explanation":"These actions have real consequences. A pause before impact catches mistakes.","difficulty":"beginner","transfer":"Which action in your day would you want an agent to pause on?"},{"id":"asl4_q9","type":"explain","text":"Explain why a long chain of agent steps can fail even when each step is reliable.","simple":"Why can a long chain of reliable steps still fail?","options":["Each step has a small chance of error","Errors multiply across many steps","Checks and human review reduce the risk"],"correct":"If each step succeeds 95 percent of the time, twenty steps in a row succeed only about a third of the time, because the small errors multiply. That is why reliable agents keep chains short, validate results between steps, and let a person review important actions.","correctAnswers":["If each step succeeds 95 percent of the time, twenty steps in a row succeed only about a third of the time, because the small errors multiply. That is why reliable agents keep chains short, validate results between steps, and let a person review important actions."],"pairs":[],"explanation":"Strong answers include multiplying errors and a mitigation.","difficulty":"beginner","transfer":"A twenty-step homework agent fails a lot. Which two checks would you add?"}],"cards":[{"emoji":"🛠️","title":"Tools Create Consequences","body":"An agent becomes powerful when it can act. Every tool needs clear limits, validation, and logs.","funFact":null},{"emoji":"🛑","title":"Pause Before Impact","body":"People should approve actions that spend, send, publish, delete, or reveal sensitive information.","funFact":null},{"emoji":"🔑","title":"Least Privilege","body":"Give an agent only the permissions its task needs, like read-only access to one calendar. Fewer permissions mean smaller damage when something goes wrong.","funFact":null},{"emoji":"🪤","title":"Prompt Injection","body":"A prompt injection is text hidden in a webpage, email or file that tries to give the agent new orders. Agents should treat content they read as information, not instructions.","funFact":null},{"emoji":"🛡️","title":"Guardrails and Human Review","body":"A guardrail is a rule the system enforces no matter what the prompt says. Human review means a person checks risky or uncertain actions before they happen.","funFact":null}]},{"id":"asl_l5","title":"Ship the Right System","description":"Balance quality, speed, cost, and product value","order":4,"difficulty":"advanced","questions":[{"id":"asl5_q1","type":"multipleChoice","text":"Which cost matters most for an AI product?","simple":"Which cost matters most for an AI product?","options":["Cost per successful task","Cost per call alone","Cost of the app icon","Cost of the longest prompt"],"correct":"Cost per successful task","correctAnswers":["Cost per successful task"],"pairs":[],"explanation":"A cheap call that often fails can create retries and support work. Unit economics should include the cost of getting a useful result.","difficulty":"beginner","transfer":"Two models cost the same per call. How else would you compare them?"},{"id":"asl5_q2","type":"multipleChoice","text":"Short factual questions go to a small fast model, hard reasoning to a bigger one. What is this called?","simple":"Sending tasks to suitable models is called what?","options":["Model routing","Fine-tuning","Tokenization","Clustering"],"correct":"Model routing","correctAnswers":["Model routing"],"pairs":[],"explanation":"Routing sends each request to a model that fits it. Users get fast answers on easy tasks and the budget goes to the hard ones.","difficulty":"beginner","transfer":"A help desk has one expert and three trainees. How would you route questions?"},{"id":"asl5_q3","type":"fillInBlank","text":"The time a user waits for an answer is called __________.","simple":"The time you wait for an answer is called what?","options":["latency","accuracy","training","recall"],"correct":"latency","correctAnswers":["latency"],"pairs":[],"explanation":"Latency is part of product quality. A more capable answer can still be the wrong choice if users cannot wait for it.","difficulty":"beginner","transfer":"A translation app takes eight seconds per phrase. Who might stop using it, and why?"},{"id":"asl5_q4","type":"scenarioJudgment","text":"Routing more requests to a small model saved money but hurt hard answers. What should the team check first?","simple":"Cheaper routing hurt difficult answers. What should you check?","options":["Which request types the router sends to the small model","Whether the logo needs updating","Whether to remove all evaluation","Whether every answer should be longer"],"correct":"Which request types the router sends to the small model","correctAnswers":["Which request types the router sends to the small model"],"pairs":[],"explanation":"Routing only works when the router sorts requests well. Look at which hard cases were misrouted, then fix the rule or the classifier.","difficulty":"intermediate","transfer":"A triage nurse sends some serious cases to the wrong line. What would you look at before blaming the doctors?"},{"id":"asl5_q5","type":"multipleChoice","text":"When can caching help most?","simple":"When does caching help most?","options":["When the same useful input or prefix repeats","When every request is completely unrelated","When outputs must always be random","When there is no context"],"correct":"When the same useful input or prefix repeats","correctAnswers":["When the same useful input or prefix repeats"],"pairs":[],"explanation":"Caching can reuse previous results or model work. It reduces cost and latency when the repeated material is safe to reuse.","difficulty":"intermediate","transfer":"The same five questions get asked every day in a club chat. How could saved answers help?"},{"id":"asl5_q6","type":"scenarioJudgment","text":"A competitor can switch to the same model tomorrow. What is a stronger product advantage?","simple":"Rivals share your model. What can give you an advantage?","options":["Unique workflow, trusted data, and measured reliability","The model name in the headline","A longer list of AI terms","Changing providers every week"],"correct":"Unique workflow, trusted data, and measured reliability","correctAnswers":["Unique workflow, trusted data, and measured reliability"],"pairs":[],"explanation":"Models change quickly and are available to many teams. Product insight, useful data, distribution, and a proven reliability loop are harder to copy.","difficulty":"advanced","transfer":"Two study apps use the same AI model. What could make one clearly better to use?"},{"id":"asl5_q7","type":"scenarioJudgment","text":"An app answers in two seconds most of the day but forty seconds right after school. Likely cause?","simple":"Answers are slow at 3 p.m. when school ends. Why?","options":["Demand spikes and the servers queue requests","The model forgot its training","The font is too large","The logo colour changed"],"correct":"Demand spikes and the servers queue requests","correctAnswers":["Demand spikes and the servers queue requests"],"pairs":[],"explanation":"Latency rises when many requests arrive at once and wait in a queue. Capacity, caching and routing are the usual fixes.","difficulty":"beginner","transfer":"The cafeteria line is longest at noon. What could the cafeteria do that a server team could copy?"},{"id":"asl5_q8","type":"trueFalse","text":"A public leaderboard score guarantees the best model for your task.","simple":"Does a leaderboard score guarantee the best model for you?","options":["True","False"],"correct":"False","correctAnswers":["False"],"pairs":[],"explanation":"Your task differs from the benchmark. Your own eval tells you what works.","difficulty":"beginner","transfer":"What would your own eval include for a science tutor?"},{"id":"asl5_q9","type":"explain","text":"Explain why the whole system, not just the model, is the product.","simple":"Why is the whole system the product, not just the model?","options":["Competitors can use the same model","Workflow, evidence, and safety checks add value","Measured reliability builds trust"],"correct":"Any competitor can switch to the same model tomorrow, so the model alone is not an advantage. Lasting value comes from the workflow around it, the trusted data it draws on, the safety checks, and the measured reliability that earns user trust.","correctAnswers":["Any competitor can switch to the same model tomorrow, so the model alone is not an advantage. Lasting value comes from the workflow around it, the trusted data it draws on, the safety checks, and the measured reliability that earns user trust."],"pairs":[],"explanation":"Strong answers name at least two system parts beyond the model.","difficulty":"beginner","transfer":"Pick any app you use. Name two parts of it that matter besides the AI model."}],"cards":[{"emoji":"⚖️","title":"Measure the Tradeoff","body":"Quality, speed, and cost move together. Choose with your own task eval instead of a public leaderboard.","funFact":null},{"emoji":"🏗️","title":"The System Is the Product","body":"A model is one part. The workflow, evidence, safety checks, and learning loop create lasting value.","funFact":null},{"emoji":"⏱️","title":"Latency","body":"Latency is how long a user waits for an answer. It rises when many requests arrive at once, and people leave when it gets long.","funFact":null},{"emoji":"🪂","title":"Fallbacks","body":"A fallback is what the system does when its first plan fails: try a backup model, show a cached answer, or hand the request to a person.","funFact":null}]},{"id":"asl_l6","title":"How Sure Is the System?","description":"Confidence, calibration, base rates and when to hand off to a person","order":5,"difficulty":"intermediate","questions":[{"id":"asl6_q1","type":"multipleChoice","text":"A weather system says '70 percent chance of rain'. What does that mean?","simple":"What does a 70 percent chance of rain mean?","options":["On days like this, it rains about 7 times in 10","It will rain for 70 percent of the day","The system is 70 percent finished","Rain is certain today"],"correct":"On days like this, it rains about 7 times in 10","correctAnswers":["On days like this, it rains about 7 times in 10"],"pairs":[],"explanation":"A probability describes many similar cases. Out of ten days like this one, about seven would bring rain.","difficulty":"beginner","transfer":"A game says a rare item drops 10 percent of the time. What should you expect over 50 tries?"},{"id":"asl6_q2","type":"trueFalse","text":"A system that sounds very sure is more likely to be right.","simple":"Does sounding sure mean being right?","options":["True","False"],"correct":"False","correctAnswers":["False"],"pairs":[],"explanation":"Confidence is a feeling or a score, not a check. A system can be very sure and still wrong.","difficulty":"beginner","transfer":"A classmate answers instantly and confidently in a quiz. How would you check before copying?"},{"id":"asl6_q3","type":"fillInBlank","text":"A system whose 70 percent answers are right about 70 percent of the time is well __________.","simple":"When 70 percent means 70 percent, the system is well what?","options":["calibrated","compressed","tokenized","cached"],"correct":"calibrated","correctAnswers":["calibrated"],"pairs":[],"explanation":"Calibration means the confidence number matches how often the system is actually right. You can only know it by checking many cases.","difficulty":"beginner","transfer":"How would you test whether a friend's 'I'm 90 percent sure' is well calibrated?"},{"id":"asl6_q4","type":"scenarioJudgment","text":"A photo checker says 'cat, 51 percent'. The next step deletes non-cat photos. What should the system do?","simple":"A checker is unsure before deleting. What should happen?","options":["Flag it for a person instead of deleting","Delete it, since 51 is above half","Raise the confidence number to 100","Guess again with the same photo"],"correct":"Flag it for a person instead of deleting","correctAnswers":["Flag it for a person instead of deleting"],"pairs":[],"explanation":"When a mistake is costly and confidence is low, the safe move is to hand the case to a person. A threshold should depend on what a wrong answer costs.","difficulty":"beginner","transfer":"A spam filter is unsure about a message from your coach. Should it delete it or leave it in the inbox?"},{"id":"asl6_q5","type":"multipleChoice","text":"An illness affects 1 in 1,000 people and the test is 95 percent accurate. Most positive results are:","simple":"Rare illness, good test. Most positive results are what?","options":["False alarms, because far more healthy people get tested","Correct, because the test is 95 percent accurate","Impossible to have","Exactly half correct"],"correct":"False alarms, because far more healthy people get tested","correctAnswers":["False alarms, because far more healthy people get tested"],"pairs":[],"explanation":"Out of 1,000 people, about 1 is ill and about 50 healthy people still test positive. Most positives are false alarms. This is why base rates matter.","difficulty":"intermediate","transfer":"A cheating detector flags 5 percent of honest essays. In a class where nobody cheated, what does a flag mean?"},{"id":"asl6_q6","type":"sortOrder","text":"Order these steps for setting a confidence threshold, from first to last:","simple":"Put the steps for choosing a threshold in order.","options":["Pick a threshold that balances the two costs","Adjust the threshold if new cases show too many mistakes","Decide what false alarms and missed cases each cost","Check the threshold on new cases"],"correct":"","correctAnswers":["Decide what false alarms and missed cases each cost","Pick a threshold that balances the two costs","Check the threshold on new cases","Adjust the threshold if new cases show too many mistakes"],"pairs":[],"explanation":"You cannot pick a sensible threshold before knowing what each kind of mistake costs. Then you choose it, check it on cases the system has not seen, and adjust if needed.","difficulty":"intermediate","transfer":"A smoke alarm can be too sensitive or not sensitive enough. Which mistake costs more, and where would you set it?"},{"id":"asl6_q7","type":"scenarioJudgment","text":"A self-driving simulation slows and asks the driver to look when a hazard is unclear. What is this practicing?","simple":"The car simulation asks the driver to check unclear hazards. Why?","options":["Handing low-confidence cases to a person","Making the car drive faster","Ignoring the sensors","Turning off the brakes"],"correct":"Handing low-confidence cases to a person","correctAnswers":["Handing low-confidence cases to a person"],"pairs":[],"explanation":"When the system is not sure and the stakes are high, escalation to a person is the safe design. A good system knows when it does not know.","difficulty":"beginner","transfer":"Name one everyday app decision where you would want the app to ask you instead of guessing."},{"id":"asl6_q8","type":"trueFalse","text":"A system that says 'not sure' has failed and should have guessed instead.","simple":"Has a system failed when it says it is not sure?","options":["True","False"],"correct":"False","correctAnswers":["False"],"pairs":[],"explanation":"Saying
