t"],"pairs":[],"explanation":"Precise numbers with no source are a classic hallucination pattern. Find where the number came from.","difficulty":"beginner","transfer":"What would you search for to check the number?"},{"id":"aip3_q8","type":"trueFalse","text":"Primary sources are more reliable than an AI's summary of them.","simple":"Are primary sources more reliable than AI summaries?","options":["True","False"],"correct":"True","correctAnswers":["True"],"pairs":[],"explanation":"The original document says what it says. A summary can drop or distort details.","difficulty":"beginner","transfer":"When did a summary of something you read leave out a key point?"},{"id":"aip3_q9","type":"explain","text":"Describe the steps you would take to fact-check an AI claim.","simple":"Describe how you would fact-check an AI claim.","options":["Identify the specific claim","Search trusted or primary sources","Compare what they say with the AI"],"correct":"First I would pin down the exact claim, such as a date or number. Then I would search trusted or primary sources like an official site or a published study. Finally I would compare what those sources say with the AI's version and use only what checks out.","correctAnswers":["First I would pin down the exact claim, such as a date or number. Then I would search trusted or primary sources like an official site or a published study. Finally I would compare what those sources say with the AI's version and use only what checks out."],"pairs":[],"explanation":"Strong answers include isolating the claim, sources, and comparison.","difficulty":"beginner","transfer":"Fact-check one claim from an AI answer about your favourite animal. Which source would count as primary?"}],"cards":[{"emoji":"🔍","title":"Check the Sources","body":"AI can invent citations that look real but do not exist. Always search for a cited source to confirm it is real.","funFact":null},{"emoji":"📚","title":"Not a Replacement","body":"AI is great for starting research, but always verify claims and read original sources for important work.","funFact":null},{"emoji":"📚","title":"Primary Sources","body":"A primary source is the original: the study, the law, the interview, the data. A summary of it, human or AI, can drift. Go to the original when it matters.","funFact":null}]},{"id":"aip_l4","title":"AI for School & Work","description":"Using AI ethically in academic and professional settings","order":3,"difficulty":"intermediate","questions":[{"id":"aip4_q1","type":"multipleChoice","text":"Your school and teacher permit AI brainstorming, but require your own essay. Which approach follows those instructions?","simple":"AI brainstorming is allowed, essay must be yours. Which fits?","options":["Using AI to help brainstorm ideas before writing your own essay","Having AI write your entire essay and submitting it as your own","Using AI to take an exam for you remotely","Copying AI output verbatim into a research paper"],"correct":"Using AI to help brainstorm ideas before writing your own essay","correctAnswers":["Using AI to help brainstorm ideas before writing your own essay"],"pairs":[],"explanation":"Check the rules for each task. Here, brainstorming is permitted while the writing and reasoning must be yours.","difficulty":"beginner","transfer":"What permission would you check before using AI on another assignment?"},{"id":"aip4_q2","type":"multipleChoice","text":"Before using AI to write a client email, what should an employee check?","simple":"Before AI writes a work email, check what?","options":["Workplace AI policy","Public model leaderboard","Maximum token count","Image license"],"correct":"Workplace AI policy","correctAnswers":["Workplace AI policy"],"pairs":[],"explanation":"An organization's AI policy explains approved tools, privacy limits, review rules, and when AI assistance must be disclosed.","difficulty":"beginner","transfer":"You want to use AI for a school club newsletter. Whose rules apply, and how would you find them?"},{"id":"aip4_q3","type":"scenarioJudgment","text":"Your teacher says to cite any AI help. You used an AI assistant for your outline. What now?","simple":"You used AI for an outline. How should you disclose it?","options":["Add a note that AI assisted with the outline","Say nothing, since it was only an outline","Pretend you did everything yourself","Delete the outline and start over"],"correct":"Add a note that AI assisted with the outline","correctAnswers":["Add a note that AI assisted with the outline"],"pairs":[],"explanation":"The rule covers any help. A short honest note keeps you within the rule and shows what was yours.","difficulty":"beginner","transfer":"You used AI to fix grammar in a story. How would you say so in one honest line?"},{"id":"aip4_q4","type":"matchPairs","text":"Match each classroom situation to its permission or problem:","simple":"Match each classroom case to its rule or problem.","options":[],"correct":"","correctAnswers":[],"pairs":[{"term":"AI brainstorming is permitted; you write the essay","definition":"Allowed assistance"},{"term":"You claim AI-written text is entirely your work","definition":"Misrepresented authorship"},{"term":"AI grammar tools are banned for this task; you use one","definition":"A task rule was broken"},{"term":"You invent research results with AI","definition":"Fabricated evidence"}],"explanation":"Consider the task's rules, the skill being practiced, and honesty about your contribution. A tool allowed for one assignment may be inappropriate for another, so follow any accessibility arrangements agreed with your teacher.","difficulty":"beginner","transfer":"A teacher allows AI for practice quizzes only. Give one allowed use and one that breaks the rule."},{"id":"aip4_q5","type":"fillInBlank","text":"When using AI for work or school, it is important to maintain __________ about how you used the tool.","simple":"Being clear about AI help is called what?","options":["transparency","secrecy","confusion","indifference"],"correct":"transparency","correctAnswers":["transparency"],"pairs":[],"explanation":"Being transparent about AI use helps maintain trust, follows policies, and ensures you get credit for your genuine contributions while acknowledging AI assistance.","difficulty":"intermediate","transfer":"Your group used AI for the slide design. How would you note that on the project?"},{"id":"aip4_q6","type":"multipleChoice","text":"A colleague asks you to review a report that reads like pure AI output. What is the best approach?","simple":"A colleague's report reads like pure AI text. Best move?","options":["Privately suggest they add their own analysis and perspective","Report them to management immediately","Say nothing and approve the report","Rewrite it yourself using a different AI"],"correct":"Privately suggest they add their own analysis and perspective","correctAnswers":["Privately suggest they add their own analysis and perspective"],"pairs":[],"explanation":"A constructive approach is to privately encourage them to add personal insights and verify the content. This maintains the relationship while promoting responsible AI use.","difficulty":"advanced","transfer":"A teammate's part of a group project looks copied from a chatbot. What would you say to them first?"},{"id":"aip4_q7","type":"scenarioJudgment","text":"A friend wants to submit an AI-written essay as their own. What would you say?","simple":"A friend claims an AI essay is theirs. What would you say?","options":["That it breaks the rules and skips the learning","That it is fine if it is good","That they should add emojis","Nothing"],"correct":"That it breaks the rules and skips the learning","correctAnswers":["That it breaks the rules and skips the learning"],"pairs":[],"explanation":"Passing off AI work as your own is dishonest and means you learned nothing from the task.","difficulty":"beginner","transfer":"How could your friend use AI on that essay honestly?"},{"id":"aip4_q8","type":"trueFalse","text":"Following your school's or workplace's AI policy is part of using AI responsibly.","simple":"Is following the AI policy part of responsible use?","options":["True","False"],"correct":"True","correctAnswers":["True"],"pairs":[],"explanation":"Policies set what is allowed. When in doubt, ask and be open about your AI use.","difficulty":"beginner","transfer":"What is one thing you would ask a teacher about AI use?"},{"id":"aip4_q9","type":"explain","text":"Explain the difference between using AI to help you and using AI to replace your work.","simple":"Explain AI helping you versus AI replacing your work.","options":["Helping means brainstorming, checking, or feedback","Replacing means submitting its output as yours","Honesty and learning are the difference"],"correct":"Using AI to help means asking for ideas, checking grammar, or getting feedback while you still do the thinking and writing. Using it to replace your work means handing in its output as your own. The first builds your skills honestly, the second hides the truth and teaches you nothing.","correctAnswers":["Using AI to help means asking for ideas, checking grammar, or getting feedback while you still do the thinking and writing. Using it to replace your work means handing in its output as your own. The first builds your skills honestly, the second hides the truth and teaches you nothing."],"pairs":[],"explanation":"Strong answers contrast the two with honesty or learning as the reason.","difficulty":"beginner","transfer":"Give one example of AI helping with homework and one of AI replacing it."}],"cards":[{"emoji":"🎓","title":"Honest AI Use","body":"Check which tools and uses your school and teacher permit. Keep the thinking you are meant to practice, and explain any AI help. Choosing not to use AI is valid.","funFact":null},{"emoji":"💼","title":"AI at Work","body":"In professional settings, always follow your organization's AI policy. Be transparent about AI use.","funFact":null}]},{"id":"aip_l5","title":"Debugging AI Mistakes","description":"Why AI gets things wrong and how to fix it","order":4,"difficulty":"advanced","questions":[{"id":"aip5_q1","type":"multipleChoice","text":"An AI answer is wrong or unhelpful. What should you do before trying again?","simple":"An AI answer is wrong. What comes before trying again?","options":["Identify the problem and decide whether AI is still appropriate","Rewrite the prompt before checking what failed","Keep asking until you get the answer you expected","Assume a longer answer will fix the problem"],"correct":"Identify the problem and decide whether AI is still appropriate","correctAnswers":["Identify the problem and decide whether AI is still appropriate"],"pairs":[],"explanation":"A vague request may need clarification, but false facts need independent checking. You can switch to a trusted source, your own work, or human help, and stopping AI use can be a good decision.","difficulty":"beginner","transfer":"What would make you stop using AI for this task?"},{"id":"aip5_q2","type":"multipleChoice","text":"An AI misunderstands a vague request. Which technique should the user try first?","simple":"AI misread a vague request. Try what first?","options":["Prompt refinement","Model pre-training","Image classification","Data labeling"],"correct":"Prompt refinement","correctAnswers":["Prompt refinement"],"pairs":[],"explanation":"Prompt refinement adds missing context, constraints, or examples. It is often the fastest way to repair a vague request.","difficulty":"beginner","transfer":"You asked for 'a good game' and got a chess tutorial. How would you rewrite the request?"},{"id":"aip5_q3","type":"sortOrder","text":"Put these debugging steps in the most effective order:","simple":"Put the fix-it steps in the best order.","options":["Add constraints or examples to your prompt","Identify what went wrong in the response","Try the improved prompt","Review the original prompt for ambiguity"],"correct":"","correctAnswers":["Identify what went wrong in the response","Review the original prompt for ambiguity","Add constraints or examples to your prompt","Try the improved prompt"],"pairs":[],"explanation":"Effective AI debugging follows a cycle: diagnose the problem, analyze your prompt, refine it with more specificity, and test again.","difficulty":"beginner","transfer":"Your drawing prompt gave the wrong style. Walk through these steps for that case."},{"id":"aip5_q4","type":"scenarioJudgment","text":"You ask an AI for a formal business email, but the reply sounds casual. What should you try?","simple":"You wanted a formal email, got a casual one. Try what?","options":["State the tone and audience clearly in the prompt","Accept the casual tone as good enough","Decide that AI cannot write formal emails","Ask for a longer email"],"correct":"State the tone and audience clearly in the prompt","correctAnswers":["State the tone and audience clearly in the prompt"],"pairs":[],"explanation":"Tone is a detail the model cannot guess. Say who the reader is and how formal it should be.","difficulty":"intermediate","transfer":"You asked for a recipe and got one for eight people. What detail was missing from your prompt?"},{"id":"aip5_q5","type":"fillInBlank","text":"Providing the AI with a specific __________ of the desired output can help it understand exactly what you want.","simple":"Giving an output sample is giving a what?","options":["example","password","timer","discount"],"correct":"example","correctAnswers":["example"],"pairs":[],"explanation":"Showing the AI an example of what you want (few-shot prompting) is one of the most effective techniques for getting better results from any AI model.","difficulty":"intermediate","transfer":"You want a study schedule in a table. What would you show the assistant so it copies the layout?"},{"id":"aip5_q6","type":"matchPairs","text":"Match each AI mistake to its likely cause:","simple":"Match each AI mistake to its likely cause.","options":[],"correct":"","correctAnswers":[],"pairs":[{"term":"Off-topic response","definition":"Vague or ambiguous prompt"},{"term":"Outdated information","definition":"Training data cutoff"},{"term":"Made-up statistics","definition":"Hallucination tendency"},{"term":"Wrong format","definition":"Missing format instructions"}],"explanation":"Understanding why AI makes specific types of mistakes helps you craft better prompts and know when to verify outputs more carefully.","difficulty":"beginner","transfer":"An assistant gives last year's team roster. Which cause fits, and what would you add to the prompt?"},{"id":"aip5_q7","type":"scenarioJudgment","text":"You asked for a summary and got a poem. What is the fastest fix?","simple":"You asked for a summary and got a poem. Fastest fix?","options":["Restate the format clearly in the prompt","Give up","Ask for a longer poem","Switch languages"],"correct":"Restate the format clearly in the prompt","correctAnswers":["Restate the format clearly in the prompt"],"pairs":[],"explanation":"Most wrong outputs come from unclear prompts. Fixing the prompt is the quickest debug step.","difficulty":"beginner","transfer":"What exact words would you add to the prompt?"},{"id":"aip5_q8","type":"trueFalse","text":"Adding an example of the output you want can fix many AI mistakes.","simple":"Can an example of the output fix many mistakes?","options":["True","False"],"correct":"True","correctAnswers":["True"],"pairs":[],"explanation":"An example shows format, tone, and length at once. It removes guesswork.","difficulty":"beginner","transfer":"What example would you give for a thank-you note?"},{"id":"aip5_q9","type":"explain","text":"Describe the debug loop for fixing a bad AI response.","simple":"Describe the debug loop for a bad AI response.","options":["Spot what went wrong","Check the prompt for vague wording","Add specifics and try again"],"correct":"First I look at the response and name what went wrong, such as wrong tone or missing detail. Then I check my prompt for vague wording that could have caused it. I add specifics or an example, run it again, and repeat until it fits.","correctAnswers":["First I look at the response and name what went wrong, such as wrong tone or missing detail. Then I check my prompt for vague wording that could have caused it. I add specifics or an example, run it again, and repeat until it fits."],"pairs":[],"explanation":"Strong answers include diagnosis, prompt check, and retry.","difficulty":"beginner","transfer":"Describe the last time a helper gave you something wrong. Which step of the loop would have fixed it?"}],"cards":[{"emoji":"🔧","title":"Diagnose Before Retrying","body":"Check what failed. Clarify a vague request, verify uncertain facts, or choose another way to do the task. Better wording cannot guarantee a correct answer.","funFact":null},{"emoji":"🔄","title":"Know When to Stop","body":"Retry only when AI still fits the task. If you cannot check the result, need your own practice, or lack permission, use another approach or ask for help.","funFact":null},{"emoji":"🧩","title":"Show an Example","body":"If you can show the shape of the answer you want, a short example in the prompt often fixes format and tone mistakes faster than more instructions.","funFact":null}]},{"id":"aip_l6","title":"AI Power User","description":"Advanced workflows and techniques","order":5,"difficulty":"advanced","questions":[{"id":"aip6_q1","type":"multipleChoice","text":"What is 'prompt chaining'?","simple":"What is prompt chaining?","options":["Using the output of one AI prompt as input for the next","Asking the same question to multiple AI models at once","Repeating the same prompt until you get a good answer","Connecting multiple AI accounts together"],"correct":"Using the output of one AI prompt as input for the next","correctAnswers":["Using the output of one AI prompt as input for the next"],"pairs":[],"explanation":"Prompt chaining breaks complex tasks into smaller steps, using each AI response to inform the next prompt. This technique produces higher quality results for complex work.","difficulty":"beginner","transfer":"Describe two prompts you would chain for a class presentation."},{"id":"aip6_q2","type":"trueFalse","text":"Using different approved AI tools for different parts of a project can be a good strategy.","simple":"Can different approved tools for different parts be a good plan?","options":["True","False"],"correct":"True","correctAnswers":["True"],"pairs":[],"explanation":"Specialized tools can help with different tasks such as writing, images, data, or code. Check each output and follow the privacy rules for every tool you use.","difficulty":"beginner","transfer":"For a science poster, which parts might use a writing helper and which an image tool?"},{"id":"aip6_q3","type":"scenarioJudgment","text":"You need a renewable energy presentation. What should you decide before using AI?","simple":"Before AI helps with a presentation, decide what?","options":["Check the assignment rules and which thinking you must do yourself","Use AI for every step and add a disclosure at the end","Choose the tool with the most polished slides"],"correct":"Check the assignment rules and which thinking you must do yourself","correctAnswers":["Check the assignment rules and which thinking you must do yourself"],"pairs":[],"explanation":"Check the learning goal and assignment rules to decide which steps, if any, permit AI help. Keep responsibility for your reasoning, check any output you use, and remember the task can be done without AI.","difficulty":"beginner","transfer":"Your teacher wants your own conclusions. Which parts of a report must you write yourself?"},{"id":"aip6_q4","type":"sortOrder","text":"Put these steps of an AI-assisted research workflow in order:","simple":"Put the AI-assisted research steps in order.","options":["Write the final draft with your own analysis","Use AI to summarize key findings","Define your research question clearly","Verify AI summaries against original sources"],"correct":"","correctAnswers":["Define your research question clearly","Use AI to summarize key findings","Verify AI summaries against original sources","Write the final draft with your own analysis"],"pairs":[],"explanation":"An effective AI-assisted workflow starts with clear goals, uses AI for heavy lifting, verifies the output, and finishes with your own critical thinking and writing.","difficulty":"intermediate","transfer":"Use these steps to plan a report on a sport. Where would you check the AI summary?"},{"id":"aip6_q5","type":"fillInBlank","text":"A __________ prompt includes context, instructions, examples, and constraints to get the best AI output.","simple":"A prompt with context, instructions, examples and limits is what?","options":["structured","random","shortest","encrypted"],"correct":"structured","correctAnswers":["structured"],"pairs":[],"explanation":"Structured prompts that include clear context, specific instructions, relevant examples, and explicit constraints consistently produce better results from AI models.","difficulty":"intermediate","transfer":"Write the four parts of a structured prompt for planning a birthday party."},{"id":"aip6_q6","type":"multipleChoice","text":"What is a key advantage of using AI to iterate on your work?","simple":"What is one real advantage of iterating with AI?","options":["You can quickly compare several approaches and variations","It removes the need for any human review","Each new version is guaranteed to be better","It replaces the need to understand the task"],"correct":"You can quickly compare several approaches and variations","correctAnswers":["You can quickly compare several approaches and variations"],"pairs":[],"explanation":"Fast variations help you see options and choose. Judging which version is better is still your job.","difficulty":"advanced","transfer":"You are designing a logo. How could asking for three versions help you decide?"},{"id":"aip6_q7","type":"scenarioJudgment","text":"You want AI to write a story, then turn it into a comic script. What technique is this?","simple":"AI writes a story, then makes it a comic script. Technique?","options":["Prompt chaining","Overfitting","Clustering","Tokenization"],"correct":"Prompt chaining","correctAnswers":["Prompt chaining"],"pairs":[],"explanation":"Feeding one output into the next prompt breaks a big task into steps.","difficulty":"beginner","transfer":"What three steps would you chain for a science poster?"},{"id":"aip6_q8","type":"trueFalse","text":"Power users still review AI results instead of trusting them blindly.","simple":"Do power users still review AI results?","options":["True","False"],"correct":"True","correctAnswers":["True"],"pairs":[],"explanation":"Combining tools multiplies the chances for errors. Review stays essential.","difficulty":"beginner","transfer":"Which step of a chained task is most likely to introduce a mistake?"},{"id":"aip6_q9","type":"explain","text":"Explain how you would break a big project into AI-assisted steps.","simple":"How would you break a big project into AI-assisted steps?","options":["Split the task into stages","Use each output as the next input","Review and add your own thinking at each stage"],"correct":"I would split the project into stages, such as research, outline, draft, and visuals. Each stage's output becomes the input to the next prompt. At every stage I review the result, fix errors, and add my own ideas so the final work is mine.","correctAnswers":["I would split the project into stages, such as research, outline, draft, and visuals. Each stage's output becomes the input to the next prompt. At every stage I review the result, fix errors, and add my own ideas so the final work is mine."],"pairs":[],"explanation":"Strong answers include stages, chaining, and human review.","difficulty":"beginner","transfer":"Split a science fair project into three AI-assisted stages and say what you check at each."}],"cards":[{"emoji":"🔗","title":"Chain Your Prompts","body":"Break big tasks into steps and feed each AI answer into your next prompt. Complex work gets easier one step at a time.","funFact":null},{"emoji":"🧩","title":"Combine Your Tools","body":"Power users mix tools: one AI for writing, another for images, another for code. Use each one's strengths, and always review the results.","funFact":null},{"emoji":"🏗️","title":"Structured Prompts","body":"A structured prompt has four parts: context about the situation, clear instructions, an example if you have one, and limits such as length or format.","funFact":null}]},{"id":"aip_l7","title":"Feeds and Recommendations","description":"How ranking systems decide what you see, and what you control","order":6,"difficulty":"beginner","questions":[{"id":"aip7_q1","type":"multipleChoice","text":"A video app decides which clip to show you next. What is it mostly predicting?","simple":"What does a video app predict when picking your next clip?","options":["What you are likely to watch or keep scrolling","What is most true","What your teacher would choose","What was posted most recently"],"correct":"What you are likely to watch or keep scrolling","correctAnswers":["What you are likely to watch or keep scrolling"],"pairs":[],"explanation":"A recommendation system ranks items by predicted engagement, such as taps or watch time. It is a prediction about you, not a judgment about quality.","difficulty":"beginner","transfer":"A music app keeps playing one style. What signal from you is it probably using?"},{"id":"aip7_q2","type":"trueFalse","text":"Two people who open the same app see the same feed.","simple":"Do two people see the same feed in the same app?","options":["True","False"],"correct":"False","correctAnswers":["False"],"pairs":[],"explanation":"Feeds are ranked per person from their own history. Two friends can see completely different videos in the same app.","difficulty":"beginner","transfer":"Compare your feed with a family member's for one minute. What differs, and why might that be?"},{"id":"aip7_q3","type":"fillInBlank","text":"A feed that keeps showing you more of the same views can create a filter __________.","simple":"Seeing only the same views creates a filter what?","options":["bubble","token","cache","weight"],"correct":"bubble","correctAnswers":["bubble"],"pairs":[],"explanation":"A filter bubble is when ranking narrows what you see to things like what you already liked. Widening what you follow and search for helps.","difficulty":"beginner","transfer":"Name one thing you could do this week to widen what a feed shows you."},{"id":"aip7_q4","type":"scenarioJudgment","text":"Your feed is full of one topic you no longer enjoy. What is the most direct fix inside the app?","simple":"Your feed is stuck on a topic. Most direct fix?","options":["Use 'not interested' or unfollow, then engage with other topics","Watch more of it so the app gets bored","Delete your account","Wait for the app to change on its own"],"correct":"Use 'not interested' or unfollow, then engage with other topics","correctAnswers":["Use 'not interested' or unfollow, then engage with other topics"],"pairs":[],"explanation":"Your actions are the signal. Telling the app what you do not want and spending time on other things changes the ranking.","difficulty":"beginner","transfer":"A game store keeps suggesting one genre. Which two actions would change that?"},{"id":"aip7_q5","type":"matchPairs","text":"Match each control to what it changes in your feed:","simple":"Match each control to what it changes.","options":[],"correct":"","correctAnswers":[],"pairs":[{"term":"Follow or unfollow","definition":"Who can appear in your feed"},{"term":"Not interested","definition":"Lowers similar items in ranking"},{"term":"Time limit","definition":"How long you scroll, not what you see"},{"term":"Chronological mode","definition":"Newest first instead of ranked"}],"explanation":"Different controls act on different parts of the system. Knowing which does what makes the settings useful.","difficulty":"intermediate","transfer":"Which of these controls would help most if you want to see posts from friends first?"},{"id":"aip7_q6","type":"multipleChoice","text":"An app optimizes for watch time. Why can that differ from what is good for you?","simple":"Why is more watch time not always good for you?","options":["Time spent is not the same as feeling better or learning","Watch time cannot be measured","Apps only optimize for truth","Longer videos are always better"],"correct":"Time spent is not the same as feeling better or learning","correctAnswers":["Time spent is not the same as feeling better or learning"],"pairs":[],"explanation":"The system is rewarded for attention. Attention and wellbeing can point in different directions, which is why the goal matters.","difficulty":"intermediate","transfer":"If you designed a feed for a homework app, what would you optimize for instead of watch time?"},{"id":"aip7_q7","type":"scenarioJudgment","text":"A friend says 'the app knows what I like'. What is the more accurate way to say it?","simple":"The app 'knows what I like'. Say it more accurately.","options":["It predicts what I will tap from what I did before","It reads my mind","It asks my friends","It picks the best videos for everyone"],"correct":"It predicts what I will tap from what I did before","correctAnswers":["It predicts what I will tap from what I did before"],"pairs":[],"explanation":"The app has no idea what you like. It has a record of what you tapped and a model that predicts more of it.","difficulty":"beginner","transfer":"Explain to a younger cousin, in one sentence, how a video app picks what they see."},{"id":"aip7_q8","type":"trueFalse","text":"Asking 'why am I seeing this?' is a reasonable question to ask any feed.","simple":"Is 'why am I seeing this?' a fair question?","options":["True","False"],"correct":"True","correctAnswers":["True"],"pairs":[],"explanation":"Many apps offer a reason for a recommendation. Asking is how you learn what signals the system uses.","difficulty":"beginner","transfer":"Find one recommendation today and guess which action of yours caused it."},{"id":"aip7_q9","type":"explain","text":"Explain how a feed ranks what you see and two ways you can change it.","simple":"Explain how a feed ranks things and two ways to change it.","options":["Ranking predicts what you will engage with","Your past actions are the signal","Controls like unfollow, not interested, or time limits change it"],"correct":"A feed uses a model that predicts what I am likely to tap or watch, based on what I did before, and shows those items first. I can change it by unfollowing or marking things not interested, by spending time on other topics, and by using settings like chronological mode or time limits.","correctAnswers":["A feed uses a model that predicts what I am likely to tap or watch, based on what I did before, and shows those items first. I can change it by unfollowing or marking things not interested, by spending time on other topics, and by using settings like chronological mode or time limits."],"pairs":[],"explanation":"Strong answers name the prediction goal and at least two specific controls.","difficulty":"beginner","transfer":"Pick one app you use and write the two settings you would change first."}],"cards":[{"emoji":"📱","title":"A Feed Is a Ranking","body":"A feed is a list sorted by a prediction: which item are you most likely to tap, watch or keep scrolling? That prediction comes from what you did before.","funFact":null},{"emoji":"🎯","title":"The Goal Matters","body":"Most feeds optimize for attention, such as watch time. Attention is not the same as feeling good, learning something or seeing your friends.","funFact":null},{"emoji":"🫧","title":"Filter Bubbles","body":"When a feed keeps showing what you already liked, your view narrows. Following different people and searching for new topics widens it again.","funFact":null},{"emoji":"🎛️","title":"Controls You Have","body":"Follow, unfollow, not interested, time limits and a newest-first mode each change a different part of the system. Your actions are the strongest signal of all.","funFact":null}]}],"bigIdeas":["learning"]},{"id":"future_of_ai","name":"AI Tomorrow","icon":"arrow.trianglehead.merge","color":"aiCyan","description":"What will AI look like when you grow up?","order":14,"unlock":{"kind":"completeTier2Minimum","value":6},"lessons":[{"id":"fa_l1","title":"Artificial General Intelligence","description":"The quest for human-level AI","order":0,"difficulty":"intermediate","questions":[{"id":"fa1_q1","type":"multipleChoice","text":"AGI (Artificial General Intelligence) would be:","simple":"What would general AI be?","options":["AI that can do any intellectual task a human can","A faster version of today's chatbots","AI only for scientific research","A chatbot that passes the Turing Test"],"correct":"AI that can do any intellectual task a human can","correctAnswers":["AI that can do any intellectual task a human can"],"pairs":[],"explanation":"AGI would match human-level intelligence across all cognitive domains: reasoning, creativity, social understanding.","difficulty":"beginner","transfer":"A robot vacuum is brilliant at cleaning. Is it general AI? Why?"},{"id":"fa1_q2","type":"trueFalse","text":"As of the mid-2020s, AGI has been achieved.","simple":"Has general AI been achieved?","options":["True","False"],"correct":"False","correctAnswers":["False"],"pairs":[],"explanation":"Despite rapid progress in LLMs and multimodal AI, no system has achieved AGI. All current AI remains narrow or specialized.","difficulty":"beginner","transfer":"A headline says a company 'reached AGI'. What would you want to see tested?"},{"id":"fa1_q3","type":"fillInBlank","text":"The gap between today's narrow AI and __________ intelligence is AI's biggest unsolved challenge.","simple":"The gap between narrow AI and what kind of intelligence?","options":["general","narrow","basic","simple"],"correct":"general","correctAnswers":["general"],"pairs":[],"explanation":"Current AI excels at specific tasks but lacks flexible, transferable reasoning. Bridging this gap may need entirely new approaches.","difficulty":"beginner","transfer":"List three very different tasks one system would need to do to count as general."},{"id":"fa1_q4","type":"multipleChoice","text":"When top researchers debate AGI timelines, their estimates:","simple":"When experts guess AGI dates, their guesses:","options":["Vary hugely, from a decade to over a century","All converge around 2030","All agree it's impossible","All agree on 2045"],"correct":"Vary hugely, from a decade to over a century","correctAnswers":["Vary hugely, from a decade to over a century"],"pairs":[],"explanation":"There is deep disagreement. Hinton thinks it could come in decades; LeCun argues current approaches are insufficient.","difficulty":"intermediate","transfer":"Two experts give dates 50 years apart. What does that tell you about the question?"},{"id":"fa1_q5","type":"scenarioJudgment","text":"A startup claims to have built AGI and wants your investment. How do you react?","simple":"A startup claims it built AGI. How should you check?","options":["Be very skeptical and demand independent evaluation","Invest quickly before the opportunity passes","Dismiss it without looking","Wait to see the stock price"],"correct":"Be very skeptical and demand independent evaluation","correctAnswers":["Be very skeptical and demand independent evaluation"],"pairs":[],"explanation":"Any AGI claim needs extreme scrutiny. Extraordinary claims require extraordinary evidence verified by independent researchers.","difficulty":"intermediate","transfer":"Design one test you would run before believing a claim of general intelligence."},{"id":"fa1_q6","type":"multipleChoice","text":"Why is AGI considered potentially transformative?","simple":"Why could general AI be such a big change?","options":["It could solve problems beyond human cognitive capability","It would be cheaper to run","It's only a marginal improvement","It's mainly useful for entertainment"],"correct":"It could solve problems beyond human cognitive capability","correctAnswers":["It could solve problems beyond human cognitive capability"],"pairs":[],"explanation":"AGI could accelerate scientific discovery, address climate change, develop medicines, and solve problems too complex for any individual.","difficulty":"advanced","transfer":"Name one problem that is hard for people, and one reason a machine might not solve it either."},{"id":"fa1_q7","type":"scenarioJudgment","text":"A program beats everyone at chess but cannot write a sentence. Is it general intelligence?","simple":"A chess champion program cannot write. Is it general AI?","options":["No, it is narrow AI","Yes, chess is hard","Yes, it beat humans","Only if it wins twice"],"correct":"No, it is narrow AI","correctAnswers":["No, it is narrow AI"],"pairs":[],"explanation":"General intelligence would handle many kinds of tasks. Excellence at one task is narrow AI.","difficulty":"beginner","transfer":"What tasks would a system need to do before you called it general?"},{"id":"fa1_q8","type":"trueFalse","text":"Experts agree on exactly when general AI will arrive.","simple":"Do experts agree on when general AI will arrive?","options":["True","False"],"correct":"False","correctAnswers":["False"],"pairs":[],"explanation":"Estimates range from years to never. Treat any confident date as a guess.","difficulty":"beginner","transfer":"How would you respond to a headline saying general AI arrives next year?"},{"id":"fa1_q9","type":"explain","text":"Explain the difference between narrow AI and general AI.","simple":"Explain narrow AI versus general AI.","options":["Narrow AI does one kind of task","General AI would handle many kinds of tasks","General AI does not exist yet"],"correct":"Narrow AI is built for one kind of task, like recognising faces or playing a game, and cannot do anything else. General AI would learn and handle almost any intellectual task the way a person can. Every AI that exists today is narrow.","correctAnswers":["Narrow AI is built for one kind of task, like recognising faces or playing a game, and cannot do anything else. General AI would learn and handle almost any intellectual task the way a person can. Every AI that exists today is narrow."],"pairs":[],"explanation":"Strong answers define both and note today's AI is narrow.","difficulty":"beginner","transfer":"Explain to a younger student why a chess champion program is not a general thinker."}],"cards":[{"emoji":"🔮","title":"What Comes Next?","body":"AI is getting more powerful every year. Future AI might help solve climate change, cure diseases, and explore space.","funFact":null},{"emoji":"⚡","title":"Faster Than Expected","body":"AI progress has surprised even experts. Many things AI can do today were predicted to take decades longer.","funFact":null},{"emoji":"🎯","title":"Narrow and General","body":"Narrow AI does one kind of task, like recognising faces or playing chess. General AI would handle many different tasks the way a person can. General AI does not exist today, and experts disagree about when, or whether, it will.","funFact":null}]},{"id":"fa_l2","title":"AI Safety & Existential Risk","description":"The big concerns about advanced AI","order":1,"difficulty":"advanced","questions":[{"id":"fa2_q1","type":"multipleChoice","text":"AI existential risk refers to:","simple":"What does AI existential risk mean?","options":["Advanced AI potentially threatening human civilization","AI systems becoming commercially obsolete","Economic disruption from job automation","Environmental cost of training models"],"correct":"Advanced AI potentially threatening human civilization","correctAnswers":["Advanced AI potentially threatening human civilization"],"pairs":[],"explanation":"Existential risk focuses on scenarios where highly capable AI acts in ways misaligned with human values at civilization-threatening scale.","difficulty":"beginner","transfer":"Why do people study AI safety before problems appear?"},{"id":"fa2_q2","type":"trueFalse","text":"AI researchers broadly agree that long-term risk is the single most urgent AI concern.","simple":"Do researchers agree long-term risk is the top concern?","options":["True","False"],"correct":"False","correctAnswers":["False"],"pairs":[],"explanation":"Researchers disagree. Some focus on long-term risks while others focus on today's harms like bias and misuse.","difficulty":"beginner","transfer":"Name one AI harm that exists today and one that is a possible future risk."},{"id":"fa2_q3","type":"fillInBlank","text":"AI __________ research focuses on ensuring advanced AI stays beneficial and controllable.","simple":"Research that keeps advanced AI helpful and in control is AI what?","options":["safety","efficiency","performance","deployment"],"correct":"safety","correctAnswers":["safety"],"pairs":[],"explanation":"AI safety spans alignment, interpretability, robustness, and governance, all aimed at keeping powerful AI under human oversight.","difficulty":"beginner","transfer":"Name one safety habit for a home robot that a safety researcher might study."},{"id":"fa2_q4","type":"matchPairs","text":"Match AI safety concepts:","simple":"Match each safety idea to its meaning.","options":[],"correct":"","correctAnswers":[],"pairs":[{"term":"Alignment","definition":"AI goals match what people want"},{"term":"Safe limits","definition":"AI can only act inside set boundaries"},{"term":"Correctable","definition":"People can fix it or switch it off"},{"term":"Explainable","definition":"People can see why it decided"}],"explanation":"Safety researchers work on all four ideas. Together they keep AI helpful and under human control.","difficulty":"beginner","transfer":"Which of these four ideas matters most for a robot that can turn itself off? Why?"},{"id":"fa2_q5","type":"multipleChoice","text":"In 2023, hundreds of researchers signed a statement comparing AI risk to pandemics and nuclear war. Their goal:","simple":"In 2023 many researchers signed a statement on AI risk. Their goal?","options":["Elevate AI safety as a serious global priority","Generate publicity for their companies","Call for a permanent halt to all AI research","Declare current AI is already dangerous"],"correct":"Elevate AI safety as a serious global priority","correctAnswers":["Elevate AI safety as a serious global priority"],"pairs":[],"explanation":"The Center for AI Safety statement aimed to legitimize AI risk discussion and encourage proactive safety research, not to stop development.","difficulty":"intermediate","transfer":"A group of experts signs a warning. What would you check before deciding how seriously to take it?"},{"id":"fa2_q6","type":"scenarioJudgment","text":"Should safety concerns affect how fast a powerful AI system is built and released?","simple":"Should safety concerns change how fast AI is built?","options":["Yes, and the right balance depends on the specific risks","No, speed should always come first","Yes, all AI research should stop until safety is solved","No, safety only matters after release"],"correct":"Yes, and the right balance depends on the specific risks","correctAnswers":["Yes, and the right balance depends on the specific risks"],"pairs":[],"explanation":"Some systems carry small risks and can move fast; others affect health, money or safety and need testing before release. The answer depends on what could go wrong.","difficulty":"advanced","transfer":"Give one AI use where slowing down makes sense and one where it may not."},{"id":"fa2_q7","type":"scenarioJudgment","text":"A delivery robot must choose between a fast route and a safe one. Who should set that rule?","simple":"A robot picks fast or safe. Who sets that rule?","options":["People who design and oversee it","The robot alone","Whoever is in a hurry","Nobody"],"correct":"People who design and oversee it","correctAnswers":["People who design and oversee it"],"pairs":[],"explanation":"Important choices about safety stay with humans. Machines follow rules people set and check.","difficulty":"beginner","transfer":"What rule would you give a delivery robot near a school?"},{"id":"fa2_q8","type":"trueFalse","text":"AI safety research tries to keep advanced AI helpful and under control.","simple":"Does AI safety research try to keep AI helpful and controllable?","options":["True","False"],"correct":"True","correctAnswers":["True"],"pairs":[],"explanation":"Safety work covers testing, alignment, and human oversight so systems do what people intend.","difficulty":"beginner","transfer":"Name one everyday product that also needed safety rules when it was new."},{"id":"fa2_q9","type":"explain","text":"Explain what human in the loop means and why it matters for powerful AI.","simple":"What is human in the loop, and why does it matter?","options":["A person checks or approves important decisions","AI can make serious mistakes","Oversight keeps people in control"],"correct":"Human in the loop means a person reviews or approves important decisions instead of letting the system act alone. It matters because AI can make serious mistakes without knowing, and keeping a person involved means someone can stop a bad action and stay responsible.","correctAnswers":["Human in the loop means a person reviews or approves important decisions instead of letting the system act alone. It matters because AI can make serious mistakes without knowing, and keeping a person involved means someone can stop a bad action and stay responsible."],"pairs":[],"explanation":"Strong answers define it and give a reason about mistakes or control.","difficulty":"beginner","transfer":"Pick one decision at your school that should always have a person in the loop."}],"cards":[{"emoji":"🤖","title":"Autonomous Systems","body":"Future AI will make more decisions on its own: self-driving cars, robot delivery, automated factories.","funFact":null},{"emoji":"🧑‍🤝‍🧑","title":"Human in the Loop","body":"Even as AI gets smarter, humans will stay in control of important decisions. Partnership, not replacement.","funFact":null},{"emoji":"🧭","title":"Four Safety Words","body":"Value alignment means the system's goals match what people want. Containment limits what it can reach. Corrigibility means it can be corrected or switched off. Interpretability means people can see why it decided.","funFact":null}]},{"id":"fa_l3","title":"AI Governance","description":"How the world will manage AI","order":2,"difficulty":"advanced","questions":[{"id":"fa3_q1","type":"multipleChoice","text":"AI governance includes:","simple":"What does AI governance include?","options":["International rules, national laws, and industry standards","Governments replaced by AI decision-makers","AI creating its own regulations","Banning all AI until governments approve each project"],"correct":"International rules, national laws, and industry standards","correctAnswers":["International rules, national laws, and industry standards"],"pairs":[],"explanation":"AI governance involves policies, regulations, technical standards, and ethical frameworks for responsible AI development.","difficulty":"beginner","transfer":"Who should have a say in rules for AI at your school?"},{"id":"fa3_q2","type":"trueFalse","text":"Major regions regulate AI in the same way.","simple":"Do regions regulate AI the same way?","options":["True","False"],"correct":"False","correctAnswers":["False"],"pairs":[],"explanation":"Approaches differ: some regions use one broad law, others rely on sector rules or guidance. This is why companies face different rules in different places.","difficulty":"beginner","transfer":"Why might two countries choose different rules for the same technology?"},{"id":"fa3_q3","type":"multipleChoice","text":"Why is AI governance harder than regulating other technologies?","simple":"Why is governing AI harder than other technology?","options":["AI evolves faster than laws can keep up","Too few companies work on AI","AI is too simple to need oversight","All nations already agreed on a framework"],"correct":"AI evolves faster than laws can keep up","correctAnswers":["AI evolves faster than laws can keep up"],"pairs":[],"explanation":"Rapid development, dual-use nature, and unpredictable capabilities make it hard for traditional regulation to keep pace.","difficulty":"beginner","transfer":"A game adds a new AI feature every month. How could rules keep up?"},{"id":"fa3_q4","type":"fillInBlank","text":"__________ AI governance requires collaboration between governments, companies, researchers, and civil society.","simple":"What kind of governance needs many groups working together?","options":["Effective","Corporate","Reactive","Voluntary"],"correct":"Effective","correctAnswers":["Effective"],"pairs":[],"explanation":"No single stakeholder can govern AI alone. Effective governance demands diverse input from technical, ethical, and democratic perspectives.","difficulty":"intermediate","transfer":"Which group is missing if only companies write the rules?"},{"id":"fa3_q5","type":"matchPairs","text":"Match global AI governance milestones:","simple":"Match each governance effort to what it is about.","options":[],"correct":"","correctAnswers":[],"pairs":[{"term":"EU AI Act","definition":"Risk-based regulatory framework"},{"term":"UK AI Safety Summit","definition":"International dialogue on frontier risks"},{"term":"OECD AI Principles","definition":"International trustworthy AI guidelines"},{"term":"China's AI regulations","definition":"Rules on algorithms and deepfakes"}],"explanation":"Different regions take varied but complementary approaches reflecting different values and priorities.","difficulty":"beginner","transfer":"Why might different regions choose different approaches to AI rules?"},{"id":"fa3_q6","type":"scenarioJudgment","text":"Should AI companies set their own rules with no outside oversight?","simple":"Should AI companies police themselves with no outside checks?","options":["No, independent oversight reduces conflicts of interest","Yes, companies understand the technology best","Yes, if the company is large enough","No, because companies should not be consulted at all"],"correct":"No, independent oversight reduces conflicts of interest","correctAnswers":["No, independent oversight reduces conflicts of interest"],"pairs":[],"explanation":"Companies know their products but also profit from them. Outside review, with company input, is how most safety-critical industries work.","difficulty":"advanced","transfer":"Why do sports have referees instead of letting teams call their own fouls?"},{"id":"fa3_q7","type":"scenarioJudgment","text":"A new AI product launches worldwide in a week. Why is that hard for lawmakers?","simple":"An AI product launches worldwide in a week. Why hard for lawmakers?","options":["Laws take much longer to write than software","Lawmakers dislike computers","Products are illegal","Laws update automatically"],"correct":"Laws take much longer to write than software","correctAnswers":["Laws take much longer to write than software"],"pairs":[],"explanation":"AI evolves faster than laws can be written and passed. Governance has to keep catching up.","difficulty":"beginner","transfer":"What rule would you want in place before a new AI tool reached your school?"},{"id":"fa3_q8","type":"trueFalse","text":"AI governance involves governments, companies, and researchers together.","simple":"Does AI governance involve many groups together?","options":["True","False"],"correct":"True","correctAnswers":["True"],"pairs":[],"explanation":"No single group can manage AI alone. Laws, standards, and research all play a part.","difficulty":"beginner","transfer":"Which group do you think should have the biggest say, and why?"},{"id":"fa3_q9","type":"explain","text":"Explain why AI companies should not be the only ones setting AI rules.","simple":"Why should companies not be the only ones setting AI rules?","options":["Companies have a conflict of interest","Independent oversight protects the public","Many groups need a voice"],"correct":"Companies profit from their products, so they have a reason to write rules that favour themselves. Independent oversight from governments and researchers protects the public and gives teachers, patients, and other affected people a voice.","correctAnswers":["Companies profit from their products, so they have a reason to write rules that favour themselves. Independent oversight from governments and researchers protects the public and gives teachers, patients, and other affected people a voice."],"pairs":[],"explanation":"Strong answers mention conflict of interest and independent oversight.","difficulty":"beginner","transfer":"Give one example of a rule that a company might not write for itself."}],"cards":[{"emoji":"🧠","title":"AGI: The Big Goal","body":"AGI would be AI that thinks as flexibly as humans. Experts disagree on when or if it will happen.","funFact":null},{"emoji":"⚠️","title":"Safety First","body":"As AI gets more powerful, safety research matters more. Advanced AI must be helpful and aligned with human values.","funFact":null}]},{"id":"fa_l4","title":"AI & Society","description":"How AI will transform daily life","order":3,"difficulty":"intermediate","questions":[{"id":"fa4_q1","type":"multipleChoice","text":"How will AI most likely reshape society?","simple":"How is AI most likely to change society?","options":["Gradually transforming work, learning, and services","Having no impact outside tech","Immediately eliminating all jobs","Only affecting wealthy nations"],"correct":"Gradually transforming work, learning, and services","correctAnswers":["Gradually transforming work, learning, and services"],"pairs":[],"explanation":"AI's societal impact will be broad but uneven, affecting healthcare, agriculture, education, and creative arts globally.","difficulty":"beginner","transfer":"How might AI change one job you see every day?"},{"id":"fa4_q2","type":"trueFalse","text":"AI is already being used to help fight climate change.","simple":"Is AI already used to help with climate work?","options":["True","False"],"correct":"True","correctAnswers":["True"],"pairs":[],"explanation":"Pattern-finding systems help cut cooling energy in data centres, improve weather forecasts, and plan power grids. They help people work on the problem; they do not solve it alone.","difficulty":"beginner","transfer":"What is one climate task where a pattern-finding system could help?"},{"id":"fa4_q3","type":"multipleChoice","text":"The 'AI divide' refers to:","simple":"What is the AI divide?","options":["The gap between who can access AI benefits and who can't","The technical difference between ML and rule-based AI","The split between research labs and product teams","The debate between AI optimists and pessimists"],"correct":"The gap between who can access AI benefits and who can't","correctAnswers":["The gap between who can access AI benefits and who can't"],"pairs":[],"explanation":"The AI divide could deepen global inequality if AI tools, education, and benefits are concentrated in wealthy communities.","difficulty":"beginner","transfer":"Name two things a school needs before AI tools help its students."},{"id":"fa4_q4","type":"fillInBlank","text":"AI in healthcare enables more __________ treatments tailored to each patient's genetics.","simple":"AI in healthcare can make treatments more what?","options":["personalized","standardized","expensive","manual"],"correct":"personalized","correctAnswers":["personalized"],"pairs":[],"explanation":"AI can analyze large medical datasets to suggest options for each patient's biology. Clinicians make the decision, and such tools are validated in clinical trials first.","difficulty":"intermediate","transfer":"What should a patient still ask when a treatment plan came from an AI?"},{"id":"fa4_q5","type":"scenarioJudgment","text":"AI helps decide loans, hiring, and medical diagnoses. Should people know when AI is involved?","simple":"AI helps decide loans and hiring. Should people be told?","options":["Yes, people should know and be able to question the decision","No, only the outcome matters","Only if the software is free","Only when the decision is favourable"],"correct":"Yes, people should know and be able to question the decision","correctAnswers":["Yes, people should know and be able to question the decision"],"pairs":[],"explanation":"Transparency lets a person ask how a decision was made and appeal it. Hidden AI decisions can hide unfairness.","difficulty":"intermediate","transfer":"A team is picked by an app. What would you want to know about how it chose?"},{"id":"fa4_q6","type":"multipleChoice","text":"How can societies ensure AI benefits are broadly shared?","simple":"How can AI benefits be shared widely?","options":["Inclusive development, public education, and equitable access policies","Let the free market sort it out","Restrict AI to government agencies only","Ban AI in developing countries"],"correct":"Inclusive development, public education, and equitable access policies","correctAnswers":["Inclusive development, public education, and equitable access policies"],"pairs":[],"explanation":"Investing in AI literacy, diverse development, multilingual models, and equitable policies helps distribute AI's benefits broadly.","difficulty":"advanced","transfer":"Name one thing a library could do so everyone can learn to use AI."},{"id":"fa4_q7","type":"scenarioJudgment","text":"A school with fast internet and devices uses AI tutors. One without cannot. What is this gap called?","simple":"One school has AI tutors, another cannot. What is the gap?","options":["The AI divide","The context window","The alignment problem","Overfitting"],"correct":"The AI divide","correctAnswers":["The AI divide"],"pairs":[],"explanation":"Access to AI benefits is uneven. Closing that gap is a societal choice.","difficulty":"beginner","transfer":"What could help the second school get the same benefits?"},{"id":"fa4_q8","type":"trueFalse","text":"Training and running large AI models use real electricity and water.","simple":"Do large AI models use real electricity and water?","options":["True","False"],"correct":"True","correctAnswers":["True"],"pairs":[],"explanation":"Data centres need power to run chips and water or energy to cool them. Efficient designs and careful use lower that cost.","difficulty":"beginner","transfer":"What is one way a school could use AI tools with less energy waste?"},{"id":"fa4_q9","type":"explain","text":"Explain why people should know when AI is involved in a big decision about them.","simple":"Why should people know when AI decides something about them?","options":["They can question or appeal the decision","Transparency builds trust","Hidden AI decisions can hide unfairness"],"correct":"If AI helped decide someone's loan, job, or diagnosis, they deserve to know so they can ask why and appeal if it seems wrong. Transparency builds trust, and hidden AI decisions make it easy for unfairness to go unnoticed.","correctAnswers":["If AI helped decide someone's loan, job, or diagnosis, they deserve to know so they can ask why and appeal if it seems wrong. Transparency builds trust, and hidden AI decisions make it easy for unfairness to go unnoticed."],"pairs":[],"explanation":"Strong answers include the ability to challenge and the trust or fairness point.","difficulty":"beginner","transfer":"Write the one sentence you would want to see when an app makes a decision about you."}],"cards":[{"emoji":"🌍","title":"AI for Good","body":"AI could help fight climate change, improve education worldwide, and provide healthcare to underserved communities.","funFact":null},{"emoji":"💼","title":"New Careers","body":"AI will create jobs we can't even imagine yet. The best preparation is learning to learn and understanding how AI works.","funFact":null}]},{"id":"fa_l5","title":"AI Predictions","description":"What experts think is coming","order":4,"difficulty":"intermediate","questions":[{"id":"fa5_q1","type":"multipleChoice","text":"A report says 'AI will change most office work within ten years'. What kind of claim is this?","simple":"An AI prediction about ten years ahead is what?","options":["A forecast that could turn out wrong","A proven fact","A law of nature","A measurement of the past"],"correct":"A forecast that could turn out wrong","correctAnswers":["A forecast that could turn out wrong"],"pairs":[],"explanation":"Predictions about the future are claims to examine, not facts. Ask who made it, what evidence they used, and what would prove it wrong.","difficulty":"beginner","transfer":"Take one prediction you have heard about AI and say what evidence would change your mind."},{"id":"fa5_q2","type":"multipleChoice","text":"Experts give very different dates for AGI. What should readers recognize?","simple":"Experts give very different AGI dates. What should you notice?","options":["Forecast uncertainty","Data leakage","Model overfitting","Prompt injection"],"correct":"Forecast uncertainty","correctAnswers":["Forecast uncertainty"],"pairs":[],"explanation":"AGI timelines are forecasts, not measured facts. Large disagreement is a reason to communicate uncertainty and avoid treating one date as certain.","difficulty":"beginner","transfer":"Two weather apps give different forecasts. How is that like expert AI predictions?"},{"id":"fa5_q3","type":"matchPairs","text":"Match each claim about AI to the kind of claim it is:","simple":"Match each claim to its kind.","options":[],"correct":"","correctAnswers":[],"pairs":[{"term":"Assistants are built into many office tools today","definition":"Checkable now"},{"term":"Agents will finish complex tasks within a few years","definition":"Near-term forecast"},{"term":"General AI may arrive in a few decades","definition":"Long-range forecast"},{"term":"Machines will surpass people at everything","definition":"Speculation"}],"explanation":"The further a claim reaches, the less anyone can check it. Treat far claims as questions, not facts.","difficulty":"intermediate","transfer":"Which of these claims could you check within a year, and which could you not?"},{"id":"fa5_q4","type":"fillInBlank","text":"The most reliable AI forecasts focus on __________ improvements rather than overnight revolutions.","simple":"The most reliable AI forecasts focus on what kind of change?","options":["incremental","revolutionary","dramatic","sudden"],"correct":"incremental","correctAnswers":["incremental"],"pairs":[],"explanation":"Gradual gains (better reasoning, fewer errors, wider tool use) are more predictable than paradigm shifts.","difficulty":"intermediate","transfer":"Look back one year. Was the biggest AI change in your life sudden or step by step?"},{"id":"fa5_q5","type":"scenarioJudgment","text":"A speaker says AI will solve poverty, disease, and climate change within 5 years. How do you react?","simple":"Someone promises AI will solve every crisis. How should you respond?","options":["Ask what evidence supports each claim; these are deeply complex problems","Feel excited, since AI is advancing rapidly","Wait for large companies to endorse it","Accept it if the speaker is famous"],"correct":"Ask what evidence supports each claim; these are deeply complex problems","correctAnswers":["Ask what evidence supports each claim; these are deeply complex problems"],"pairs":[],"explanation":"These problems involve politics, money and people, not only technology. Big claims need evidence for each part.","difficulty":"intermediate","transfer":"Which of those three problems needs more than technology, and what else?"},{"id":"fa5_q6","type":"multipleChoice","text":"Best personal strategy given AI's uncertain future:","simple":"What is a sound personal plan for an uncertain AI future?","options":["Stay informed, remain adaptable, and engage thoughtfully","Ignore AI entirely","Assume the most extreme predictions are true","Wait for certainty before forming any opinions"],"correct":"Stay informed, remain adaptable, and engage thoughtfully","correctAnswers":["Stay informed, remain adaptable, and engage thoughtfully"],"pairs":[],"explanation":"Continuous learning, flexibility, and critical engagement with AI developments are the best preparation.","difficulty":"advanced","transfer":"Name one habit that helps you judge new AI claims as they arrive."},{"id":"fa5_q7","type":"scenarioJudgment","text":"A video says AI will cure every disease by next year. How should you treat that claim?","simple":"A video says AI cures all disease next year. Treat it how?","options":["With strong skepticism","As a fact","As a promise","As a reason to stop studying"],"correct":"With strong skepticism","correctAnswers":["With strong skepticism"],"pairs":[],"explanation":"Complex problems do not vanish overnight. Reliable forecasts describe gradual improvement.","difficulty":"beginner","transfer":"What evidence would make you take a big AI claim more seriously?"},{"id":"fa5_q8","type":"trueFalse","text":"AI is helping scientists find new materials and predict molecule shapes.","simple":"Is AI helping scientists with materials and molecules?","options":["True","False"],"correct":"True","correctAnswers":["True"],"pairs":[],"explanation":"AI speeds up parts of science by predicting results before slow experiments. Experiments still confirm them.","difficulty":"beginner","transfer":"Which science subject would you most want AI help with?"},{"id":"fa5_q9","type":"explain","text":"Explain why experts give such different dates for future AI milestones.","simple":"Why do experts give different dates for AI milestones?","options":["Progress is hard to predict","People define milestones differently","Forecasts carry uncertainty"],"correct":"Nobody knows which research problems will be solved quickly and which will take decades, and experts even disagree on what counts as reaching a milestone like general AI. That is why predictions range so widely, and why any single date should be treated as uncertain.","correctAnswers":["Nobody knows which research problems will be solved quickly and which will take decades, and experts even disagree on what counts as reaching a milestone like general AI. That is why predictions range so widely, and why any single date should be treated as uncertain."],"pairs":[],"explanation":"Strong answers name uncertainty and differing definitions.","difficulty":"beginner","transfer":"Give one reason two smart people could disagree about a prediction."}],"cards":[{"emoji":"🔬","title":"AI in Science","body":"AI is accelerating scientific discovery: predicting protein structures, finding new materials, and analyzing the cosmos.","funFact":null},{"emoji":"🧬","title":"Personalized Everything","body":"Future AI might create personalized medicine, education, and entertainment tailored exactly to each individual.","funFact":null},{"emoji":"🔮","title":"Forecasts Are Claims","body":"A prediction about AI is a claim, not a fact. Ask who made it, what evidence they used, and what would show it was wrong. The further ahead it reaches, the less anyone can check.","funFact":null}]},{"id":"fa_l6","title":"Your Role in the AI Future","description":"Becoming an informed AI citizen","order":5,"difficulty":"beginner","questions":[{"id":"fa6_q1","type":"multipleChoice","text":"A friend wants to be ready for AI changes but is not a programmer. Which habit helps most?","simple":"How can someone outside programming prepare for AI?","options":["Learn how AI works and question claims about it","Memorise the names of current AI models","Avoid every AI product","Follow AI company accounts for news"],"correct":"Learn how AI works and question claims about it","correctAnswers":["Learn how AI works and question claims about it"],"pairs":[],"explanation":"AI literacy transfers to new tools and new claims. Model names change every year; the questions to ask do not.","difficulty":"beginner","transfer":"What is one question you now ask about any AI feature that you did not ask before?"},{"id":"fa6_q2","type":"trueFalse","text":"Shaping AI's future requires people from outside tech, including ethicists, teachers, and everyday citizens.","simple":"Does shaping AI's future need people outside tech?","options":["True","False"],"correct":"True","correctAnswers":["True"],"pairs":[],"explanation":"AI's impact is too broad to be shaped by engineers alone. Lawyers, teachers, artists, and citizens all bring vital perspectives.","difficulty":"beginner","transfer":"Which non-tech job at your school should have a say in AI rules?"},{"id":"fa6_q3","type":"fillInBlank","text":"AI __________ means understanding what AI can and can't do, and how it affects your life.","simple":"Knowing what AI can and cannot do is AI what?","options":["literacy","programming","engineering","avoidance"],"correct":"literacy","correctAnswers":["literacy"],"pairs":[],"explanation":"AI literacy is becoming as important as digital literacy was in the early internet era.","difficulty":"beginner","transfer":"Name one thing you learned in this app that changed how you use a helper."},{"id":"fa6_q4","type":"multipleChoice","text":"How can ordinary citizens participate in AI governance?","simple":"How can ordinary people take part in AI governance?","options":["Advocate for responsible policies and make informed choices","Only by becoming AI researchers","It's not possible for non-experts","Boycott all AI products"],"correct":"Advocate for responsible policies and make informed choices","correctAnswers":["Advocate for responsible policies and make informed choices"],"pairs":[],"explanation":"Citizens can engage officials, support digital rights orgs, participate in consultations, and demand transparency from AI providers.","difficulty":"intermediate","transfer":"What is one way a student could influence how AI is used at school?"},{"id":"fa6_q5","type":"scenarioJudgment","text":"You just finished this AI course. Best next step?","simple":"You finished this course. Best next step?","options":["Apply your knowledge daily and keep learning as AI evolves","Consider yourself a full expert now","Stop following AI developments","Wait for someone to tell you what to do"],"correct":"Apply your knowledge daily and keep learning as AI evolves","correctAnswers":["Apply your knowledge daily and keep learning as AI evolves"],"pairs":[],"explanation":"AI evolves rapidly. Your foundations help evaluate new developments, but staying current through continued learning is essential.","difficulty":"intermediate","transfer":"What is one AI claim you would now check that you would have believed before?"},{"id":"fa6_q6","type":"scenarioJudgment","text":"A new AI product promises to replace teachers within a year. What does AI literacy let you do?","simple":"AI promises to replace teachers soon. What can you do?","options":["Ask what evidence supports the claim and who is accountable","Accept it because the demo looked impressive","Reject every AI product on principle","Wait for someone else to decide"],"correct":"Ask what evidence supports the claim and who is accountable","correctAnswers":["Ask what evidence supports the claim and who is accountable"],"pairs":[],"explanation":"Understanding how AI works turns a bold claim into questions you can check: what was tested, what failed, and who is responsible when it is wrong.","difficulty":"advanced","transfer":"A game studio says its AI writes better stories than people. What would you want to see before agreeing?"},{"id":"fa6_q7","type":"scenarioJudgment","text":"Your town is deciding whether to use AI cameras in parks. How can you take part?","simple":"Your town considers AI park cameras. How can you participate?","options":["Learn the facts and share your view with the council","Ignore it because it is for adults","Assume it has already been decided","Share a rumour about it online"],"correct":"Learn the facts and share your view with the council","correctAnswers":["Learn the facts and share your view with the council"],"pairs":[],"explanation":"Local decisions often invite public comment. Knowing what the cameras do and asking who is accountable is real participation.","difficulty":"beginner","transfer":"What fact would you want before deciding about cameras in your park?"},{"id":"fa6_q8","type":"trueFalse","text":"Shaping how AI is used is a job for programmers alone.","simple":"Is shaping AI use a job for programmers alone?","options":["True","False"],"correct":"False","correctAnswers":["False"],"pairs":[],"explanation":"Teachers, artists, nurses, and citizens all influence how AI is used and what rules it follows.","difficulty":"beginner","transfer":"What role could an artist play in shaping AI?"},{"id":"fa6_q9","type":"explain","text":"Describe what AI literacy lets you do when you meet a bold AI claim.","simple":"What does AI literacy let you do with a bold AI claim?","options":["Ask what evidence supports it","Know what AI can and cannot do","Decide who is accountable"],"correct":"AI literacy means understanding what AI can and cannot do, so when a product promises to replace teachers in a year you can ask what evidence backs that, compare it with how AI actually works, and ask who is responsible if it fails.","correctAnswers":["AI literacy means understanding what AI can and cannot do, so when a product promises to replace teachers in a year you can ask what evidence backs that, compare it with how AI actually works, and ask who is responsible if it fails."],"pairs":[],"explanation":"Strong answers include asking for evidence and knowing limits.","difficulty":"beginner","transfer":"Pick a bold AI claim you have heard and apply these three steps to it."}],"cards":[{"emoji":"🗳️","title":"AI and Society","body":"As AI gets more powerful, society must decide: Who controls it? Who benefits? How do we keep it fair?","funFact":null},{"emoji":"📚","title":"Stay Curious","body":"The most important thing about AI's future is that YOU will help shape it. Understanding AI gives you a voice.","funFact":null}]}],"bigIdeas":["societalImpact"]},{"id":"build_with_ai","name":"Build with AI","icon":"hammer.fill","color":"aiSecondary","description":"Learn how real apps and tools are built with AI","order":15,"unlock":{"kind":"completeTier2Minimum","value":6},"lessons":[{"id":"bwa_l1","title":"What's an API?","description":"How apps talk to AI","order":0,"difficulty":"beginner","questions":[{"id":"bwa1_q1","type":"multipleChoice","text":"An app sends a prompt to a hosted model and receives JSON. Which connection is it using?","simple":"An app contacts a hosted model. What does it use?","options":["API","RAG","Fine-tuning","Embedding"],"correct":"API","correctAnswers":["API"],"pairs":[],"explanation":"An application programming interface, or API, defines how software sends a request to a service and receives a response.","difficulty":"beginner","transfer":"A translation app sends text to a service and gets it back. What is it using?"},{"id":"bwa1_q2","type":"multipleChoice","text":"Which credential should an app keep secret when calling a model service?","simple":"Which secret should an app never show when calling a model?","options":["API key","Endpoint name","Model name","Prompt text"],"correct":"API key","correctAnswers":["API key"],"pairs":[],"explanation":"An API key identifies and authorizes the app. Exposing it can let someone else use the account or create charges.","difficulty":"beginner","transfer":"Why is an API key more like a house key than a username?"},{"id":"bwa1_q3","type":"matchPairs","text":"Match each API concept to its description:","simple":"Match each API word to its meaning.","options":[],"correct":"","correctAnswers":[],"pairs":[{"term":"Request","definition":"What your app sends to the AI"},{"term":"Response","definition":"What the AI sends back"},{"term":"API Key","definition":"A secret code, like a password, that lets your app in"},{"term":"Endpoint","definition":"The URL where the AI service lives"}],"explanation":"Your app sends a request with its secret API key to an endpoint and gets a response back. Keep the key private, like a password.","difficulty":"beginner","transfer":"Describe ordering food with these four words: request, response, key, endpoint."},{"id":"bwa1_q4","type":"scenarioJudgment","text":"A developer pushes code with their AI API key inside to a public repository. What happens next?","simple":"A developer posts code with the API key inside. What next?","options":["Anyone can use the key and run up charges","Nothing, because keys are meant to be shared","The key stops working automatically","Only the developer's friends can use it"],"correct":"Anyone can use the key and run up charges","correctAnswers":["Anyone can use the key and run up charges"],"pairs":[],"explanation":"A leaked key works for anyone who finds it. Revoke it, issue a new one, and keep keys out of code.","difficulty":"intermediate","transfer":"What is the first thing to do if you find your key in a public post?"},{"id":"bwa1_q5","type":"fillInBlank","text":"When your app sends a prompt to an AI API, it returns a __________ containing the generated text.","simple":"The API sends back a what with the generated text?","options":["response","download","screenshot","backup"],"correct":"response","correctAnswers":["response"],"pairs":[],"explanation":"The AI service processes your request and returns a response, typically in JSON format, containing the generated text along with metadata like token usage and model information.","difficulty":"intermediate","transfer":"What should an app do if the response never arrives?"},{"id":"bwa1_q6","type":"scenarioJudgment","text":"Your app needs an LLM answer that code can safely read. Which design is strongest?","simple":"Your code must safely read a model answer. Strongest design?","options":["Require a fixed structure, check it, and retry invalid answers","Ask nicely for JSON and trust every answer","Guess the meaning of whatever text comes back","Make the output more random and creative"],"correct":"Require a fixed structure, check it, and retry invalid answers","correctAnswers":["Require a fixed structure, check it, and retry invalid answers"],"pairs":[],"explanation":"This is structured output. A schema defines the required fields, validation checks the response, and a limited retry or safe failure handles invalid results.","difficulty":"advanced","transfer":"A form expects a number and the model writes 'about twelve'. How should the app handle it?"},{"id":"bwa1_q7","type":"scenarioJudgment","text":"A weather app shows a forecast from a service it does not run. How does it get the data?","simple":"An app shows data from a service it does not run. How?","options":["Through an API","By guessing","By printing it","Through the camera"],"correct":"Through an API","correctAnswers":["Through an API"],"pairs":[],"explanation":"An API is the agreed way for one program to request something from another, including AI models.","difficulty":"beginner","transfer":"What might a homework app request from an AI service?"},{"id":"bwa1_q8","type":"trueFalse","text":"Sharing your API key publicly is safe because it is just a code.","simple":"Is sharing an API key publicly safe?","options":["True","False"],"correct":"False","correctAnswers":["False"],"pairs":[],"explanation":"Anyone with the key can use your account and run up charges. Treat it like a password.","difficulty":"beginner","transfer":"What would you do if you saw a key posted in a shared project?"},{"id":"bwa1_q9","type":"explain","text":"Explain what an API is using a restaurant as your comparison.","simple":"Explain an API using a restaurant.","options":["Your app is the customer placing an order","The API is the menu and the waiter","The model is the kitchen that sends back the result"],"correct":"Your app is l
