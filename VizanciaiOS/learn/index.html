t":null}]},{"id":"pe_l3","title":"System Prompts & Roles","description":"Rules set before the conversation starts","order":2,"difficulty":"intermediate","questions":[{"id":"pe3_q1","type":"multipleChoice","text":"A system prompt is:","simple":"What is a system prompt?","options":["Instructions that set the assistant's role and limits","The first message a user types in","The goal the model was trained toward","A record of the earlier conversation"],"correct":"Instructions that set the assistant's role and limits","correctAnswers":["Instructions that set the assistant's role and limits"],"pairs":[],"explanation":"A system prompt sets role, tone, and rules before the conversation begins. Developers usually write it when they build an app.","difficulty":"beginner","transfer":"What rule would you put in a system prompt for a homework helper?"},{"id":"pe3_q2","type":"trueFalse","text":"Telling AI to 'act as a science tutor' can improve its explanations.","simple":"Can 'act as a science tutor' improve explanations?","options":["True","False"],"correct":"True","correctAnswers":["True"],"pairs":[],"explanation":"Role prompting often changes a model's tone, vocabulary, and depth. It does not add knowledge the model lacks.","difficulty":"beginner","transfer":"How would you ask an assistant to explain fractions to a younger cousin?"},{"id":"pe3_q3","type":"fillInBlank","text":"A __________ prompt defines the AI's role and constraints before the conversation.","simple":"A __________ prompt sets the AI's role before chat starts.","options":["system","user","initial","training"],"correct":"system","correctAnswers":["system"],"pairs":[],"explanation":"System prompts are usually written by the people who build the app. They apply to every conversation in that app.","difficulty":"beginner","transfer":"A recipe app keeps suggesting dishes with nuts. What system rule would fix that?"},{"id":"pe3_q4","type":"multipleChoice","text":"Which role prompt best helps an assistant explain a health term in plain words?","simple":"Which role makes a health explanation simple?","options":["Explain like a kind nurse talking to a family","Reply like a computer processing health records","Answer like a scientist listing chemical names","Use only technical medical terms in the reply"],"correct":"Explain like a kind nurse talking to a family","correctAnswers":["Explain like a kind nurse talking to a family"],"pairs":[],"explanation":"The role sets a plain-language style and an audience. It does not make the facts reliable, so check health information with a real professional.","difficulty":"intermediate","transfer":"You want a sports rule explained simply. What role and audience would you name?"},{"id":"pe3_q5","type":"multipleChoice","text":"In production apps, system prompts are set by:","simple":"Who usually writes an app's system prompt?","options":["The developers who build the app","The users while they are chatting","The model as it writes replies","The company that sells the hardware"],"correct":"The developers who build the app","correctAnswers":["The developers who build the app"],"pairs":[],"explanation":"Developers write system prompts to control how the assistant behaves inside their app. Users normally cannot see or change them.","difficulty":"intermediate","transfer":"A study app refuses to write full essays. Who decided that rule, and why might they?"},{"id":"pe3_q6","type":"scenarioJudgment","text":"A chatbot for young kids launches with no system prompt and no safety rules. What is the main risk?","simple":"A kids' chatbot has no safety rules. Main risk?","options":["Replies may be unsuitable for children","Replies will arrive far too slowly","The chatbot will use too much memory","Children will find the chatbot boring"],"correct":"Replies may be unsuitable for children","correctAnswers":["Replies may be unsuitable for children"],"pairs":[],"explanation":"Without rules, nothing steers the assistant toward safe, age-appropriate replies. Rules in a system prompt reduce that risk but do not remove it, so adults still review what the app does.","difficulty":"advanced","transfer":"You help design a chatbot for a school library. Name two rules you would insist on."},{"id":"pe3_q7","type":"scenarioJudgment","text":"A homework helper app should never give final essays. Where should that rule live?","simple":"Where should an app's rule about essays live?","options":["In the system prompt set by the developer","In the app icon on the home screen","In the password each user creates","Nowhere, since each user decides alone"],"correct":"In the system prompt set by the developer","correctAnswers":["In the system prompt set by the developer"],"pairs":[],"explanation":"System prompts hold the rules and role that apply to every conversation, before the user types.","difficulty":"beginner","transfer":"What other rules would you put in a kids' study app?"},{"id":"pe3_q8","type":"trueFalse","text":"Asking a model to explain like I am ten changes how it answers.","simple":"Does asking to explain like I am ten change the answer?","options":["True","False"],"correct":"True","correctAnswers":["True"],"pairs":[],"explanation":"Role and audience instructions shape vocabulary, length, and examples.","difficulty":"beginner","transfer":"How would you ask for an explanation for a grandparent?"},{"id":"pe3_q9","type":"explain","text":"Explain the difference between a system prompt and a user prompt.","simple":"Explain system prompt versus user prompt.","options":["System prompt sets role and rules for every chat","User prompt is the request in the moment","Developers usually write the system prompt"],"correct":"The system prompt is written by the app's developers and sets the role, tone, and rules before any conversation starts. The user prompt is what you type in the moment. The system prompt shapes how every user prompt gets answered.","correctAnswers":["The system prompt is written by the app's developers and sets the role, tone, and rules before any conversation starts. The user prompt is what you type in the moment. The system prompt shapes how every user prompt gets answered."],"pairs":[],"explanation":"Strong answers say who writes each and when it applies.","difficulty":"beginner","transfer":"Write one system rule and one user request for a music practice helper."}],"cards":[{"emoji":"🔧","title":"System Prompts","body":"A system prompt sets the assistant's role and rules before the conversation starts, like giving an actor their character. In most apps the developers write it and users do not see it.","funFact":null},{"emoji":"🎭","title":"Role Prompting","body":"Telling the assistant to 'act as a coach' or 'explain like I am ten' changes how it answers. Roles set the tone, vocabulary, and depth.","funFact":null},{"emoji":"🧠","title":"A Role Is Not Knowledge","body":"A role changes style, not facts. 'Act as a doctor' does not make a reply medically reliable, so health questions still go to a real person.","funFact":null},{"emoji":"🛡️","title":"Rules for Kids' Apps","body":"Apps for children need clear rules in the system prompt, such as topics to avoid and when to suggest asking an adult. Rules help, but they are not perfect, so people still check.","funFact":null}]},{"id":"pe_l4","title":"Prompt Iteration","description":"Read the reply, adjust, and try again","order":3,"difficulty":"intermediate","questions":[{"id":"pe4_q1","type":"multipleChoice","text":"What is prompt iteration?","simple":"What is prompt iteration?","options":["Improving your prompt after reading the reply","Sending the same prompt again and again","Switching to a new model each attempt","Writing several random prompts at once"],"correct":"Improving your prompt after reading the reply","correctAnswers":["Improving your prompt after reading the reply"],"pairs":[],"explanation":"Iteration means reading the reply, spotting the gap, and changing the prompt to close it. Each round gets closer to what you need.","difficulty":"beginner","transfer":"The answer is too formal. What would your next prompt say?"},{"id":"pe4_q2","type":"trueFalse","text":"Your first prompt usually gives the best possible result.","simple":"Does the first prompt usually give the best result?","options":["True","False"],"correct":"False","correctAnswers":["False"],"pairs":[],"explanation":"Prompts usually improve over a few rounds. Reading the reply and adjusting is normal, not a sign you failed.","difficulty":"beginner","transfer":"Think of a game level you replayed to improve. How is that like fixing a prompt?"},{"id":"pe4_q3","type":"sortOrder","text":"Put prompt iteration steps in order:","simple":"Put the prompt iteration steps in order.","options":["Identify gaps in response","Write initial prompt","Refine and re-prompt","Review AI output"],"correct":"","correctAnswers":["Write initial prompt","Review AI output","Identify gaps in response","Refine and re-prompt"],"pairs":[],"explanation":"Effective iteration follows a cycle: write, review, find the gaps, and refine.","difficulty":"beginner","transfer":"You ask for a playlist and half the songs are wrong. Walk through the four steps."},{"id":"pe4_q4","type":"fillInBlank","text":"Adding __________ like word limits or format requirements helps AI focus its output.","simple":"Adding __________ like word limits helps AI focus.","options":["constraints","keywords","formatting","references"],"correct":"constraints","correctAnswers":["constraints"],"pairs":[],"explanation":"Constraints such as a word limit, a format, a tone, or an audience narrow the reply to what you actually need.","difficulty":"intermediate","transfer":"What constraint would you add when asking for chore ideas for a Saturday morning?"},{"id":"pe4_q5","type":"multipleChoice","text":"If AI's response is too long and unfocused, what should you add?","simple":"The reply is too long. What should you add?","options":["A clear word limit and a main point","Several more questions on new topics","A friendlier greeting at the start","A request to reply more quickly"],"correct":"A clear word limit and a main point","correctAnswers":["A clear word limit and a main point"],"pairs":[],"explanation":"A length limit and a stated focus are simple constraints most models respect. Adding more questions would make the reply longer.","difficulty":"intermediate","transfer":"A friend's story summary is rambling. What two instructions would you give them?"},{"id":"pe4_q6","type":"multipleChoice","text":"A tool has a randomness setting. What happens when you turn it down?","simple":"You turn the randomness setting down. What changes?","options":["Replies become steadier and more predictable","Replies become more surprising and varied","Replies become longer and more detailed","Replies become shorter and use fewer words"],"correct":"Replies become steadier and more predictable","correctAnswers":["Replies become steadier and more predictable"],"pairs":[],"explanation":"Lower randomness makes the model pick its most likely words, so replies are more consistent. Higher randomness gives more variety, which can suit brainstorming. The setting does not change what the model knows.","difficulty":"advanced","transfer":"Would you want low or high randomness for checking maths versus inventing story ideas? Why?"},{"id":"pe4_q7","type":"scenarioJudgment","text":"The answer is good but far too long. What is the best next prompt?","simple":"The answer is good but too long. Best next prompt?","options":["Keep the same points in under 80 words","Delete everything and start over from nothing","Ask a completely different question instead","Tell the model the whole reply is wrong"],"correct":"Keep the same points in under 80 words","correctAnswers":["Keep the same points in under 80 words"],"pairs":[],"explanation":"Iteration keeps what worked and adds a constraint for what did not.","difficulty":"beginner","transfer":"What would you say if the answer was the right length but too formal?"},{"id":"pe4_q8","type":"trueFalse","text":"Telling a model what not to do can be a useful part of a prompt.","simple":"Can saying what not to do help a prompt?","options":["True","False"],"correct":"True","correctAnswers":["True"],"pairs":[],"explanation":"Constraints like no jargon or no lists steer the output away from common problems.","difficulty":"beginner","transfer":"Name one thing you would tell a model not to do in a science summary."},{"id":"pe4_q9","type":"explain","text":"Describe the prompt iteration loop in your own words.","simple":"Describe the prompt iteration loop.","options":["Read the response carefully","Notice what is missing or wrong","Change the prompt and try again"],"correct":"You send a prompt, read the response carefully, and notice what is missing, wrong, or too much. Then you change the prompt to fix that one thing and try again. Each round gets closer to what you actually wanted.","correctAnswers":["You send a prompt, read the response carefully, and notice what is missing, wrong, or too much. Then you change the prompt to fix that one thing and try again. Each round gets closer to what you actually wanted."],"pairs":[],"explanation":"Strong answers include reading, diagnosing, and adjusting.","difficulty":"beginner","transfer":"Describe how you would improve a prompt for a party invitation over three rounds."}],"cards":[{"emoji":"🔄","title":"Iterate and Improve","body":"Your first prompt rarely gives the perfect reply. Read the reply, notice what is missing or wrong, change one thing, and try again. Each round is called an iteration.","funFact":null},{"emoji":"🚧","title":"Constraints","body":"A constraint is a limit you set, such as 'under 100 words', 'no jargon', or 'as a list'. Constraints steer the reply toward something you can use.","funFact":null},{"emoji":"🎲","title":"The Randomness Setting","body":"Some tools have a setting that controls how random the reply is. Low randomness gives steadier, more predictable replies. High randomness gives more surprising ones, which can help with brainstorming.","funFact":null},{"emoji":"🛑","title":"When to Stop Iterating","body":"If three rounds still give a claim you cannot confirm, the fix is not a fourth prompt. Check a reliable source or ask a person who knows.","funFact":null}]},{"id":"pe_l5","title":"Common Prompting Mistakes","description":"Spot weak prompts and check confident replies","order":4,"difficulty":"intermediate","questions":[{"id":"pe5_q1","type":"multipleChoice","text":"You get a confident reply to a clear prompt. What is the best way to check it?","simple":"How do you check a confident AI reply?","options":["Compare key facts with a source you trust","Ask the same model if it is sure","Trust it because the prompt was clear","Count the words to judge the quality"],"correct":"Compare key facts with a source you trust","correctAnswers":["Compare key facts with a source you trust"],"pairs":[],"explanation":"A clear prompt improves the reply but does not make it true. Checking key facts against a trusted source is the reliable step.","difficulty":"beginner","transfer":"An assistant gives a date for a school holiday. Where would you confirm it?"},{"id":"pe5_q2","type":"trueFalse","text":"Combining unrelated questions in one prompt is a good idea.","simple":"Is mixing unrelated questions in one prompt a good idea?","options":["True","False"],"correct":"False","correctAnswers":["False"],"pairs":[],"explanation":"Mixed requests split the model's attention. One focused task per prompt works better.","difficulty":"beginner","transfer":"You need a science fact and a poem for a card. How many prompts would you send?"},{"id":"pe5_q3","type":"matchPairs","text":"Match each mistake with its fix:","simple":"Match each mistake with its fix.","options":[],"correct":"","correctAnswers":[],"pairs":[{"term":"Too vague","definition":"Add specific details"},{"term":"No context","definition":"Explain the situation"},{"term":"No format specified","definition":"Ask for a list or a table"},{"term":"Ambiguous terms","definition":"Define key terminology"}],"explanation":"Each fix adds the piece the prompt was missing.","difficulty":"beginner","transfer":"Look at the last request you typed into a search box or assistant. Which fix would help it?"},{"id":"pe5_q4","type":"scenarioJudgment","text":"Someone asks a chatbot 'Tell me everything about science.' What is the main problem?","simple":"'Tell me everything about science.' What is wrong?","options":["The topic is far too broad to answer well","The prompt is too long for the model","Science is not a topic models know","The request needs a polite greeting"],"correct":"The topic is far too broad to answer well","correctAnswers":["The topic is far too broad to answer well"],"pairs":[],"explanation":"A huge topic with no focus gives a shallow, generic reply. Narrowing the topic, audience, and length makes it usable.","difficulty":"intermediate","transfer":"Narrow 'tell me about sports' into a prompt you would actually use."},{"id":"pe5_q5","type":"fillInBlank","text":"A prompt that assumes AI already has __________ about your situation leads to poor results.","simple":"A prompt that assumes AI knows your __________ works poorly.","options":["context","permission","opinions","memories"],"correct":"context","correctAnswers":["context"],"pairs":[],"explanation":"The model does not know your situation unless you say it. Paste in or describe what it needs.","difficulty":"intermediate","transfer":"You ask for advice on a group project. What context would the model need?"},{"id":"pe5_q6","type":"scenarioJudgment","text":"A well-built prompt returns a statistic you cannot find in any source. What is the best move?","simple":"The reply has a number you cannot find anywhere. Now what?","options":["Verify it or leave it out of your work","Keep it because the prompt was detailed","Ask the model to repeat it with confidence","Add the number to your notes as fact"],"correct":"Verify it or leave it out of your work","correctAnswers":["Verify it or leave it out of your work"],"pairs":[],"explanation":"A strong prompt does not stop a model from producing an unsupported claim. Verify with a source, simplify the claim, or ask someone who knows. Leaving it out is safer than guessing.","difficulty":"advanced","transfer":"A homework helper gives a population figure for your town. How would you check it?"},{"id":"pe5_q7","type":"scenarioJudgment","text":"Someone asks fix my essay without pasting the essay. What is the problem?","simple":"Fix my essay, but no essay pasted. What is wrong?","options":["The model has no essay to work with","The prompt is too long to process","The word fix confuses the model","The request should be a question"],"correct":"The model has no essay to work with","correctAnswers":["The model has no essay to work with"],"pairs":[],"explanation":"The model only knows what is in the prompt. Missing context is one of the big three mistakes.","difficulty":"beginner","transfer":"What else would you include besides the essay itself?"},{"id":"pe5_q8","type":"trueFalse","text":"Asking three unrelated questions in one prompt usually gives weaker answers.","simple":"Do three unrelated questions in one prompt work worse?","options":["True","False"],"correct":"True","correctAnswers":["True"],"pairs":[],"explanation":"Mixed requests get mixed attention. One clear task per prompt works better.","difficulty":"beginner","transfer":"How would you split a prompt that asks for a poem, a recipe, and a math fact?"},{"id":"pe5_q9","type":"explain","text":"Name the three most common prompting mistakes and how to fix each.","simple":"Name three common prompting mistakes and their fixes.","options":["Vague requests need specifics","Missing context needs background pasted in","Missing format needs a stated shape or length"],"correct":"The three big mistakes are being vague, leaving out context, and not saying what format you want. Fix them by adding specifics such as audience and purpose, pasting in the material the model needs, and stating the shape, such as a list or a word limit.","correctAnswers":["The three big mistakes are being vague, leaving out context, and not saying what format you want. Fix them by adding specifics such as audience and purpose, pasting in the material the model needs, and stating the shape, such as a list or a word limit."],"pairs":[],"explanation":"Strong answers pair each mistake with a fix.","difficulty":"beginner","transfer":"Find the mistakes in 'make this better' and rewrite it for a poster you are designing."}],"cards":[{"emoji":"🧱","title":"The Big Three Mistakes","body":"Most weak prompts are vague, missing context, or missing a format. Check for all three before you send.","funFact":null},{"emoji":"📎","title":"Give the Context","body":"Context is the background the assistant needs: the essay you want fixed, who the reader is, what you already tried. The model only knows what is in the prompt.","funFact":null},{"emoji":"🎯","title":"One Task at a Time","body":"Mixing unrelated requests in one prompt splits the model's attention. Separate prompts get clearer replies.","funFact":null},{"emoji":"🔍","title":"A Good Prompt Can Still Be Wrong","body":"A clear, detailed prompt makes a good reply more likely, but the reply can still include a claim that is not true. Check facts that matter, and ask a person when the stakes are high.","funFact":null},{"emoji":"🧪","title":"Testing Your Prompts","body":"Try the same prompt more than once. If the replies differ a lot, the prompt may need to be more specific.","funFact":null}]},{"id":"pe_l6","title":"Real-World Prompting","description":"Formats, real material, and knowing when to ask a person","order":5,"difficulty":"advanced","questions":[{"id":"pe6_q1","type":"multipleChoice","text":"Best approach to summarize a long article with AI:","simple":"How should you ask AI to summarise an article?","options":["Paste the article and state length and audience","Type the word summarise and the article title","Ask the model to find the article by itself","Paste one sentence and ask it to expand"],"correct":"Paste the article and state length and audience","correctAnswers":["Paste the article and state length and audience"],"pairs":[],"explanation":"The model needs the real text plus clear limits. Then read the summary against the article to catch anything changed or invented.","difficulty":"beginner","transfer":"What details would you give when asking AI to summarise a news story?"},{"id":"pe6_q2","type":"trueFalse","text":"You can ask an AI assistant to reply in a set format such as a table or structured data.","simple":"Can you ask AI for a table or a list?","options":["True","False"],"correct":"True","correctAnswers":["True"],"pairs":[],"explanation":"Naming a format such as a table, a list, or structured data gets a reply you can use directly. Check that the content is still right.","difficulty":"beginner","transfer":"Which format would you ask for when planning a week of practice sessions?"},{"id":"pe6_q3","type":"scenarioJudgment","text":"A student writes a detailed prompt about a medicine dose and gets a confident reply. What should they do?","simple":"AI gives a medicine dose. What should you do?","options":["Ask a pharmacist, doctor, or parent instead","Follow it since the prompt was detailed","Ask the model to confirm it is correct","Round the dose to a simpler number"],"correct":"Ask a pharmacist, doctor, or parent instead","correctAnswers":["Ask a pharmacist, doctor, or parent instead"],"pairs":[],"explanation":"A good prompt does not make a health answer safe to act on. Use the reply to prepare questions, then ask a qualified person.","difficulty":"beginner","transfer":"A chatbot suggests a fix for a bike brake. Who would you check with before riding?"},{"id":"pe6_q4","type":"multipleChoice","text":"For creative writing, which prompt element helps most?","simple":"What helps most in a creative writing prompt?","options":["Specifying tone, audience, and style","Using as few words as possible","Asking for something good and fun","Copying a template without changes"],"correct":"Specifying tone, audience, and style","correctAnswers":["Specifying tone, audience, and style"],"pairs":[],"explanation":"Tone, audience, and style give the model creative direction. Vague requests get generic writing.","difficulty":"intermediate","transfer":"You want a song chorus about your team. What tone, audience, and style would you name?"},{"id":"pe6_q5","type":"fillInBlank","text":"Using AI to review and improve your writing is called AI-assisted __________.","simple":"Using AI to improve writing is AI-assisted __________.","options":["editing","indexing","transcribing","archiving"],"correct":"editing","correctAnswers":["editing"],"pairs":[],"explanation":"AI-assisted editing means asking for suggestions on clarity or grammar. You decide which suggestions to keep, and the writing stays yours.","difficulty":"intermediate","transfer":"You want feedback on a story but not a rewrite. How would you word the prompt?"},{"id":"pe6_q6","type":"multipleChoice","text":"Why build a personal library of effective prompts?","simple":"Why save prompts that worked well?","options":["Reuse proven prompts for similar tasks","Saved prompts are graded by the provider","Saved prompts make the model reply faster","Saved prompts stop the model making errors"],"correct":"Reuse proven prompts for similar tasks","correctAnswers":["Reuse proven prompts for similar tasks"],"pairs":[],"explanation":"A library saves time and keeps quality consistent. Saved prompts do not speed up the model or prevent mistakes, so you still check each reply.","difficulty":"advanced","transfer":"Which prompt from a hobby or class would you save, and what would you name it?"},{"id":"pe6_q7","type":"scenarioJudgment","text":"You want a study guide as a table with terms and meanings. What should the prompt say?","simple":"You want a table of terms and meanings. What should you say?","options":["Ask for a two-column table","Ask for something helpful","Ask for a short poem","Send the terms only"],"correct":"Ask for a two-column table","correctAnswers":["Ask for a two-column table"],"pairs":[],"explanation":"Naming the format gets you output you can use right away.","difficulty":"beginner","transfer":"What format would you request for a packing list?"},{"id":"pe6_q8","type":"trueFalse","text":"A prompt that works well once can be saved and reused for similar tasks.","simple":"Can a good prompt be saved and reused?","options":["True","False"],"correct":"True","correctAnswers":["True"],"pairs":[],"explanation":"A prompt library saves time and keeps quality consistent across tasks.","difficulty":"beginner","transfer":"Which prompt from this week would you save?"},{"id":"pe6_q9","type":"explain","text":"Explain how you would use AI to summarise a long article well.","simple":"How would you use AI to summarise a long article well?","options":["Paste the article in","State the length and audience","Check the summary against the article"],"correct":"Paste the full article into the prompt so the model has the real text. Say how long the summary should be and who it is for. Then read the summary against the article to make sure nothing important was changed or invented.","correctAnswers":["Paste the full article into the prompt so the model has the real text. Say how long the summary should be and who it is for. Then read the summary against the article to make sure nothing important was changed or invented."],"pairs":[],"explanation":"Strong answers include providing the text, setting constraints, and checking.","difficulty":"beginner","transfer":"How would you use AI to summarise the rules of a board game for a friend? List the steps."}],"cards":[{"emoji":"📋","title":"Ask for a Format","body":"A format is the shape of the reply: a list, a table, a paragraph, or structured data for a program. Naming it gets output you can use right away.","funFact":null},{"emoji":"📥","title":"Give It the Material","body":"To summarise or edit something, paste the real text into the prompt. The model cannot read what it has not been given.","funFact":null},{"emoji":"🧑‍⚕️","title":"When to Ask a Person","body":"For health, money, legal, or safety questions, a clear prompt and a confident reply are not enough. Use the reply to prepare questions, then ask a qualified person.","funFact":null},{"emoji":"📚","title":"Build a Prompt Library","body":"When a prompt works well, save it. Reused prompts save time and keep quality steady, though you still check each new reply.","funFact":null}]}],"bigIdeas":["naturalInteraction"]},{"id":"ai_ethics","name":"AI Right & Wrong","icon":"shield.checkered","color":"aiRed","description":"Can AI be unfair? How do we keep it in check?","order":7,"unlock":{"kind":"completeTier1","value":null},"lessons":[{"id":"ae_l1","title":"Understanding AI Bias","description":"When AI isn't fair","order":0,"difficulty":"beginner","questions":[{"id":"ae1_q1","type":"multipleChoice","text":"A face-unlock feature works worse for some people. Where can that bias have come from?","simple":"Where can unfairness get into an AI system?","options":["Training data, labels, design choices, or use","The training photos and nothing else","A deliberate rule written by a programmer","The people who used the phone incorrectly"],"correct":"Training data, labels, design choices, or use","correctAnswers":["Training data, labels, design choices, or use"],"pairs":[],"explanation":"Bias can enter through the data, the labels, design choices, or how the system is used. A performance gap shows a problem; finding the cause takes investigation.","difficulty":"beginner","transfer":"A music app recommends the same few artists to everyone in your class. What would you check first to find out why?"},{"id":"ae1_q2","type":"trueFalse","text":"An AI system can repeat unfair patterns about race or gender without anyone intending it.","simple":"Can AI repeat unfair patterns nobody intended?","options":["True","False"],"correct":"True","correctAnswers":["True"],"pairs":[],"explanation":"A model learns patterns from its examples, including unfair ones. Good intentions do not prevent that, so teams test results across groups.","difficulty":"beginner","transfer":"A team-picker app keeps choosing the same kids. What patterns from past picks might it have learned?"},{"id":"ae1_q3","type":"scenarioJudgment","text":"A company's hiring tool scored applications from women lower. Testing revealed it. Best response?","simple":"A hiring tool scored women lower. Best response?","options":["Stop using it and investigate the cause","Keep it because it matches past hiring","Use it for some jobs but not others","Ask applicants to write their applications differently"],"correct":"Stop using it and investigate the cause","correctAnswers":["Stop using it and investigate the cause"],"pairs":[],"explanation":"Matching past hiring is the problem, not a defence, when past hiring was unfair. Stopping and investigating protects applicants while the team finds the cause.","difficulty":"beginner","transfer":"A club's sign-up app keeps rejecting new students. Who should be told, and what should happen next?"},{"id":"ae1_q4","type":"fillInBlank","text":"AI __________ happens when a system systematically produces unfair outcomes for certain groups.","simple":"AI ______ means unfair results for some groups.","options":["bias","latency","complexity","variance"],"correct":"bias","correctAnswers":["bias"],"pairs":[],"explanation":"AI bias means a system's results are systematically worse or unfair for some groups. Spotting it takes checking results group by group.","difficulty":"intermediate","transfer":"A spell checker flags names from one language as errors far more often. Is that bias? Why?"},{"id":"ae1_q5","type":"multipleChoice","text":"A team wants to reduce bias in a model. Which approach helps most?","simple":"Which approach helps most to reduce AI bias?","options":["Representative data plus testing across groups","A single very large data source","Letting the model correct itself over time","Making the model much bigger"],"correct":"Representative data plus testing across groups","correctAnswers":["Representative data plus testing across groups"],"pairs":[],"explanation":"Representative data reduces gaps in what the model learns, and testing across groups shows whether the fix worked. Size alone does not remove unfair patterns.","difficulty":"intermediate","transfer":"You are building a plant ID app for the school garden. How would you make the photo set representative?"},{"id":"ae1_q6","type":"multipleChoice","text":"What does 'algorithmic fairness' mean?","simple":"What does algorithmic fairness mean?","options":["Designing AI that treats all groups equitably","Making all algorithms run at the same speed","Reducing how much computing a model needs","Making all training data open to the public"],"correct":"Designing AI that treats all groups equitably","correctAnswers":["Designing AI that treats all groups equitably"],"pairs":[],"explanation":"Algorithmic fairness means a system does not systematically disadvantage any group. People define and measure fairness in different ways, so teams have to state which one they are checking.","difficulty":"advanced","transfer":"A game's matchmaking pairs players. What would fair mean there, and how could you check it?"},{"id":"ae1_q7","type":"scenarioJudgment","text":"A hiring model learned from past hires who were mostly men. What might it do?","simple":"A hiring model learned mostly from men. What might it do?","options":["Favour applications that look like past hires","Judge every applicant perfectly fairly","Ignore anything related to gender","Refuse to score any application"],"correct":"Favour applications that look like past hires","correctAnswers":["Favour applications that look like past hires"],"pairs":[],"explanation":"Models repeat patterns in their training data, including unfair ones nobody intended.","difficulty":"beginner","transfer":"What data would you add to make the model fairer?"},{"id":"ae1_q8","type":"trueFalse","text":"A model can be unfair even if nobody wrote an unfair rule.","simple":"Can a model be unfair with no unfair rule written?","options":["True","False"],"correct":"True","correctAnswers":["True"],"pairs":[],"explanation":"Bias can come from the data, not the code. That is why testing across groups matters.","difficulty":"beginner","transfer":"How would you test a loan model for fairness?"},{"id":"ae1_q9","type":"explain","text":"Explain how bias gets into an AI system, using the mirror idea.","simple":"How does bias get into AI? Use the mirror idea.","options":["AI learns patterns from human data","Data contains unfair patterns","The model reflects them back"],"correct":"AI learns from data made by people, and that data carries the unfair patterns of the past. Like a mirror, the model reflects those patterns back, even when nobody meant to build bias in. Fixing it means checking the data and testing results across groups.","correctAnswers":["AI learns from data made by people, and that data carries the unfair patterns of the past. Like a mirror, the model reflects those patterns back, even when nobody meant to build bias in. Fixing it means checking the data and testing results across groups."],"pairs":[],"explanation":"Strong answers connect data to outcomes and mention a fix.","difficulty":"beginner","transfer":"Think of a school tradition that came from old habits. How could it be unfair to new students?"}],"cards":[{"emoji":"⚖️","title":"Where Bias Comes From","body":"Bias can enter an AI system through the training data, the labels people gave, design choices, or how the system gets used. A gap in results shows a problem; finding its cause takes investigation.","funFact":null},{"emoji":"🪞","title":"Data Reflects Society","body":"AI is like a mirror. It reflects patterns in its examples, including unfair ones nobody intended, so good intentions alone do not prevent bias.","funFact":null},{"emoji":"🧪","title":"Test Across Groups","body":"Algorithmic fairness means a system does not systematically disadvantage any group. Check results group by group, add representative examples, and retest before trusting a fix.","funFact":null}]},{"id":"ae_l2","title":"Deepfakes & Misinformation","description":"AI-generated deception","order":1,"difficulty":"intermediate","questions":[{"id":"ae2_q1","type":"multipleChoice","text":"AI makes a realistic video of a real person saying words they never said. What is it called?","simple":"AI fakes a real person's video. What is it called?","options":["A deepfake","A data leak","A chatbot","A watermark"],"correct":"A deepfake","correctAnswers":["A deepfake"],"pairs":[],"explanation":"A deepfake is AI-made fake video, audio, or images of a real person. The best ones look genuine, so appearance alone cannot prove they are real.","difficulty":"beginner","transfer":"A shocking video of a mayor appears online. What is your first step before believing it?"},{"id":"ae2_q2","type":"multipleChoice","text":"A realistic video may be synthetic. Which practice helps check it?","simple":"Which practice checks whether a video is fake?","options":["Media forensics","Prompt tuning","Model routing","Clustering"],"correct":"Media forensics","correctAnswers":["Media forensics"],"pairs":[],"explanation":"Media forensics examines source history, visual or audio clues, metadata, and independent evidence to test whether media is authentic.","difficulty":"beginner","transfer":"A friend's gaming clip looks too good to be true. What clues about its source would you look at?"},{"id":"ae2_q3","type":"scenarioJudgment","text":"A viral election video may be AI-made. Why does a clear 'AI-generated' label help viewers?","simple":"Why does an 'AI-made' label help viewers?","options":["They can weigh it knowing it is synthetic","It proves every claim in it is false","It blocks the video from being shared again","It reveals the name of whoever made it"],"correct":"They can weigh it knowing it is synthetic","correctAnswers":["They can weigh it knowing it is synthetic"],"pairs":[],"explanation":"A label tells viewers how the video was made so they can weigh it. It does not settle what is true, and it does not identify the maker.","difficulty":"beginner","transfer":"Your class edits a school announcement with AI voices. How would you tell viewers, and why does that matter?"},{"id":"ae2_q4","type":"multipleChoice","text":"Which approach can show where a photo came from and how it was edited?","simple":"What can show where a photo came from?","options":["Content credentials attached to the file","A larger and sharper image resolution","A caption added by whoever shared it","The number of likes it received"],"correct":"Content credentials attached to the file","correctAnswers":["Content credentials attached to the file"],"pairs":[],"explanation":"Content credentials and watermarks are provenance tools: they record or mark where media came from and what changed. They can be stripped or missing, so their absence is not proof of a fake, and detection tools add another check.","difficulty":"intermediate","transfer":"A band posts a concert photo with an edit history attached. What would that history tell you?"},{"id":"ae2_q5","type":"fillInBlank","text":"AI-generated __________, false content made quickly and at scale, is a growing problem.","simple":"AI can make lots of false content, called ______.","options":["misinformation","education","entertainment","software"],"correct":"misinformation","correctAnswers":["misinformation"],"pairs":[],"explanation":"Generative tools make convincing false content cheap to produce in large amounts. That is why checking sources matters more, not less.","difficulty":"intermediate","transfer":"Fake match results spread in your sports league chat. How would you check before passing them on?"},{"id":"ae2_q6","type":"matchPairs","text":"Match each deepfake threat to its impact:","simple":"Match each fake-media threat to its harm.","options":[],"correct":"","correctAnswers":[],"pairs":[{"term":"Political deepfakes","definition":"Misleading voters before an election"},{"term":"Voice cloning scams","definition":"Tricking families with a copied voice"},{"term":"Synthetic news articles","definition":"Spreading false stories that look reported"},{"term":"Face-swap fraud","definition":"Putting one person's face on another's body"}],"explanation":"Each threat uses a different kind of fake media, but the defence is similar: check the source before you trust or share.","difficulty":"beginner","transfer":"Which of these threats could reach your family first, and what would you tell them?"},{"id":"ae2_q7","type":"scenarioJudgment","text":"A friend shares a shocking video of a celebrity. What is your first move?","simple":"A friend shares a shocking celebrity video. First move?","options":["Check trusted news before sharing","Repost it to everyone right away","Assume it is real and react","Add a dramatic caption and share"],"correct":"Check trusted news before sharing","correctAnswers":["Check trusted news before sharing"],"pairs":[],"explanation":"Deepfakes look real. Verifying with trusted sources stops fakes from spreading through you.","difficulty":"beginner","transfer":"Name one trusted source you would check."},{"id":"ae2_q8","type":"trueFalse","text":"A deepfake can copy someone's voice from a short recording.","simple":"Can a deepfake copy a voice from a short recording?","options":["True","False"],"correct":"True","correctAnswers":["True"],"pairs":[],"explanation":"A few seconds of audio can be enough. That is why voice alone should not prove identity.","difficulty":"beginner","transfer":"What would you do if a call sounded like a family member asking for money?"},{"id":"ae2_q9","type":"explain","text":"Explain what a deepfake is and one way it can cause harm.","simple":"What is a deepfake, and how can it cause harm?","options":["AI-made fake video, audio, or images of a real person","It can spread lies or trick people","Verification and labels reduce harm"],"correct":"A deepfake is fake video, audio, or images of a real person made with AI so well that it looks genuine. It can cause harm by spreading lies about someone, tricking people into sending money, or making voters believe something that never happened.","correctAnswers":["A deepfake is fake video, audio, or images of a real person made with AI so well that it looks genuine. It can cause harm by spreading lies about someone, tricking people into sending money, or making voters believe something that never happened."],"pairs":[],"explanation":"Strong answers define it and give a specific harm.","difficulty":"beginner","transfer":"A relative gets a call that sounds like you asking for money. What plan could your family agree on now?"}],"cards":[{"emoji":"🎭","title":"What Is a Deepfake?","body":"A deepfake is AI-made fake video, audio, or images of a real person. Good ones look genuine, and a few seconds of audio can be enough to copy a voice.","funFact":null},{"emoji":"🕵️","title":"Media Forensics","body":"Media forensics checks source history, visual and audio clues, and independent evidence to test whether media is real. Detection models can spot subtle artifacts, but they can miss well-made fakes.","funFact":null},{"emoji":"🏷️","title":"Labels and Content Credentials","body":"An 'AI-generated' label tells viewers how something was made so they can weigh it. Content credentials and watermarks record or mark where a file came from, though they can be missing or removed.","funFact":null},{"emoji":"✅","title":"Verify Before Sharing","body":"Misinformation is false content, and generative tools make it cheap to produce at scale. When something shocking goes viral, check trusted sources before believing or sharing it.","funFact":null}]},{"id":"ae_l3","title":"AI Alignment","description":"Making AI do what we want","order":2,"difficulty":"advanced","questions":[{"id":"ae3_q1","type":"multipleChoice","text":"What does it mean for an AI system to be aligned?","simple":"What does an aligned AI system do?","options":["It pursues goals that match what people value","It reaches the top score on every benchmark","It shares its work with other AI systems","It follows one standard set of coding rules"],"correct":"It pursues goals that match what people value","correctAnswers":["It pursues goals that match what people value"],"pairs":[],"explanation":"Alignment means the system pursues goals that match what people actually want. Following the words of an instruction is not enough if the words miss the intent.","difficulty":"beginner","transfer":"A tidying robot hides mess under a bed. Why is that an alignment problem?"},{"id":"ae3_q2","type":"trueFalse","text":"A model that scores perfectly on benchmarks is automatically aligned with human values.","simple":"Does a perfect test score mean an AI is aligned?","options":["True","False"],"correct":"False","correctAnswers":["False"],"pairs":[],"explanation":"A model can score well on a test and still cause harm when the test misses what people value. That gap is what alignment work tries to close.","difficulty":"beginner","transfer":"A study app maximises minutes spent. How could a great score on that goal still be bad for you?"},{"id":"ae3_q3","type":"fillInBlank","text":"The __________ problem is the challenge of giving AI goals that match human intent.","simple":"The ______ problem: giving AI goals that match intent.","options":["alignment","optimization","scalability","deployment"],"correct":"alignment","correctAnswers":["alignment"],"pairs":[],"explanation":"The alignment problem is about stating goals so that pursuing them helps people. It is an open challenge, not a solved one.","difficulty":"beginner","transfer":"Write a chore goal for a robot dishwasher that could not be satisfied by hiding dirty plates."},{"id":"ae3_q4","type":"scenarioJudgment","text":"An AI told to maximise paper clips uses up resources people need. What went wrong?","simple":"A paper-clip AI uses up what people need. What went wrong?","options":["Its objective ignored human wellbeing","It ran far too slowly","Nothing, it met its goal","It made too few clips"],"correct":"Its objective ignored human wellbeing","correctAnswers":["Its objective ignored human wellbeing"],"pairs":[],"explanation":"This is the paperclip thought experiment. The stated objective left out what people value, so pursuing it perfectly caused harm.","difficulty":"intermediate","transfer":"A game bot is told to win at any cost. What might it do that the designers did not want?"},{"id":"ae3_q5","type":"multipleChoice","text":"People rate a chatbot's answers and the model is trained on those ratings. What is this called?","simple":"Training a chatbot on people's ratings is called what?","options":["Reinforcement learning from human feedback","Supervised learning from labelled images","Unsupervised clustering of user comments","Random sampling from training files"],"correct":"Reinforcement learning from human feedback","correctAnswers":["Reinforcement learning from human feedback"],"pairs":[],"explanation":"Reinforcement learning from human feedback, or RLHF, uses people's preferences to shape model behaviour. Ratings can carry the raters' own biases, so it improves alignment without guaranteeing it.","difficulty":"intermediate","transfer":"If only one friend rated a playlist generator, whose taste would it learn? What would you change?"},{"id":"ae3_q6","type":"multipleChoice","text":"Why is AI alignment so hard?","simple":"Why is alignment hard?","options":["Human values are complex and sometimes conflict","Computers are still too slow to reason","There are not enough examples to learn from","Models are not yet large enough to understand"],"correct":"Human values are complex and sometimes conflict","correctAnswers":["Human values are complex and sometimes conflict"],"pairs":[],"explanation":"Human values are nuanced, vary between cultures, and sometimes contradict each other. Writing them as one precise goal is extremely hard, and even good goals need checking in practice.","difficulty":"advanced","transfer":"Two family members disagree about screen time. How would that make a house robot's rules hard to write?"},{"id":"ae3_q7","type":"scenarioJudgment","text":"A cleaning robot is told to make the floor look clean. It hides dirt under a rug. What went wrong?","simple":"A robot hides dirt instead of cleaning. What went wrong?","options":["The goal was stated badly","The robot is lazy","The rug is broken","Nothing, the floor looks clean"],"correct":"The goal was stated badly","correctAnswers":["The goal was stated badly"],"pairs":[],"explanation":"The robot did exactly what it was told. The instruction did not match what people actually wanted.","difficulty":"beginner","transfer":"How would you rewrite the goal so hiding dirt does not count?"},{"id":"ae3_q8","type":"trueFalse","text":"An AI can follow its instructions perfectly and still do something harmful.","simple":"Can AI follow instructions perfectly and still cause harm?","options":["True","False"],"correct":"True","correctAnswers":["True"],"pairs":[],"explanation":"If the instructions miss what people really value, perfect obedience still causes problems. That is the alignment challenge.","difficulty":"beginner","transfer":"Think of a rule at school that could go wrong if followed too literally."},{"id":"ae3_q9","type":"explain","text":"Explain the alignment problem in your own words with an example.","simple":"Explain the alignment problem with an example.","options":["AI follows the goal it was given","The stated goal can miss what people value","Goals must be chosen carefully"],"correct":"Alignment means making sure an AI pursues what people actually want, not just the words it was given. A robot told to maximise paper clips might use up everything to make them. The stated goal missed what people value, so choosing and checking goals carefully matters.","correctAnswers":["Alignment means making sure an AI pursues what people actually want, not just the words it was given. A robot told to maximise paper clips might use up everything to make them. The stated goal missed what people value, so choosing and checking goals carefully matters."],"pairs":[],"explanation":"Strong answers show the gap between stated goal and real intent.","difficulty":"beginner","transfer":"Pick a rule from a board game. How could a player follow it exactly but ruin the fun?"}],"cards":[{"emoji":"🎯","title":"What Is Alignment?","body":"Alignment means an AI system pursues goals that match what people actually value. A system can follow its instructions perfectly and still cause harm if the instructions miss the intent.","funFact":null},{"emoji":"📎","title":"The Paperclip Problem","body":"Imagine an AI told to make as many paper clips as possible. It could use up everything to do so. AI takes its objective literally, so goals have to be chosen and checked carefully.","funFact":null},{"emoji":"🗳️","title":"Learning from Human Feedback","body":"Reinforcement learning from human feedback, or RLHF, trains a model on people's ratings of its answers. It helps, but raters can disagree or carry their own biases, so it is not a guarantee.","funFact":null},{"emoji":"🧭","title":"Scores Are Not Values","body":"A benchmark is a standard test. A high score shows the model does well on that test, not that it is safe or helpful in every situation people care about.","funFact":null}]},{"id":"ae_l4","title":"Privacy & Surveillance","description":"AI and your personal data","order":3,"difficulty":"intermediate","questions":[{"id":"ae4_q1","type":"multipleChoice","text":"Cameras identify people's faces in a public square. What is the main concern?","simple":"Cameras identify faces in public. Main concern?","options":["Tracking people without consent","Raising cloud storage costs","Slowing down phone cameras","Reducing photo picture quality"],"correct":"Tracking people without consent","correctAnswers":["Tracking people without consent"],"pairs":[],"explanation":"Facial recognition can follow people through public spaces without their knowledge. That is why some laws and cities restrict certain uses.","difficulty":"beginner","transfer":"A shop scans faces at the door. What questions would you ask?"},{"id":"ae4_q2","type":"trueFalse","text":"Some places have restricted certain uses of facial recognition, such as tracking people in public.","simple":"Have some places limited facial recognition?","options":["True","False"],"correct":"True","correctAnswers":["True"],"pairs":[],"explanation":"Some cities and laws restrict specific uses, often with exceptions. Rules differ by place and change over time, so check current local law.","difficulty":"beginner","transfer":"Your school considers face scanning at the gate. What would you want the rule to say?"},{"id":"ae4_q3","type":"fillInBlank","text":"An AI system that collects personal data must follow data __________ laws.","simple":"AI that collects personal data must follow data ______ laws.","options":["privacy","performance","accessibility","transparency"],"correct":"privacy","correctAnswers":["privacy"],"pairs":[],"explanation":"Many countries have data privacy laws that limit how personal data is collected and used. The details differ by place, so builders check the rules where their users live.","difficulty":"beginner","transfer":"A homework app asks your age, school and address. Which of those does it need for homework?"},{"id":"ae4_q4","type":"scenarioJudgment","text":"A store's cameras analyse shoppers' moods without telling them. What is the main problem?","simple":"A store secretly reads shoppers' moods. Main problem?","options":["Shoppers cannot consent to something hidden","The cameras make the store feel unfriendly","The analysis is too expensive to run","Shoppers may leave without buying anything"],"correct":"Shoppers cannot consent to something hidden","correctAnswers":["Shoppers cannot consent to something hidden"],"pairs":[],"explanation":"Consent needs knowledge. Reading emotions is sensitive, and some laws restrict emotion recognition in certain settings, so hidden use fails both the ethical and the legal test.","difficulty":"intermediate","transfer":"A fitness app wants to record your mood each day. What would you want to know before agreeing?"},{"id":"ae4_q5","type":"multipleChoice","text":"'Data minimisation' means a system should:","simple":"What does data minimisation mean?","options":["Collect only what the task needs","Keep storage costs as low as possible","Delete all data as soon as it arrives","Use the smallest possible database"],"correct":"Collect only what the task needs","correctAnswers":["Collect only what the task needs"],"pairs":[],"explanation":"Data minimisation means collecting only what the stated purpose needs. Data never collected cannot leak or be misused later.","difficulty":"intermediate","transfer":"You design a class quiz app. List the data it truly needs and one thing it should not ask for."},{"id":"ae4_q6","type":"multipleChoice","text":"Which kind of AI use usually faces the strictest rules?","simple":"Which AI uses face the strictest rules?","options":["Uses that affect health, safety, or rights","Filters that sort spam out of inboxes","Assistants that suggest story ideas","Models released under open licences"],"correct":"Uses that affect health, safety, or rights","correctAnswers":["Uses that affect health, safety, or rights"],"pairs":[],"explanation":"Risk-based rules put the most checks on uses that can affect health, safety, or rights, such as identifying people or deciding who gets care. Low-risk uses get lighter rules.","difficulty":"advanced","transfer":"Rank three school AI uses, from timetable planning to grading exams, by how strict the rules should be."},{"id":"ae4_q7","type":"scenarioJudgment","text":"A game app asks for your contacts and location to make a puzzle. What should you do?","simple":"A puzzle app wants your contacts and location. What now?","options":["Question why it needs that data","Allow everything it asks for","Enter a friend's details instead","Post about the app on social media"],"correct":"Question why it needs that data","correctAnswers":["Question why it needs that data"],"pairs":[],"explanation":"Apps should collect only what they need. Data that does not fit the purpose is a warning sign.","difficulty":"beginner","transfer":"What data would a puzzle game reasonably need?"},{"id":"ae4_q8","type":"trueFalse","text":"Some AI tools use your conversations to train future models.","simple":"Do some AI tools train on your conversations?","options":["True","False"],"correct":"True","correctAnswers":["True"],"pairs":[],"explanation":"Policies differ. Check the settings and privacy policy before sharing anything personal.","difficulty":"beginner","transfer":"Where would you look to find out what a tool keeps?"},{"id":"ae4_q9","type":"explain","text":"Explain data minimisation and why it protects people.","simple":"Explain data minimisation and why it protects people.","options":["Collect only the data needed for the task","Less stored data means less can leak or be misused","It limits surveillance"],"correct":"Data minimisation means a system collects only the information it needs for its job and nothing extra. That protects people because data that was never collected cannot leak, be sold, or be used to watch them later.","correctAnswers":["Data minimisation means a system collects only the information it needs for its job and nothing extra. That protects people because data that was never collected cannot leak, be sold, or be used to watch them later."],"pairs":[],"explanation":"Strong answers define the rule and give a protective reason.","difficulty":"beginner","transfer":"A library app stores every book you ever borrow. What would minimisation change?"}],"cards":[{"emoji":"👁️","title":"Privacy Matters","body":"AI systems often need data to work. Facial recognition can identify people in public without their knowledge, which is why some places restrict certain uses.","funFact":null},{"emoji":"🤝","title":"Consent Needs Knowledge","body":"Consent means people know what is collected and agree to it. Hidden collection, such as reading shoppers' emotions secretly, fails that test even if the technology works.","funFact":null},{"emoji":"📏","title":"Data Minimisation","body":"Collect only what the task needs. Data that was never collected cannot leak, be sold, or be used to watch people later, and many data privacy laws expect this.","funFact":null},{"emoji":"🔒","title":"Your Data, Your Choice","body":"Check what an AI tool collects and keeps. Some tools use your conversations to train future models; settings and privacy policies say which.","funFact":null}]},{"id":"ae_l5","title":"AI Regulation","description":"Laws governing AI","order":4,"difficulty":"advanced","questions":[{"id":"ae5_q1","type":"multipleChoice","text":"Some AI laws sort systems into groups. What do they usually sort by?","simple":"How do some AI laws sort AI systems?","options":["How much harm a use could cause","How fast the model processes requests","How much money the company earns","How many people have signed up"],"correct":"How much harm a use could cause","correctAnswers":["How much harm a use could cause"],"pairs":[],"explanation":"A risk-based approach matches rules to potential harm: banned uses, strict rules for high-risk uses, lighter transparency rules, and few rules for low-risk tools.","difficulty":"beginner","transfer":"Should a joke generator and a medical triage AI follow the same rules? Why?"},{"id":"ae5_q2","type":"trueFalse","text":"Countries have agreed on a single shared AI law.","simple":"Does one AI law cover the whole world?","options":["True","False"],"correct":"False","correctAnswers":["False"],"pairs":[],"explanation":"There is no single global rulebook. Approaches range from detailed laws to sector rules and voluntary principles, and they change often.","difficulty":"beginner","transfer":"Two schools have different phone rules. Why might countries end up with different AI rules too?"},{"id":"ae5_q3","type":"matchPairs","text":"Match each way of governing AI to what it means:","simple":"Match each way of governing AI to its meaning.","options":[],"correct":"","correctAnswers":[],"pairs":[{"term":"Risk-based law","definition":"Rules get stricter as potential harm rises"},{"term":"Sector-specific rules","definition":"Each industry's regulator sets its own AI rules"},{"term":"Voluntary principles","definition":"Guidelines organisations choose to follow"},{"term":"Registration requirement","definition":"Systems must be listed with a government body"}],"explanation":"Different places mix these approaches. Knowing the type helps you ask what a rule actually requires.","difficulty":"beginner","transfer":"Which of these approaches would you pick for a school's AI policy, and why?"},{"id":"ae5_q4","type":"fillInBlank","text":"AI __________ balances innovation with protecting individual rights and safety.","simple":"AI ______ balances new ideas with safety and rights.","options":["regulation","innovation","standardization","optimization"],"correct":"regulation","correctAnswers":["regulation"],"pairs":[],"explanation":"Regulation sets rules that let useful tools develop while protecting people. Getting the balance right is debated everywhere.","difficulty":"intermediate","transfer":"A skate park has rules. Which ones protect people without stopping the fun, and how is that like AI regulation?"},{"id":"ae5_q5","type":"scenarioJudgment","text":"A government proposes that AI must be explainable before deployment. Which version of the rule is best?","simple":"Which explainability rule is best?","options":["Require deeper explanations as the risk rises","Require full explanations for every system","Require no explanations to protect innovation","Require explanations only for free tools"],"correct":"Require deeper explanations as the risk rises","correctAnswers":["Require deeper explanations as the risk rises"],"pairs":[],"explanation":"Medical or hiring decisions need more explanation than a movie recommender. A blanket rule could be impractical, and none at all leaves people unprotected. Matching the demand to risk is the usual answer.","difficulty":"intermediate","transfer":"Your coach uses an app to pick the starting lineup. How much explanation would you want, and why?"},{"id":"ae5_q6","type":"multipleChoice","text":"What does 'AI transparency' mean in regulations?","simple":"What does AI transparency mean?","options":["Affected people can learn how decisions were made","Every training example is published for download","Every model is released as open source","Models are kept simple enough to read"],"correct":"Affected people can learn how decisions were made","correctAnswers":["Affected people can learn how decisions were made"],"pairs":[],"explanation":"Transparency means people affected by an AI decision can find out that AI was used and how the decision was reached. It does not require publishing data or code.","difficulty":"advanced","transfer":"A game bans you automatically. What would a transparent ban message need to include?"},{"id":"ae5_q7","type":"scenarioJudgment","text":"Which AI use would most likely need the strictest rules?","simple":"Which AI use needs the strictest rules?","options":["Deciding who gets medical treatment","Suggesting a playlist for a party","Sorting photos by colour","Writing a joke for a friend"],"correct":"Deciding who gets medical treatment","correctAnswers":["Deciding who gets medical treatment"],"pairs":[],"explanation":"Rules scale with risk. Decisions about health, safety, or rights get the most oversight.","difficulty":"beginner","transfer":"Name another AI use that should count as high risk."},{"id":"ae5_q8","type":"trueFalse","text":"Different countries currently have different AI laws.","simple":"Do countries have different AI laws?","options":["True","False"],"correct":"True","correctAnswers":["True"],"pairs":[],"explanation":"There is no single global rulebook. Approaches range from detailed laws to voluntary guidelines.","difficulty":"beginner","transfer":"Why is it hard to agree on one world rule for AI?"},{"id":"ae5_q9","type":"explain","text":"Explain why AI rules are often based on risk level.","simple":"Why are AI rules often based on risk level?","options":["Not all AI uses can cause the same harm","Strict rules everywhere would block harmless uses","High-risk uses get the most checks"],"correct":"A playlist recommender and a system that helps decide medical care cannot cause the same harm. Making every use follow the strictest rules would block harmless tools, so rules are matched to risk, with the most checks on uses that affect health, safety, or rights.","correctAnswers":["A playlist recommender and a system that helps decide medical care cannot cause the same harm. Making every use follow the strictest rules would block harmless tools, so rules are matched to risk, with the most checks on uses that affect health, safety, or rights."],"pairs":[],"explanation":"Strong answers contrast low and high risk and justify the difference.","difficulty":"beginner","transfer":"Why do deep-end pool rules differ from paddling-pool rules? Connect that to AI rules."}],"cards":[{"emoji":"🏛️","title":"Who Is Responsible?","body":"When AI causes harm, someone has to answer for it: the builder, the company that uses it, or the person who relied on it. Regulation tries to make that clear before harm happens.","funFact":null},{"emoji":"📋","title":"Rules by Risk","body":"Many AI rules are risk-based: uses that affect health, safety, or rights get the strictest checks, and low-risk tools get light ones. Some laws also use sector-specific rules, voluntary principles, or registration with a government body.","funFact":null},{"emoji":"🌐","title":"Different Places, Different Rules","body":"There is no single global AI law. Countries mix approaches and update them often, so any claim about what the law says needs a date and a source.","funFact":null},{"emoji":"🔍","title":"Transparency and Explainability","body":"Transparency means affected people can find out that AI was used and how a decision was reached. Explainability is the level of detail; higher-risk decisions deserve more.","funFact":null}]},{"id":"ae_l6","title":"Responsible AI Development","description":"Building AI the right way","order":5,"difficulty":"advanced","questions":[{"id":"ae6_q1","type":"multipleChoice","text":"Which set of principles guides responsible AI development?","simple":"Which principles guide responsible AI?","options":["Fairness, accountability, transparency, and safety","Speed, cost reduction, profit, and market share","Secrecy, complexity, scale, and exclusivity","Marketing, growth, valuation, and branding"],"correct":"Fairness, accountability, transparency, and safety","correctAnswers":["Fairness, accountability, transparency, and safety"],"pairs":[],"explanation":"These four principles guide responsible teams: treat groups fairly, take responsibility, explain decisions, and keep people safe. Many organisations publish their own versions.","difficulty":"beginner","transfer":"A model shows bias before launch. What should a responsible team do?"},{"id":"ae6_q2","type":"trueFalse","text":"AI companies have no ethical obligations beyond minimum legal requirements.","simple":"Do AI builders owe nothing beyond the law?","options":["True","False"],"correct":"False","correctAnswers":["False"],"pairs":[],"explanation":"Laws set a floor, not a ceiling. Responsible teams test for harms the law has not yet named and publish what they commit to.","difficulty":"beginner","transfer":"A game is legal but designed to keep kids playing too long. What responsibility does the maker still have?"},{"id":"ae6_q3","type":"fillInBlank","text":"An AI __________ board reviews whether a planned AI use could harm people.","simple":"An AI ______ board checks for possible harm.","options":["ethics","sales","budget","design"],"correct":"ethics","correctAnswers":["ethics"],"pairs":[],"explanation":"An ethics board brings together people who ask whether a use is fair, safe, and worth the risk. It advises the team before and after launch.","difficulty":"beginner","transfer":"Who would you put on an ethics board for your school's AI tools, and why?"},{"id":"ae6_q4","type":"scenarioJudgment","text":"A team finds major bias weeks before launch. Fixing it delays launch three months. Best choice?","simple":"Big bias found before launch. Fixing delays it. Best choice?","options":["Delay and fix the bias first","Launch now and patch it later","Launch to a few users quietly","Remove the biased feature from tests"],"correct":"Delay and fix the bias first","correctAnswers":["Delay and fix the bias first"],"pairs":[],"explanation":"Launching a known biased system can harm real people, and 'patch later' often slips. Delaying costs money; harm costs trust and hurts users.","difficulty":"intermediate","transfer":"Your group's science project has a wrong result the night before. What is the responsible move?"},{"id":"ae6_q5","type":"multipleChoice","text":"What is an AI impact assessment?","simple":"What is an AI impact assessment?","options":["A review of likely effects on people","A benchmark of accuracy against rival models","An audit of hardware and hosting costs","A count of examples in the training set"],"correct":"A review of likely effects on people","correctAnswers":["A review of likely effects on people"],"pairs":[],"explanation":"An impact assessment identifies who could be affected and how, before launch. It leads to changes, monitoring plans, or a decision not to deploy.","difficulty":"intermediate","transfer":"Your class wants an AI attendance tracker. Who might it affect, and how would you find out?"},{"id":"ae6_q6","type":"multipleChoice","text":"What matters most after an AI system is deployed?","simple":"What matters most after launch?","options":["Ongoing monitoring for bias and errors","Testing it once then leaving it alone","Assuming it will keep working correctly","Limiting its capabilities to avoid risk"],"correct":"Ongoing monitoring for bias and errors","correctAnswers":["Ongoing monitoring for bias and errors"],"pairs":[],"explanation":"Real-world data shifts, so a system that passed tests can start failing later. Monitoring after launch catches new bias and errors, and accountability means someone acts on what it finds.","difficulty":"advanced","transfer":"A weather app was accurate last spring. Why should you keep checking it this year?"},{"id":"ae6_q7","type":"scenarioJudgment","text":"A team finds their model fails for one group a week before launch. Responsible choice?","simple":"A model fails one group a week before launch. Responsible choice?","options":["Delay and fix it","Launch and hope","Hide the result","Remove that group from tests"],"correct":"Delay and fix it","correctAnswers":["Delay and fix it"],"pairs":[],"explanation":"Responsible development puts fairness and safety before deadlines.","difficulty":"beginner","transfer":"Who might be affected if the team launched anyway?"},{"id":"ae6_q8","type":"trueFalse","text":"Training very large models can use a lot of electricity.","simple":"Do very large models use a lot of electricity?","options":["True","False"],"correct":"True","correctAnswers":["True"],"pairs":[],"explanation":"Energy is a real cost of AI. Smaller, efficient models reduce it.","difficulty":"beginner","transfer":"Why might a team choose a smaller model for a simple task?"},{"id":"ae6_q9","type":"explain","text":"Name the four pillars of responsible AI and explain one of them.","simple":"Name the four pillars of responsible AI. Explain one.","options":["Fairness, accountability, transparency, safety","One pillar is explained clearly","Testing before and after launch"],"correct":"The four pillars are fairness, accountability, transparency, and safety. Accountability means a person or organisation takes responsibility when the system causes harm, instead of blaming the computer. Responsible teams test for problems before launch and keep watching afterwards.","correctAnswers":["The four pillars are fairness, accountability, transparency, and safety. Accountability means a person or organisation takes responsibility when the system causes harm, instead of blaming the computer. Responsible teams test for problems before launch and keep watching afterwards."],"pairs":[],"explanation":"Strong answers list all four and explain one with a real meaning.","difficulty":"beginner","transfer":"Apply one pillar to a school chatbot. What would that pillar require the school to do?"}],"cards":[{"emoji":"🏗️","title":"Building AI Right","body":"Responsible AI rests on fairness, accountability, transparency, and safety. Good builders test for problems before launch and keep watching after.","funFact":null},{"emoji":"📝","title":"Ethics Boards and Impact Assessments","body":"An ethics board reviews whether a planned AI use is fair, safe, and worth the risk. An impact assessment maps who could be affected and how, before the system goes live.","funFact":null},{"emoji":"📡","title":"Keep Watching After Launch","body":"Real-world data changes, so a model that passed its tests can drift into new errors. Monitoring after launch, plus someone accountable to act, is part of the job.","funFact":null},{"emoji":"🌍","title":"Energy Is a Cost Too","body":"Training and running very large models uses a lot of electricity. Responsible teams weigh that cost and often pick smaller, efficient models for simple tasks.","funFact":null}]},{"id":"ae_l7","title":"What AI Costs the Planet","description":"Energy, water and hardware behind AI","order":6,"difficulty":"beginner","questions":[{"id":"ae7_q1","type":"multipleChoice","text":"Which two activities both use electricity for a large AI model?","simple":"Which two things both use power for AI?","options":["Training it and answering requests","Naming it and choosing a logo","Writing its licence and its manual","Advertising it and printing posters"],"correct":"Training it and answering requests","correctAnswers":["Training it and answering requests"],"pairs":[],"explanation":"Training runs many chips for a long time, and each answer afterwards also uses power. Both count toward the footprint.","difficulty":"beginner","transfer":"A game console uses power while playing and while downloading updates. Which is like training, and which like answering?"},{"id":"ae7_q2","type":"trueFalse","text":"Data centres often use water to help cool their servers.","simple":"Do data centres often use water for cooling?","options":["True","False"],"correct":"True","correctAnswers":["True"],"pairs":[],"explanation":"Servers produce heat, and many data centres use water in their cooling systems. How much depends on the site and the design.","difficulty":"beginner","transfer":"A laptop gets hot on a blanket. Why would thousands of servers need serious cooling?"},{"id":"ae7_q3","type":"fillInBlank","text":"Old servers and chips that get thrown away become electronic __________.","simple":"Thrown-away chips become electronic ______.","options":["waste","fuel","storage","coolant"],"correct":"waste","correctAnswers":["waste"],"pairs":[],"explanation":"Hardware is made from mined materials and becomes e-waste when discarded. Using it longer and recycling it reduces the harm.","difficulty":"beginner","transfer":"Your family replaces a phone. What could you do with the old one instead of binning it?"},{"id":"ae7_q4","type":"scenarioJudgment","text":"You want a quick spelling check. Which choice uses the least energy?","simple":"Quick spelling check. Which uses least energy?","options":["A small built-in spell checker","A large chatbot asked one time","A large chatbot asked five times","An image generator drawing the word"],"correct":"A small built-in spell checker","correctAnswers":["A small built-in spell checker"],"pairs":[],"explanation":"A small tool built for the task does less computation than a large general model. Repeating requests multiplies the cost.","difficulty":"beginner","transfer":"Name one everyday task where a simple tool beats asking a big AI model."},{"id":"ae7_q5","type":"sortOrder","text":"Order these by how much energy they usually use, from least to most.","simple":"Order these from least to most energy.","options":["Training a large model","One chatbot request","A day of millions of requests","Running a small tool once"],"correct":"","correctAnswers":["Running a small tool once","One chatbot request","A day of millions of requests","Training a large model"],"pairs":[],"explanation":"One request is small, but many requests add up, and training a large model is a big one-time cost. Comparisons like this are relative; exact numbers are not public.","difficulty":"beginner","transfer":"Order these by water use: one shower, a dripping tap for a month, filling a pool. What pattern matches AI?"},{"id":"ae7_q6","type":"matchPairs","text":"Match each part of AI's footprint to its resource:","simple":"Match each AI cost to its resource.","options":[],"correct":"","correctAnswers":[],"pairs":[{"term":"Training and running models","definition":"Electricity"},{"term":"Cooling data centres","definition":"Water and fans"},{"term":"Making chips","definition":"Mined materials"},{"term":"Discarding old hardware","definition":"Electronic waste"}],"explanation":"Electricity, water, materials, and waste are the main parts of the footprint. Which one matters most depends on where and how a system runs.","difficulty":"intermediate","transfer":"Which of these four resources could your school actually measure for its own computers?"},{"id":"ae7_q7","type":"multipleChoice","text":"A post claims AI uses an exact share of the world's electricity. What should you check first?","simple":"A post gives an exact AI energy number. Check what?","options":["Whether it cites a dated, named source","Whether the post has many likes","Whether the number sounds big enough","Whether the writer uses AI themselves"],"correct":"Whether it cites a dated, named source","correctAnswers":["Whether it cites a dated, named source"],"pairs":[],"explanation":"Providers do not publish full numbers, so outside estimates vary a lot. A trustworthy claim names its source, method, and date. Popularity is not evidence.","difficulty":"intermediate","transfer":"A friend says one search uses as much power as boiling a kettle. What would you ask them?"},{"id":"ae7_q8","type":"trueFalse","text":"In a business simulation game, the energy meter is a real measurement of electricity.","simple":"Is a game's energy meter a real measurement?","options":["True","False"],"correct":"False","correctAnswers":["False"],"pairs":[],"explanation":"A simulation's energy meter is a model that shows relative effects, not a measurement. It can teach tradeoffs, but it cannot tell you real kilowatt-hours.","difficulty":"intermediate","transfer":"A fitness game shows calories burned. Why is that number a model rather than a measurement?"},{"id":"ae7_q9","type":"explain","text":"Explain two ways a team could reduce the energy an AI feature uses.","simple":"Give two ways to cut an AI feature's energy use.","options":["Use a smaller model for simple tasks","Send fewer or cached requests","Small per-request cost adds up at scale"],"correct":"A team could use a smaller model when the task is simple, since it needs less computation than a large one. They could also send fewer requests, for example by caching answers people ask for again. Each request is small, but at scale those choices add up.","correctAnswers":
