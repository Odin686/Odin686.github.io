<style>
/* Vizancia Learn web player. Mirrors the iOS palette and card language. */
:root {
  --primary: #6C5CE7;
  --primary-2: #5B4BD6;
  --secondary: #00CEC9;
  --success: #00B894;
  --error: #FF6B6B;
  --warning: #FDCB6E;
  --orange: #E17055;
  --blue: #0984E3;
  --bg: #F8F9FE;
  --card: #FFFFFF;
  --card-2: #F1F2FA;
  --text: #2D3436;
  --text-2: #636E72;
  --line: #E4E6F2;
  --shadow: 0 2px 6px rgba(45,52,54,.06), 0 10px 28px rgba(45,52,54,.06);
  --radius: 16px;
  --radius-sm: 12px;
  --tap: 44px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #141830;
    --card: #1C2140;
    --card-2: #252B52;
    --text: #EDEFF8;
    --text-2: #A3A9C8;
    --line: #2E3560;
    --shadow: 0 2px 6px rgba(0,0,0,.35), 0 10px 28px rgba(0,0,0,.3);
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: ui-rounded, "SF Pro Rounded", "Nunito", "Segoe UI", system-ui, -apple-system, sans-serif;
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; }
a { color: var(--primary); text-decoration: none; }
p a, li a, .small a { text-decoration: underline; text-underline-offset: 2px; }
.node, .node .label, .hero, .brand { color: inherit; text-decoration: none; }
.node { color: var(--text); }
button, [role="button"] { cursor: pointer; }
:focus-visible { outline: 3px solid var(--secondary); outline-offset: 2px; border-radius: 8px; }
.skip { position: absolute; left: -999px; top: 8px; background: var(--primary); color: #fff; padding: 8px 12px; border-radius: 8px; z-index: 50; }
.skip:focus { left: 8px; }
[hidden] { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* Top bar */
.topbar {
  position: sticky; top: 0; z-index: 20;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
.topbar-inner {
  max-width: 1080px; margin: 0 auto; padding: 10px 16px;
  display: flex; align-items: center; gap: 12px; min-height: 56px;
}
.brand { display: flex; align-items: center; gap: 8px; font-weight: 900; font-size: 18px; letter-spacing: -.01em; text-decoration: none; color: var(--text); }
.brand .mark { width: 28px; height: 28px; border-radius: 8px; background: var(--primary); display: grid; place-items: center; color: #fff; font-weight: 900; font-size: 15px; }
.stats { display: flex; gap: 8px; margin-left: auto; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 6px 11px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); font-weight: 800; font-size: 13px; min-height: 34px; white-space: nowrap; }
.pill.xp { color: var(--primary); }
.pill.streak { color: var(--orange); }
.pill.band { color: var(--text-2); }
.nav { display: flex; gap: 4px; }
.nav a { padding: 8px 10px; border-radius: 10px; font-weight: 800; font-size: 13.5px; color: var(--text-2); text-decoration: none; min-height: var(--tap); display: inline-flex; align-items: center; }
.nav a[aria-current="page"], .nav a:hover { background: var(--card-2); color: var(--text); }
@media (max-width: 720px) { .nav a span { display: none; } .nav a { padding: 8px 9px; font-size: 18px; } }

/* Layout */
.app { max-width: 1080px; margin: 0 auto; padding: 20px 16px 96px; }
.wrap { max-width: 720px; margin: 0 auto; }
.wide { display: grid; gap: 20px; grid-template-columns: 1fr; }
@media (min-width: 960px) { .wide { grid-template-columns: minmax(0, 1fr) 300px; align-items: start; } .wide > aside { position: sticky; top: 76px; } }

.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px 20px; }
.card + .card { margin-top: 14px; }
.eyebrow { font-size: 11.5px; font-weight: 900; letter-spacing: .08em; text-transform: uppercase; color: var(--text-2); }
h1 { font-size: clamp(26px, 4vw, 34px); font-weight: 900; line-height: 1.1; margin: 6px 0 12px; letter-spacing: -.01em; text-wrap: balance; }
h2 { font-size: 20px; font-weight: 900; margin: 0 0 10px; text-wrap: balance; }
h3 { font-size: 16px; font-weight: 800; margin: 0 0 8px; }
p { margin: 0 0 10px; }
.muted { color: var(--text-2); }
.small { font-size: 13.5px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.grow { flex: 1; }
.stack { display: grid; gap: 10px; }

/* Buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: var(--tap); padding: 10px 18px; border-radius: 14px; border: 1px solid transparent;
  font-weight: 900; font-size: 15px; text-decoration: none; transition: transform .08s ease, background .15s ease;
}
.btn:active { transform: scale(.98); }
.btn.primary { background: linear-gradient(135deg, var(--primary), var(--secondary)); color: #fff; }
.btn.solid { background: var(--primary); color: #fff; }
.btn.ghost { background: var(--card); border-color: var(--line); color: var(--text); }
.btn.success { background: var(--success); color: #fff; }
.btn.block { width: 100%; }
.btn[disabled] { opacity: .45; cursor: not-allowed; transform: none; }

/* Hero */
.hero {
  background: linear-gradient(135deg, var(--primary), var(--secondary));
  color: #fff; border-radius: 20px; padding: 20px 22px; display: flex; align-items: center; gap: 16px;
  box-shadow: 0 12px 30px rgba(108,92,231,.25); text-decoration: none;
}
.hero .play { width: 54px; height: 54px; border-radius: 50%; background: rgba(255,255,255,.22); display: grid; place-items: center; font-size: 22px; flex: none; }
.hero .eyebrow { color: rgba(255,255,255,.85); }
.hero h2 { color: #fff; margin: 2px 0; font-size: 22px; }
.hero .sub { color: rgba(255,255,255,.85); font-weight: 700; font-size: 14px; }
.hero .arrow { margin-left: auto; font-size: 24px; }

/* Learn path */
.tier { text-align: center; margin: 28px 0 10px; }
.tier span { display: inline-block; padding: 8px 18px; border-radius: 999px; background: color-mix(in srgb, var(--primary) 12%, transparent); color: var(--primary); font-weight: 900; }
.cat { margin: 14px 0 26px; }
.cat-head { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
.cat-icon { width: 54px; height: 54px; border-radius: 50%; display: grid; place-items: center; font-size: 24px; background: color-mix(in srgb, var(--primary) 14%, var(--card)); border: 3px solid color-mix(in srgb, var(--primary) 30%, transparent); flex: none; }
.cat.locked .cat-icon { background: var(--card-2); border-color: var(--line); filter: grayscale(1); opacity: .7; }
.cat-title { font-weight: 900; font-size: 18px; }
.cat-sub { font-size: 13px; color: var(--text-2); font-weight: 700; }
.tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
.tag { font-size: 10.5px; font-weight: 900; letter-spacing: .04em; text-transform: uppercase; padding: 2px 8px; border-radius: 999px; background: color-mix(in srgb, var(--secondary) 16%, transparent); color: color-mix(in srgb, var(--secondary) 70%, var(--text)); }
.nodes { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
.node {
  display: flex; align-items: center; gap: 10px; text-align: left; padding: 10px 12px; min-height: 60px;
  background: var(--card); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow);
}
.node .dot { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-weight: 900; color: #fff; background: var(--primary); flex: none; font-size: 16px; }
.node.done .dot { background: var(--success); }
.node.locked .dot { background: var(--line); color: var(--text-2); }
.node.locked { opacity: .65; }
.node.check .dot { background: var(--warning); color: #4a3a00; }
.node.boss .dot { background: var(--orange); }
.node .label { font-weight: 800; font-size: 14px; line-height: 1.25; }
.node .stars { font-size: 12px; color: var(--warning); letter-spacing: 1px; }
.node .meta { font-size: 12px; color: var(--text-2); font-weight: 700; }

/* Lesson */
.progress { height: 10px; background: var(--card-2); border-radius: 999px; overflow: hidden; border: 1px solid var(--line); }
.progress > i { display: block; height: 100%; background: linear-gradient(90deg, var(--primary), var(--secondary)); border-radius: 999px; transition: width .25s ease; }
.lesson-top { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
.lesson-top .close { width: var(--tap); height: var(--tap); border-radius: 50%; border: 1px solid var(--line); background: var(--card); font-size: 18px; display: grid; place-items: center; flex: none; }
.tcard { text-align: center; padding: 30px 22px; }
.tcard .emoji { font-size: 56px; line-height: 1; margin-bottom: 12px; }
.tcard h2 { font-size: 24px; }
.tcard p { font-size: 17px; max-width: 46ch; margin: 0 auto 10px; }
.tcard .fact { display: inline-block; margin-top: 8px; padding: 8px 14px; border-radius: 12px; background: color-mix(in srgb, var(--warning) 25%, transparent); font-weight: 700; font-size: 14px; }
.dots { display: flex; justify-content: center; gap: 6px; margin: 12px 0; }
.dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
.dots i.on { background: var(--primary); }
.qtype { font-size: 11.5px; font-weight: 900; letter-spacing: .08em; text-transform: uppercase; color: var(--primary); margin-bottom: 6px; }
.stem { font-size: 20px; font-weight: 800; line-height: 1.35; margin: 0 0 16px; text-wrap: balance; }
.stem .blank { display: inline-block; min-width: 110px; border-bottom: 3px solid var(--primary); color: var(--primary); text-align: center; }
.opts { display: grid; gap: 10px; }
.opt {
  display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
  padding: 14px 16px; min-height: 56px; border-radius: 14px; border: 2px solid var(--line); background: var(--card); font-weight: 700; font-size: 16px;
}
.opt .key { width: 30px; height: 30px; border-radius: 9px; background: var(--card-2); display: grid; place-items: center; font-weight: 900; font-size: 13px; color: var(--text-2); flex: none; }
.opt:hover { border-color: color-mix(in srgb, var(--primary) 50%, var(--line)); }
.opt.sel { border-color: var(--primary); background: color-mix(in srgb, var(--primary) 10%, var(--card)); }
.opt.ok { border-color: var(--success); background: color-mix(in srgb, var(--success) 14%, var(--card)); }
.opt.bad { border-color: var(--error); background: color-mix(in srgb, var(--error) 14%, var(--card)); }
.opt[disabled] { cursor: default; }
.pairs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.pairs .col { display: grid; gap: 8px; align-content: start; }
.pairs .opt { min-height: 52px; font-size: 14.5px; padding: 10px 12px; }
.pairs .opt.paired { border-style: dashed; opacity: .75; }
.pairs .opt .badge { margin-left: auto; width: 22px; height: 22px; border-radius: 50%; background: var(--primary); color: #fff; font-size: 12px; display: grid; place-items: center; font-weight: 900; }
.sortlist { display: grid; gap: 8px; }
.sortlist .opt { padding: 8px 10px 8px 14px; }
.sortlist .opt .n { width: 26px; height: 26px; border-radius: 50%; background: var(--primary); color: #fff; display: grid; place-items: center; font-weight: 900; font-size: 12px; flex: none; }
.sortlist .ctrl { margin-left: auto; display: flex; gap: 4px; }
.sortlist .ctrl button { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--card-2); font-size: 16px; }
.feedback { margin-top: 14px; padding: 14px 16px; border-radius: 14px; border-left: 5px solid var(--success); background: color-mix(in srgb, var(--success) 12%, var(--card)); }
.feedback.bad { border-left-color: var(--error); background: color-mix(in srgb, var(--error) 12%, var(--card)); }
.feedback b { display: block; margin-bottom: 4px; font-size: 15px; }
.feedback .why { font-size: 15px; }
.actions { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
.actions .btn { flex: 1; }
.done { text-align: center; padding: 30px 20px; }
.done .big { font-size: 64px; line-height: 1; }
.done .starrow { font-size: 40px; letter-spacing: 6px; color: var(--warning); margin: 8px 0; }
.done .starrow .off { color: var(--line); }
.done .kpis { display: flex; justify-content: center; gap: 14px; margin: 14px 0; flex-wrap: wrap; }
.kpi { min-width: 110px; padding: 12px 14px; border-radius: 14px; background: var(--card-2); }
.kpi b { display: block; font-size: 24px; font-weight: 900; }
.kpi span { font-size: 12px; color: var(--text-2); font-weight: 800; text-transform: uppercase; letter-spacing: .05em; }

/* Report */
.report h1 { margin-bottom: 4px; }
.grid2 { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
.bar { display: grid; grid-template-columns: 1fr auto; gap: 6px 10px; align-items: center; font-size: 14px; font-weight: 700; }
.bar .track { grid-column: 1 / -1; height: 8px; background: var(--card-2); border-radius: 999px; overflow: hidden; }
.bar .track i { display: block; height: 100%; background: var(--primary); border-radius: 999px; }
.bar .track i.sec { background: var(--secondary); }
.bar .track i.warn { background: var(--warning); }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--text-2); }
td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.callout { padding: 12px 16px; border-radius: 14px; background: color-mix(in srgb, var(--warning) 22%, var(--card)); border-left: 5px solid var(--warning); font-size: 14.5px; }
.callout.info { background: color-mix(in srgb, var(--primary) 10%, var(--card)); border-left-color: var(--primary); }

/* Forms */
label.f { display: grid; gap: 6px; font-weight: 800; font-size: 14px; }
input[type="text"], select, textarea { font: inherit; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); color: var(--text); min-height: var(--tap); width: 100%; }
textarea { min-height: 96px; font-family: ui-monospace, Menlo, monospace; font-size: 13px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.seg button { padding: 8px 12px; min-height: 40px; background: var(--card); border: 0; font-weight: 800; font-size: 13.5px; }
.seg button[aria-pressed="true"] { background: var(--primary); color: #fff; }
.linkbox { font-family: ui-monospace, Menlo, monospace; font-size: 13px; word-break: break-all; padding: 10px 12px; border-radius: 12px; background: var(--card-2); border: 1px dashed var(--line); }
#qr { display: grid; place-items: center; padding: 12px; background: #fff; border-radius: 12px; width: fit-content; }
.timer { font-variant-numeric: tabular-nums; font-weight: 900; }

/* Sheet */
.sheet-bg { position: fixed; inset: 0; background: rgba(20,24,48,.45); z-index: 30; display: grid; place-items: end center; }
.sheet { background: var(--card); width: min(560px, 100%); max-height: 88vh; overflow: auto; border-radius: 20px 20px 0 0; padding: 20px 20px 28px; }
@media (min-width: 720px) { .sheet-bg { place-items: center; } .sheet { border-radius: 20px; } }

.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-weight: 800; z-index: 40; box-shadow: var(--shadow); }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
@media print {
  .topbar, .no-print, .btn { display: none !important; }
  body { background: #fff; color: #000; }
  .card { box-shadow: none; border-color: #ccc; break-inside: avoid; }
  .app { padding: 0; }
}

</style>
</head>

dence would you need before trusting its answer?"},{"id":"ab1_q3","type":"multipleChoice","text":"A phone reads a Japanese sign, then writes it in English. Which skills work together?","simple":"A phone reads and translates a sign. Which skills work together?","options":["Computer vision and machine translation","Speech recognition and text-to-speech","Recommendation and image generation","Translation and speech recognition"],"correct":"Computer vision and machine translation","correctAnswers":["Computer vision and machine translation"],"pairs":[],"explanation":"Computer vision can extract text from an image. Machine translation changes that text into another language.","difficulty":"beginner","transfer":"A translated sign seems strange. Would you check the original photo, the translation, or both? Why?"},{"id":"ab1_q4","type":"fillInBlank","text":"An app suggests movies from your viewing history. This is a __________.","simple":"Which system suggests movies from your viewing history?","options":["recommendation system","speech recognition system","image classification system","fixed countdown timer"],"correct":"recommendation system","correctAnswers":["recommendation system"],"pairs":[],"explanation":"A recommendation system predicts what you might choose using signals such as views, ratings, and skips. Its suggestions may miss your needs.","difficulty":"intermediate","transfer":"Your interests change. Which actions might help a music app notice?"},{"id":"ab1_q5","type":"multipleChoice","text":"Your goal is to practise writing your own story opening. How could you use AI without skipping that practice?","simple":"To practise your own writing, when could AI feedback help?","options":["Write first, then request feedback if allowed","Generate an opening and submit it unchanged","Copy an opening and change character names","Ask AI to grade work you have not written"],"correct":"Write first, then request feedback if allowed","correctAnswers":["Write first, then request feedback if allowed"],"pairs":[],"explanation":"Writing your first attempt protects the skill you are practising. If AI feedback is allowed, judge its suggestions and decide what to revise.","difficulty":"intermediate","transfer":"For a drawing lesson, what would you try yourself before using an image tool?"},{"id":"ab1_q6","type":"scenarioJudgment","text":"An app guesses recycling bins from photos. Which test checks whether it relies on background colour?","simple":"To test background clues, which recycling photos should you compare?","options":["The same item against different backgrounds","Different items against different backgrounds","The same photo with different file names","The same photo shown several times"],"correct":"The same item against different backgrounds","correctAnswers":["The same item against different backgrounds"],"pairs":[],"explanation":"Changing the background while keeping the item fixed helps isolate that clue. Test several items because one result cannot establish a reliable pattern.","difficulty":"advanced","transfer":"How could you check whether a plant app relies on the pot instead of the leaves?"},{"id":"ab1_q7","type":"multipleChoice","text":"A timer rings after five minutes without learning from examples. What controls this action?","simple":"A timer rings after five minutes without learning. What controls it?","options":["A fixed countdown rule","Patterns learned from labeled messages","A prediction from earlier timers","A strategy learned from rewards"],"correct":"A fixed countdown rule","correctAnswers":["A fixed countdown rule"],"pairs":[],"explanation":"A countdown follows a fixed instruction; it does not need training examples. Many apps combine fixed rules with models that learn patterns.","difficulty":"beginner","transfer":"A quiz checks whether 3 + 4 equals 7. Does that check need machine learning? Why?"},{"id":"ab1_q8","type":"multipleChoice","text":"A phone compares your face with saved features to unlock. Which AI field is this?","simple":"Which AI field helps a phone recognize your face?","options":["Computer vision","Speech recognition","Machine translation","Recommendation systems"],"correct":"Computer vision","correctAnswers":["Computer vision"],"pairs":[],"explanation":"Computer vision analyzes images, including features used for face matching. A visual match is a prediction and can be wrong.","difficulty":"beginner","transfer":"Would a face match tell a phone what someone is thinking? Explain why."},{"id":"ab1_q9","type":"scenarioJudgment","text":"A chatbot quotes the school handbook about trip permission. What should you do before relying on its answer?","simple":"A chatbot quotes the school handbook. What should you check?","options":["Read the relevant section in the current handbook","Trust the answer because it includes a quotation","Ask for a more confident version","Check whether the reply has correct spelling"],"correct":"Read the relevant section in the current handbook","correctAnswers":["Read the relevant section in the current handbook"],"pairs":[],"explanation":"A quotation can be invented, outdated, or taken out of context. Check that the current source actually supports the answer.","difficulty":"intermediate","transfer":"An AI gives a link for a science claim. What would you check after opening it?"},{"id":"ab1_q10","type":"multipleChoice","text":"You say 'fifteen minutes,' but the assistant displays 'fifty minutes.' Which part should you check first?","simple":"You say fifteen; the assistant displays fifty. What needs checking first?","options":["The speech recognition result","The voice used to read the reply","The timer countdown rule","The order of recommended apps"],"correct":"The speech recognition result","correctAnswers":["The speech recognition result"],"pairs":[],"explanation":"The displayed words suggest the speech-to-text step misheard the request. Checking each step helps locate an error instead of blaming the whole system.","difficulty":"advanced","transfer":"Captions are wrong before translation begins. Which step would you investigate first?"},{"id":"ab1_q11","type":"multipleChoice","text":"A video feed keeps suggesting clips you watch for longer. What is it using as a clue?","simple":"A feed repeats clips you watch longer. What is its clue?","options":["Your viewing behaviour","Your teacher's learning goals","A fact-check of each clip","Your reasons for watching each clip"],"correct":"Your viewing behaviour","correctAnswers":["Your viewing behaviour"],"pairs":[],"explanation":"Watch time can help predict what keeps your attention. It does not establish that a clip is accurate or useful for learning.","difficulty":"beginner","transfer":"If a feed distracts you from homework, what could you choose to do?"},{"id":"ab1_q12","type":"trueFalse","text":"Correctly transcribing your words proves an assistant's answer is accurate.","simple":"Do correct voice captions prove the answer is accurate?","options":["True","False"],"correct":"False","correctAnswers":["False"],"pairs":[],"explanation":"Recognizing the words and answering the question are different tasks. Correct words can still lead to an incorrect answer.","difficulty":"beginner","transfer":"A chatbot repeats your question perfectly. What still needs checking in its answer?"},{"id":"ab1_q13","type":"explain","text":"A spam filter learns from examples; a timer follows a countdown rule. Explain the difference.","simple":"Compare a spam filter learning examples with a fixed countdown timer.","options":["Describe the examples the spam filter learns from","Describe the timer's fixed countdown rule","Explain why a new message needs checking"],"correct":"The spam filter learns patterns from example messages and uses them to predict whether a new message is spam. The timer follows a set countdown rule. I would check whether the filter wrongly blocks a useful message.","correctAnswers":["The spam filter learns patterns from example messages and uses them to predict whether a new message is spam. The timer follows a set countdown rule. I would check whether the filter wrongly blocks a useful message."],"pairs":[],"explanation":"Explain what each system uses to do its job. Include a possible mistake by the learned filter.","difficulty":"beginner","transfer":"A school app contains a timer and a learned handwriting reader. Which part needs examples, and why?"}],"cards":[{"emoji":"👁️","title":"Start with the task","body":"Speech recognition turns audio into text. Computer vision analyzes images. Translation changes languages; recommendations predict what you might choose.","funFact":null},{"emoji":"⏱️","title":"Learned patterns and fixed rules","body":"A learned spam filter uses patterns from example messages. A countdown timer follows a fixed rule. One app can contain both kinds of steps.","funFact":null},{"emoji":"🔎","title":"Fluent does not mean verified","body":"A chatbot generates language from learned patterns. Caring words do not establish feelings, and a confident answer or quotation still needs checking against a reliable source.","funFact":null},{"emoji":"✍️","title":"Keep your own thinking","body":"First ask what you want to learn or do. Try the part you need to practise yourself, follow class rules, and decide whether AI would actually help.","funFact":null}]},{"id":"ab_l2","title":"Machine Learning Fundamentals","description":"Learn from examples, then test on something new","order":1,"difficulty":"beginner","questions":[{"id":"ab2_q1","type":"scenarioJudgment","text":"Past weather records include the actual next-day temperature. Which learning method uses these input-and-answer pairs?","simple":"Weather examples include correct temperatures. Which learning method uses those answers?","options":["Supervised learning","Unsupervised learning","Reinforcement learning","Model inference"],"correct":"Supervised learning","correctAnswers":["Supervised learning"],"pairs":[],"explanation":"Supervised learning uses examples paired with known answers. Here, the answer to learn is the next-day temperature.","difficulty":"beginner","transfer":"Past bus trips include their actual delays. How could those answers help train a delay predictor?"},{"id":"ab2_q2","type":"fillInBlank","text":"Dog photos used to teach a model are called __________ data.","simple":"Dog photos used to teach a model are called ___ data.","options":["training","test","output","backup"],"correct":"training","correctAnswers":["training"],"pairs":[],"explanation":"Training data supplies examples used to fit a model. The examples should cover the kinds of dogs and photos it will encounter.","difficulty":"beginner","transfer":"Which examples would you collect to teach a model about several kinds of bicycle?"},{"id":"ab2_q3","type":"multipleChoice","text":"A model groups songs by similar sounds without genre labels. Which learning method fits?","simple":"Songs are grouped by sound without labels. Which learning method fits?","options":["Unsupervised learning","Supervised learning","Reinforcement learning","Manual labeling"],"correct":"Unsupervised learning","correctAnswers":["Unsupervised learning"],"pairs":[],"explanation":"Unsupervised learning finds patterns without supplied answer labels. Grouping similar items is called clustering.","difficulty":"beginner","transfer":"A model groups similar playground sounds without names. Who could help interpret the groups?"},{"id":"ab2_q4","type":"multipleChoice","text":"A trained model predicts the plant in one new photo. Which stage is happening?","simple":"A trained model predicts a new plant photo. Which stage?","options":["Inference","Training","Labeling","Data collection"],"correct":"Inference","correctAnswers":["Inference"],"pairs":[],"explanation":"Inference uses a trained model to produce an output. Training is the process that fits the model using examples.","difficulty":"intermediate","transfer":"A handwriting app reads your new word. Is that training or inference? Explain."},{"id":"ab2_q5","type":"matchPairs","text":"Match each machine-learning term to its role in a plant-photo project.","simple":"Match each learning term to its plant-photo role.","options":[],"correct":"","correctAnswers":[],"pairs":[{"term":"Dataset","definition":"The collection of plant photos"},{"term":"Label","definition":"The correct plant name attached to a photo"},{"term":"Feature","definition":"An input detail, such as leaf colour"},{"term":"Trained model","definition":"The learned system that predicts a plant name"}],"explanation":"A dataset holds examples, and a label supplies an answer. Features describe inputs; a trained model uses learned patterns to make predictions.","difficulty":"beginner","transfer":"For a fruit sorter, name a possible feature and a possible label."},{"id":"ab2_q6","type":"scenarioJudgment","text":"A team adapts a model trained on general photos to classify leaves. What approach is this?","simple":"Adapting a trained photo model for leaves is which approach?","options":["Transfer learning","Training from scratch","Collecting unlabeled data","Testing without adaptation"],"correct":"Transfer learning","correctAnswers":["Transfer learning"],"pairs":[],"explanation":"Transfer learning reuses learning from an earlier task or dataset. It may save training work, but performance on the new task still needs testing.","difficulty":"advanced","transfer":"Would a model trained on animal photos automatically work well on drawings? How would you find out?"},{"id":"ab2_q7","type":"multipleChoice","text":"Which photos best test whether a trained dog model works on new examples?","simple":"Which photos best test a dog model on new examples?","options":["Unseen dog photos from varied everyday settings","The photos already used for training","Training photos copied into a new folder","The training photos it gets right most often"],"correct":"Unseen dog photos from varied everyday settings","correctAnswers":["Unseen dog photos from varied everyday settings"],"pairs":[],"explanation":"Keep test photos separate from training photos. Fresh examples show whether learned patterns work beyond familiar pictures.","difficulty":"beginner","transfer":"Why would renaming a training photo not make it a fair new test?"},{"id":"ab2_q8","type":"scenarioJudgment","text":"A dog model trained only on golden retrievers meets a poodle photo. Which prediction is reasonable?","simple":"Trained on golden retrievers, a model sees a poodle. What might happen?","options":["It may miss the unfamiliar-looking dog","It must recognize any dog equally well","Its breed labels will expand by themselves","Its training score tells us the poodle result"],"correct":"It may miss the unfamiliar-looking dog","correctAnswers":["It may miss the unfamiliar-looking dog"],"pairs":[],"explanation":"Examples covering one breed may leave gaps for other breeds. Test varied dogs before deciding where the model works well.","difficulty":"beginner","transfer":"A bike model saw only side views. What new photos would you test?"},{"id":"ab2_q9","type":"explain","text":"Explain how training photos differ from a trained plant model, and how you would test it.","simple":"Explain training photos, a trained plant model, and a fresh test.","options":["Identify photos and labels as training examples","Describe the model as learned patterns used for predictions","Test a separate photo with a checked plant name"],"correct":"Training photos and their plant labels are examples. The trained model uses patterns learned from those examples to predict a plant name. I would check its answer on a separate photo whose plant name I know.","correctAnswers":["Training photos and their plant labels are examples. The trained model uses patterns learned from those examples to predict a plant name. I would check its answer on a separate photo whose plant name I know."],"pairs":[],"explanation":"Distinguish the examples from the system trained on them. Include a fresh test with a known answer.","difficulty":"beginner","transfer":"How would the examples and final test change for a handwriting model?"}],"cards":[{"emoji":"🏷️","title":"Examples, features, and labels","body":"A dataset is a collection of examples. In plant photos, leaf colour can be a feature and the checked plant name a label. The trained model uses learned patterns to predict a name.","funFact":null},{"emoji":"🧩","title":"Different ways to learn","body":"Supervised learning uses examples paired with known answers. Unsupervised learning looks for patterns without answer labels, such as grouping similar sounds. Reinforcement learning uses rewards from actions.","funFact":null},{"emoji":"🔄","title":"Training and inference","body":"Training fits a model using examples. Inference uses the trained model to make a prediction. Transfer learning adapts earlier learning to a new task, which still needs testing.","funFact":null},{"emoji":"🧪","title":"Keep a fresh test","body":"Set aside test examples that training never uses. Include the kinds of cases the model will meet, then compare its predictions with checked answers. Copying a training photo does not make a fresh test.","funFact":null}]},{"id":"ab_l3","title":"Neural Networks Explained","description":"Follow inputs, weights, and layers to a prediction","order":2,"difficulty":"beginner","questions":[{"id":"ab3_q1","type":"scenarioJudgment","text":"A neural network receives a photo as numbers. What do its layers do?","simple":"A network receives photo numbers. What do its layers do?","options":["Transform the numbers to build a prediction","Assign the correct label before doing calculations","Compare file names instead of image values","Keep the numbers unchanged until the final answer"],"correct":"Transform the numbers to build a prediction","correctAnswers":["Transform the numbers to build a prediction"],"pairs":[],"explanation":"Layers apply calculations to their inputs and pass results onward. Training adjusts numbers in these calculations to help the network make predictions.","difficulty":"beginner","transfer":"What might the input numbers represent in a network that processes sound?"},{"id":"ab3_q2","type":"trueFalse","text":"Using a trained network for one prediction necessarily changes its learned weights.","simple":"Does making one prediction necessarily change a trained network's weights?","options":["True","False"],"correct":"False","correctAnswers":["False"],"pairs":[],"explanation":"An ordinary prediction uses the weights already learned during training. Updating those weights requires a learning step.","difficulty":"beginner","transfer":"A model repeats a mistake. Why might asking again fail to teach it the right answer?"},{"id":"ab3_q3","type":"sortOrder","text":"Order the stages in a simple image-classification network, from input to prediction.","simple":"Order a simple photo network from input to prediction.","options":["Predicted label","Image converted to numbers","Output scores","Hidden layers transform numbers"],"correct":"","correctAnswers":["Image converted to numbers","Hidden layers transform numbers","Output scores","Predicted label"],"pairs":[],"explanation":"Image numbers pass through hidden layers to produce output scores. A classifier can use those scores to choose a predicted label.","difficulty":"beginner","transfer":"Where would you check for a blurry input image in this sequence?"},{"id":"ab3_q4","type":"multipleChoice","text":"In a neural network, what are weights?","simple":"What are weights in a neural network?","options":["Numbers that adjust the influence of inputs","Names attached to training examples","The final labels predicted for images","The number of photos in a dataset"],"correct":"Numbers that adjust the influence of inputs","correctAnswers":["Numbers that adjust the influence of inputs"],"pairs":[],"explanation":"Weights control how much inputs contribute to a calculation. Training adjusts them to reduce errors according to the training objective.","difficulty":"intermediate","transfer":"How is changing a weight different from changing the label on a training photo?"},{"id":"ab3_q5","type":"fillInBlank","text":"A neural network with many hidden layers is commonly called a __________ network.","simple":"A network with many hidden layers is called ___ .","options":["deep","wide","shallow","untrained"],"correct":"deep","correctAnswers":["deep"],"pairs":[],"explanation":"Deep refers to having multiple hidden layers. Depth describes the network structure; it does not guarantee better predictions.","difficulty":"intermediate","transfer":"Two models differ in depth. What would you measure before choosing one?"},{"id":"ab3_q6","type":"scenarioJudgment","text":"Further training improves familiar-photo scores but worsens separate validation scores. What should the team investigate?","simple":"Training scores rise; separate validation scores fall. What needs investigating?","options":["Overfitting to the training examples","An increase in errors on the training examples","Improved performance on unfamiliar examples","Training that never changed the weights"],"correct":"Overfitting to the training examples","correctAnswers":["Overfitting to the training examples"],"pairs":[],"explanation":"Overfitting means learned patterns fit training examples too closely to generalize well. Validation results can help decide when to stop training or change the model. Keep a separate final test for the finished choice.","difficulty":"advanced","transfer":"A handwriting model improves on one notebook but worsens on others. What would you compare?"},{"id":"ab3_q7","type":"multipleChoice","text":"Before an image enters a neural network, how is it typically represented?","simple":"How is a photo represented when entering a neural network?","options":["Numbers describing its pixels","A sentence naming the correct object","A list of previous prediction scores","The file name as the whole picture"],"correct":"Numbers describing its pixels","correctAnswers":["Numbers describing its pixels"],"pairs":[],"explanation":"Pixels contain numerical information about an image, such as colour values. The model uses this input to calculate a prediction.","difficulty":"beginner","transfer":"What changes in the input numbers when a photo becomes darker?"},{"id":"ab3_q8","type":"trueFalse","text":"A neural network's artificial neurons are living brain cells inside a computer.","simple":"Are artificial neurons living brain cells inside a computer?","options":["True","False"],"correct":"False","correctAnswers":["False"],"pairs":[],"explanation":"Artificial neurons are mathematical units implemented in software or hardware. The name is inspired by brains, but these units are not living cells.","difficulty":"beginner","transfer":"Why might the word brain give someone a misleading picture of a model?"},{"id":"ab3_q9","type":"explain","text":"Explain a photo's journey through a neural network, including why its prediction might be wrong.","simple":"Explain how photo numbers become a prediction that could be wrong.","options":["Start with numbers representing the photo","Describe calculations through layers using learned weights","Explain that the predicted label still needs checking"],"correct":"The photo becomes numbers that pass through layers of calculations using learned weights. The network produces scores for possible labels. Its chosen label can be wrong, especially when the photo differs from its training examples.","correctAnswers":["The photo becomes numbers that pass through layers of calculations using learned weights. The network produces scores for possible labels. Its chosen label can be wrong, especially when the photo differs from its training examples."],"pairs":[],"explanation":"Connect the input, calculations, and output. A prediction is a result to check, not proof that the network is right.","difficulty":"beginner","transfer":"How might poor lighting affect this journey for a recycling camera?"}],"cards":[{"emoji":"🔢","title":"Pictures become numbers","body":"A photo contains pixels with numerical colour values. A neural network passes input numbers through layers of calculations and produces output numbers, such as scores for labels.","funFact":null},{"emoji":"🎚️","title":"Weights shape the result","body":"Weights are numbers controlling how inputs influence calculations. Training changes them to reduce errors. Artificial neurons are mathematical units inspired by brains, not living cells.","funFact":null},{"emoji":"🧱","title":"Depth and predictions","body":"A deep network has multiple hidden layers. During ordinary inference, it uses learned weights without changing them. More layers or more training do not guarantee better results.","funFact":null},{"emoji":"📋","title":"Check beyond training","body":"Overfitting means fitting familiar examples too closely to work well on fresh ones. Separate validation examples help guide changes during training; keep a final test separate to evaluate the finished model.","funFact":null}]},{"id":"ab_l4","title":"Computer Vision & Deep Learning","description":"Explore image tasks and test what cameras can miss","order":3,"difficulty":"intermediate","questions":[{"id":"ab4_q1","type":"multipleChoice","text":"An app identifies plants from photos. Which field covers analyzing these images?","simple":"Which field covers identifying plants from photos?","options":["Computer vision","Speech recognition","Machine translation","Recommendation systems"],"correct":"Computer vision","correctAnswers":["Computer vision"],"pairs":[],"explanation":"Computer vision extracts information from images and video. Plant classification is one task it can support.","difficulty":"beginner","transfer":"A camera counts bicycles at a school gate. What information must it find in the image?"},{"id":"ab4_q2","type":"scenarioJudgment","text":"A model labels training photos perfectly but struggles with unfamiliar photos of the same classes. What might explain this?","simple":"Training photos score perfectly; unfamiliar ones score poorly. What might explain?","options":["Overfitting to familiar examples","Reliable performance in new settings","More accurate labels on every new photo","Successful testing across many environments"],"correct":"Overfitting to familiar examples","correctAnswers":["Overfitting to familiar examples"],"pairs":[],"explanation":"Overfitting can make a model perform well on familiar examples but poorly on fresh ones. A high training score is not enough.","difficulty":"beginner","transfer":"A bottle model works in one classroom. What would you test before using it in the cafeteria?"},{"id":"ab4_q3","type":"matchPairs","text":"Match each computer-vision task to its output.","simple":"Match each vision task to what it produces.","options":[],"correct":"","correctAnswers":[],"pairs":[{"term":"Classification","definition":"One category label for a photo"},{"term":"Object detection","definition":"Boxes around individual bottles"},{"term":"Segmentation","definition":"A label for each pixel in a path region"},{"term":"Text recognition (OCR)","definition":"Written words extracted from a sign photo"}],"explanation":"Vision tasks produce different kinds of outputs, such as labels, boxes, pixel regions, or text. Choose the task that supplies the information you need.","difficulty":"beginner","transfer":"To count cans separately in one photo, would a single image label be enough? Why?"},{"id":"ab4_q4","type":"multipleChoice","text":"Why can a GPU help train a deep-learning model?","simple":"How can a GPU help train a deep-learning model?","options":["It performs many suitable numerical operations in parallel","It supplies correct labels for the training data","It makes the training examples more representative","It prevents the model from overfitting"],"correct":"It performs many suitable numerical operations in parallel","correctAnswers":["It performs many suitable numerical operations in parallel"],"pairs":[],"explanation":"GPUs can run many numerical operations at once, which suits much neural-network work. Actual speed depends on the model, hardware, and workload.","difficulty":"intermediate","transfer":"Would a faster chip fix wrong training labels? Explain."},{"id":"ab4_q5","type":"fillInBlank","text":"Patterns such as edges and textures used by an image model are called __________.","simple":"Edges and textures used by an image model are called ___ .","options":["features","labels","test scores","file names"],"correct":"features","correctAnswers":["features"],"pairs":[],"explanation":"Features are useful input properties or representations. Deep-learning image models can learn features during training rather than requiring people to design each one.","difficulty":"intermediate","transfer":"Which visible features might help distinguish a bicycle from a ball?"},{"id":"ab4_q6","type":"scenarioJudgment","text":"A defect camera works on still photos. What must a factory test before using it on a moving belt?","simple":"A defect camera passed still photos. What should belt testing check?","options":["Accuracy and response time on new moving items","Accuracy on the same still photos again","Whether the screen displays more decimal places","Whether the model has more layers than before"],"correct":"Accuracy and response time on new moving items","correctAnswers":["Accuracy and response time on new moving items"],"pairs":[],"explanation":"Movement, lighting, and unfamiliar defects can change results. Response time, or latency, also matters: an accurate answer that arrives after an item passes may be useless.","difficulty":"advanced","transfer":"How would a late but correct prediction affect a game that steers around obstacles?"},{"id":"ab4_q7","type":"multipleChoice","text":"Network A has two hidden layers; network B has twelve. Which has greater depth?","simple":"A has two hidden layers; B has twelve. Which is deeper?","options":["Network B","Network A","Both have the same depth","The one with the higher test score"],"correct":"Network B","correctAnswers":["Network B"],"pairs":[],"explanation":"Depth counts the layers along a network's processing path. More layers do not automatically make B more accurate than A.","difficulty":"beginner","transfer":"If the deeper model is slower and less accurate, which would you choose for a simple task? Why?"},{"id":"ab4_q8","type":"scenarioJudgment","text":"Two photos of the same leaf get different confident labels. What should you do?","simple":"The same leaf gets different confident labels. What should you do?","options":["Compare leaf details with a reliable plant guide","Pick whichever answer sounds more certain","Repeat the guesses and accept the most common label","Choose the label with the longest description"],"correct":"Compare leaf details with a reliable plant guide","correctAnswers":["Compare leaf details with a reliable plant guide"],"pairs":[],"explanation":"Confident labels can still be wrong, especially when lighting or angle changes. Use an independent source to check the plant's visible details.","difficulty":"beginner","transfer":"A recycling camera is uncertain about a carton. What could you check outside the app?"},{"id":"ab4_q9","type":"explain","text":"Plan a test for a school recycling camera before students rely on it.","simple":"How would you test a school recycling camera before use?","options":["Use new items with independently checked bin labels","Include varied lighting, backgrounds, and item conditions","Record mistakes and plan what to do with uncertain items"],"correct":"I would test new items with bin labels checked against school recycling rules. I would include crushed cans, different backgrounds, and varied lighting. I would record mistakes and send uncertain items for a person to check.","correctAnswers":["I would test new items with bin labels checked against school recycling rules. I would include crushed cans, different backgrounds, and varied lighting. I would record mistakes and send uncertain items for a person to check."],"pairs":[],"explanation":"A useful test matches the real setting and checks against known answers. Include a way to handle mistakes.","difficulty":"beginner","transfer":"Which parts of your plan would change for a camera reading handwritten library labels?"}],"cards":[{"emoji":"📷","title":"What should the camera produce?","body":"Classification gives an image a category. Object detection locates separate objects with boxes. Segmentation labels pixels in regions. Text recognition, or OCR, extracts written words from an image.","funFact":null},{"emoji":"🧱","title":"Learning visual features","body":"Image networks can learn useful features such as edges and textures. Deep networks have multiple hidden layers. Extra depth can help some tasks, but you must measure the results.","funFact":null},{"emoji":"⚡","title":"Chips and response time","body":"GPUs can perform many suitable calculations in parallel. They do not fix wrong labels. Latency means the time until a result arrives; a moving-belt camera needs answers before items pass.","funFact":null},{"emoji":"🔦","title":"Test in the real setting","body":"Try fresh images with checked answers across lighting, angles, and backgrounds. Record errors as well as successes. Decide when a person should check an uncertain result.","funFact":null}]},{"id":"ab_l5","title":"Data Quality & Bias","description":"Investigate errors, respect people, and test improvements","order":4,"difficulty":"intermediate","questions":[{"id":"ab5_q1","type":"scenarioJudgment","text":"A club-selection model learns from past decisions that excluded some groups. What risk should the school investigate?","simple":"Past club choices excluded some groups. What might a model repeat?","options":["Repeating unfair patterns from past selections","Correcting unfairness without checking results","Treating past choices as proof of fair selection","Ignoring past patterns because the code runs correctly"],"correct":"Repeating unfair patterns from past selections","correctAnswers":["Repeating unfair patterns from past selections"],"pairs":[],"explanation":"A model can learn unfair patterns from historical decisions. Check the selection goal, examples, and outcomes before relying on it.","difficulty":"beginner","transfer":"Could a fairer club-selection process use a transparent rule or lottery instead? When might that fit?"},{"id":"ab5_q2","type":"trueFalse","text":"A fast model can still make poor predictions when its training labels are wrong.","simple":"Can wrong training labels hurt predictions even with a fast model?","options":["True","False"],"correct":"True","correctAnswers":["True"],"pairs":[],"explanation":"Speed measures how quickly a model runs, not whether its examples are correct. Wrong labels can teach misleading patterns.","difficulty":"beginner","transfer":"Half the apple photos are labeled orange. What would you fix before training again?"},{"id":"ab5_q3","type":"multipleChoice","text":"A face-matching system makes more errors for one skin-tone group. What can this result establish?","simple":"Face matching fails more for one skin-tone group. What is established?","options":["Uneven performance that needs further investigation","Training data is definitely the single cause","Image quality cannot affect the result","A good overall score makes the gap unimportant"],"correct":"Uneven performance that needs further investigation","correctAnswers":["Uneven performance that needs further investigation"],"pairs":[],"explanation":"Different error rates show a performance gap, not its cause. Investigate the data, image quality, and system before deciding what to change.","difficulty":"beginner","transfer":"A voice tool misses one accent more often. What would you investigate besides training examples?"},{"id":"ab5_q4","type":"multipleChoice","text":"People tag emails as 'spam' or 'not spam' for training. What is this work called?","simple":"Tagging training emails as spam or not spam is called what?","options":["Data labeling","Data compression","Data encryption","Model inference"],"correct":"Data labeling","correctAnswers":["Data labeling"],"pairs":[],"explanation":"Data labeling attaches target information to examples. Reviewers need clear instructions and a way to resolve uncertain cases.","difficulty":"intermediate","transfer":"Two people disagree about a photo label. What should happen before using it for training?"},{"id":"ab5_q5","type":"fillInBlank","text":"Training photos accidentally appear in the final test set. This overlap is a form of data __________.","simple":"Training photos appear in the final test: data ___ .","options":["leakage","labeling","compression","collection"],"correct":"leakage","correctAnswers":["leakage"],"pairs":[],"explanation":"Data leakage allows information that should be separate to influence evaluation. Reusing training photos can make a test look better than performance on fresh photos.","difficulty":"intermediate","transfer":"Would a cropped copy of a training photo be a truly independent test example? Why be careful?"},{"id":"ab5_q6","type":"multipleChoice","text":"A fictional test scores 95/100 overall but 6/10 for one group. What should happen next?","simple":"Scores: 95/100 overall, 6/10 in one group. What next?","options":["Investigate the gap and collect more group-specific evidence","Report the overall score as proof of fairness","Treat ten cases as a precise long-term error rate","Remove that group from future tests"],"correct":"Investigate the gap and collect more group-specific evidence","correctAnswers":["Investigate the gap and collect more group-specific evidence"],"pairs":[],"explanation":"An overall average can hide a group with more errors. Ten cases also give limited evidence, so investigate the failures and test more representative examples.","difficulty":"advanced","transfer":"What would you report alongside an overall score for a school voice tool?"},{"id":"ab5_q7","type":"multipleChoice","text":"Your class wants voice recordings for a project. Which collection plan respects classmates' choices?","simple":"For class voice recordings, which plan respects classmates' choices?","options":["Explain the use, ask permission, and allow people to decline","Record first and explain the project afterward","Reuse private messages because the project is educational","Require everyone's full name with each sound clip"],"correct":"Explain the use, ask permission, and allow people to decline","correctAnswers":["Explain the use, ask permission, and allow people to decline"],"pairs":[],"explanation":"Explain what will be recorded, how it will be used, and who can access it. Follow the school's rules and provide a way to take part without recording.","difficulty":"beginner","transfer":"How could someone help test a sound project without sharing their own voice?"},{"id":"ab5_q8","type":"trueFalse","text":"Equal numbers of examples from each group guarantee that a model's decisions are fair.","simple":"Do equal group counts guarantee fair model decisions?","options":["True","False"],"correct":"False","correctAnswers":["False"],"pairs":[],"explanation":"Balanced counts can help, but labels, goals, and real conditions also matter. Check the actual outcomes and who experiences mistakes.","difficulty":"beginner","transfer":"A balanced dataset has many wrong labels. Why is counting examples not enough?"},{"id":"ab5_q9","type":"explain","text":"A recycling model misses crumpled cans. Explain what you would investigate, change, and test again.","simple":"A model misses crumpled cans. What would you check and retest?","options":["Investigate examples, labels, or photo conditions before assuming a cause","Choose a change linked to what the investigation finds","Test new cans and check that other items still work"],"correct":"I would check whether crumpled cans appear in the training examples and whether their labels and photos are clear. If they are missing, I would add suitable labeled examples and retrain. Then I would test fresh crumpled cans and other items.","correctAnswers":["I would check whether crumpled cans appear in the training examples and whether their labels and photos are clear. If they are missing, I would add suitable labeled examples and retrain. Then I would test fresh crumpled cans and other items."],"pairs":[],"explanation":"Connect a possible cause to a specific change. Test again to find out whether the change actually helps.","difficulty":"beginner","transfer":"How would you investigate a handwriting model that misses left-handed classmates' writing?"}],"cards":[{"emoji":"🏷️","title":"Quality is more than quantity","body":"Training examples need useful coverage and reliable labels. Missing groups, wrong labels, or unfair historical decisions can affect results. More copies of the same examples do not fill those gaps.","funFact":null},{"emoji":"⚖️","title":"Look inside the average","body":"Check errors for different groups and conditions, not just one overall score. A gap shows uneven performance; it does not establish one cause. Small samples need further investigation.","funFact":null},{"emoji":"🎙️","title":"People have a choice","body":"Before collecting voices or photos, explain the purpose and access, follow school rules, and ask permission. Let people decline and offer another way to contribute. Collect only what the project needs.","funFact":null},{"emoji":"🧪","title":"Fix, then test again","body":"Training examples leaking into a final test can inflate scores. Investigate mistakes, make a relevant change, and retest with fresh examples. Balanced counts alone do not guarantee fair outcomes.","funFact":null}]},{"id":"ab_l6","title":"Narrow AI vs. General AI","description":"Judge capability claims and choose a tool that fits","order":5,"difficulty":"intermediate","questions":[{"id":"ab6_q1","type":"scenarioJudgment","text":"An ad claims an AI can 'do every school task.' What evidence would best test that claim?","simple":"An AI claims every school task. What evidence would test this?","options":["Independent tests across varied, unfamiliar school tasks","A polished demo of one successful answer","The number of people who downloaded it","A statement that it feels confident"],"correct":"Independent tests across varied, unfamiliar school tasks","correctAnswers":["Independent tests across varied, unfamiliar school tasks"],"pairs":[],"explanation":"A broad claim needs evidence across the abilities it promises. Ask what was tested, under which conditions, and where the system failed.","difficulty":"beginner","transfer":"An app claims perfect homework help. What example would you test before trusting that promise?"},{"id":"ab6_q2","type":"trueFalse","text":"Success at labeling photos proves a model can translate a new language accurately.","simple":"Does labeling photos well prove a model translates languages accurately?","options":["True","False"],"correct":"False","correctAnswers":["False"],"pairs":[],"explanation":"Image labeling and translation require different evidence. A model may support both, but a photo test does not establish translation quality.","difficulty":"beginner","transfer":"What would you test before using a story-writing assistant to explain science?"},{"id":"ab6_q3","type":"matchPairs","text":"Match each AI term to its meaning.","simple":"Match each AI term to its meaning.","options":[],"correct":"","correctAnswers":[],"pairs":[{"term":"Narrow AI","definition":"A system focused on limited tasks"},{"term":"Foundation model","definition":"A model trained broadly and adaptable to many tasks"},{"term":"Multimodal model","definition":"A model handling multiple types, such as text and images"},{"term":"General AI (AGI)","definition":"Proposed broad general capability; definitions differ"}],"explanation":"These terms describe different aspects of a system, not steps on one ladder. A foundation model can be multimodal without proving AGI.","difficulty":"beginner","transfer":"A model handles text and pictures. Which term fits, and what does it not prove?"},{"id":"ab6_q4","type":"multipleChoice","text":"You need the exact sum of a fixed list of numbers. Which tool directly fits?","simple":"Which tool directly fits adding a fixed list of numbers exactly?","options":["A calculator or spreadsheet formula","A chatbot estimate without calculation tools","A rounded mental estimate","The total from a similar list"],"correct":"A calculator or spreadsheet formula","correctAnswers":["A calculator or spreadsheet formula"],"pairs":[],"explanation":"A calculator or spreadsheet formula performs a defined arithmetic operation. Check your inputs; a learning model is not needed for this job.","difficulty":"intermediate","transfer":"When might a simple checklist serve your goal better than an AI assistant?"},{"id":"ab6_q5","type":"scenarioJudgment","text":"One model writes stories and labels photos. What do these demonstrations establish?","simple":"A model writes stories and labels photos. What does that show?","options":["Evidence for those tasks under the demonstrated conditions","Proof it can handle any unfamiliar problem","Proof its answers never need checking","Evidence that its photo labels explain its writing quality"],"correct":"Evidence for those tasks under the demonstrated conditions","correctAnswers":["Evidence for those tasks under the demonstrated conditions"],"pairs":[],"explanation":"A model can support several useful tasks without being reliable everywhere. Demonstrations show particular results; broader claims need broader tests.","difficulty":"intermediate","transfer":"What new test would help you judge whether this model can explain a misleading graph?"},{"id":"ab6_q6","type":"scenarioJudgment","text":"An AI aces a test, but its training data included the answers. What would better assess generalization?","simple":"Training included the test answers. What would better test new learning?","options":["Independently written, unfamiliar tasks with checked solutions","The same questions in a different font","Repeating the test until it gets full marks","Counting how quickly it repeats the known answers"],"correct":"Independently written, unfamiliar tasks with checked solutions","correctAnswers":["Independently written, unfamiliar tasks with checked solutions"],"pairs":[],"explanation":"Exposure to test answers can inflate scores without showing how a model handles new problems. Use uncontaminated tasks and report the limits of what was measured.","difficulty":"advanced","transfer":"How could you check your own understanding beyond memorizing a quiz answer?"},{"id":"ab6_q7","type":"multipleChoice","text":"Your school needs a recycling sorter. Which evidence is most relevant when choosing a model?","simple":"For a school recycling sorter, which evidence matters most?","options":["Its results on fresh items from the school's bins","Its score in an unrelated chess tournament","How naturally it chats about recycling","How many tasks its advertisement lists"],"correct":"Its results on fresh items from the school's bins","correctAnswers":["Its results on fresh items from the school's bins"],"pairs":[],"explanation":"Choose evidence that matches the job and its real conditions. Skill at another task does not establish sorting accuracy.","difficulty":"beginner","transfer":"What evidence would matter most for a tool that adds captions to school videos?"},{"id":"ab6_q8","type":"trueFalse","text":"New cases can reveal mistakes even after a model earns a high test score.","simple":"Can new cases reveal mistakes after a high test score?","options":["True","False"],"correct":"True","correctAnswers":["True"],"pairs":[],"explanation":"A test covers a sample of situations, not every future case. Keep checking performance when conditions or users change.","difficulty":"beginner","transfer":"A recycling camera moves outdoors. What changes would you test?"},{"id":"ab6_q9","type":"explain","text":"Choose a school task. Explain whether you would use AI, another tool, or your own effort, and why.","simple":"Choose a school task: AI, another tool, or yourself? Explain why.","options":["Name the task and what you want to learn or achieve","Choose a method that fits the goal and class rules","Describe how to check the result or your understanding"],"correct":"To practise explaining a science idea, I would write my own explanation first. If class rules allow it, I could ask AI for questions about unclear parts. I would check any suggested facts against my class materials and explain the idea again without help.","correctAnswers":["To practise explaining a science idea, I would write my own explanation first. If class rules allow it, I could ask AI for questions about unclear parts. I would check any suggested facts against my class materials and explain the idea again without help."],"pairs":[],"explanation":"Different choices can be reasonable. Connect your choice to the goal and explain how you would check the outcome.","difficulty":"beginner","transfer":"Record one real AI choice in your Passport: what did you choose, why, and what will you check?"}],"cards":[{"emoji":"🎯","title":"Limited tasks and broad models","body":"Narrow AI focuses on limited tasks. Foundation models are trained on broad data and can be adapted to many tasks. Either way, test the ability you actually plan to use.","funFact":null},{"emoji":"🖼️","title":"Multimodal means multiple types","body":"A multimodal model handles more than one kind of data, such as text and images. That describes its inputs or outputs, not proof that it can solve every problem.","funFact":null},{"emoji":"🔍","title":"Big claims need clear tests","body":"Artificial General Intelligence, or AGI, describes proposed broad general capability; definitions differ. Ask for clear tasks, independent tests, and failure cases. Familiar test answers can make performance look better than it is.","funFact":null},{"emoji":"🧭","title":"Choose what fits","body":"Start with the goal, class rules, and what you want to learn. A calculator, a trusted source, your own first attempt, or an AI tool may fit. Check the outcome and reflect on the choice.","funFact":null}]}],"bigIdeas":["representationReasoning","perception"]},{"id":"ai_history","name":"The Story of AI","icon":"clock.arrow.circlepath","color":"aiBrown","description":"From Turing's question to today's chatbots: how AI was built, stalled, and grew","order":1,"unlock":{"kind":"completeCategory","value":"ai_basics"},"lessons":[{"id":"aih_l1","title":"The Birth of AI","description":"Turing's question, the Dartmouth name, and the first chatbot","order":0,"difficulty":"beginner","questions":[{"id":"aih1_q1","type":"multipleChoice","text":"The field got the name Artificial Intelligence at which event?","simple":"Where did the name Artificial Intelligence come from?","options":["The 1956 Dartmouth workshop","The 1950 Turing Test paper","The 1966 ELIZA experiment","The 1997 chess match"],"correct":"The 1956 Dartmouth workshop","correctAnswers":["The 1956 Dartmouth workshop"],"pairs":[],"explanation":"John McCarthy proposed the name for a 1956 summer workshop at Dartmouth College. A small group of scientists met there to plan how machines might reason.","difficulty":"beginner","transfer":"A friend says AI began with phone assistants. What older date could you mention?"},{"id":"aih1_q2","type":"trueFalse","text":"Alan Turing proposed a test for machine intelligence before the field had a name.","simple":"Did Turing suggest a test before AI had a name?","options":["True","False"],"correct":"True","correctAnswers":["True"],"pairs":[],"explanation":"Turing published his paper asking whether machines can think in 1950. The field was named six years later.","difficulty":"beginner","transfer":"Why might a big idea appear years before anyone agrees on a name for it?"},{"id":"aih1_q3","type":"fillInBlank","text":"The __________ Test asks whether a machine's chat can pass for a person's.","simple":"Which test asks if a machine can pass for a person?","options":["Turing","Dartmouth","McCarthy","Shannon"],"correct":"Turing","correctAnswers":["Turing"],"pairs":[],"explanation":"In Turing's test a judge chats with a hidden machine and a hidden person and tries to tell them apart. Sounding human is not the same as understanding.","difficulty":"beginner","transfer":"A game character chats like a friend. Would that prove it understands you? Why or why not?"},{"id":"aih1_q4","type":"sortOrder","text":"Put these AI milestones in the order they happened:","simple":"Put these AI events in order.","options":["AI term coined (1956)","Expert systems era (1980s)","Turing Test proposed (1950)","ELIZA chatbot created (1966)"],"correct":"","correctAnswers":["Turing Test proposed (1950)","AI term coined (1956)","ELIZA chatbot created (1966)","Expert systems era (1980s)"],"pairs":[],"explanation":"Turing asked the question in 1950, the field was named in 1956, ELIZA chatted in 1966, and businesses bought expert systems in the 1980s. Each step built on the last.","difficulty":"intermediate","transfer":"Think of a video game series you know. How would you check which game came first?"},{"id":"aih1_q5","type":"multipleChoice","text":"Which researcher led the 1956 Dartmouth workshop and proposed the name AI?","simple":"Who led the 1956 meeting that named AI?","options":["John McCarthy","Alan Turing","Claude Shannon","Joseph Weizenbaum"],"correct":"John McCarthy","correctAnswers":["John McCarthy"],"pairs":[],"explanation":"McCarthy organized the workshop with Marvin Minsky, Nathaniel Rochester, and Claude Shannon. Shannon is also known for information theory, the math behind digital communication.","difficulty":"intermediate","transfer":"Your class names a group project. Why is it useful to record who proposed the name and when?"},{"id":"aih1_q6","type":"multipleChoice","text":"ELIZA (1966) matched patterns in typed text. What surprised its creator?","simple":"What surprised ELIZA's creator in 1966?","options":["People shared personal feelings with a simple program","It translated between dozens of languages accurately","It defeated strong chess players in tournament play","It produced realistic pictures from short descriptions"],"correct":"People shared personal feelings with a simple program","correctAnswers":["People shared personal feelings with a simple program"],"pairs":[],"explanation":"ELIZA used simple pattern matching to play a therapist, yet people opened up to it. Joseph Weizenbaum worried that people trusted a program that understood nothing. That question is still with us.","difficulty":"advanced","transfer":"A game character replies to your messages. What would show you it does not understand them?"},{"id":"aih1_q7","type":"multipleChoice","text":"What question did Alan Turing ask in 1950?","simple":"What did Alan Turing ask in 1950?","options":["Can machines think?","Can machines feel pain?","Can machines be trusted?","Can machines learn to draw?"],"correct":"Can machines think?","correctAnswers":["Can machines think?"],"pairs":[],"explanation":"Turing's 1950 paper asked whether machines could think and proposed a test to explore the question.","difficulty":"beginner","transfer":"How would you decide whether a chatbot thinks? What would you test?"},{"id":"aih1_q8","type":"trueFalse","text":"The field of AI got its name at a 1956 meeting of scientists.","simple":"Did AI get its name at a meeting in 1956?","options":["True","False"],"correct":"True","correctAnswers":["True"],"pairs":[],"explanation":"The Dartmouth workshop in 1956 gave the field its name and its first big goals.","difficulty":"beginner","transfer":"Why does it matter that AI is an old idea, not a 2022 invention?"},{"id":"aih1_q9","type":"explain","text":"Explain the Turing Test in your own words and one reason it may not measure intelligence well.","simple":"Explain the Turing Test and one weakness of it.","options":["A judge chats and tries to tell machine from human","Passing means being hard to tell apart","Sounding human is not the same as understanding"],"correct":"In the Turing Test a judge chats with a hidden machine and a hidden person and tries to tell which is which. It measures whether a machine can sound human, which is not the same as understanding, so a system can pass by imitating well.","correctAnswers":["In the Turing Test a judge chats with a hidden machine and a hidden person and tries to tell which is which. It measures whether a machine can sound human, which is not the same as understanding, so a system can pass by imitating well."],"pairs":[],"explanation":"Strong answers describe the setup and question what it measures.","difficulty":"beginner","transfer":"Pick a chatbot or game character. How would you test whether it understands or just imitates?"}],"cards":[{"emoji":"🖥️","title":"Turing's Question","body":"In 1950 Alan Turing asked whether machines can think. He proposed a test: a judge chats with a hidden machine and a hidden person and tries to tell which is which.","funFact":null},{"emoji":"📜","title":"A Name at Dartmouth","body":"In 1956 John McCarthy led a summer workshop at Dartmouth College with Marvin Minsky, Nathaniel Rochester, and Claude Shannon. They chose the name Artificial Intelligence for the new field.","funFact":null},{"emoji":"💬","title":"ELIZA, the Pattern Matcher","body":"In 1966 Joseph Weizenbaum built ELIZA, a program that echoed people's words back as questions. Many users shared real feelings with it, which troubled Weizenbaum because ELIZA understood nothing.","funFact":null},{"emoji":"🧭","title":"An Old Idea","body":"AI is more than seventy years old. Today's chatbots build on decades of questions, experiments, and mistakes, so knowing the history helps you judge new claims.","funFact":null}]},{"id":"aih_l2","title":"AI Winters","description":"The times AI fell out of favour, and what the pattern teaches","order":1,"difficulty":"intermediate","questions":[{"id":"aih2_q1","type":"multipleChoice","text":"What does the phrase AI winter describe?","simple":"What is an AI winter?","options":["A period when trust and funding for AI fell","A season when computer labs closed for the cold","A planned pause in research to test safety","A slow year for hiring in technology jobs"],"correct":"A period when trust and funding for AI fell","correctAnswers":["A period when trust and funding for AI fell"],"pairs":[],"explanation":"AI winters came after grand promises did not come true. Excitement and money poured in, results fell short, and the money left.","difficulty":"beginner","transfer":"A hyped toy craze fades by spring. What was promised, and what actually arrived?"},{"id":"aih2_q2","type":"trueFalse","text":"There have been at least two major AI winters in history.","simple":"Have there been at least two AI winters?","options":["True","False"],"correct":"True","correctAnswers":["True"],"pairs":[],"explanation":"The first winter followed 1970s reports that progress was slower than promised. The second came in the late 1980s when costly expert systems disappointed buyers.","difficulty":"beginner","transfer":"Why might an idea fail twice and still succeed later?"},{"id":"aih2_q3","type":"fillInBlank","text":"AI winters follow when __________ run far ahead of what AI can deliver.","simple":"AI winters come when __________ run ahead of results.","options":["expectations","budgets","timelines","datasets"],"correct":"expectations","correctAnswers":["expectations"],"pairs":[],"explanation":"The pattern repeats: excitement, big promises, results that fall short, then cuts. Knowing it helps you weigh new claims.","difficulty":"beginner","transfer":"A team promises to win every game this season. What happens to support after the first losses?"},{"id":"aih2_q4","type":"multipleChoice","text":"The 1973 Lighthill Report helped start the first AI winter. Who commissioned it?","simple":"Who asked for the 1973 Lighthill Report?","options":["The British government's research council","The United States Congress","The Japanese government","A group of computer companies"],"correct":"The British government's research council","correctAnswers":["The British government's research council"],"pairs":[],"explanation":"James Lighthill wrote the report for the UK Science Research Council. It said AI had not met its goals, and British funding was cut sharply.","difficulty":"intermediate","transfer":"A report says your school club wastes money. Who wrote it, and why does that matter?"},{"id":"aih2_q5","type":"matchPairs","text":"Match each era of AI history:","simple":"Match each time span to what happened.","options":[],"correct":"","correctAnswers":[],"pairs":[{"term":"1956 to 1974","definition":"Golden age of AI optimism"},{"term":"1974 to 1980","definition":"First AI winter"},{"term":"1980 to 1987","definition":"Expert systems boom"},{"term":"1987 to 1993","definition":"Second AI winter"}],"explanation":"AI history has cycled between excitement and disappointment. Each return brought stronger tools and lessons that shape how AI is built today.","difficulty":"beginner","transfer":"Draw a timeline of a hobby you love. Where were the boom years and the quiet years?"},{"id":"aih2_q6","type":"scenarioJudgment","text":"A news story says AI investment looks like past hype cycles. Which evidence best tests that claim?","simple":"Which check best tests the claim that AI is a hype bubble?","options":["Compare what products promised with what they delivered","Count how often AI is mentioned on social media","Check whether the reporter works for a technology firm","Read how many headlines mention AI in one week"],"correct":"Compare what products promised with what they delivered","correctAnswers":["Compare what products promised with what they delivered"],"pairs":[],"explanation":"Past winters followed a gap between promises and results, so that gap is the thing to measure. Mentions and headlines rise in booms and busts alike. A reporter's employer is worth noting but does not settle the question.","difficulty":"advanced","transfer":"A game studio promises a huge update. How would you judge whether it delivered?"},{"id":"aih2_q7","type":"multipleChoice","text":"What usually happens right before an AI winter?","simple":"What comes right before an AI winter?","options":["Big promises the technology cannot keep","A sudden shortage of computer chips","A new law that bans research","A famous scientist retiring early"],"correct":"Big promises the technology cannot keep","correctAnswers":["Big promises the technology cannot keep"],"pairs":[],"explanation":"Winters follow hype. When results fall short of promises, funding and interest drop.","difficulty":"beginner","transfer":"What promise about AI have you heard recently that might be hard to keep?"},{"id":"aih2_q8","type":"trueFalse","text":"AI winters were periods of reduced funding and enthusiasm.","simple":"Did funding and enthusiasm fall during AI winters?","options":["True","False"],"correct":"True","correctAnswers":["True"],"pairs":[],"explanation":"Disappointing results and unmet expectations led to funding cuts. Research continued despite the reduced support.","difficulty":"beginner","transfer":"How could reduced funding slow a promising research idea?"},{"id":"aih2_q9","type":"explain","text":"Explain the hype cycle in AI and why knowing it helps you today.","simple":"Explain the AI hype cycle and why it helps to know it.","options":["Excitement, overpromising, disappointment, cuts","The pattern has repeated","It helps you judge today's claims"],"correct":"AI has cycled through excitement, big promises, disappointment, and funding cuts more than once. Knowing the pattern helps you ask what evidence backs a new claim instead of trusting the excitement.","correctAnswers":["AI has cycled through excitement, big promises, disappointment, and funding cuts more than once. Knowing the pattern helps you
