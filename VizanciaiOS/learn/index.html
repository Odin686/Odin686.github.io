 ask what evidence backs a new claim instead of trusting the excitement."],"pairs":[],"explanation":"Strong answers name the pattern and apply it to a current claim.","difficulty":"beginner","transfer":"Find one AI claim in an ad or video this week. Which stage of the cycle does it sound like?"}],"cards":[{"emoji":"❄️","title":"What an AI Winter Is","body":"An AI winter is a period when funding and interest in AI drop. It happens when expectations run far ahead of what the technology can deliver.","funFact":null},{"emoji":"📉","title":"The First Winter","body":"In 1973 James Lighthill wrote a report for the UK Science Research Council saying AI had not met its goals. British funding was cut, and the 1970s became the first winter.","funFact":null},{"emoji":"🏢","title":"Expert Systems Boom and Bust","body":"In the 1980s companies bought expert systems, programs built from hand-written rules collected from human experts. They were costly to update and often brittle, and by the late 1980s buyers pulled back.","funFact":null},{"emoji":"🌱","title":"Patience Pays Off","body":"Many AI techniques invented decades ago only became useful when computers and data caught up. Good ideas sometimes just need time.","funFact":null},{"emoji":"🔍","title":"Reading Hype Today","body":"The cycle of excitement, big promises, disappointment, and cuts has repeated. When you hear a bold AI claim, compare what is promised with what has actually been delivered.","funFact":null}]},{"id":"aih_l3","title":"The AlexNet Moment","description":"The 2012 result that launched the deep learning era","order":2,"difficulty":"intermediate","questions":[{"id":"aih3_q1","type":"multipleChoice","text":"What 2012 event do many people call the start of modern deep learning?","simple":"What 2012 event started modern deep learning?","options":["A deep network won the ImageNet contest by a wide margin","The first personal computers reached ordinary homes","A program beat the world chess champion for the first time","A chatbot became the most talked-about app of the year"],"correct":"A deep network won the ImageNet contest by a wide margin","correctAnswers":["A deep network won the ImageNet contest by a wide margin"],"pairs":[],"explanation":"AlexNet, trained by Alex Krizhevsky with Ilya Sutskever and Geoffrey Hinton, cut the ImageNet error rate far below older methods. Researchers across the field took notice.","difficulty":"beginner","transfer":"A new training method wins a science fair by a mile. Why would other students copy it?"},{"id":"aih3_q2","type":"trueFalse","text":"Hinton, LeCun, and Bengio shared the 2018 Turing Award for deep learning work.","simple":"Did three deep learning researchers share the 2018 Turing Award?","options":["True","False"],"correct":"True","correctAnswers":["True"],"pairs":[],"explanation":"The Turing Award is computing's top prize. The three kept working on neural networks through years when few others believed in them.","difficulty":"beginner","transfer":"Why might an award arrive decades after the work was done?"},{"id":"aih3_q3","type":"fillInBlank","text":"The __________ dataset, led by Fei-Fei Li, gave researchers millions of labelled images.","simple":"Which dataset gave researchers millions of labelled pictures?","options":["ImageNet","CIFAR","MNIST","COCO"],"correct":"ImageNet","correctAnswers":["ImageNet"],"pairs":[],"explanation":"Fei-Fei Li's team organized and labelled millions of images and ran a yearly contest on them. AlexNet's 2012 win on that contest launched the deep learning era.","difficulty":"beginner","transfer":"You want to teach a friend to spot bird species. Why would many labelled photos help?"},{"id":"aih3_q4","type":"sortOrder","text":"Order these deep learning milestones from earliest to latest:","simple":"Put these AI events in order.","options":["Transformer paper published (2017)","AlexNet wins ImageNet (2012)","AlphaGo beats Lee Sedol (2016)","A chatbot reaches a mass public audience (2022)"],"correct":"","correctAnswers":["AlexNet wins ImageNet (2012)","AlphaGo beats Lee Sedol (2016)","Transformer paper published (2017)","A chatbot reaches a mass public audience (2022)"],"pairs":[],"explanation":"In one decade AI went from recognizing images, to mastering Go, to a new language architecture, to chatbots used by millions. Each step leaned on the one before.","difficulty":"intermediate","transfer":"Think of phones you have seen. How would you check which feature came first?"},{"id":"aih3_q5","type":"multipleChoice","text":"Which three ingredients came together to make deep learning take off?","simple":"Which three things made deep learning possible?","options":["Large datasets, fast graphics chips, better training methods","Faster internet, cheaper phones, social media apps","Government grants, university labs, shared code","Quantum computers, blockchains, cloud platforms"],"correct":"Large datasets, fast graphics chips, better training methods","correctAnswers":["Large datasets, fast graphics chips, better training methods"],"pairs":[],"explanation":"The internet supplied huge datasets, graphics chips built for games turned out to be good at training networks, and researchers improved training methods. All three arrived together.","difficulty":"intermediate","transfer":"Think of a sport you play. What three things have to line up for a team to improve fast?"},{"id":"aih3_q6","type":"multipleChoice","text":"In 2016 the program AlphaGo beat Go champion Lee Sedol. Why did that matter?","simple":"Why was a computer winning at Go a big deal?","options":["Go has far too many positions to search by brute force","It was the first time a computer played any board game","Lee Sedol was not considered a strong player","Go has very few possible moves to consider"],"correct":"Go has far too many positions to search by brute force","correctAnswers":["Go has far too many positions to search by brute force"],"pairs":[],"explanation":"Chess programs could win by checking huge numbers of positions. Go has far more, so AlphaGo learned from human games and self-play instead of searching everything. That approach spread to other problems.","difficulty":"advanced","transfer":"Some puzzles have too many possibilities to try them all. How do you solve one?"},{"id":"aih3_q7","type":"multipleChoice","text":"What hardware was the 2012 ImageNet-winning network trained on?","simple":"What chips trained the 2012 winning network?","options":["Graphics chips built for games","A single office laptop","Supercomputers built for weather","Ordinary phone processors"],"correct":"Graphics chips built for games","correctAnswers":["Graphics chips built for games"],"pairs":[],"explanation":"AlexNet was trained on graphics chips (GPUs). Chips built for games turned out to be good at training networks.","difficulty":"beginner","transfer":"Why might hardware built for one purpose end up useful for another?"},{"id":"aih3_q8","type":"multipleChoice","text":"In the ImageNet contest, programs were tested on which photos?","simple":"Which photos did the ImageNet contest test programs on?","options":["Photos they had not seen before","The same photos they trained on","Hand-drawn sketches only","Photos with the answers printed on them"],"correct":"Photos they had not seen before","correctAnswers":["Photos they had not seen before"],"pairs":[],"explanation":"The contest used unseen photos, so it measured real recognition instead of memory. That is why a wide-margin win was convincing.","difficulty":"beginner","transfer":"Why would a test made of the practice questions prove less than one with new questions?"},{"id":"aih3_q9","type":"explain","text":"Explain why a big labelled dataset like ImageNet mattered so much.","simple":"Why did a big labelled dataset like ImageNet matter?","options":["Models learn from examples","Millions of labelled images gave enough to learn","A shared benchmark let researchers compare"],"correct":"Deep networks need huge numbers of labelled examples to learn. ImageNet provided millions of them and a shared contest, so researchers could train real models and compare results fairly.","correctAnswers":["Deep networks need huge numbers of labelled examples to learn. ImageNet provided millions of them and a shared contest, so researchers could train real models and compare results fairly."],"pairs":[],"explanation":"Strong answers link data volume to learning and mention the shared benchmark.","difficulty":"beginner","transfer":"Your class wants to compare two study methods fairly. What would you need that works like a shared contest?"}],"cards":[{"emoji":"🗂️","title":"ImageNet","body":"Fei-Fei Li's team built ImageNet, a collection of millions of photos each labelled with what it shows. A yearly contest asked programs to name the objects in unseen photos.","funFact":null},{"emoji":"🧠","title":"The 2012 Result","body":"In 2012 a deep convolutional network called AlexNet won the ImageNet contest by a wide margin. It was trained on graphics chips, and the result convinced many researchers that deep learning worked.","funFact":null},{"emoji":"🧩","title":"Three Ingredients","body":"Deep learning took off when three things arrived together: large datasets from the internet, fast graphics chips (GPUs) originally built for games, and better training methods.","funFact":null},{"emoji":"🏆","title":"AlphaGo, 2016","body":"Go has too many possible positions for a program to check them all. In 2016 AlphaGo beat champion Lee Sedol by learning from human games and from playing itself.","funFact":null},{"emoji":"🎖️","title":"Recognition at Last","body":"Geoffrey Hinton, Yann LeCun, and Yoshua Bengio shared the 2018 Turing Award, computing's top prize, for decades of work on neural networks that few had believed in.","funFact":null}]},{"id":"aih_l4","title":"Types of Neural Networks","description":"CNNs, RNNs, transformers, and GANs: what each is built for","order":3,"difficulty":"intermediate","questions":[{"id":"aih4_q1","type":"multipleChoice","text":"A convolutional neural network (CNN) is designed mainly for which kind of data?","simple":"What kind of data are CNNs built for?","options":["Images and video, scanned piece by piece","Long text documents, read word by word","Sound recordings, split into short clips","Spreadsheet tables, sorted column by column"],"correct":"Images and video, scanned piece by piece","correctAnswers":["Images and video, scanned piece by piece"],"pairs":[],"explanation":"A CNN slides small filters across an image to find edges, then shapes, then objects. That is how a phone finds faces in photos.","difficulty":"beginner","transfer":"Your phone finds faces in photos. Which network type is likely working?"},{"id":"aih4_q2","type":"matchPairs","text":"Match each type of neural network to what it does best:","simple":"Match each network to its best job.","options":[],"correct":"","correctAnswers":[],"pairs":[{"term":"CNN (Convolutional)","definition":"Analyzing images and video"},{"term":"RNN (Recurrent)","definition":"Reading a sequence one step at a time"},{"term":"Transformer","definition":"Relating every word to every other word at once"},{"term":"GAN (Generative Adversarial)","definition":"Creating realistic new images"}],"explanation":"Different problems need different designs: CNNs scan images, RNNs step through sequences, transformers use attention across a whole passage, and GANs generate new data.","difficulty":"beginner","transfer":"You have photos, a song, and a story. Which network would you pick for each?"},{"id":"aih4_q3","type":"multipleChoice","text":"Most modern chatbots are built on which attention-based architecture?","simple":"Which design do most modern chatbots use?","options":["Transformer","Decision tree","K-means clustering","Linear regression"],"correct":"Transformer","correctAnswers":["Transformer"],"pairs":[],"explanation":"A 2017 research paper introduced the transformer, which uses attention to relate words across a whole passage. Most large language models build on it.","difficulty":"beginner","transfer":"A translation app handles a long sentence well. Which idea from this lesson helps it?"},{"id":"aih4_q4","type":"multipleChoice","text":"In the 1990s Yann LeCun's team built an early CNN called LeNet. What did it read?","simple":"What did the early CNN called LeNet read?","options":["Handwritten digits on bank cheques","Street signs from car cameras","Faces in security camera footage","Words in scanned library books"],"correct":"Handwritten digits on bank cheques","correctAnswers":["Handwritten digits on bank cheques"],"pairs":[],"explanation":"LeNet read handwritten numbers on cheques and postal codes, one of the first CNNs in daily use. The same ideas power image recognition today.","difficulty":"intermediate","transfer":"Your bank app reads a cheque photo. What could make it misread a digit?"},{"id":"aih4_q5","type":"fillInBlank","text":"Transformers use the __________ mechanism to weigh which words matter most.","simple":"Transformers use the __________ mechanism to find key words.","options":["attention","deletion","compression","rotation"],"correct":"attention","correctAnswers":["attention"],"pairs":[],"explanation":"Attention works like a spotlight the model can point at different parts of a sentence. It helps connect 'cat' with 'sat' even when other words sit between them.","difficulty":"intermediate","transfer":"When reading a long text message, how do you decide which words matter most?"},{"id":"aih4_q6","type":"scenarioJudgment","text":"You are building a tool that flags possible fractures on X-rays for doctors. Which network fits best?","simple":"Which network suits a tool that checks X-ray pictures?","options":["A CNN, because X-rays are images","An RNN, because scans arrive one after another","A GAN, because it can generate example X-rays","A transformer, because doctors write text reports"],"correct":"A CNN, because X-rays are images","correctAnswers":["A CNN, because X-rays are images"],"pairs":[],"explanation":"X-rays are images, so a CNN is the natural fit for finding patterns in them. Such tools assist radiologists; a doctor still reviews each case and makes the decision.","difficulty":"advanced","transfer":"A coach wants software to spot a bad swing in video. Which network type would you pick?"},{"id":"aih4_q7","type":"multipleChoice","text":"Which network type is built for pictures?","simple":"Which network type is for pictures?","options":["CNN","RNN","GAN","Transformer"],"correct":"CNN","correctAnswers":["CNN"],"pairs":[],"explanation":"Convolutional networks scan an image piece by piece to find edges, shapes, and objects.","difficulty":"beginner","transfer":"Which network type would you pick for reading a paragraph?"},{"id":"aih4_q8","type":"trueFalse","text":"Attention lets a model focus on the most relevant words in a sentence.","simple":"Does attention help a model focus on key words?","options":["True","False"],"correct":"True","correctAnswers":["True"],"pairs":[],"explanation":"Attention scores how much each word matters to the others, so the model connects related words even when far apart.","difficulty":"beginner","transfer":"In 'the cake my aunt baked was gone', which two words does attention need to connect?"},{"id":"aih4_q9","type":"explain","text":"Explain why different problems need different kinds of neural networks.","simple":"Why do different problems need different networks?","options":["Images, sequences, and generation differ","Each architecture suits a data shape","The wrong one works poorly"],"correct":"Images, text sequences, and generated media have different shapes, so networks are designed around them: CNNs scan images, sequence models and transformers handle text, GANs create new images. The wrong type learns slowly or badly.","correctAnswers":["Images, text sequences, and generated media have different shapes, so networks are designed around them: CNNs scan images, sequence models and transformers handle text, GANs create new images. The wrong type learns slowly or badly."],"pairs":[],"explanation":"Strong answers match a data type to an architecture.","difficulty":"beginner","transfer":"Think of three tools in a kitchen. Why does each job need its own tool, and how is that like networks?"}],"cards":[{"emoji":"👁️","title":"CNNs See","body":"A convolutional neural network (CNN) slides small filters across an image to find edges, then shapes, then whole objects. In the 1990s Yann LeCun's LeNet read handwritten digits on cheques, and AlexNet in 2012 used the same idea at a much larger scale.","funFact":null},{"emoji":"🔁","title":"RNNs Step Through Sequences","body":"A recurrent neural network (RNN) reads a sequence one step at a time, carrying a memory forward. That suits speech and text, though the memory fades over long passages.","funFact":null},{"emoji":"🌊","title":"Transformers and Attention","body":"A 2017 research paper introduced the transformer. Its attention mechanism lets the model weigh how much every word matters to every other word at once, and most large language models are built on it.","funFact":null},{"emoji":"🎨","title":"GANs Create","body":"A generative adversarial network (GAN) pairs two networks: one generates images and the other judges whether they look real. Competing against each other, they learn to create realistic new pictures.","funFact":null}]},{"id":"aih_l5","title":"Chatbots Go Mainstream","description":"What changed in 2022, why it worked, and how to judge the claims","order":4,"difficulty":"beginner","questions":[{"id":"aih5_q1","type":"multipleChoice","text":"What was new about the chatbot that went public in late 2022?","simple":"What was new about the 2022 chatbot?","options":["Anyone could use a large language model by typing","It was the first language model ever trained","It was the first program to pass the Turing Test","It replaced web search engines within a year"],"correct":"Anyone could use a large language model by typing","correctAnswers":["Anyone could use a large language model by typing"],"pairs":[],"explanation":"Large language models existed before 2022. The new part was a free chat window that let millions of people try one without any special skill.","difficulty":"beginner","transfer":"A music app adds one-tap sharing. Why might use jump even though the songs did not change?"},{"id":"aih5_q2","type":"trueFalse","text":"Fluent, confident writing from a chatbot is proof that its answer is correct.","simple":"Does confident chatbot writing prove the answer is right?","options":["True","False"],"correct":"False","correctAnswers":["False"],"pairs":[],"explanation":"A language model predicts likely words, so it can be fluent and wrong at the same time. Safety and evaluation research exists partly to measure and reduce these errors.","difficulty":"beginner","transfer":"A classmate answers a quiz question confidently but wrongly. How do you check?"},{"id":"aih5_q3","type":"fillInBlank","text":"After 2022 many labs released rival chatbots, a period of intense __________.","simple":"After 2022, labs released rival chatbots in a period of __________.","options":["competition","cooperation","consolidation","standardization"],"correct":"competition","correctAnswers":["competition"],"pairs":[],"explanation":"Success attracted rivals, and several labs released models within months of each other. Competition sped up releases and also sped up mistakes, so testing mattered more.","difficulty":"beginner","transfer":"Two game studios race to release similar games. What could players gain and lose?"},{"id":"aih5_q4","type":"matchPairs","text":"Match each chatbot behaviour to its cause:","simple":"Match each chatbot habit to its cause.","options":[],"correct":"","correctAnswers":[],"pairs":[{"term":"Confident but wrong answer","definition":"Predicts likely words, not checked facts"},{"term":"Fluent, natural sentences","definition":"Trained on huge amounts of human writing"},{"term":"Follows instructions politely","definition":"Tuned with examples and human feedback"},{"term":"Knows nothing about last week","definition":"Training data ends at a cutoff date"}],"explanation":"Each habit traces back to how the model was built. Knowing the cause tells you when to double-check.","difficulty":"beginner","transfer":"A chatbot gets a sports score wrong. Which cause fits, and how would you check the score?"},{"id":"aih5_q5","type":"multipleChoice","text":"Why do modern chatbots answer questions instead of just continuing your text?","simple":"Why do chatbots answer instead of just continuing text?","options":["They were further trained on examples and rated by people","They look up each answer in a fixed rulebook","They copy their replies from one approved website","They are wired to a person typing behind the screen"],"correct":"They were further trained on examples and rated by people","correctAnswers":["They were further trained on examples and rated by people"],"pairs":[],"explanation":"A base model only predicts the next words. Extra training on example conversations, plus human ratings of replies, teaches it to follow instructions. This step is often called instruction tuning.","difficulty":"intermediate","transfer":"You train a puppy with treats for good behaviour. How is that like rating chatbot replies?"},{"id":"aih5_q6","type":"scenarioJudgment","text":"A headline says a chatbot was the fastest-growing app ever. Which check matters most?","simple":"How would you check a 'fastest-growing app' claim?","options":["Find the source, how users were counted, and the date","Count how many friends have heard of the app","See whether the headline appears on several sites","Check whether the app has a high store rating"],"correct":"Find the source, how users were counted, and the date","correctAnswers":["Find the source, how users were counted, and the date"],"pairs":[],"explanation":"Growth claims depend on who counted, what counted as a user, and when. Records get passed, so a claim needs a source and a date. Repetition across sites is not evidence.","difficulty":"advanced","transfer":"A video claims a song broke a streaming record. What would you look for before repeating it?"},{"id":"aih5_q7","type":"multipleChoice","text":"Why did the 2022 chatbot launch reach so many people so fast?","simple":"Why did the 2022 chatbot spread so fast?","options":["Anyone could use it by typing plain sentences","It was the first computer program to chat","It was built for scientists in research labs","It needed special coding skills to run"],"correct":"Anyone could use it by typing plain sentences","correctAnswers":["Anyone could use it by typing plain sentences"],"pairs":[],"explanation":"Language models existed before, but a simple chat interface let millions try one without special skills.","difficulty":"beginner","transfer":"What other technology became popular once it got an easy interface?"},{"id":"aih5_q8","type":"trueFalse","text":"After 2022, many companies raced to release competing language models.","simple":"Did many companies race to release AI models after 2022?","options":["True","False"],"correct":"True","correctAnswers":["True"],"pairs":[],"explanation":"Success drew competition. Several labs released models within months of each other.","difficulty":"beginner","transfer":"What are the good and bad sides of a race between AI companies?"},{"id":"aih5_q9","type":"explain","text":"Explain what changed in 2022 and one mistake people made about chatbots.","simple":"What changed in 2022, and what did people get wrong?","options":["A free chat window reached the public","Fluent text was mistaken for reliable facts","Answers still need checking"],"correct":"In 2022 a free chat window let millions of people use a large language model by typing. Many treated its fluent, confident writing as reliable, but the model predicts words rather than checks facts, so answers need checking.","correctAnswers":["In 2022 a free chat window let millions of people use a large language model by typing. Many treated its fluent, confident writing as reliable, but the model predicts words rather than checks facts, so answers need checking."],"pairs":[],"explanation":"Strong answers name the interface change and the fluency mistake.","difficulty":"beginner","transfer":"Tell a family member one thing to check before trusting a chatbot answer about homework."}],"cards":[{"emoji":"💬","title":"Late 2022","body":"In late 2022 a research lab released a free chatbot to the public, and within months millions of people were typing questions to it. Language models existed before; the easy chat window was the new part.","funFact":null},{"emoji":"⚙️","title":"Why It Worked","body":"Three things lined up: larger models trained on far more text, instruction tuning that used example conversations and human ratings to teach the model to follow requests, and a simple interface anyone could use.","funFact":null},{"emoji":"🎯","title":"Fluent Is Not the Same as Right","body":"A language model predicts likely words, so it can sound confident while being wrong, and it knows nothing after its training cutoff. Safety and evaluation research measures these errors and works to reduce them.","funFact":null},{"emoji":"🏁","title":"The Race That Followed","body":"Within months many labs released rival chatbots and models. Competition sped up new features and also sped up mistakes, which made careful testing matter more.","funFact":null},{"emoji":"📰","title":"Judging Big Claims","body":"Headlines called the chatbot the fastest-growing app ever. Claims like that depend on who counted, what counted as a user, and when, and records get passed, so ask for the source and the date.","funFact":null}]},{"id":"aih_l6","title":"AI Pioneers","description":"The people who asked the questions, built the tools, and found the flaws","order":5,"difficulty":"beginner","questions":[{"id":"aih6_q1","type":"matchPairs","text":"Match these AI pioneers to their contributions:","simple":"Match each pioneer to what they did.","options":[],"correct":"","correctAnswers":[],"pairs":[{"term":"Alan Turing","definition":"Asked whether machines can think and proposed a test"},{"term":"Fei-Fei Li","definition":"Led ImageNet, a huge labelled image dataset"},{"term":"Geoffrey Hinton","definition":"Kept neural networks alive, later warned about risks"},{"term":"Yann LeCun","definition":"Pioneered practical CNNs that read handwritten digits"}],"explanation":"Turing set the questions, LeCun made CNNs practical, building on Kunihiko Fukushima's earlier neocognitron, Li supplied the data, and Hinton persisted through the winters.","difficulty":"beginner","transfer":"Pick a team sport. Who sets the plan, who supplies the gear, and who keeps going when losing?"},{"id":"aih6_q2","type":"trueFalse","text":"AlphaGo improved partly by playing many games against itself.","simple":"Did AlphaGo learn by playing against itself?","options":["True","False"],"correct":"True","correctAnswers":["True"],"pairs":[],"explanation":"AlphaGo studied human games, then played itself many times to improve. Self-play later helped other game-playing systems.","difficulty":"beginner","transfer":"How could playing against yourself help you improve at a game or a sport?"},{"id":"aih6_q3","type":"multipleChoice","text":"Gender Shades (2018) tested face tools on different groups. Why did that method matter?","simple":"Why did testing face tools by group matter?","options":["Testing by group revealed errors an average score hid","Testing by group made every tool run much faster","Testing by group proved the tools were fully fair","Testing by group replaced the need for training data"],"correct":"Testing by group revealed errors an average score hid","correctAnswers":["Testing by group revealed errors an average score hid"],"pairs":[],"explanation":"Overall accuracy looked fine, but breaking results down by skin tone and gender showed much higher error rates for dark-skinned women. The study pushed companies to test and report by group.","difficulty":"beginner","transfer":"Your class average on a quiz is high. What could the average hide?"},{"id":"aih6_q4","type":"fillInBlank","text":"Geoffrey __________ championed neural networks for decades and in 2023 began warning publicly about AI risks.","simple":"Geoffrey __________ backed neural networks for decades, then warned about risks.","options":["Hinton","Bengio","Dean","Sutton"],"correct":"Hinton","correctAnswers":["Hinton"],"pairs":[],"explanation":"Hinton kept working on neural networks through both AI winters. In 2023 he left his industry job so he could speak freely about risks.","difficulty":"intermediate","transfer":"Why might someone who helped build a thing be worth hearing when they warn about it?"},{"id":"aih6_q5","type":"multipleChoice","text":"Andrew Ng is known for which contribution to AI?","simple":"What is Andrew Ng known for?","options":["Free online courses that taught machine learning to millions","The first program to beat a chess world champion","The 2017 paper that introduced the transformer","The rules-based expert systems of the 1980s"],"correct":"Free online courses that taught machine learning to millions","correctAnswers":["Free online courses that taught machine learning to millions"],"pairs":[],"explanation":"Ng's free online machine learning course reached millions of learners. He showed that you do not need a research degree to start learning AI.","difficulty":"intermediate","transfer":"Name a skill you learned from a free video or website. What made it work?"},{"id":"aih6_q6","type":"multipleChoice","text":"Why does a team with varied backgrounds tend to build fairer AI?","simple":"Why do varied teams build fairer AI?","options":["Members notice failures that affect people like them","Varied teams write code that runs with fewer bugs","Varied teams are required before a product can launch","Members agree faster, so testing takes less time"],"correct":"Members notice failures that affect people like them","correctAnswers":["Members notice failures that affect people like them"],"pairs":[],"explanation":"People are quickest to spot problems that would affect them. A uniform team can miss a failure for a group nobody on the team belongs to, as the face-analysis errors showed.","difficulty":"advanced","transfer":"Your group plans a class party. Who would notice if the food or games left someone out?"},{"id":"aih6_q7","type":"multipleChoice","text":"What did the Gender Shades study reveal?","simple":"What did the Gender Shades study show?","options":["Face tools failed more often for dark-skinned women","Face tools worked about the same for everyone","Face tools needed brighter light to work at all","Face tools were slower on older phone models"],"correct":"Face tools failed more often for dark-skinned women","correctAnswers":["Face tools failed more often for dark-skinned women"],"pairs":[],"explanation":"Testing across groups showed much higher error rates for some people, which pushed the industry to take bias seriously.","difficulty":"beginner","transfer":"How could a company find a problem like this before launch?"},{"id":"aih6_q8","type":"trueFalse","text":"Some AI pioneers kept working on neural networks when most people had given up.","simple":"Did some researchers keep going when others quit?","options":["True","False"],"correct":"True","correctAnswers":["True"],"pairs":[],"explanation":"Researchers such as Hinton persisted through the winters. Their work paid off when data and hardware caught up.","difficulty":"beginner","transfer":"Why might a good idea fail at first and succeed later?"},{"id":"aih6_q9","type":"explain","text":"Explain why diverse teams tend to build fairer AI.","simple":"Why do diverse teams build fairer AI?","options":["Different people notice different problems","Uniform teams miss biases","Testing across groups catches failures"],"correct":"People notice problems that affect people like them. A team with many backgrounds is more likely to spot a failure for a group before launch, while a uniform team can miss it completely.","correctAnswers":["People notice problems that affect people like them. A team with many backgrounds is more likely to spot a failure for a group before launch, while a uniform team can miss it completely."],"pairs":[],"explanation":"Strong answers explain who notices what, not just that diversity is good.","difficulty":"beginner","transfer":"Think of a school event you helped plan. Whose point of view was missing, and what did that miss?"}],"cards":[{"emoji":"🧑‍🔬","title":"Many Hands","body":"AI was built by many people over decades. Alan Turing asked whether machines could think, John McCarthy named the field, Fei-Fei Li led ImageNet, and Yann LeCun made CNNs practical, building on Kunihiko Fukushima's earlier neocognitron.","funFact":null},{"emoji":"🌱","title":"Persistence","body":"Geoffrey Hinton, Yoshua Bengio, and Yann LeCun kept working on neural networks through both AI winters and shared the 2018 Turing Award. In 2023 Hinton left his industry job to speak freely about AI risks.","funFact":null},{"emoji":"🎯","title":"Gender Shades, 2018","body":"Joy Buolamwini and Timnit Gebru tested face-analysis tools by skin tone and gender. Overall accuracy looked fine, but error rates for dark-skinned women were far higher, and the study pushed companies to test and report by group.","funFact":null},{"emoji":"🎓","title":"Sharing Knowledge","body":"Andrew Ng's free online machine learning course reached millions of learners. Many of today's AI researchers and builders started with free lessons like these.","funFact":null},{"emoji":"🌍","title":"Why Varied Teams Matter","body":"People are quickest to notice problems that would affect them. A team with many backgrounds is more likely to catch a failure for some group before launch.","funFact":null}]}],"bigIdeas":["representationReasoning"]},{"id":"ai_under_hood","name":"How AI Works","icon":"gearshape.2","color":"aiOrange","description":"Peek under the hood: weights, biases, training loops, and the math that makes AI tick","order":2,"unlock":{"kind":"completeCategory","value":"ai_history"},"lessons":[{"id":"auh_l1","title":"Weights & Biases","description":"The tiny numbers that control what a model pays attention to","order":0,"difficulty":"beginner","questions":[{"id":"auh1_q1","type":"multipleChoice","text":"In a neural network, what does a weight do?","simple":"What does a weight do in a neural network?","options":["Sets how strongly one neuron affects the next","Stores the training examples for the model to reuse","Counts how many layers the whole model contains","Measures how quickly the model returns an answer"],"correct":"Sets how strongly one neuron affects the next","correctAnswers":["Sets how strongly one neuron affects the next"],"pairs":[],"explanation":"A weight is a number on the connection between two neurons. A bigger weight means the first neuron's signal counts more.","difficulty":"beginner","transfer":"A coach counts practice attendance heavily when picking a team. How is that like a large weight?"},{"id":"auh1_q2","type":"trueFalse","text":"A hiring model treats one group unfairly. That is the same thing as a neuron's bias number.","simple":"Is unfair model behaviour the same as a neuron's bias number?","options":["True","False"],"correct":"False","correctAnswers":["False"],"pairs":[],"explanation":"A neuron's bias is a tuning number that shifts when it activates. Unfair treatment is a different problem that happens to share the word.","difficulty":"beginner","transfer":"A friend says a model 'has bias' so it must be unfair. What question would you ask first?"},{"id":"auh1_q3","type":"fillInBlank","text":"A model card says '7 billion __________', counting its adjustable weights and biases.","simple":"A card says 7 billion __________ (its adjustable numbers).","options":["parameters","tokens","prompts","users"],"correct":"parameters","correctAnswers":["parameters"],"pairs":[],"explanation":"Parameters are the numbers training adjusts. Some providers publish counts and others do not, so outside estimates vary.","difficulty":"beginner","transfer":"Two websites list different sizes for the same model. What could explain the difference?"},{"id":"auh1_q4","type":"multipleChoice","text":"A model keeps calling small dogs cats. During training, what actually changes to fix this?","simple":"Training fixes a mistake. What actually changes inside?","options":["Its weights and biases shift slightly","Its source code is rewritten by hand","It downloads a fresh training dataset","Its layers are deleted one at a time"],"correct":"Its weights and biases shift slightly","correctAnswers":["Its weights and biases shift slightly"],"pairs":[],"explanation":"Learning is adjusting numbers. The model predicts, measures the error, and nudges its weights and biases so the same mistake is a little smaller next time.","difficulty":"intermediate","transfer":"You keep misspelling one word. What small adjustment, repeated, would fix it?"},{"id":"auh1_q5","type":"scenarioJudgment","text":"Two neurons connect with a weight of 0.01. What happens to the first neuron's signal?","simple":"A connection has weight 0.01. What happens to the signal?","options":["It barely reaches the second neuron","It is passed through at full strength","It is flipped to the opposite sign","It is stored until training ends"],"correct":"It barely reaches the second neuron","correctAnswers":["It barely reaches the second neuron"],"pairs":[],"explanation":"Multiplying by 0.01 shrinks the signal almost to nothing. Training decides which connections stay weak and which grow strong.","difficulty":"intermediate","transfer":"In a group chat, whose messages do you give almost zero weight, and why?"},{"id":"auh1_q6","type":"matchPairs","text":"Match each term to its meaning:","simple":"Match each word to its meaning.","options":[],"correct":"","correctAnswers":[],"pairs":[{"term":"Weight","definition":"How much one neuron's signal counts for the next"},{"term":"Bias","definition":"Shifts how easily a neuron activates"},{"term":"Parameter","definition":"Any number that training adjusts"},{"term":"Training","definition":"Adjusting all the numbers to cut errors"}],"explanation":"Weights and biases are both parameters. Training is the process that adjusts them.","difficulty":"beginner","transfer":"A speaker has a volume knob and a sensitivity setting. Which is like a weight, and which like a bias?"},{"id":"auh1_q7","type":"multipleChoice","text":"A face model ignores photo backgrounds. What are the background connections probably like?","simple":"The model ignores backgrounds. What are those weights like?","options":["Weights near zero","Very large weights","Weights removed entirely","Weights that keep growing"],"correct":"Weights near zero","correctAnswers":["Weights near zero"],"pairs":[],"explanation":"Near-zero weights mean the network mostly ignores that input. Training shrinks connections that do not help predictions.","difficulty":"beginner","transfer":"When you read a long text message, which parts get almost zero attention?"},{"id":"auh1_q8","type":"trueFalse","text":"Training changes a model's weights in many small steps rather than one jump.","simple":"Does training change weights bit by bit?","options":["True","False"],"correct":"True","correctAnswers":["True"],"pairs":[],"explanation":"Each step nudges the weights a little so errors shrink. Huge jumps could undo earlier progress.","difficulty":"beginner","transfer":"Learning a song, why do small corrections work better than changing everything at once?"},{"id":"auh1_q9","type":"explain","text":"Explain what a parameter is and why exact counts for big models are hard to know.","simple":"What is a parameter? Why are exact counts unclear?","options":["A parameter is an adjustable number like a weight or bias","Big models have billions of them","Exact counts are often unpublished, so estimates vary"],"correct":"A parameter is any adjustable number inside a model, mainly weights and biases. Big models have billions because each one captures a small piece of a pattern. Many providers do not publish exact counts, so numbers you hear are estimates.","correctAnswers":["A parameter is any adjustable number inside a model, mainly weights and biases. Big models have billions because each one captures a small piece of a pattern. Many providers do not publish exact counts, so numbers you hear are estimates."],"pairs":[],"explanation":"Strong answers define the term, connect count to patterns, and note that outside numbers are estimates.","difficulty":"beginner","transfer":"A video claims to know a model's exact size. How would you check whether that is known or guessed?"}],"cards":[{"emoji":"🔢","title":"It is all numbers","body":"Inside a neural network, everything the model knows is stored as numbers called parameters. Training adjusts them a little at a time until predictions improve.","funFact":null},{"emoji":"⚙️","title":"Weights","body":"A weight sits on the connection between two neurons and sets how much one neuron's signal counts for the next. Near zero means mostly ignore; large means pay attention.","funFact":null},{"emoji":"🎚️","title":"Biases","body":"A bias is a number added inside a neuron that shifts how easily it activates. It is a tuning number, not the same as unfair bias in data.","funFact":null},{"emoji":"🔒","title":"Counting parameters","body":"Large models have billions of parameters. Exact counts for many commercial models are not published, so outside estimates vary, and the count alone does not tell you how good a model is.","funFact":null}]},{"id":"auh_l2","title":"Activation Functions","description":"The gates that let neural networks learn curved patterns","order":1,"difficulty":"intermediate","questions":[{"id":"auh2_q1","type":"multipleChoice","text":"What does an activation function decide for a neuron?","simple":"What does an activation function decide?","options":["What signal passes to the next layer","Which training example comes next","How many neurons the layer has","How long the model keeps training"],"correct":"What signal passes to the next layer","correctAnswers":["What signal passes to the next layer"],"pairs":[],"explanation":"The neuron adds up its weighted inputs, then the activation function decides what passes on. Without it, layers just add and multiply.","difficulty":"beginner","transfer":"A goalie decides which shots get through. How is that like an activation function?"},{"id":"auh2_q2","type":"multipleChoice","text":"A network with no activation functions cannot learn a curved pattern. What is it missing?","simple":"No activation functions, no curved patterns. What is missing?","options":["Nonlinearity","Storage","Labels","Retrieval"],"correct":"Nonlinearity","correctAnswers":["Nonlinearity"],"pairs":[],"explanation":"Without nonlinearity, stacked layers collapse into one straight-line formula. Activation functions add the bends.","difficulty":"beginner","transfer":"Drawing a circle with only a straight ruler, what tool would you need to add?"},{"id":"auh2_q3","type":"multipleChoice","text":"A layer passes 5 through unchanged but turns -3 into 0. Which activation function is it using?","simple":"5 stays 5, and -3 becomes 0. Which function?","options":["ReLU","Sigmoid","Softmax","Tanh"],"correct":"ReLU","correctAnswers":["ReLU"],"pairs":[],"explanation":"ReLU keeps positive inputs and zeros negative ones. Its simplicity makes it quick to compute.","difficulty":"beginner","transfer":"Name something in a game that lets some things through and blocks the rest."},{"id":"auh2_q4","type":"fillInBlank","text":"ReLU keeps a positive input the __________ and turns a negative input into zero.","simple":"ReLU keeps positive inputs the __________, negatives become zero.","options":["same","doubled","halved","rounded"],"correct":"same","correctAnswers":["same"],"pairs":[],"explanation":"ReLU(x) = max(0, x). It is a gate that blocks negatives and passes positives untouched. That simple rule trains faster than older curved functions.","difficulty":"intermediate","transfer":"If ReLU receives 0.5, then -0.5, what comes out each time?"},{"id":"auh2_q5","type":"matchPairs","text":"Match each activation function to its behaviour:","simple":"Match each function to what it does.","options":[],"correct":"","correctAnswers":[],"pairs":[{"term":"ReLU","definition":"Blocks negatives, passes positives unchanged"},{"term":"Sigmoid","definition":"Squeezes any number into 0 to 1"},{"term":"Softmax","definition":"Turns scores into probabilities adding to 1"},{"term":"Tanh","definition":"Squeezes any number into -1 to 1"}],"explanation":"ReLU is fast and simple, while sigmoid and softmax suit probabilities and tanh centres outputs around zero. Networks often use different functions in different layers.","difficulty":"beginner","transfer":"Your model must say how likely rain is, from 0 to 100 percent. Which function fits the last step?"},{"id":"auh2_q6","type":"scenarioJudgment","text":"Your classifier must output cat, dog and bird probabilities adding to 100 percent. Which final activation fits?","simple":"Cat, dog, bird chances must add to 100 percent. Which function?","options":["Softmax, which makes probabilities that sum to 1","ReLU, which zeros out negative values","Tanh, which keeps outputs between -1 and 1","Sigmoid on each output, which need not sum to 1"],"correct":"Softmax, which makes probabilities that sum to 1","correctAnswers":["Softmax, which makes probabilities that sum to 1"],"pairs":[],"explanation":"Softmax turns raw scores into probabilities that add up to 1. Scores of 2.0, 1.0 and 0.5 become roughly 0.63, 0.23 and 0.14, so the model favours the first category.","difficulty":"advanced","transfer":"A quiz app guesses which of five topics a question belongs to. What should its last layer output?"},{"id":"auh2_q7","type":"multipleChoice","text":"What does ReLU output for the input -4?","simple":"What does ReLU give for -4?","options":["0","-4","4","-8"],"correct":"0","correctAnswers":["0"],"pairs":[],"explanation":"ReLU turns negative inputs into zero and leaves positive inputs unchanged.","difficulty":"beginner","transfer":"If ReLU receives 4, what comes out?"},{"id":"auh2_q8","type":"trueFalse","text":"Stacking linear layers without activation functions can behave like one linear layer.","simple":"Can stacked linear layers act like one layer?","options":["True","False"],"correct":"True","correctAnswers":["True"],"pairs":[],"explanation":"Multiply and add, then multiply and add again, is still one multiply and add. Activation functions break that pattern.","difficulty":"beginner","transfer":"Why might adding more linear layers fail to help with a curved pattern?"},{"id":"auh2_q9","type":"explain","text":"Explain in your own words why a neuron needs an activation function.","simple":"Why does a neuron need an activation function?","options":["It decides what signal passes on","It adds nonlinearity","Without it, layers collapse into one simple equation"],"correct":"The activation function decides whether and how strongly a neuron's signal moves forward. It adds nonlinearity, which lets many layers learn complicated patterns instead of collapsing into one straight-line formula.","correctAnswers":["The activation function decides whether and how strongly a neuron's signal moves forward. It adds nonlinearity, which lets many layers learn complicated patterns instead of collapsing into one straight-line formula."],"pairs":[],"explanation":"Strong answers mention both the gate and the nonlinearity.","difficulty":"beginner","transfer":"Explain to a younger student why a network needs bends, using a drawing example."}],"cards":[{"emoji":"⚡","title":"Activation functions","body":"After a neuron adds up its weighted inputs, an activation function decides what signal passes on. It can block, shrink, or pass the value.","funFact":null},{"emoji":"📈","title":"ReLU","body":"ReLU is a common activation function: a positive input passes through unchanged and a negative input becomes zero. It is simple and quick to train.","funFact":null},{"emoji":"🌀","title":"Why nonlinearity matters","body":"Stacking layers that only multiply and add gives one straight-line formula, however many layers you stack. Activation functions add bends, so the network can learn curved patterns like faces or speech.","funFact":null},{"emoji":"🎯","title":"Squashing functions","body":"Sigmoid squeezes any number into 0 to 1, and tanh into -1 to 1. Softmax turns a list of scores into probabilities that add up to 1, useful for picking one of several categories.","funFact":null}]},{"id":"auh_l3","title":"The Training Loop","description":"How a model learns from data, step by step","order":2,"difficulty":"intermediate","questions":[{"id":"auh3_q1","type":"sortOrder","text":"Put the steps of training a neural network in order:","simple":"Put the training steps in order.","options":["Adjust weights to reduce the error","Compare the prediction with the answer","Feed an example through the network","Repeat with the next examples"],"correct":"","correctAnswers":["Feed an example through the network","Compare the prediction with the answer","Adjust weights to reduce the error","Repeat with the next examples"],"pairs":[],"explanation":"Forward pass, loss, backpropagation, repeat. This loop runs thousands or millions of times.","difficulty":"beginner","transfer":"Practising free throws, which of your steps matches each training step?"},{"id":"auh3_q2","type":"multipleChoice","text":"A model predicts 30 degrees; the real answer was 22. Which part turns that gap into a number?","simple":"Which part measures how wrong a prediction was?","options":["The loss function","The forward pass","The learning rate","The activation function"],"correct":"The loss function","correctAnswers":["The loss function"],"pairs":[],"explanation":"The loss function scores how wrong a prediction was. Training tries to make that number smaller.","difficulty":"beginner","transfer":"A teacher marks a quiz out of 10. How is that like a loss score, and how is it different?"},{"id":"auh3_q3","type":"fillInBlank","text":"__________ works backwards from the error to find how each weight should change.","simple":"__________ works backwards from the error to fix weights.","options":["Backpropagation","Forward pass","Data loading","Activation"],"correct":"Backpropagation","correctAnswers":["Backpropagation"],"pairs":[],"explanation":"Backpropagation figures out how much each weight contributed to the error. Then each weight gets nudged the helpful way.","difficulty":"beginner","transfer":"A cake came out flat. How would you work backwards to find which step caused it?"},{"id":"auh3_q4","type":"multipleChoice","text":"A dataset has 10,000 photos and the model has seen each one three times. How many epochs?","simple":"The model saw every photo three times. How many epochs?","options":["Three","One","Ten thousand","Thirty thousand"],"correct":"Three","correctAnswers":["Three"],"pairs":[],"explanation":"An epoch is one full pass through the training data. Three full passes means three epochs, however many photos there are.","difficulty":"intermediate","transfer":"You read a whole study guide twice before an exam. How many epochs is that?"},{"id":"auh3_q5","type":"trueFalse","text":"The learning rate sets how much the weights change after each training step.","simple":"Does the learning rate set the size of each weight change?","options":["True","False"],"correct":"True","correctAnswers":["True"],"pairs":[],"explanation":"A large learning rate makes big adjustments that can overshoot. A small one makes tiny, slow adjustments. Choosing it well matters.","difficulty":"intermediate","transfer":"Turning a shower tap, when do big turns help and when do tiny turns help?"},{"id":"auh3_q6","type":"scenarioJudgment","text":"Loss fell quickly, then stopped improving halfway through training. What is a sensible next step?","simple":"Loss stopped improving. What should you try?","options":["Try a smaller learning rate or more varied data","Increase the loss so training restarts","Remove the loss function to speed things up","Train on the test set until loss falls"],"correct":"Try a smaller learning rate or more varied data","correctAnswers":["Try a smaller learning rate or more varied data"],"pairs":[],"explanation":"A plateau means the current setup has stopped finding improvements. Smaller steps, more varied data, or a different architecture are the usual experiments. Training on the test set would only hide the problem.","difficulty":"advanced","transfer":"Your free-throw accuracy stops improving. What would you change about practice?"},{"id":"auh3_q7","type":"multipleChoice","text":"The loss number goes down each epoch. What does that tell you?","simple":"Loss goes down. What does that mean?","options":["The model makes fewer training errors","The model is running more slowly","The training data is shrinking","The model has finished learning"],"correct":"The model makes fewer training errors","correctAnswers":["The model makes fewer training errors"],"pairs":[],"explanation":"Loss measures how wrong predictions are. Falling loss means the model fits its training data better.","difficulty":"beginner","transfer":"Your spelling test errors drop each week. What would you check to be sure you really learned it?"},{"id":"auh3_q8","type":"trueFalse","text":"A model usually sees the whole training set more than once.","simple":"Does a model see the training data more than once?","options":["True","False"],"correct":"True","correctAnswers":["True"],"pairs":[],"explanation":"Each full pass is an epoch. Models train for many epochs, improving a little each time.","difficulty":"beginner","transfer":"Why might too many passes over the same data cause a problem?"},{"id":"auh3_q9","type":"explain","text":"Explain the training loop to a friend: predict, compare, adjust, repeat.","simple":"Explain the training loop: predict, compare, adjust, repeat.","options":["A forward pass makes a prediction","Loss compares it with the answer","Weights adjust and it repeats"],"correct":"The model makes a prediction on an example, the loss function measures how far off it was, backpropagation adjusts the weights to be a bit less wrong, and this repeats over the data thousands of times.","correctAnswers":["The model makes a prediction on an example, the loss function measures how far off it was, backpropagation adjusts the weights to be a bit less wrong, and this repeats over the data thousands of times."],"pairs":[],"explanation":"Strong answers include all four steps in order.","difficulty":"beginner","transfer":"Describe a skill you practise using the words predict, compare, adjust, repeat."}],"cards":[{"emoji":"🔁","title":"The training loop","body":"Training repeats four steps: make a prediction (the forward pass), measure the error, adjust the weights, and repeat with the next examples. Every trained network went through this loop many times.","funFact":null},{"emoji":"📉","title":"Loss functions","body":"The loss function turns 'how wrong was that?' into one number. Lower is better, so a falling loss means the model is improving on its training data.","funFact":null},{"emoji":"🔄","title":"Backpropagation","body":"Backpropagation works backwards from the error to find how much each weight contributed. That tells training which way to nudge each weight.","funFact":null},{"emoji":"⏱️","title":"Epochs and learning rate","body":"One full pass through the training data is an epoch, and models usually run many. The learning rate sets how big each weight adjustment is.","funFact":null}]},{"id":"auh_l4","title":"Gradient Descent","description":"The downhill search that finds better weights","order":3,"difficulty":"advanced","questions":[{"id":"auh4_q1","type":"multipleChoice","text":"What does gradient descent do during training?","simple":"What does gradient descent do?","options":["Steps downhill on the error landscape repeatedly","Sorts the training data from largest to smallest","Compresses the model so it loads faster","Chooses which layer to train next"],"correct":"Steps downhill on the error landscape repeatedly","correctAnswers":["Steps downhill on the error landscape repeatedly"],"pairs":[],"explanation":"Think of a blindfolded hiker feeling for the downhill direction and stepping that way. The landscape is all possible weights, and height is the error.","difficulty":"beginner","transfer":"How is gradient descent like hiking downhill blindfolded?"},{"id":"auh4_q2","type":"trueFalse","text":"If a weight's gradient is positive, training should decrease that weight.","simple":"Gradient positive means lower the weight. True?","options":["True","False"],"correct":"True","correctAnswers":["True"],"pairs":[],"explanation":"The gradient shows which direction raises the loss. Moving the other way lowers it.","difficulty":"beginner","transfer":"A compass points away from where you want to go. What do you do?"},{"id":"auh4_q3","type":"fillInBlank","text":"Training stopped in a dip that is not the lowest point. It is stuck in a __________ minimum.","simple":"Stuck in a dip that is not lowest: a __________ minimum.","options":["local","global","partial","digital"],"correct":"local","correctAnswers":["local"],"pairs":[],"explanation":"Imagine a valley with a deeper valley hidden behind a hill. Momentum and randomness help training climb out.","difficulty":"beginner","transfer":"Looking for the quietest spot in a park, why might you stop too early?"},{"id":"auh4_q4","type":"multipleChoice","text":"A team wants faster training on ten million examples. Which change makes sense?","simple":"Training is too slow. Which change helps?","options":["Update weights after each small random batch","Check every example before each single step","Set the learning rate to exactly zero","Stop after the first local minimum"],"correct":"Update weights after each small random batch","correctAnswers":["Update weights after each small random batch"],"pairs":[],"explanation":"Stochastic gradient descent uses a mini-batch, often 32 or 64 examples, per step. That is far faster than a full pass, and the randomness helps escape local minimums.","difficulty":"intermediate","transfer":"Studying for a test, why might you review small mixed sets instead of everything every time?"},{"id":"auh4_q5","type":"matchPairs","text":"Match each optimisation idea to the hiking picture:","simple":"Match each idea to the hiking picture.","options":[],"correct":"","correctAnswers":[],"pairs":[{"term":"Gradient","definition":"Which direction is uphill"},{"term":"Learning rate","definition":"How big each step is"},{"term":"Local minimum","definition":"A valley that is not the deepest"},{"term":"Convergence","definition":"Steps stop lowering the error"}],"explanation":"The gradient points uphill so training steps the other way, the learning rate sets step size, local minimums are misleading valleys, and convergence is when steps stop helping.","difficulty":"beginner","transfer":"Describe the hill picture to a friend in your own words."},{"id":"auh4_q6","type":"scenarioJudgment","text":"During training, the loss bounces up and down wildly instead of falling smoothly. What is the likely problem?","simple":"Loss jumps up and down wildly. Likely problem?","options":["The learning rate is too high and overshoots","The training data is too clean","The model has too few parameters","The gradient is pointing downhill"],"correct":"The learning rate is too high and overshoots","correctAnswers":["The learning rate is too high and overshoots"],"pairs":[],"explanation":"Too-big steps jump across the valley floor, so loss swings up and down. Lowering the learning rate usually smooths it.","difficulty":"advanced","transfer":"Steering a bike, what happens when every correction is too big?"},{"id":"auh4_q7","type":"multipleChoice","text":"In gradient descent, which direction does the model step?","simple":"Which way does the model step in gradient descent?","options":["Downhill, toward lower error","Uphill, toward higher error","Sideways, along equal error","Nowhere until training ends"],"correct":"Downhill, toward lower error","correctAnswers":["Downhill, toward lower error"],"pairs":[],"explanation":"The gradient points uphill, so the model steps the opposite way to reduce the loss.","difficulty":"beginner","transfer":"Blindfolded on a hill, how would you find the bottom?"},{"id":"auh4_q8","type":"trueFalse","text":"A very large learning rate can make training overshoot the best answer.","simple":"Can a big learning rate make training overshoot?","options":["True","False"],"correct":"True","correctAnswers":["True"],"pairs":[],"explanation":"Big steps jump past the valley floor. Smaller steps settle in, but take longer.","difficulty":"beginner","transfer":"What sign in a loss graph would show overshooting?"},{"id":"auh4_q9","type":"explain","text":"Explain gradient descent using the hill analogy.","simple":"Explain gradient descent using a hill.","options":["Loss is a landscape","The gradient shows which way is uphill, so step the other way","Step size is the learning rate"],"correct":"Imagine the error as a hilly landscape and the model as a blindfolded hiker. The gradient says which way is uphill, the hiker steps the other way, and the step size is the learning rate. Repeating this reaches a valley of low error.","correctAnswers":["Imagine the error as a hilly landscape and the model as a blindfolded hiker. The gradient says which way is uphill, the hiker steps the other way, and the step size is the learning rate. Repeating this reaches a valley of low error."],"pairs":[],"explanation":"Strong answers map each part of the analogy to a real term.","difficulty":"beginner","transfer":"Explain the hill idea using a game where you search for something hidden."}],"cards":[{"emoji":"⛰️","title":"Gradient descent","body":"Picture every possible set of weights as a hilly landscape where height is the error. Gradient descent steps downhill again and again, looking for a low point.","funFact":null},{"emoji":"🧭","title":"The gradient","body":"The gradient is the slope: it points toward higher error. Training steps the opposite way, and the learning rate sets the step size.","funFact":null},{"emoji":"🕳️","title":"Local minimums","body":"A local minimum is a dip that is not the lowest point on the landscape. Training can get stuck there, so methods add momentum or randomness to keep moving.","funFact":null},{"emoji":"🎲","title":"Mini-batches and convergence","body":"Checking all the training data before each step is slow. Stochastic gradient descent uses a small random batch each step, which is faster and adds helpful noise. Convergence is when further steps stop lowering the loss.","funFact":null}]},{"id":"auh_l5","title":"Overfitting & Generalization","description":"Why a model that memorises its textbook fails the real test","order":4,"difficulty":"intermediate","questions":[{"id":"auh5_q1","type":"multipleChoice","text":"A model scores 99 percent on training data but 50 percent on new data. What is happening?","simple":"99 percent on training, 50 percent on new data. What happened?","options":["Overfitting: it memorised instead of generalising","Underfitting: it is too simple to learn","Data drift: the world changed after training","Convergence: training finished successfully"],"correct":"Overfitting: it memorised instead of generalising","correctAnswers":["Overfitting: it memorised instead of generalising"],"pairs":[],"explanation":"A huge gap between training and new-data scores is the classic sign of overfitting. The model learned quirks and noise, not the general pattern.","difficulty":"beginner","transfer":"A friend can only answer the exact practice questions. What kind of learning happened?"},{"id":"auh5_q2","type":"trueFalse","text":"A team tests its model on the same data it trained on. That test can reveal overfitting.","simple":"Testing on the training data reveals overfitting. True?","options":["True","False"],"correct":"False","correctAnswers":["False"],"pairs":[],"explanation":"Testing on training data shows memory, not learning. You need a held-out test set to see how the model handles new examples.","difficulty":"beginner","transfer":"Why is practising with the real exam paper a poor way to check learning?"},{"id":"auh5_q3","type":"fillInBlank","text":"__________ switches off random neurons during training so no single path is relied on.","simple":"__________ turns off random neurons during training.","options":["Dropout","Backprop","Softmax","Gradient"],"correct":"Dropout","correctAnswers":["Dropout"],"pairs":[],"explanation":"Dropout deactivates a share of neurons each step. The network builds backup routes, like a team that practises with players benched.","difficulty":"beginner","transfer":"How would a band get stronger by practising with a different member missing each time?"},{"id":"auh5_q4","type":"matchPairs","text":"Match each concept to its definition:","simple":"Match each word to its meaning.","options":[],"correct":"","correctAnswers":[],"pairs":[{"term":"Overfitting","definition":"Memorising training data, failing on new data"},{"term":"Underfitting","definition":"Too simple to learn the patterns"},{"term":"Generalization","definition":"Working well on data never seen before"},{"term":"Regularization","definition":"Techniques that discourage memorising"}],"explanation":"The goal is generalization. Overfitting and underfitting are the two extremes, and regularization techniques like dropout keep a model between them.","difficulty":"beginner","transfer":"Which of these four would you check first if a model fails in real life?"},{"id":"auh5_q5","type":"multipleChoice","text":"A team has 500 dog photos and worries about overfitting. Which option stretches the data?","simple":"Only 500 dog photos. Which option makes more training examples?","options":["Flip, rotate and recolour the photos","Delete the blurry photos","Compress the photos to save space","Encrypt the photos for privacy"],"correct":"Flip, rotate and recolour the photos","correctAnswers":["Flip, rotate and recolour the photos"],"pairs":[],"explanation":"Data augmentation turns one image into many varied ones. The model then learns dogs regardless of angle or lighting.","difficulty":"intermediate","transfer":"How could you make more practice problems from one maths worksheet?"},{"id":"auh5_q6","type":"scenarioJudgment","text":"Cat photos were all indoors, dog photos all outdoors. The model aces training but fails elsewhere. Why?","simple":"Cats indoors, dogs outdoors. Model fails on new photos. Why?","options":["It learned backgrounds, not animals","It needs more layers to see fur","Its learning rate was set too low","Its test set had too many cats"],"correct":"It learned backgrounds, not animals","correctAnswers":["It learned backgrounds, not animals"],"pairs":[],"explanation":"This is shortcut learning: the model found a giveaway that worked on training data but not in general. Varied training data and testing on diverse examples catch it.","difficulty":"advanced","transfer":"A quiz where every true answer is option A. What shortcut might you learn, and what breaks it?"},{"id":"auh5_q7","type":"multipleChoice","text":"A model aces its practice questions but fails the real test. This is:","simple":"Great on practice, bad on the test. What is this?","options":["Overfitting","Generalising","Dropout","Inference"],"correct":"Overfitting","correctAnswers":["Overfitting"],"pairs":[],"explanation":"Overfitting means the model memorised its training data instead of learning patterns that work on new data.","difficulty":"beginner","transfer":"How is this like a student who memorises answer keys?"},{"id":"auh5_q8","type":"trueFalse","text":"A hidden test set that training did not use helps you spot overfitting.","simple":"Does a hidden test set help spot overfitting?","options":["True","False"],"correct":"True","correctAnswers":["True"],"pairs":[],"explanation":"If the model scores well on training data but poorly on unseen test data, it overfit.","difficulty":"beginner","transfer":"Why must the test data stay hidden during training?"},{"id":"auh5_q9","type":"explain","text":"Explain what generalisation means and why it is the real goal.","simple":"What is generalisation, and why is it the real goal?","options":["Working well on new, unseen data","Memorising training data is not enough","Real use is new data"],"correct":"Generalisation is when a model does well on data it has never seen. That is the real goal because in real use every input is new, so memorising the training set is worthless if it does not transfer.","correctAnswers":["Generalisation is when a model does well on data it has never seen. That is the real goal because in real use every input is new, so memorising the training set is worthless if it does not transfer."],"pairs":[],"explanation":"Strong answers connect the definition to real-world use.","difficulty":"beginner","transfer":"Describe a skill where practice examples differed from the real situation. What helped it transfer?"}],"cards":[{"emoji":"📚","title":"Overfitting and underfitting","body":"Overfitting is when a model memorises its training examples, noise included, and then fails on new ones. Underfitting is the opposite: too simple to learn the pattern at all.","funFact":null},{"emoji":"🧪","title":"Three sets","body":"Teams split data into a training set to learn from, a validation set to check progress, and a test set kept hidden until the end. A big gap between training and test scores signals overfitting.","funFact":null},{"emoji":"🎲","title":"Regularization and dropout","body":"Regularization is any technique that discourages memorising. Dropout switches off random neurons during each training step so the network cannot lean on one path.","funFact":null},{"emoji":"🔀","title":"Augmentation and shortcuts","body":"Data augmentation flips, rotates or recolours training images so one photo becomes many. It also fights shortcut learning, where a model picks up a giveaway like the background instead of the object.","funFact":null}]},{"id":"auh_l6","title":"Building a Real Model","description":"From raw data to a working model, and what happens after launch","order":5,"difficulty":"advanced","questions":[{"id":"auh6_q1","type":"sortOrder","text":"Put the steps of building a model in order:","simple":"Put the model-building steps in order.","options":["Deploy the model for real users","Train the model and tune hyperparameters","Collect and clean your dataset","Evaluate on test data and fix problems"],"correct":"","correctAnswers":["Collect and clean your dataset","Train the model and tune hyperparameters","Evaluate on test data and fix problems","Deploy the model for real users"],"pairs":[],"explanation":"Data preparation, training, evaluation, deployment. In practice teams cycle back through these steps many times.","difficulty":"beginner","transfer":"Planning a science fair project, which steps match collect, train, evaluate, deploy?"},{"id":"auh6_q2","type":"multipleChoice","text":"A team's survey data has missing answers, duplicates and typos. Which step handles this?","simple":"Data has gaps and typos. Which step fixes it?","options":["Cleaning the data","Tuning the learning rate","Choosing an activation function","Deploying to users"],"correct":"Cleaning the data","correctAnswers":["Cleaning the data"],"pairs":[],"explanation":"Cleaning data means fixing gaps, removing duplicates and checking labels. It is often the biggest job in the project.","difficulty":"beginner","transfer":"What messy-data problems might a school attendance sheet have?"},{"id":"auh6_q3","type":"fillInBlank","text":"Learning rate and batch size are __________, settings chosen before training starts.","simple":"Learning rate and batch size are __________.","options":["hyperparameters","outputs","labels","gradients"],"correct":"hyperparameters","correctAnswers":["hyperparameters"],"pairs":[],"explanation":"Hyperparameters are set by people, not learned. Weights are learned; hyperparameters shape how that learning runs.","difficulty":"beginner","transfer":"Before a study session you choose its length and break timing. How are those like hyperparameters?"},{"id":"auh6_q4","type":"trueFalse","text":"A team with 300 X-ray images starts from a model trained on everyday photos. This is transfer learning.","simple":"Starting from a photo model for X-rays is transfer learning?","options":["True","False"],"correct":"True","correctAnswers":["True"],"pairs":[],"explanation":"Transfer learning reuses features learned on one task for another. It needs less data, though the new model still needs its own testing, and medical results still need a professional.","difficulty":"intermediate","transfer":"Which skills transfer from one sport to a new one, and which do not?"},{"id":"auh6_q5","type":"multipleChoice","text":"A confusion matrix shows 'cat' predicted as 'dog' 40 times but as 'bird' twice. What did you learn?","simple":"Cats called dogs 40 times, birds twice. What does that show?","options":["Which categories get mixed up","How quickly the model responds","How many parameters it holds","Which training epoch went wrong"],"correct":"Which categories get mixed up","correctAnswers":["Which categories get mixed up"],"pairs":[],"explanation":"A confusion matrix breaks accuracy into specific mistakes. Here cats and dogs need attention, not birds.","difficulty":"intermediate","transfer":"You keep confusing two similar words on spelling tests. What would a table of your errors show?"},{"id":"auh6_q6","type":"scenarioJudgment","text":"Your model worked well in testing, but accuracy drops with real users months later. What happened?","simple":"Good in testing, worse with real users later. Why?","options":["Real inputs drifted from the training data","The server ran out of memory overnight","Users typed much faster than expected","The test set was larger than needed"],"correct":"Real inputs drifted from the training data","correctAnswers":["Real inputs drifted from the training data"],"pairs":[],"explanation":"Data drift means the world changed in ways training data did not capture. Slang, prices, fashions and habits all shift. Deployed models need monitoring and retraining.","difficulty":"advanced","transfer":"How could a music recommender drift over two years?"},{"id":"auh6_q7","type":"multipleChoice","text":"A model trained on summer photos is used in winter and accuracy falls. What should the team do first?","simple":"Summer-trained model fails in winter. First step?","options":["Compare new inputs with the training data","Raise the learning rate for the model","Retire the confusion matrix from reports","Delete every photo taken in summer"],"correct":"Compare new inputs with the training data","correctAnswers":["Compare new inputs with the training data"],"pairs":[],"explanation":"Start by checking whether inputs drifted. Then collect winter examples and retrain.","difficulty":"beginner","transfer":"Your bike route changes because of roadworks. What do you check before adjusting your plan?"},{"id":"auh6_q8","type":"trueFalse","text":"A model that worked in testing can still fail later as the real world changes.","simple":"Can a good model fail later when the world changes?","options":["True","False"],"correct":"True","correctAnswers":["True"],"pairs":[],"explanation":"Data drift means new inputs stop matching training data. Deployed models need monitoring and retraining.","difficulty":"beginner","transfer":"What might change at a school over a year that a timetable model would miss?"},{"id":"auh6_q9","type":"explain","text":"Explain why a team should keep monitoring a model after it is launched.","simple":"Why keep watching a model after launch?","options":["Real data changes over time","Errors appear in new situations","Monitoring triggers retraining"],"correct":"The real world keeps changing, so inputs slowly stop matching the training data and the model's errors grow. Monitoring catches that drift early so the team can retrain before users are affected.","correctAnswers":["The real world keeps changing, so inputs slowly stop matching the training data and the model's errors grow. Monitoring catches that drift early so the team can retrain before users are affected."],"pairs":[],"explanation":"Strong answers name drift and what monitoring leads to.","difficulty":"beginner","transfer":"Name something you would keep checking after finishing a project, and why."}],"cards":[{"emoji":"🧹","title":"Data first","body":"Building a model starts with collecting and cleaning data: fixing missing values, removing duplicates, checking labels. Teams often report that this takes most of the project's time.","funFact":null},{"emoji":"🎛️","title":"Hyperparameters","body":"Hyperparameters are settings chosen before training, such as the learning rate, batch size and number of layers. The model does not learn them; people tune them by experiment.","funFact":null},{"emoji":"🔁","title":"Transfer learning","body":"Transfer learning adapts a model trained on one task to a related one. It saves data and time, but the adapted model still needs its own testing.","funFact":null},{"emoji":"🧮","title":"Confusion matrix","body":"A confusion matrix is a table showing, for each true category, what the model predicted. It reveals which pairs get mixed up, such as small dogs and cats.","funFact":null},{"emoji":"📡","title":"Drift and monitoring","body":"Data drift is when real-world inputs stop matching the training data, so accuracy slides. Monitoring after launch catches drift early so the team can retrain.","funFact":null}]}],"bigIdeas":["representationReasoning","learning"]},{"id":"ai_safety_you","name":"Engaging Safely with AI","icon":"shield.fill","color":"aiRed","description":"Stay safe, stay smart, stay human. Learn to navigate AI with confidence","order":3,"unlock":{"kind":"completeCategory","value":"ai_under_hood"},"lessons":[{"id":"asy_l1","title":"Don't Overshare with AI","description":"What to keep out of an AI chat","order":0,"difficulty":"beginner","questions":[{"id":"asy1_q1","type":"multipleChoice","text":"When you type something into an AI chatbot, what could happen to that information?","simple":"What might happen to words you type into an AI chatbot?","options":["They may be stored or reviewed","They always disappear right away","Only you can ever see them","They cannot leave your device"],"correct":"They may be stored or reviewed","correctAnswers":["They may be stored or reviewed"],"pairs":[],"explanation":"Some AI services store conversations, use them to improve systems, or let trained reviewers inspect them. Treat a chatbot like a public space and keep private details out.","difficulty":"beginner","transfer":"A homework app asks for your full name and school. What would you do?"},{"id":"asy1_q2","type":"trueFalse","text":"Sharing your home address, phone number, and passwords with an AI chatbot is safe.","simple":"Is it safe to tell a chatbot your address or password?","options":["True","False"],"correct":"False","correctAnswers":["False"],"pairs":[],"explanation":"Keep addresses, phone numbers, passwords, identity numbers, and payment details private. A service can be breached, or a conversation can be seen by someone else.","difficulty":"beginner","transfer":"A quiz app offers a prize if you enter your phone number. What would you do?"},{"id":"asy1_q3","type":"sortOrder","text":"Rank these from safest to most risky to share with an AI chatbot:","simple":"Put these in order from safest to riskiest to share.","options":["Your credit card number","Your government identity number","A general homework question","Your full name and schoo
