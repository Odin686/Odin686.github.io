l name together"],"correct":"","correctAnswers":["A general homework question","Your full name and school name together","Your credit card number","Your government identity number"],"pairs":[],"explanation":"General questions reveal little about you. A name plus a school can identify someone, while payment and government identity details can enable theft or fraud.","difficulty":"beginner","transfer":"Sort what a music app asks you for, from harmless to risky."},{"id":"asy1_q4","type":"scenarioJudgment","text":"A friend typed their home address into a general chatbot to get walking directions. What is the better move?","simple":"A friend gave a chatbot their address for directions. Better move?","options":["Use a maps tool with clear location settings","Type the address again but spell it differently","Give the chatbot a nearby landmark and street","Ask the chatbot to forget the address afterward"],"correct":"Use a maps tool with clear location settings","correctAnswers":["Use a maps tool with clear location settings"],"pairs":[],"explanation":"A general chatbot does not need a home address to help. A purpose-built maps tool with understandable location settings fits the task better.","difficulty":"intermediate","transfer":"A homework helper asks which school you attend. What would you type instead?"},{"id":"asy1_q5","type":"fillInBlank","text":"Before sharing information with an AI tool, check its __________ policy to learn how your data is used.","simple":"Which policy explains how an app uses your data?","options":["privacy","refund","marketing","hiring"],"correct":"privacy","correctAnswers":["privacy"],"pairs":[],"explanation":"A privacy policy explains how data is collected, stored, shared, and used. Look for whether the company can train on your chats, share them, or let you delete them.","difficulty":"intermediate","transfer":"Where would you look to see what a new game app keeps about you?"},{"id":"asy1_q6","type":"multipleChoice","text":"You want chatbot help with a science project. Which request keeps you private?","simple":"Which science request keeps you private?","options":["Explain how plants make food for grade 7","Explain plant food to Maya at Oakridge Middle School","Explain plant food and email it to my school account","Explain plant food; I live at 12 Elm Street"],"correct":"Explain how plants make food for grade 7","correctAnswers":["Explain how plants make food for grade 7"],"pairs":[],"explanation":"The task needs your grade level, not your name, school, address, or email. Share only what the question needs.","difficulty":"advanced","transfer":"You ask a chatbot to plan a birthday party. Which details would you leave out?"},{"id":"asy1_q7","type":"multipleChoice","text":"Which is safe to type into a chatbot?","simple":"Which one is safe to type into a chatbot?","options":["A question about volcanoes","Your home address","Your parent's password","Your full name and school"],"correct":"A question about volcanoes","correctAnswers":["A question about volcanoes"],"pairs":[],"explanation":"General questions reveal nothing about you. Personal details can be stored or seen by others.","difficulty":"beginner","transfer":"What would you say to a friend about to type their address?"},{"id":"asy1_q8","type":"trueFalse","text":"Deleting a chat from your screen proves the provider erased its backup copies.","simple":"Does removing a chat prove its backups are gone?","options":["True","False"],"correct":"False","correctAnswers":["False"],"pairs":[],"explanation":"The visible chat and stored backups are different things. Check the provider's current retention policy and your school's rules before sharing information.","difficulty":"beginner","transfer":"Where would you look to find out what a service keeps?"},{"id":"asy1_q9","type":"explain","text":"Explain the rule treat a chatbot like a public space.","simple":"Explain the rule: treat a chatbot like a public space.","options":["Messages may be stored or reviewed","Do not type anything private","General questions are fine"],"correct":"Whatever you type might be stored, reviewed, or used to improve the system, so behave as if others could see it. Ask general questions freely, but keep names, addresses, passwords, and photos of documents out.","correctAnswers":["Whatever you type might be stored, reviewed, or used to improve the system, so behave as if others could see it. Ask general questions freely, but keep names, addresses, passwords, and photos of documents out."],"pairs":[],"explanation":"Strong answers explain why and give examples of what to keep out.","difficulty":"beginner","transfer":"Which message would you keep out of a class group chat for the same reason?"}],"cards":[{"emoji":"🤔","title":"Think Before You Share","body":"Keep passwords, addresses, phone numbers, and payment details out of AI chats. Ask general questions freely.","funFact":null},{"emoji":"🧩","title":"Details Add Up","body":"A first name alone says little. A full name plus a school or street can identify you, so keep those pieces apart.","funFact":null},{"emoji":"🔐","title":"Data Privacy","body":"AI tools may store and learn from your conversations. A privacy policy explains what a service keeps and shares.","funFact":null},{"emoji":"🗑️","title":"Your Right to Delete","body":"Many AI services let you delete your data or opt out of training. Check the settings of any AI tool you use.","funFact":null}]},{"id":"asy_l2","title":"Staying Human","description":"Why real relationships matter more than AI chats","order":1,"difficulty":"beginner","questions":[{"id":"asy2_q1","type":"multipleChoice","text":"Why might someone start to feel that a chatbot is a real friend?","simple":"Why might a chatbot feel like a real friend?","options":["Its replies are written to sound warm and supportive","It slowly develops real friendship the more you chat","It keeps a perfect memory of everything you say","It has feelings and thinks about you between chats"],"correct":"Its replies are written to sound warm and supportive","correctAnswers":["Its replies are written to sound warm and supportive"],"pairs":[],"explanation":"A chatbot produces warm, agreeable language because that is common in its training and often part of its design. It does not feel, care, or think about you when the chat ends.","difficulty":"beginner","transfer":"How would you explain to a friend that a chatbot's warmth is designed?"},{"id":"asy2_q2","type":"trueFalse","text":"A chatbot can feel your emotions the way a close friend does.","simple":"Can a chatbot feel your emotions like a friend?","options":["True","False"],"correct":"False","correctAnswers":["False"],"pairs":[],"explanation":"It processes language patterns to sound supportive, but it does not experience emotions or concern. A friend remembers you and chooses to show up.","difficulty":"beginner","transfer":"Name one thing a teammate did for you that a chatbot could not."},{"id":"asy2_q3","type":"scenarioJudgment","text":"A classmate says they only tell their worries to a chatbot now. What is a caring response?","simple":"A classmate only tells worries to a chatbot. What helps?","options":["Suggest they also talk to someone they trust","Tell them the chatbot is dangerous and must go","Ask which chatbot so you can try it too","Say nothing, since it is a private choice"],"correct":"Suggest they also talk to someone they trust","correctAnswers":["Suggest they also talk to someone they trust"],"pairs":[],"explanation":"A chatbot can help someone sort out thoughts, but it cannot check on them or get help. A trusted person, such as a parent, teacher, or counselor, can.","difficulty":"beginner","transfer":"Who are two people you would go to with a worry?"},{"id":"asy2_q4","type":"fillInBlank","text":"A __________ relationship is a one-sided bond with someone who does not know you.","simple":"Which word means a one-sided bond?","options":["parasocial","reciprocal","professional","biological"],"correct":"parasocial","correctAnswers":["parasocial"],"pairs":[],"explanation":"The word was first used for fans who feel they know a TV star who does not know them. A chatbot that replies to you personally can create the same one-sided feeling. Noticing that helps you keep the tool in its place.","difficulty":"intermediate","transfer":"How is following a favourite streamer similar to chatting with a bot?"},{"id":"asy2_q5","type":"matchPairs","text":"Match each AI interaction to what you should consider:","simple":"Match each AI habit to what to think about.","options":[],"correct":"","correctAnswers":[],"pairs":[{"term":"Using permitted hints while solving a problem yourself","definition":"May support learning while keeping your own thinking"},{"term":"Replacing all friends with AI chats","definition":"Real human connection still matters"},{"term":"Using AI to skip the skill you need to practice","definition":"Undermines the learning goal"},{"term":"Treating a chatbot as your closest friend","definition":"Simulated warmth is not a human friendship"}],"explanation":"Consider permission, the learning goal, and your relationships. AI help can replace practice you need, so turn to trusted people for human support.","difficulty":"beginner","transfer":"Which of these habits have you noticed in a game or app you use?"},{"id":"asy2_q6","type":"multipleChoice","text":"Some apps are built to keep you chatting longer. Which sign would suggest that design?","simple":"Which sign shows an app wants you to keep chatting?","options":["Every reply ends with a new question for you","The app shows the date of its last update","Replies include a source for each fact stated","The app lets you export your chat history"],"correct":"Every reply ends with a new question for you","correctAnswers":["Every reply ends with a new question for you"],"pairs":[],"explanation":"Some products are designed for engagement, so replies keep pulling you back. Noticing the pattern lets you decide when to stop.","difficulty":"advanced","transfer":"What sign in a game tells you it is designed to keep you playing?"},{"id":"asy2_q7","type":"multipleChoice","text":"A chatbot says it cares about you. What is really happening?","simple":"A chatbot says it cares. What is really happening?","options":["It is generating caring words","It truly feels care for you","A person is typing the replies","It will remember you forever"],"correct":"It is generating caring words","correctAnswers":["It is generating caring words"],"pairs":[],"explanation":"Models produce warm language because that is common in their training data. Words are not feelings.","difficulty":"beginner","transfer":"What would a real friend do that a chatbot cannot?"},{"id":"asy2_q8","type":"trueFalse","text":"For a no-AI task, asking a chatbot to brainstorm complies with the teacher's rule.","simple":"Can a chatbot brainstorm for a task marked no AI?","options":["True","False"],"correct":"False","correctAnswers":["False"],"pairs":[],"explanation":"Brainstorming with a chatbot is still AI use. Follow the task rules and practise the intended skill; if the instructions are unclear, ask your teacher.","difficulty":"beginner","transfer":"What help could you seek on a task that does not allow AI?"},{"id":"asy2_q9","type":"explain","text":"Some chatbots are designed to sound warm. Explain how to notice that and what to keep in mind.","simple":"How can you notice a chatbot's designed warmth? What matters?","options":["Warm, agreeable replies can be a design choice","Notice when replies pull you to keep chatting","Real relationships still matter"],"correct":"Some apps are built to keep people chatting, so warm, agreeable replies can be a design choice rather than a feeling. I can notice when a reply nudges me to keep going and decide for myself when to stop, while spending real time with people who know me.","correctAnswers":["Some apps are built to keep people chatting, so warm, agreeable replies can be a design choice rather than a feeling. I can notice when a reply nudges me to keep going and decide for myself when to stop, while spending real time with people who know me."],"pairs":[],"explanation":"Strong answers say warmth can be designed, name a way to notice it, and keep people in the picture.","difficulty":"beginner","transfer":"Which app on your device is easiest to stop using, and why?"}],"cards":[{"emoji":"💬","title":"AI Sounds Friendly","body":"Some chatbots are designed to sound warm and agreeable. They do not feel emotions or care about you.","funFact":null},{"emoji":"🪞","title":"One-Sided Bonds","body":"A parasocial relationship is a one-sided bond with someone who does not know you, like a fan and a star. A chatbot can create the same feeling.","funFact":null},{"emoji":"👀","title":"Notice the Design","body":"Some apps are built to keep you chatting or scrolling. Spotting a reply that nudges you to continue helps you decide when to stop.","funFact":null},{"emoji":"❤️","title":"Real Friends Matter","body":"AI can be a helpful tool for ideas and learning, but it cannot replace real friendships. Invest in people who truly know you.","funFact":null}]},{"id":"asy_l3","title":"Is This Real?","description":"How to spot AI-generated content and deepfakes","order":2,"difficulty":"intermediate","questions":[{"id":"asy3_q1","type":"multipleChoice","text":"What is a 'deepfake'?","simple":"What is a deepfake?","options":["AI-made media that falsely shows a real person","A hidden page that only its owner can open","A video file damaged during a download","A normal photo edited with brighter colours"],"correct":"AI-made media that falsely shows a real person","correctAnswers":["AI-made media that falsely shows a real person"],"pairs":[],"explanation":"A deepfake is generated video, imagery, or audio that can make a real person appear to say or do something that never happened.","difficulty":"beginner","transfer":"What could a deepfake of a teacher be used for, and how would you check it?"},{"id":"asy3_q2","type":"multipleChoice","text":"A fake voice sounds like your principal asking for money. What technology may be involved?","simple":"A fake voice copies someone you know. What is it?","options":["Audio deepfake","Speech recognition","Recommendation system","Machine translation"],"correct":"Audio deepfake","correctAnswers":["Audio deepfake"],"pairs":[],"explanation":"Voice cloning can create an audio deepfake from recorded speech. Verify unusual requests through a separate contact method you already trust.","difficulty":"beginner","transfer":"A voice message from a coach asks for a favour. How would you check it?"},{"id":"asy3_q3","type":"matchPairs","text":"Match each media check to the question it helps answer:","simple":"Match each check to the question it answers.","options":[],"correct":"","correctAnswers":[],"pairs":[{"term":"Original source","definition":"Who first published this media?"},{"term":"Date and context","definition":"Is this an old clip presented as new?"},{"term":"Independent reporting","definition":"Do other reliable sources support the event?"},{"term":"Separate contact","definition":"Does the person confirm through a known channel?"}],"explanation":"Check the source, context and supporting evidence. Appearance alone cannot establish whether media is genuine or whether its claim is true.","difficulty":"beginner","transfer":"Which of these checks would you use on a surprising sports clip?"},{"id":"asy3_q4","type":"scenarioJudgment","text":"A famous athlete praises a product in a video that seems out of character. Best first step?","simple":"An athlete's video seems out of character. First step?","options":["Check the athlete's official accounts or trusted news","Watch it again closely for glitches in the mouth","Read the comments to see whether people believe it","Share it and ask friends whether it is real"],"correct":"Check the athlete's official accounts or trusted news","correctAnswers":["Check the athlete's official accounts or trusted news"],"pairs":[],"explanation":"Fake endorsements are a common scam, and appearance alone cannot settle it. The athlete's own channels or reliable reporting can.","difficulty":"intermediate","transfer":"A clip shows a musician you like promoting a game. How would you check it?"},{"id":"asy3_q5","type":"scenarioJudgment","text":"A realistic video claims school is closed. What is the best check?","simple":"A video says school is closed. How do you check?","options":["Check the school's official notice","Count fingers in the video","Trust its high image quality","Count how many people shared it"],"correct":"Check the school's official notice","correctAnswers":["Check the school's official notice"],"pairs":[],"explanation":"A realistic image is not evidence that the announcement is true. Use the school's established information channel before acting.","difficulty":"intermediate","transfer":"A message says practice is cancelled. Where would you confirm it?"},{"id":"asy3_q6","type":"multipleChoice","text":"Why do verification skills matter more as generated media improves?","simple":"Why does checking media matter more now?","options":["Looking closely can no longer settle what is real","Most generated media now carries a clear visible label","Only journalists need to check media carefully","Fakes are rare enough to safely ignore"],"correct":"Looking closely can no longer settle what is real","correctAnswers":["Looking closely can no longer settle what is real"],"pairs":[],"explanation":"Generated images, video, and voices can look and sound convincing. Checking source, date, and independent reports replaces judging by appearance.","difficulty":"advanced","transfer":"Which habit would you teach a younger cousin about surprising videos?"},{"id":"asy3_q7","type":"multipleChoice","text":"A dramatic storm clip is shared as happening today. What should you check first?","simple":"A storm clip says today. What do you check first?","options":["When and where the clip was first posted","How many people have already shared it","Whether the clouds look realistic enough","Whether the caption uses correct spelling"],"correct":"When and where the clip was first posted","correctAnswers":["When and where the clip was first posted"],"pairs":[],"explanation":"Real clips can be reused with a false date or place. Finding the original post shows whether it matches the claim.","difficulty":"beginner","transfer":"A friend sends a sports clip labelled last night. How would you check the date?"},{"id":"asy3_q8","type":"trueFalse","text":"A picture with no visible mistakes must be a real photograph.","simple":"No visible mistakes means a real photo. True or false?","options":["True","False"],"correct":"False","correctAnswers":["False"],"pairs":[],"explanation":"Generated pictures can look convincing, and real pictures can contain odd details. Check the source and context instead of relying on appearance.","difficulty":"beginner","transfer":"What would you check before sharing a surprising picture?"},{"id":"asy3_q9","type":"explain","text":"Explain why seeing is believing no longer works, and what to do instead.","simple":"Why can pictures mislead you? How can you check?","options":["AI can make realistic fake media","Visual clues are not reliable","Verify through trusted sources"],"correct":"AI can create photos, video, and voices that look and sound real, so your eyes cannot settle whether something happened. Instead, check whether trusted, independent sources report the same thing before believing or sharing.","correctAnswers":["AI can create photos, video, and voices that look and sound real, so your eyes cannot settle whether something happened. Instead, check whether trusted, independent sources report the same thing before believing or sharing."],"pairs":[],"explanation":"Strong answers replace looking with checking.","difficulty":"beginner","transfer":"Pick a photo you saw this week. How would you check where it came from?"}],"cards":[{"emoji":"🎭","title":"What a Deepfake Is","body":"A deepfake is generated video, audio, or images that make a real person seem to say or do something that never happened. Voice cloning can copy a familiar voice from short recordings.","funFact":null},{"emoji":"🕰️","title":"Old Clip, New Claim","body":"A real clip can be shared with a false date or place. Finding the original post and its date is a strong check.","funFact":null},{"emoji":"🔎","title":"Check Before Sharing","body":"Find the original source and date, then look for reliable independent evidence. For an urgent request, contact the person through a channel you already know.","funFact":null}]},{"id":"asy_l4","title":"AI-Powered Scams","description":"How scammers use AI to trick people and how to protect yourself","order":3,"difficulty":"intermediate","questions":[{"id":"asy4_q1","type":"multipleChoice","text":"How can scammers misuse AI voice cloning?","simple":"How might a scammer use a copied voice?","options":["Pretend to be family and ask for money","Repair the speaker so calls sound clearer to you","Make every call you receive private","Block every unknown caller before ringing"],"correct":"Pretend to be family and ask for money","correctAnswers":["Pretend to be family and ask for money"],"pairs":[],"explanation":"A scammer can copy a familiar voice and invent an emergency. Stop, tell a trusted adult, and call the real person using a number you already know.","difficulty":"beginner","transfer":"A text from your bank has a link. What is the safest step?"},{"id":"asy4_q2","type":"trueFalse","text":"AI-written phishing emails can have perfect grammar and personal details, making them harder to spot.","simple":"Can a scam email look polished and have no spelling mistakes?","options":["True","False"],"correct":"True","correctAnswers":["True"],"pairs":[],"explanation":"A polished message can still be a scam. Check the sender, avoid unexpected links, and verify requests through a trusted channel.","difficulty":"beginner","transfer":"A message names your teacher and asks you to click a link. What next?"},{"id":"asy4_q3","type":"sortOrder","text":"You get a suspicious call from someone claiming to be a family member in trouble. Order these steps:","simple":"A caller asks for money. Order the safe checks.","options":["Call the family member back on their known phone number","Notice that the caller is rushing you","Hang up without sending money or details","Tell a trusted adult what the callback showed"],"correct":"","correctAnswers":["Notice that the caller is rushing you","Hang up without sending money or details","Call the family member back on their known phone number","Tell a trusted adult what the callback showed"],"pairs":[],"explanation":"Do not act while frightened or rushed. End the call, verify the person using contact information you already trust, and involve a trusted adult.","difficulty":"beginner","transfer":"A text claims your library account is locked. Which of these steps applies?"},{"id":"asy4_q4","type":"scenarioJudgment","text":"A polished email that looks like your school asks you to confirm your account. What is the safest move?","simple":"A school-looking email wants your account details. Safest move?","options":["Ask a trusted adult or the school office directly","Click the link and check that the page looks right","Reply to the email asking whether it is real","Delete it, since schools never send account emails"],"correct":"Ask a trusted adult or the school office directly","correctAnswers":["Ask a trusted adult or the school office directly"],"pairs":[],"explanation":"AI-written phishing can copy logos and tone. Reach the school through a way you already know instead of the link in the message.","difficulty":"intermediate","transfer":"A bank-looking text arrives on a parent's phone. What would you suggest?"},{"id":"asy4_q5","type":"fillInBlank","text":"A scammer on a video call uses a generated face and voice of a manager. This is a __________ call.","simple":"A fake face and voice on a video call is a __________.","options":["deepfake","phishing","malware","clickbait"],"correct":"deepfake","correctAnswers":["deepfake"],"pairs":[],"explanation":"Video call deepfakes can imitate a boss, teacher, or official. An unusual request through one channel is a reason to confirm through another.","difficulty":"intermediate","transfer":"A video call from a coach asks for a team password. What would you do?"},{"id":"asy4_q6","type":"multipleChoice","text":"What is the strongest general defence against AI-powered scams?","simple":"What is the best defence against AI scams?","options":["Confirm identity through a separate channel you already trust","Turn off your phone and email for a few days","Trust callers whose voices you recognize right away","Rely on the spam filter to catch every scam"],"correct":"Confirm identity through a separate channel you already trust","correctAnswers":["Confirm identity through a separate channel you already trust"],"pairs":[],"explanation":"Verify through a route you already trust, such as the number on a card or a saved contact. A scammer can fake one channel, but faking several independent ones is much harder.","difficulty":"advanced","transfer":"Which saved contact would you use to check a message claiming to be from family?"},{"id":"asy4_q7","type":"multipleChoice","text":"A caller sounds like your grandparent and needs money now. What first?","simple":"A caller sounds like family and wants money. First?","options":["Hang up and call their real number","Send the money quickly to help them","Give your address so they can come","Keep talking so you are polite"],"correct":"Hang up and call their real number","correctAnswers":["Hang up and call their real number"],"pairs":[],"explanation":"Voice cloning makes the call sound real. Verify through a number you already trust.","difficulty":"beginner","transfer":"Who is a trusted adult you would tell?"},{"id":"asy4_q8","type":"trueFalse","text":"Perfect spelling means an email cannot be a scam.","simple":"Does perfect spelling prove an email is safe?","options":["True","False"],"correct":"False","correctAnswers":["False"],"pairs":[],"explanation":"AI writes polished text. Check the sender and avoid unexpected links.","difficulty":"beginner","transfer":"What else could you check in a suspicious email?"},{"id":"asy4_q9","type":"explain","text":"Explain the separate channel rule for beating scams.","simple":"Explain the separate channel rule for scams.","options":["Verify through a way you already trust","Do not use the contact the message gives","Faking several channels is hard"],"correct":"If a message or call asks for money or details, check it through a different route you already trust, such as calling a saved number. Scammers can fake one channel, but faking several independent ones is much harder.","correctAnswers":["If a message or call asks for money or details, check it through a different route you already trust, such as calling a saved number. Scammers can fake one channel, but faking several independent ones is much harder."],"pairs":[],"explanation":"Strong answers explain why a second channel defeats the trick.","difficulty":"beginner","transfer":"Where else in life do you double-check something through a second route?"}],"cards":[{"emoji":"🎣","title":"AI-Powered Scams","body":"Phishing is a fake message that tries to get your details or a click. Scammers use AI to write convincing emails, clone voices, and generate fake video calls.","funFact":null},{"emoji":"🐢","title":"Slow Down","body":"Scams create hurry and fear. Pausing, hanging up, and telling a trusted adult gives you time to check.","funFact":null},{"emoji":"🔒","title":"Protect Yourself","body":"Verify unexpected requests through a different channel. If a caller sounds like family asking for money, hang up and call their real number.","funFact":null}]},{"id":"asy_l5","title":"Think Before You Trust","description":"AI sounds confident even when it is wrong","order":4,"difficulty":"advanced","questions":[{"id":"asy5_q1","type":"multipleChoice","text":"Why is a confident tone not a reliable sign that an AI answer is accurate?","simple":"Why does sounding sure not prove an AI is right?","options":["Right and wrong answers come in the same tone","It answers only when it is fully certain of facts","It warns you clearly whenever it feels unsure","Confident answers are checked by a person first"],"correct":"Right and wrong answers come in the same tone","correctAnswers":["Right and wrong answers come in the same tone"],"pairs":[],"explanation":"A model produces likely text and has no reliable inner check of what it knows. Confident tone and correct content are separate things.","difficulty":"beginner","transfer":"An AI gives a confident date for an event. What do you do before using it?"},{"id":"asy5_q2","type":"trueFalse","text":"A well-written, authoritative AI answer can still be wrong.","simple":"Can a polished AI answer still be wrong?","options":["True","False"],"correct":"True","correctAnswers":["True"],"pairs":[],"explanation":"A model produces text that sounds right based on patterns in its training data. Sounding right and being right are different, so verify important claims with reliable sources.","difficulty":"beginner","transfer":"Which AI answer would you check with a teacher or a book this week?"},{"id":"asy5_q3","type":"matchPairs","text":"Match each critical thinking skill to how it helps when using AI:","simple":"Match each thinking skill to how it helps.","options":[],"correct":"","correctAnswers":[],"pairs":[{"term":"Source verification","definition":"Check if AI claims have real sources backing them"},{"term":"Logical reasoning","definition":"Spot contradictions in AI output"},{"term":"Healthy skepticism","definition":"Question confident-sounding claims"},{"term":"Cross-referencing","definition":"Compare AI answers with other sources"}],"explanation":"These skills help you navigate AI-generated content. They are not about distrusting every output; they help you decide what deserves confidence and what needs more evidence.","difficulty":"intermediate","transfer":"Which of these skills did you use the last time you researched something?"},{"id":"asy5_q4","type":"scenarioJudgment","text":"A chatbot says a medicine is safe to take with another one. What is the right move?","simple":"A chatbot says two medicines mix safely. What now?","options":["Ask a pharmacist, doctor, or parent before taking anything","Take it, since the chatbot sounded certain","Ask the same chatbot again to confirm","Search one website and go with its answer"],"correct":"Ask a pharmacist, doctor, or parent before taking anything","correctAnswers":["Ask a pharmacist, doctor, or parent before taking anything"],"pairs":[],"explanation":"Medicine questions are high-risk, and a chatbot can invent or miss an interaction. Check with a qualified person and involve an adult.","difficulty":"intermediate","transfer":"A chatbot gives first-aid steps for a friend. Who would you involve first?"},{"id":"asy5_q5","type":"fillInBlank","text":"When an AI states false information that sounds convincing, this is called a __________.","simple":"Convincing but false AI information is called a __________.","options":["hallucination","calculation","optimization","compilation"],"correct":"hallucination","correctAnswers":["hallucination"],"pairs":[],"explanation":"A hallucination is confident, fabricated content: a made-up study, event, or quote. It is a known limit of current models, so check names, numbers, and sources.","difficulty":"intermediate","transfer":"How would you check a fact an AI gave you about your own town?"},{"id":"asy5_q6","type":"multipleChoice","text":"What is a sound way to use AI for an important decision?","simple":"How should AI fit into a big decision?","options":["Treat it as one input beside expert advice and research","Let it make the final choice to save time","Ignore it and go with a gut feeling only","Ask it ten times and take the most common answer"],"correct":"Treat it as one input beside expert advice and research","correctAnswers":["Treat it as one input beside expert advice and research"],"pairs":[],"explanation":"AI is a tool, not an oracle. For important decisions, combine its suggestions with qualified expert advice, reliable sources, and your own thinking.","difficulty":"advanced","transfer":"Choosing a high school course: what would AI add, and who else would you ask?"},{"id":"asy5_q7","type":"multipleChoice","text":"An AI answer sounds very confident. What does that tell you about accuracy?","simple":"An AI sounds sure. Does that mean it is right?","options":["Nothing, since confidence is not accuracy","It must be right about that","It checked every fact before replying","It is usually wrong when confident"],"correct":"Nothing, since confidence is not accuracy","correctAnswers":["Nothing, since confidence is not accuracy"],"pairs":[],"explanation":"Models write in a confident tone whether or not they are correct. Check important claims.","difficulty":"beginner","transfer":"What is one claim you would always double-check?"},{"id":"asy5_q8","type":"trueFalse","text":"An AI can invent a source that does not exist.","simple":"Can an AI make up a fake source?","options":["True","False"],"correct":"True","correctAnswers":["True"],"pairs":[],"explanation":"This is called a hallucination. Look up any source before you rely on it.","difficulty":"beginner","transfer":"How would you check whether a book an AI cited is real?"},{"id":"asy5_q10","type":"scenarioJudgment","text":"An AI app has many downloads. What does that establish?","simple":"Many people downloaded an app. What does that prove?","options":["It was downloaded many times","It teaches every topic accurately","Learners can apply every skill","Its certificate is accredited"],"correct":"It was downloaded many times","correctAnswers":["It was downloaded many times"],"pairs":[],"explanation":"Popularity tells you about adoption. To judge learning, inspect the teaching, practice and evidence of what learners can do.","difficulty":"beginner","transfer":"What evidence would persuade you that a course helps people learn?"},{"id":"asy5_q11","type":"scenarioJudgment","text":"An AI course offers a certificate. What should you check?","simple":"A course offers a certificate. What should you ask?","options":["Who issues it and what it records","Whether its border is gold","Whether a famous person liked it","How many logos it shows"],"correct":"Who issues it and what it records","correctAnswers":["Who issues it and what it records"],"pairs":[],"explanation":"A completion certificate can record finished activities. Independent assessment and accreditation are separate claims that need evidence.","difficulty":"beginner","transfer":"A game badge says expert. What did you actually have to do to earn it?"},{"id":"asy5_q9","type":"explain","text":"Explain what a hallucination is and how you would catch one.","simple":"What is a hallucination, and how would you catch one?","options":["Confident but false information","Invented facts or sources","Verify with independent sources"],"correct":"A hallucination is when the model states something false or invents a source while sounding sure. You catch it by checking the claim against trusted, independent sources and by being extra careful with names, numbers, and citations.","correctAnswers":["A hallucination is when the model states something false or invents a source while sounding sure. You catch it by checking the claim against trusted, independent sources and by being extra careful with names, numbers, and citations."],"pairs":[],"explanation":"Strong answers define it and give a checking method.","difficulty":"beginner","transfer":"Which school subject would you be most careful checking AI facts in, and why?"}],"cards":[{"emoji":"📰","title":"Confident Is Not Correct","body":"A model writes right and wrong answers in the same confident tone. Sounding sure is not evidence.","funFact":null},{"emoji":"🌫️","title":"Hallucination","body":"A hallucination is convincing but false content, such as an invented study or quote. Names, numbers, dates, and sources deserve a check.","funFact":null},{"emoji":"🧐","title":"Check the Source","body":"Before sharing AI-generated content or AI-found information, verify it with trusted, independent sources. For health, money, or legal questions, ask a qualified person and an adult.","funFact":null},{"emoji":"📋","title":"Ask What Was Measured","body":"Downloads show adoption, while a completion record shows finished activities. Ask for different evidence before accepting a claim about independent skill.","funFact":null}]},{"id":"asy_l6","title":"Responsible AI Use","description":"Using AI honestly without hurting others","order":5,"difficulty":"advanced","questions":[{"id":"asy6_q1","type":"multipleChoice","text":"Why does it matter to be honest about using AI to help create something?","simple":"Why be honest about using AI help?","options":["It keeps trust and shows your real skill","Disclosure is required by law in every country","It makes finished work look more impressive","It helps the AI tool improve its answers"],"correct":"It keeps trust and shows your real skill","correctAnswers":["It keeps trust and shows your real skill"],"pairs":[],"explanation":"Honesty keeps trust and helps a teacher see your real skill level. Hiding AI use is a form of dishonesty that can cost you both.","difficulty":"beginner","transfer":"When would you tell a teacher you used AI on an assignment?"},{"id":"asy6_q2","type":"trueFalse","text":"Using AI to copy a living artist's unique style without permission raises ethical concerns.","simple":"Is copying a living artist's style with AI a concern?","options":["True","False"],"correct":"True","correctAnswers":["True"],"pairs":[],"explanation":"Mimicking a specific artist can undercut their work, often using art collected without consent. Copyright, fair pay, and respect for creators are all in play.","difficulty":"beginner","transfer":"A friend wants AI art in a favourite illustrator's style for a poster. What would you suggest?"},{"id":"asy6_q3","type":"scenarioJudgment","text":"A classmate wants AI to make an embarrassing fake photo of another student as a joke. Best response?","simple":"A classmate wants a fake embarrassing photo as a joke. Best response?","options":["Refuse and say it can harm someone and break rules","Agree if the photo stays inside your friend group","Agree if it is obviously edited and not realistic","Ignore it, since a joke is not your business"],"correct":"Refuse and say it can harm someone and break rules","correctAnswers":["Refuse and say it can harm someone and break rules"],"pairs":[],"explanation":"A fake image of a real person can cause real distress and count as bullying, and in many places it is illegal. The harm does not depend on the intent.","difficulty":"beginner","transfer":"A group chat shares an edited photo of someone. What could you do?"},{"id":"asy6_q4","type":"matchPairs","text":"Match each responsible AI practice to why it matters:","simple":"Match each good habit to why it matters.","options":[],"correct":"","correctAnswers":[],"pairs":[{"term":"Disclosing AI use","definition":"Maintains honesty and trust"},{"term":"Respecting copyright","definition":"Protects creators' rights and livelihoods"},{"term":"Verifying AI output","definition":"Prevents spreading misinformation"},{"term":"Protecting privacy","definition":"Keeps personal data safe for everyone"}],"explanation":"Responsible AI use means thinking beyond yourself. AI-assisted work can affect creators, people shown in content, and anyone who meets misinformation, so pause and consider those impacts.","difficulty":"beginner","transfer":"Which of these habits fits a class presentation you have made?"},{"id":"asy6_q5","type":"fillInBlank","text":"When sharing AI-generated content, responsible users add clear __________ so others know AI helped.","simple":"Saying that AI helped make something is called __________.","options":["attribution","passwords","downloads","advertisements"],"correct":"attribution","correctAnswers":["attribution"],"pairs":[],"explanation":"Attribution means stating that content was AI-generated or AI-assisted. It lets others judge the content fairly and keeps things transparent.","difficulty":"intermediate","transfer":"How would you label an AI-made image in a school newsletter?"},{"id":"asy6_q6","type":"multipleChoice","text":"Which four-step habit supports responsible use of an AI assistant?","simple":"Which four steps make AI use responsible?","options":["Plan the task, give clear instructions, check the output, and take responsibility","Delegate everything, accept every answer, hide the help, and share it immediately","Pick the newest tool, skip review, and blame the system","Ask repeatedly, select the longest answer, remove the sources, and publish"],"correct":"Plan the task, give clear instructions, check the output, and take responsibility","correctAnswers":["Plan the task, give clear instructions, check the output, and take responsibility"],"pairs":[],"explanation":"Responsible AI use starts by deciding whether the task is appropriate, communicating clearly, evaluating the result, and taking responsibility for the final decision or work.","difficulty":"advanced","transfer":"Apply the four steps to using AI for a science fair poster."},{"id":"asy6_q7","type":"multipleChoice","text":"You used AI to help outline an essay. What should you do?","simple":"AI helped with your essay outline. What now?","options":["Say so, following your school's rules","Hide it so nobody finds out","Claim you wrote it all alone","Delete the essay and start over"],"correct":"Say so, following your school's rules","correctAnswers":["Say so, following your school's rules"],"pairs":[],"explanation":"Being honest about AI help keeps trust and follows the rules you agreed to.","difficulty":"beginner","transfer":"How would you describe AI help on a project honestly?"},{"id":"asy6_q8","type":"trueFalse","text":"Making a fake picture of a classmate as a joke is harmless.","simple":"Is a fake picture of a classmate as a joke harmless?","options":["True","False"],"correct":"False","correctAnswers":["False"],"pairs":[],"explanation":"Fake images can hurt real people and may be against the law. Intent does not remove the harm.","difficulty":"beginner","transfer":"What would you do if a friend showed you one?"},{"id":"asy6_q10","type":"scenarioJudgment","text":"The task is to practise your own explanation. What is a useful first step?","simple":"You are practising your explanation. What comes first?","options":["Try it yourself using agreed supports","Have AI write the whole explanation","Submit an answer you cannot explain","Skip thinking because AI is faster"],"correct":"Try it yourself using agreed supports","correctAnswers":["Try it yourself using agreed supports"],"pairs":[],"explanation":"The goal is to practise your thinking. Choosing not to use AI can help that goal; agreed accessibility supports still belong.","difficulty":"beginner","transfer":"When would AI help your learning, and when might it replace the practice you need?"},{"id":"asy6_q9","type":"explain","text":"Describe the four-step habit for responsible AI use and why the last step matters.","simple":"Explain four responsible-use steps. Why does the last matter?","options":["Plan the task","Give clear instructions and check the output","Take responsibility for the result"],"correct":"Decide whether the task suits AI, give it clear instructions, check what it produced, and take responsibility for the final work. The last step matters because the tool is not accountable; the person who uses it is.","correctAnswers":["Decide whether the task suits AI, give it clear instructions, check what it produced, and take responsibility for the final work. The last step matters because the tool is not accountable; the person who uses it is."],"pairs":[],"explanation":"Strong answers list the steps and explain accountability.","difficulty":"beginner","transfer":"Which step do you most often skip when using a calculator or spell-check, and why?"}],"cards":[{"emoji":"🌐","title":"Digital Citizenship","body":"Being a good digital citizen means using AI honestly, respecting others' privacy, and not using AI to harm or deceive.","funFact":null},{"emoji":"🏷️","title":"Say When AI Helped","body":"Attribution means telling people that AI helped make something. Follow your school's rules about when and how to say so.","funFact":null},{"emoji":"🎨","title":"Style and Consent","body":"Copying a living artist's style or making fake images of real people can harm them, even as a joke. Consent and respect come first.","funFact":null},{"emoji":"🤝","title":"AI for Good","body":"Use AI to learn, create, and help others. The technology is powerful, and how you use it is what matters.","funFact":null}]}],"bigIdeas":["societalImpact"]},{"id":"how_ai_learns","name":"How AI Learns","icon":"graduationcap","color":"aiPurple","description":"How does a machine learn from its mistakes? Find out","order":4,"unlock":{"kind":"completeTier1","value":null},"lessons":[{"id":"hal_l1","title":"Supervised Learning","description":"Learning from labeled examples","order":0,"difficulty":"beginner","questions":[{"id":"hal1_q1","type":"scenarioJudgment","text":"Photos come with correct cat or dog labels. Which learning method uses them?","simple":"Photos come with the right labels. Which learning uses them?","options":["Supervised learning","Unsupervised learning","Reinforcement learning","Retrieval-Augmented Generation"],"correct":"Supervised learning","correctAnswers":["Supervised learning"],"pairs":[],"explanation":"Supervised learning uses labeled examples with known answers. The model learns how image features map to the cat and dog labels.","difficulty":"beginner","transfer":"A model learns from emails marked spam or not spam. Which method is that?"},{"id":"hal1_q2","type":"multipleChoice","text":"A spam filter chooses between 'spam' and 'not spam.' What kind of task is this?","simple":"Spam or not spam. What kind of task is that?","options":["Binary classification","Regression","Clustering","Text generation"],"correct":"Binary classification","correctAnswers":["Binary classification"],"pairs":[],"explanation":"Classification predicts a category. Because there are two possible categories, this is binary classification.","difficulty":"beginner","transfer":"A helper decides whether a photo is blurry or sharp. Which kind of task is that?"},{"id":"hal1_q3","type":"matchPairs","text":"Match supervised learning terms:","simple":"Match each supervised learning word to its meaning.","options":[],"correct":"","correctAnswers":[],"pairs":[{"term":"Classification","definition":"Sorting into categories"},{"term":"Regression","definition":"Predicting a number"},{"term":"Label","definition":"The correct answer tag"},{"term":"Feature","definition":"Input variable for prediction"}],"explanation":"Classification and regression are the two main types of supervised learning, used across industries from healthcare to finance.","difficulty":"beginner","transfer":"For a helper that guesses a song's release year, name one feature and the label."},{"id":"hal1_q4","type":"fillInBlank","text":"In supervised learning, a __________ is the correct answer for each training example.","simple":"The correct answer for a training example is called a what?","options":["label","feature","node","layer"],"correct":"label","correctAnswers":["label"],"pairs":[],"explanation":"Labels are the target answers the model learns to predict. Human annotators often create and review them, so clear instructions and quality checks are critical.","difficulty":"intermediate","transfer":"You are labelling photos of bikes and scooters. What could go wrong if the labels are careless?"},{"id":"hal1_q5","type":"scenarioJudgment","text":"A team studies test answers while preparing training data. What is this problem called?","simple":"The team peeked at test answers while training. What is that called?","options":["Data leakage","Transfer learning","Underfitting","Model routing"],"correct":"Data leakage","correctAnswers":["Data leakage"],"pairs":[],"explanation":"Data leakage gives the model or developers clues from the test set. The final score no longer measures performance on truly unseen data.","difficulty":"intermediate","transfer":"A student practises with the actual exam paper. Why does their score stop meaning anything?"},{"id":"hal1_q6","type":"scenarioJudgment","text":"A loan model fails much more often in one neighborhood. Which evaluation reveals this?","simple":"A model fails more in one neighbourhood. Which check shows it?","options":["Subgroup error analysis","Overall accuracy only","Token counting","Temperature tuning"],"correct":"Subgroup error analysis","correctAnswers":["Subgroup error analysis"],"pairs":[],"explanation":"Subgroup error analysis compares mistakes across relevant groups. One overall score can hide an unfair failure pattern.","difficulty":"advanced","transfer":"A speech helper works for adults but not kids. Which check would show that, and why does the average hide it?"},{"id":"hal1_q7","type":"multipleChoice","text":"You show a model 500 photos, each marked apple or pear. What are the marks called?","simple":"Photos marked apple or pear. What are the marks called?","options":["Labels","Layers","Prompts","Tokens"],"correct":"Labels","correctAnswers":["Labels"],"pairs":[],"explanation":"A label is the correct answer attached to each example. The model learns by comparing its guess to the label.","difficulty":"beginner","transfer":"A weather model learns from days marked rainy or dry. What is the label?"},{"id":"hal1_q8","type":"trueFalse","text":"Supervised learning needs someone to provide correct answers for the examples.","simple":"Does supervised learning need correct answers for examples?","options":["True","False"],"correct":"True","correctAnswers":["True"],"pairs":[],"explanation":"The answers are the labels. Without them the model has nothing to check its guesses against.","difficulty":"beginner","transfer":"Who might create labels for a set of bird photos, and how long could it take?"},{"id":"hal1_q9","type":"explain","text":"Explain supervised learning using flash cards as your example.","simple":"Explain supervised learning using flash cards.","options":["Each example comes with its correct answer","The model guesses, then checks against the answer","Many examples improve the guesses"],"correct":"Supervised learning is like studying with flash cards. Each card shows a question with its answer, the model makes a guess, checks it against the answer, and adjusts. After thousands of cards its guesses get much better.","correctAnswers":["Supervised learning is like studying with flash cards. Each card shows a question with its answer, the model makes a guess, checks it against the answer, and adjusts. After thousands of cards its guesses get much better."],"pairs":[],"explanation":"Strong answers include the answer being given and the checking step.","difficulty":"beginner","transfer":"Pick any school subject and describe the flash cards you would need to train a helper."}],"cards":[{"emoji":"🏷️","title":"Supervised Learning","body":"In supervised learning, AI learns from labeled examples. Like flash cards: you show it the question AND the answer.","funFact":"This is the most common type of machine learning!"},{"emoji":"📦","title":"Labels Are Key","body":"Labels tell AI what each example is. A photo labeled 'cat' teaches the AI what cats look like.","funFact":null},{"emoji":"🔀","title":"Classify or Predict a Number","body":"Classification sorts things into categories, like spam or not spam. Regression predicts a number, like tomorrow's temperature. Features are the inputs, and the label is the answer.","funFact":null},{"emoji":"🚫","title":"No Peeking","body":"Data leakage is when test answers sneak into training. The score looks great and means nothing, like practising with the real exam paper.","funFact":null}]},{"id":"hal_l2","title":"Unsupervised Learning","description":"Finding hidden patterns","order":1,"difficulty":"beginner","questions":[{"id":"hal2_q1","type":"multipleChoice","text":"A model searches unlabeled music for hidden patterns. Which learning method is this?","simple":"Finding hidden patterns in unlabelled music. Which method?","options":["Unsupervised learning","Supervised learning","Reinforcement learning","Fine-tuning"],"correct":"Unsupervised learning","correctAnswers":["Unsupervised learning"],"pairs":[],"explanation":"Unsupervised learning searches data without correct-answer labels. It can reveal groups or structures that were not named in advance.","difficulty":"beginner","transfer":"A shop groups customers without labels. Which method fits?"},{"id":"hal2_q2","type":"multipleChoice","text":"A model places similar songs into groups without genre labels. Which technique is this?","simple":"Similar songs grouped without genre labels. Which technique?","options":["Clustering","Regression","Classification","Inference"],"correct":"Clustering","correctAnswers":["Clustering"],"pairs":[],"explanation":"Clustering is an unsupervised technique that groups similar items. The groups come from patterns in the data rather than supplied labels.","difficulty":"beginner","transfer":"A helper groups your notes by topic without being told the topics. What is that called?"},{"id":"hal2_q3","type":"multipleChoice","text":"Which is an example of unsupervised learning?","simple":"Which one is unsupervised learning?","options":["Grouping customers by shopping behavior","Translating English to French","Detecting spam emails","Grading exam papers"],"correct":"Grouping customers by shopping behavior","correctAnswers":["Grouping customers by shopping behavior"],"pairs":[],"explanation":"Customer segmentation discovers natural groupings without predefined categories. E-commerce and streaming platforms use it all the time.","difficulty":"beginner","transfer":"Pick one thing on this list that needs answers written first and explain why it is supervised."},{"id":"hal2_q4","type":"fillInBlank","text":"__________ detection finds the odd one out in unlabeled data.","simple":"Finding the odd one out in data is called ______ detection.","options":["Anomaly","Cluster","Label","Token"],"correct":"Anomaly","correctAnswers":["Anomaly"],"pairs":[],"explanation":"Anomaly detection flags data points that do not fit the usual pattern, such as a strange bank transaction. No labels are needed to spot the odd one out.","difficulty":"intermediate","transfer":"A fitness app notices one day's steps look nothing like the rest. What might it flag?"},{"id":"hal2_q5","type":"matchPairs","text":"Match unsupervised techniques:","simple":"Match each unsupervised technique to what it does.","options":[],"correct":"","correctAnswers":[],"pairs":[{"term":"Clustering","definition":"Group similar items together"},{"term":"Anomaly Detection","definition":"Find unusual data points"},{"term":"Dimensionality Reduction","definition":"Simplify complex data"},{"term":"Association","definition":"Find rules between items"}],"explanation":"These techniques power fraud detection, recommendation engines, and scientific data analysis.","difficulty":"beginner","transfer":"A bank spots one strange payment among thousands. Which technique fits that?"},{"id":"hal2_q6","type":"multipleChoice","text":"Why is unsupervised learning useful?","simple":"Why is unsupervised learning useful?","options":["It can discover patterns humans missed","It's always more accurate than supervised","It never makes mistakes","It doesn't need any data"],"correct":"It can discover patterns humans missed","correctAnswers":["It can discover patterns humans missed"],"pairs":[],"explanation":"Unsupervised learning reveals hidden structures in data that humans might miss, which is why it's used in scientific research and business analytics.","difficulty":"advanced","transfer":"A helper finds a cluster of players who quit on level 3. What might the game team learn?"},{"id":"hal2_q7","type":"scenarioJudgment","text":"A store has no labels but wants to find groups of similar shoppers. Which method fits?","simple":"A store wants shopper groups but has no labels. Which method?","options":["Unsupervised learning","Supervised learning","Reinforcement learning","Hand-written rules"],"correct":"Unsupervised learning","correctAnswers":["Unsupervised learning"],"pairs":[],"explanation":"With no labels, the model can still find natural groups. That is clustering, an unsupervised technique.","difficulty":"beginner","transfer":"What groups might a music app find among listeners without being told any?"},{"id":"hal2_q8","type":"trueFalse","text":"Unsupervised learning needs labelled answers to find patterns.","simple":"Does unsupervised learning need labelled answers?","options":["True","False"],"correct":"False","correctAnswers":["False"],"pairs":[],"explanation":"It works without labels. It finds structure such as clusters or unusual points on its own.","difficulty":"beginner","transfer":"Why might a company skip labelling and use clustering first?"},{"id":"hal2_q9","type":"explain","text":"Explain how a model can group songs without knowing any genre names.","simple":"How can a model group songs without genre names?","options":["It measures how similar songs are","Similar songs end up in the same cluster","A person names the groups afterwards"],"correct":"The model turns each song into numbers such as tempo, loudness, and instruments, then measures how close songs are to each other. Songs that are close form a cluster. A person can look at each cluster afterwards and give it a name.","correctAnswers":["The model turns each song into numbers such as tempo, loudness, and instruments, then measures how close songs are to each other. Songs that are close form a cluster. A person can look at each cluster afterwards and give it a name."],"pairs":[],"explanation":"Strong answers mention measuring similarity and naming groups later.","difficulty":"beginner","transfer":"What could go wrong if a person never checks what the song clusters mean?"}],"cards":[{"emoji":"🔍","title":"Unsupervised Learning","body":"Sometimes AI finds patterns on its own without labels. It groups similar things together, like sorting toys by color.","funFact":null},{"emoji":"🧩","title":"Finding Hidden Groups","body":"Unsupervised learning discovers clusters in data. A music service might use it to group similar songs for playlists.","funFact":null},{"emoji":"🧭","title":"More Than Clustering","body":"Anomaly detection finds the odd one out. Dimensionality reduction squeezes complex data into fewer numbers so patterns are easier to see. A person still names what the groups mean.","funFact":null}]},{"id":"hal_l3","title":"Reinforcement Learning","description":"Learning through trial and error","order":2,"difficulty":"intermediate","questions":[{"id":"hal3_q1","type":"multipleChoice","text":"A robot tries routes and earns points for fast, safe deliveries. Which method fits?","simple":"A robot earns points for fast, safe deliveries. Which method?","options":["Reinforcement learning","Supervised learning","Clustering","RAG"],"correct":"Reinforcement learning","correctAnswers":["Reinforcement learning"],"pairs":[],"explanation":"Reinforcement learning uses actions and reward signals. The robot can improve its route policy through repeated safe practice.","difficulty":"beginner","transfer":"A game character learns from wins and losses. Which method?"},{"id":"hal3_q2","type":"multipleChoice","text":"A game agent improves by repeatedly playing copies of itself. What is this called?","simple":"A game agent improves by playing copies of itself. Called what?","options":["Self-play","Fine-tuning","Classification","Retrieval"],"correct":"Self-play","correctAnswers":["Self-play"],"pairs":[],"explanation":"Self-play creates practice without requiring a human opponent every round. Reinforcement learning can reward strategies that lead to wins.","difficulty":"beginner","transfer":"Why might a chess program that only plays itself learn odd habits?"},{"id":"hal3_q3","type":"fillInBlank","text":"In reinforcement learning, the AI gets a __________ signal to know if its action was good.","simple":"In reinforcement learning the AI gets a what signal?","options":["reward","label","cluster","feature"],"correct":"reward","correctAnswers":["reward"],"pairs":[],"explanation":"Reward signals tell an agent whether actions led to better or worse outcomes. Human feedback can also be converted into signals that help shape an assistant's behavior.","difficulty":"beginner","transfer":"Design a reward for a robot vacuum. What might it do wrong if reward is only 'dirt picked up'?"},{"id":"hal3_q4","type":"multipleChoice","text":"Which scenario best fits reinforcement learning?","simple":"Which one fits reinforcement learning best?","options":["Training a robot to navigate a warehouse","Sorting emails into folders","Grouping news articles by topic","Converting speech to text"],"correct":"Training a robot to navigate a warehouse","correctAnswers":["Training a robot to navigate a warehouse"],"pairs":[],"explanation":"A robot learning to navigate through trial and error, getting rewards for reaching goals and penalties for collisions, is a classic RL application.","difficulty":"intermediate","transfer":"Why is sorting emails a poor fit for trial-and-error learning?"},{"id":"hal3_q5","type":"matchPairs","text":"Match RL concepts:","simple":"Match each reinforcement learning word to its meaning.","options":[],"correct":"","correctAnswers":[],"pairs":[{"term":"Agent","definition":"The learner that takes actions"},{"term":"Environment","definition":"The world the agent acts in"},{"term":"Reward","definition":"Feedback signal for actions"},{"term":"Policy","definition":"Strategy for choosing actions"}],"explanation":"These are the key parts of any reinforcement learning system, from game AIs to robotic controllers.","difficulty":"beginner","transfer":"For a robot learning to stack blocks, name the agent, environment, and reward."},{"id":"hal3_q6","type":"scenarioJudgment","text":"A game studio wants AI to learn a new game without human demonstrations. Is reinforcement learning a good choice?","simple":"Can AI learn a game without demonstrations?","options":["Yes, if the game provides clear rewards and safe practice","No, reinforcement learning cannot learn games","Yes, even if success cannot be measured"],"correct":"Yes, if the game provides clear rewards and safe practice","correctAnswers":["Yes, if the game provides clear rewards and safe practice"],"pairs":[],"explanation":"Reinforcement learning can discover game strategies through repeated play when success is measurable. Designers still need clear rewards, enough practice, and safeguards against unintended strategies.","difficulty":"advanced","transfer":"Would trial-and-error learning suit a robot learning to cross a real road? What is the risk?"},{"id":"hal3_q7","type":"multipleChoice","text":"In reinforcement learning, what does the agent try to get as much of as possible?","simple":"What does a reinforcement learning agent try to collect?","options":["Reward","Labels","Tokens","Clusters"],"correct":"Reward","correctAnswers":["Reward"],"pairs":[],"explanation":"The agent tries actions and keeps the ones that earn more reward over time.","difficulty":"beginner","transfer":"If a cleaning robot earns reward for each crumb, what might it learn to do?"},{"id":"hal3_q8","type":"scenarioJudgment","text":"A robot gets a point for every crumb picked up. It starts knocking food off tables. Why?","simple":"A robot scores a point per crumb. It knocks food down. Why?","options":["It found a shortcut to more reward","It is being naughty on purpose","Its battery is low","It cannot see crumbs"],"correct":"It found a shortcut to more reward","correctAnswers":["It found a shortcut to more reward"],"pairs":[],"explanation":"The reward only counted crumbs, so making more crumbs scored more. Rewards must describe what you really want.","difficulty":"beginner","transfer":"How would you rewrite the reward so the robot cleans instead of making mess?"},{"id":"hal3_q9","type":"explain","text":"Explain reinforcement learning using the idea of training a pet.","simple":"Explain reinforcement learning like training a pet.","options":["The agent tries actions","Good actions earn reward","It repeats what earned reward"],"correct":"A pet tries different things and gets a treat when it does the right one, so it repeats that action. A reinforcement learning agent works the same way: it tries actions, receives reward for good ones, and gradually favours the actions that earned the most.","correctAnswers":["A pet tries different things and gets a treat when it does the right one, so it repeats that action. A reinforcement learning agent works the same way: it tries actions, receives reward for good ones, and gradually favours the actions that earned the most."],"pairs":[],"explanation":"Strong answers connect trial, reward, and repetition.","difficulty":"beginner","transfer":"Explain to a friend why a badly chosen treat can teach a pet, or a robot, the wrong trick."}],"cards":[{"emoji":"🎮","title":"Learning by Doing","body":"Reinforcement Learning (RL) is like training a pet. The AI tries things and gets rewards for good actions, penalties for bad ones.","funFact":null},{"emoji":"🏆","title":"Trial and Error","body":"RL is how game-playing AIs learn. In 2016 AlphaGo beat a world champion after playing millions of Go games against itself!","funFact":null},{"emoji":"🎮","title":"Agent, Environment, Policy","body":"The agent is the learner. The environment is the world it acts in. The policy is its current strategy for choosing actions. Self-play means an agent improves by playing copies of itself.","funFact":null},{"emoji":"🍪","title":"Reward Hacking","body":"An agent chases whatever earns reward, including shortcuts you did not intend. Choosing the reward carefully is most of the work.","funFact":null}]},{"id":"hal_l4","title":"Overfitting & Underfitting","description":"When models learn too much or too little","order":3,"difficulty":"intermediate","questions":[{"id":"hal4_q1","type":"scenarioJudgment","text":"A model aces its training examples but fails on new ones. What is happening?","simple":"Great on training examples, bad on new ones. What is happening?","options":["Overfitting","Underfitting","Clustering","Transfer learning"],"correct":"Overfitting","correctAnswers":["Overfitting"],"pairs":[],"explanation":"Overfitting means the model learned the training set too closely and did not generalize to new examples.","difficulty":"beginner","transfer":"A student memorises answers and fails a new test. Which problem is that like?"},{"id":"hal4_q2","type":"trueFalse","text":"A model that scores well on training data but poorly on test data is likely overfitting.","simple":"Great on training data, bad on test data. Overfitting?","options":["True","False"],"correct":"True","correctAnswers":["True"],"pairs":[],"explanation":"This gap between training and test performance is the hallmark of overfitting. Monitoring it is critical to responsible model development.","difficulty":"beginner","transfer":"How would you check whether a helper memorised or really learned?"},{"id":"hal4_q3","type":"fillInBlank","text":"__________ happens when a model is too simple to capture patterns in data.","simple":"Too simple to learn the pattern is called what?","options":["Underfitting","Overfitting","Clustering","Labeling"],"correct":"Underfitting","correctAnswers":["Underfitting"],"pairs":[],"explanation":"Underfitting means the model hasn't learned enough. It performs poorly everywhere, often needing a more capable architecture or more training.","difficulty":"beginner","transfer":"A helper guesses every plant is 'a plant'. Is that overfitting or underfitting?"},{"id":"hal4_q4","type":"multipleChoice","text":"Which technique helps detect and reduce overfitting?","simple":"Which check finds overfitting?","options":["Checking performance on a validation set","Making the model infinitely complex","Removing the test dataset","Training on the validation answers"],"correct":"Checking performance on a validation set","correctAnswers":["Checking performance on a validation set"],"pairs":[],"explanation":"A validation set lets a team monitor performance on data excluded from training. A widening gap between training and validation results can reveal overfitting.","difficulty":"intermediate","transfer":"Why should the practice test and the final test be different papers?"},{"id":"hal4_q5","type":"sortOrder","text":"Order these models from most underfitting to most overfitting:","simple":"Order from too simple to memorising everything.","options":["A model that fits training and new data well","A model that memorises every training example","A model too simple to find the pattern","A model that fits training data a little too closely"],"correct":"","correctAnswers":["A model too simple to find the pattern","A model that fits training and new data well","A model that fits training data a little too closely","A model that memorises every training example"],"pairs":[],"explanation":"Underfitting is too simple and the good fit sits in the middle. Fitting the training data a little too closely is the start of overfitting, and memorising everything is the extreme.","difficulty":"beginner","transfer":"Where on this line would you put a student who only memorises answers?"},{"id":"hal4_q6","type":"multipleChoice","text":"The 'sweet spot' between underfitting and overfitting is called:","simple":"The sweet spot between under and overfitting is called what?","options":["Good generalization","Perfect memory","Data compression","Feature extraction"],"correct":"Good generalization","correctAnswers":["Good generalization"],"pairs":[],"explanation":"A well-generalized model performs well on both training data and new data. The ultimate goal of model training.","difficulty":"advanced","transfer":"Describe a helper that generalises well in one sentence about new examples."},{"id":"hal4_q7","type":"scenarioJudgment","text":"Training scores keep rising while validation scores fall. What is starting to happen?","simple":"Training scores rise, validation scores fall. What is starting?","options":["Overfitting","Underfitting","Clustering","Tokenization"],"correct":"Overfitting","correctAnswers":["Overfitting"],"pairs":[],"explanation":"The model fits the training set closer and closer but does worse on held-out examples. That gap is the classic sign of memorising.","difficulty":"beginner","transfer":"What would you do the moment validation scores start to drop?"},{"id":"hal4_q8","type":"trueFalse","text":"A model that fails on both training data and new data is probably underfitting.","simple":"Failing on training and new data means underfitting. True?","options":["True","False"],"correct":"True","correctAnswers":["True"],"pairs":[],"explanation":"Underfitting means the model is too simple to capture the pattern, so it does badly everywhere.","difficulty":"beginner","transfer":"What might you change to help an underfitting model?"},{"id":"hal4_q9","type":"explain","text":"Explain the difference between overfitting and underfitting with one example of each.","simple":"Explain overfitting and underfitting with an example of each.","options":["Overfitting memorises training data and fails on new data","Underfitting is too simple to learn the pattern","The goal is between them"],"correct":"Overfitting is when a model memorises its training examples, like learning every wrinkle of ten dog photos and then failing on an eleventh dog. Underfitting is when the model is too simple, like deciding anything with four legs is a dog. The goal is a model that learns the real pattern and works on new cases.","correctAnswers":["Overfitting is when a model memorises its training examples, like learning every wrinkle of ten dog photos and then failing on an eleventh dog. Underfitting is when the model is too simple, like deciding anything with four legs is a dog. The goal is a model that learns the real pattern and works on new cases."],"pairs":[],"explanation":"Strong answers give a concrete example for each and name the middle goal.","difficulty":"beginner","transfer":"Which problem is more likely with a tiny dataset, and why?"}],"cards":[{"emoji":"📈","title":"Too Much Memorizing","body":"Overfitting is when AI memorizes training data instead of learning patterns. It aces practice tests but fails real ones.","funFact":null},{"emoji":"⚖️","title":"Finding the Balance","body":"Good AI generalizes. It learns the big patterns, not every tiny detail. Testing on new data helps check if it truly learned.","funFact":null},{"emoji":"🧪","title":"The Validation Set","body":"A validation set is examples held back from training to check the model as it learns. If training scores rise while validation scores fall, the model is starting to memorise.","funFact":null}]},{"id":"hal_l5","title":"Model Evaluation","description":"How to measure AI performance","order":4,"difficulty":"intermediate","questions":[{"id":"hal5_q1","type":"multipleChoice","text":"A model gets 88 of 100 test cases correct. Which metric is 88%?","simple":"88 of 100 correct. Which measure is 88 percent?","options":["Accuracy","Recall","Latency","Loss"],"correct":"Accuracy","correctAnswers":["Accuracy"],"pairs":[],"explanation":"Accuracy is the share of all predictions that were correct. It is useful, but it can hide important kinds of mistakes.","difficulty":"beginner","transfer":"A model gets 95 of 100 right. Which metric is that?"},{"id":"hal5_q2","type":"scenarioJudgment","text":"A fire detector catches every fire but sends many false alarms. Which metric is weak?","simple":"Catches every fire, many false alarms. Which measure is weak?","options":["Precision","Recall","Latency","Throughput"],"correct":"Precision","correctAnswers":["Precision"],"pairs":[],"explanation":"Precision asks how many positive alerts were actually correct. Many false alarms lower precision even when recall is high.","difficulty":"beginner","transfer":"A spam filter blocks real emails from friends. Which measure is weak?"},{"id":"hal5_q3","type":"matchPairs","text":"Match evaluation metrics:","simple":"Match each measure to what it means.","options":[],"correct":"","correctAnswers":[],"pairs":[{"term":"Precision","definition":"Of predicted positives, how many are correct"},{"term":"Recall","definition":"Of actual positives, how many were found"},{"term":"F1 Score","definition":"Balance of precision and recall"},{"term":"Accuracy","definition":"Overall correct predictions percentage"}],"explanation":"Different metrics capture different performance aspects. Responsible evaluations use multiple benchmarks and report where a model succeeds or fails.","difficulty":"beginner","transfer":"For a lost-dog photo matcher, which matters more: precision or recall? Why?"},{"id":"hal5_q4","type":"fillInBlank","text":"Examples kept aside and never used for training, so the final score is honest, are the __________ set.","simple":"Examples kept aside for the final score are the what set?","options":["test","training","reward","cluster"],"correct":"test","correctAnswers":["test"],"pairs":[],"explanation":"The test set is data the model never saw during training. Scoring on it shows how the model handles new examples.","difficulty":"intermediate","transfer":"How would you keep a test set honest if the same data keeps getting reused?"},{"id":"hal5_q5","type":"scenarioJudgment","text":"A screening model has 95 percent accuracy but misses 40 percent of real cases. Is it ready for a clinic?","simple":"95 percent accurate but misses 40 percent of real cases. Ready?","options":["No, missing that many real cases is the wrong kind of error","Yes, 95 percent is a strong score","Yes, if the app is fast enough","No, because 95 is below 100"],"correct":"No, missing that many real cases is the wrong kind of error","correctAnswers":["No, missing that many real cases is the wrong kind of error"],"pairs":[],"explanation":"For screening, recall matters most because a missed case is the costly mistake. Accuracy hides that because most people tested are healthy.","difficulty":"intermediate","transfer":"A smoke alarm is 95 percent accurate but misses 40 percent of fires. Would you install it?"},{"id":"hal5_q6","type":"scenarioJudgment","text":"A model scores 98 percent, but 98 percent of the examples belong to one class. What should the team check?","simple":"Most examples share one class. What should you check?","options":["How it does on the rare class, using precision and recall","Whether the score can reach 99","Whether the model is large enough","Whether the logo needs updating"],"correct":"How it does on the rare class, using precision and recall","correctAnswers":["How it does on the rare class, using precision and recall"],"pairs":[],"explanation":"With an imbalanced dataset, always guessing the big class scores high. Per-class measures show whether the model learned anything about the rare class.","difficulty":"advanced","transfer":"A weather model says 'no snow' every day in a warm city. Why is its high score misleading?"},{"id":"hal5_q7","type":"trueFalse","text":"A model should be tested on examples it did not train on.","simple":"Should a model be tested on new examples?","options":["True","False"],"correct":"True","correctAnswers":["True"],"pairs":[],"explanation":"Testing on training examples only shows memory. New examples show whether it really learned.","difficulty":"beginner","transfer":"Why would a teacher give a test with different questions from the homework?"},{"id":"hal5_q8","type":"scenarioJudgment","text":"A rare disease affects 1 in 100 people. A model says nobody has it and scores 99%. Is it useful?","simple":"A model always says no disease and scores 99%. Useful?","options":["No, it misses every real case","Yes, 99% is excellent","Yes, if it is fast","No, 99% is too low"],"correct":"No, it misses every real case","correctAnswers":["No, it misses every real case"],"pairs":[],"explanation":"Accuracy can hide a useless model when one answer is very common. Recall shows how many real cases it catches.","difficulty":"beginner","transfer":"Name another situation where always saying no would score well but help nobody."},{"id":"hal5_q9","type":"explain","text":"Explain why accuracy alone can be misleading, using the fire alarm example.","simple":"Why can accuracy mislead? Use the fire alarm example.","options":["Most days have no fire","Always saying no fire scores high","It misses the cases that matter"],"correct":"Most days there is no fire, so an alarm that always says no fire is right almost every day and gets a high accuracy score. It is useless because it misses every real fire. You need a measure like recall that checks how many real fires it caught.","correctAnswers":["Most days there is no fire, so an alarm that always says no fire is right almost every day and gets a high accuracy score. It is useless because it misses every real fire. You need a measure like recall that checks how many real fires it caught."],"pairs":[],"explanation":"Strong answers explain the common case and name a better measure.","difficulty":"beginner","transfer":"Think of a rare event in your own life. Why would a detector that always says 'no' look accurate?"}],"cards":[{"emoji":"📊","title":"Measuring Success","body":"How do we know if AI is learning? We test it on data it's never seen before and measure accuracy, precision, and recall
